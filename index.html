D.catprod = () => pair("CATEGORY", "PRODUCT", "cfN", "cfN", "contains", "belongs to",
  "→  Each category contains one or more products.", "←  Each product belongs to one or more categories.",
  { line:"Many-to-many: crow’s feet at both ends. Read the label nearest the entity you start from: a category contains products, a product belongs to categories.",
    L:"CATEGORY. The crow’s foot at this end answers “how many categories per product?”: many, and no circle, so at least one.",
    R:"PRODUCT. The crow’s foot at this end answers “how many products per category?”: many, at least one.",
    s1:"A design decision: empty categories frustrate shoppers, so every category must contain a product.",
    s2:"A product with no category would never be listed; and allowing several categories raises the default-category question." });
D.ordprod = () => pair("PRODUCT", "ORDER", "cfN", "cf0N", "ordered by", "order for",
  "→  Each product is ordered by zero, one or more orders.", "←  Each order is for one or more products.",
  { line:"Many-to-many. The circle at the Order end allows zero: a product can exist before anyone orders it.",
    L:"PRODUCT. The crow’s foot here: an order is for many products, and no circle, so at least one.",
    R:"ORDER. Circle plus crow’s foot here: a product appears on zero or more orders.",
    s1:"A new product is on no orders yet, so the minimum is zero.",
    s2:"An order with no products isn’t an order; one product per order would be unfriendly." });
D.custord = () => pair("CUSTOMER", "ORDER", "", "cf0N", "orders", "ordered by",
  "→  Each customer orders zero, one or more orders.", "←  Each order is ordered by exactly one customer.",
  { line:"One-to-many. Many (with zero allowed) at the Order end; exactly one at the Customer end. The accent bars are a course addition: the book leaves that end unmarked.",
    L:"CUSTOMER. Each order belongs to exactly one customer: the application never creates an anonymous or shared order.",
    R:"ORDER. A customer may have registered (or joined a mailing list) without ordering yet, hence the circle.",
    s1:"Repeat business means many; registering before buying means zero is allowed.",
    s2:"No order without a known customer, and no orders shared between customers." }, true);

D.recur = () => {
  let s = "";
  s += REL("A recursive relationship: the line leaves CATEGORY and comes back to it. One end plays the parent, the other the subcategory.", "M290 70V120H440V50H360", "l", "cf0N",
    stub("M290 70V72", "cf01") + T(452, 90, "belongs to", "sm", "start") + T(365, 138, "contains", "sm"));
  s += ent(220, 30, 140, "CATEGORY", "CATEGORY plays both roles. Circle plus crow’s foot on the right side: a category contains zero or more subcategories. Circle plus bar below: a subcategory belongs to zero or one parent.");
  s += G("Zero: bottom-level categories have no subcategories.", T(370, 174, "→  Each category contains zero, one or more (sub)categories.", "sm2"));
  s += G("Zero: top-level categories have no parent. One: a design choice, to keep the hierarchy understandable.", T(370, 196, "←  Each (sub)category belongs to zero or one category.", "sm2"));
  return SVG(720, 212, "Recursive ER diagram: Category contains Category", s);
};

const CATS = [
  { id:1, name:"Computers", p:null, x:150, y:20, w:130 },
  { id:2, name:"Programming", p:1, x:20, y:100, w:120 },
  { id:3, name:"Education", p:1, x:155, y:100, w:120 },
  { id:5, name:"Parallel Computing", p:1, x:290, y:100, w:140 },
  { id:4, name:"Programming", p:3, x:155, y:180, w:120 },
  { id:6, name:"Programming", p:5, x:300, y:180, w:120 }
];
const catPath = id => { const out = []; let c = CATS.find(k => k.id === id); while (c) { out.unshift(c.name); c = CATS.find(k => k.id === c.p); } return out.join(": "); };
D.subcat = () => {
  let s = "";
  s += REL("Computers is the parent of three subcategories.", "M215 56V78M80 78H360M80 78V100M215 78V100M360 78V100", "l");
  s += REL("Education has one subcategory: Programming (id 4).", "M215 136V180", "l");
  s += REL("Parallel Computing has one subcategory: Programming (id 6).", "M360 136V180", "l");
  CATS.forEach(c => {
    const prog = c.name === "Programming";
    s += PH(`${catPath(c.id)} (id ${c.id}). ${c.p ? "One parent only." : "Top level: no parent."} Click to see its row.`,
      R(c.x, c.y, c.w, 36, "b", 4) + T(c.x + c.w / 2, c.y + 23, c.name, prog ? "m hd" : "m"), `data-c="${c.id}"`);
  });
  const tx = 450, cw = [40, 140, 80];
  s += G("A self-referencing table (course preview of Chapter 6): parent_id points at another row of the same table.",
    R(tx, 20, 260, 24, "b2", 2) + T(tx + 6, 37, "id", "sm2 hd", "start") + T(tx + 46, 37, "name", "sm2 hd", "start") + T(tx + 186, 37, "parent_id", "sm2 hd", "start"));
  [...CATS].sort((a, b) => a.id - b.id).forEach((c, i) => {
    const y = 44 + 24 * i;
    s += `<g class="row" data-r="${c.id}">` + G(`Row ${c.id}: ${catPath(c.id)}.`,
      R(tx, y, 260, 24, "b", 0) + T(tx + 6, y + 16, String(c.id), "sm2", "start") + T(tx + 46, y + 16, c.name, "sm2", "start") + T(tx + 186, y + 16, c.p === null ? "NULL" : String(c.p), "sm2", "start")) + `</g>`;
  });
  s += P(`M${tx + cw[0]} 20V188M${tx + cw[0] + cw[1]} 20V188`);
  s += G("Three rows share the name Programming but have different ids and parents: three different categories.", T(580, 210, "same name, three categories", "sm"));
  return SVG(720, 230, "Category tree from the Open Directory example and the matching self-referencing table rows", s);
};

D.decoder = () => {
  let s = "";
  s += REL("The relationship line. The marker at the ORDER end answers: how many orders per customer?", "M260 50H460", "l", "cf0N",
    stub("M260 50H262", "cf11") + T(360, 42, "places", "sm"));
  s += ent(110, 30, 150, "CUSTOMER", "CUSTOMER. The bars at this end say each order has exactly one customer (fixed in this builder).");
  s += ent(460, 30, 150, "ORDER", "ORDER. Change the marker at this end with the buttons below.");
  s += G("The cardinality statement for the direction Customer → Order.", `<text id="decSent" x="360" y="104" text-anchor="middle" class="hd">Each customer places zero, one or more orders.</text>`);
  const LEG = [["cf01","zero or one","Circle and bar: optional, at most one."],["cf11","exactly one","Two bars: mandatory, at most one."],["cf0N","zero or more","Circle and crow’s foot: optional, many."],["cf1N","one or more","Bar and crow’s foot: mandatory, many."]];
  LEG.forEach(([mk, lab, tip], i) => {
    const x = 50 + 170 * i;
    s += G(`${lab}: ${tip} The marker sits at the end of the entity being counted.`, P(`M${x} 150H${x + 90}`, "l", mk) + R(x + 90, 140, 14, 20, "b2", 2) + T(x + 52, 182, lab, "sm"));
  });
  s += P("M20 126H700", "dot-line");
  return SVG(720, 196, "Cardinality builder: Customer places Order, with the four crow's-foot markers", s);
};

D.model = () => {
  let s = "";
  s += `<g data-r="cp">` + REL("Category–Product, many-to-many: each category contains one or more products; each product belongs to one or more categories.",
    "M220 180V50H330", "l", "cfN", stub("M220 180V178", "cfN") + T(290, 42, "contains", "sm", "end") + T(210, 120, "belongs to", "sm", "end")) + `</g>`;
  s += `<g data-r="cc">` + REL("Category–Category, recursive one-to-many: a category contains zero or more subcategories; a subcategory belongs to zero or one category.",
    "M400 70V110H530V50H470", "l", "cf0N", stub("M400 70V72", "cf01") + T(542, 85, "belongs to", "sm", "start") + T(465, 128, "contains", "sm")) + `</g>`;
  s += `<g data-r="po">` + REL("Product–Order, many-to-many: a product is ordered by zero or more orders; an order is for one or more products.",
    "M290 200H470", "l", "cf0N", stub("M290 200H292", "cfN") + T(318, 192, "ordered by", "sm", "start") + T(442, 216, "order for", "sm", "end")) + `</g>`;
  s += `<g data-r="co">` + REL("Customer–Order, one-to-many: a customer orders zero or more orders; an order is ordered by exactly one customer. (Accent bars added; the book leaves the Customer end unmarked.)",
    "M430 310H540V220", "l", "cf0N", bars(442, 310) + T(552, 270, "ordered by", "sm", "start") + T(485, 302, "orders", "sm")) + `</g>`;
  s += ent(330, 30, 140, "CATEGORY", "CATEGORY: related to Product (many-to-many) and to itself (recursive).");
  s += ent(150, 180, 140, "PRODUCT", "PRODUCT: related to Category and Order. Not directly to Customer: only through Order.");
  s += ent(470, 180, 140, "ORDER", "ORDER: related to Product (many-to-many) and to Customer (each order has exactly one).");
  s += ent(290, 290, 140, "CUSTOMER", "CUSTOMER: related only to Order.");
  return SVG(720, 346, "Conceptual data model of the web store: Category, Product, Order and Customer", s);
};

document.querySelectorAll("[data-dg]").forEach(el => { const f = D[el.dataset.dg]; if (f) el.innerHTML = f(); });

/* ---------- helpers for chip rows ---------- */
function chips(rowId, items, onPick){
  const row = $(rowId);
  items.forEach(([v, l]) => { const b = document.createElement("button"); b.className = "btn"; b.dataset.v = v; b.textContent = l; b.addEventListener("click", () => pick(v)); row.appendChild(b); });
  function pick(v){ row.querySelectorAll(".btn").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === v)); onPick(v); }
  return pick;
}
const plate = id => document.querySelector(`[data-dg="${id}"]`);
function clickable(groups, fn){
  groups.forEach(g => { g.addEventListener("click", () => fn(g)); g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fn(g); } }); });
}

/* planning pipeline */
(function(){
  const gs = plate("steps").querySelectorAll("[data-k]");
  clickable(gs, g => { gs.forEach(x => x.classList.toggle("sel", x === g)); $("stepsNote").innerHTML = STEPS[+g.dataset.k].d; });
  $("stepsNote").innerHTML = "Click a step to see what it involves. The order matters: each step consumes the previous step’s output.";
})();

/* requirement sorter */
(function(){
  const S = {
    price:"<b>Attribute of Product.</b> A plain fact about one product. It goes straight onto the Product list.",
    cats:"<b>A relationship, not an attribute.</b> “Category or categories” names another entity. It is left off Product’s list and comes back as the Category–Product relationship.",
    search:"<b>Note it for physical design.</b> Keyword search may need keyword tables later, but how searching works doesn’t change the conceptual model yet.",
    admin:"<b>Processing, with a data side effect.</b> The add-product page is application work, but it must be owner-only, which implies an owner ID and password. The book defers that to Chapter 7.",
    del:"<b>A new attribute: status.</b> Products with sales can’t be deleted without damaging history, so they get an active/deleted status instead.",
    card:"<b>Don’t store it.</b> Payment goes through a third-party processor; the store keeps only the approved/denied outcome on the order.",
    gift:"<b>Optional, if asked at all.</b> Customers have no reason to answer, and a form that insists may lose the order.",
    email:"<b>Attribute of Customer, safe to ask.</b> It lets the store send a shipping confirmation.",
    report:"<b>A check, not a new item.</b> Test each report against the data you plan to store. Sales by category also needs the default-category decision in 5.4."
  };
  chips("reqBtns", [["price","Product price"],["cats","Product categories"],["search","Keyword search"],["admin","Add-product page"],["del","Remove a product"],["card","Credit card number"],["gift","“Gift or personal use?”"],["email","Customer e-mail"],["report","Sales by category report"]], v => { $("reqNote").innerHTML = S[v]; });
  $("reqNote").innerHTML = "Pick a requirement to see where it ends up: attribute, relationship, a note for later, or nothing stored at all.";
})();

/* hidden relationships toggle */
(function(){
  const p = plate("ents");
  const N = {
    list:"<b>The book’s lists.</b> Plain attributes only: anything that looked like a relationship was deliberately left out. Hover an entity for what changed.",
    rel:"<b>Hidden relationships.</b> Two items on Order describe the link between orders and products, not the order itself. The book keeps them on the list; Chapter 6 moves them into the associative entity."
  };
  chips("entsBtns", [["list","Book’s lists"],["rel","Hidden relationships"]], v => { p.querySelector(".v-rel").style.display = v === "rel" ? "" : "none"; $("entsNote").innerHTML = N[v]; })("list");
})();

/* category tree */
(function(){
  const p = plate("subcat"); const gs = p.querySelectorAll("[data-c]"); const rows = p.querySelectorAll(".row");
  function sel(id){
    gs.forEach(g => g.classList.toggle("sel", +g.dataset.c === id));
    rows.forEach(r => r.querySelector(".tip").classList.toggle("cur", +r.dataset.r === id));
    const c = CATS.find(k => k.id === id);
    $("subcatNote").innerHTML = `<b>${esc(catPath(id))}</b> is row ${id}` + (c.p === null ? ", with parent_id NULL: a top-level category, the “zero” in zero or one." : `, with parent_id ${c.p}: exactly one parent.`) +
      (c.name === "Programming" ? " Same name as two other rows, but a different category." : "");
  }
  clickable(gs, g => sel(+g.dataset.c));
  $("subcatNote").innerHTML = "Click a category in the tree to see its full path and its row in the table.";
})();

/* cardinality builder */
(function(){
  const p = plate("decoder"); let mn = "0", mx = "N";
  const MK = { "01":"cf01", "11":"cf11", "0N":"cf0N", "1N":"cf1N" };
  const WORD = { "01":"zero or one order", "11":"exactly one order", "0N":"zero, one or more orders", "1N":"one or more orders" };
  function upd(){
    const k = mn + mx;
    p.querySelector('path[marker-end]').setAttribute("marker-end", `url(#${MK[k]})`);
    const t = p.querySelector("#decSent"); if (t) t.textContent = `Each customer places ${WORD[k]}.`;
    $("decNote").innerHTML = (k === "0N" ? "<b>This is the book’s choice.</b> Zero, because a customer can register before ordering; many, because repeat business is welcome."
      : k === "1N" ? "<b>One or more</b> would mean nobody can register without ordering: no sign-up first, no mailing list."
      : k === "11" ? "<b>Exactly one</b> would make Customer and Order one-to-one: every customer could only ever buy once."
      : "<b>Zero or one</b> allows registering first, but caps each customer at a single order.") +
      " The minimum is drawn nearest the line’s middle (circle = 0, bar = 1); the maximum sits against the entity (bar = 1, crow’s foot = many).";
  }
  chips("decMin", [["0","Minimum: zero (optional)"],["1","Minimum: one (mandatory)"]], v => { mn = v; upd(); })("0");
  chips("decMax", [["1","Maximum: one"],["N","Maximum: many"]], v => { mx = v; upd(); })("N");
})();

/* model filter */
(function(){
  const p = plate("model");
  const N = {
    all:"<b>The whole model.</b> Four relationships among four entities. Pick one to read it in both directions.",
    cp:"<b>Category–Product (many-to-many).</b> Each category contains one or more products; each product belongs to one or more categories. Needs an associative entity, plus a default category for sales reports.",
    cc:"<b>Category–Category (recursive, one-to-many).</b> Each category contains zero or more subcategories; each subcategory belongs to zero or one category.",
    po:"<b>Product–Order (many-to-many).</b> Each product is ordered by zero or more orders; each order is for one or more products. Needs an associative entity.",
    co:"<b>Customer–Order (one-to-many).</b> Each customer orders zero or more orders; each order is ordered by exactly one customer."
  };
  chips("modelBtns", [["all","All"],["cp","Category–Product"],["cc","Category–Category"],["po","Product–Order"],["co","Customer–Order"]], v => {
    p.querySelectorAll("[data-r]").forEach(g => g.style.opacity = v === "all" || g.dataset.r === v ? "" : ".15");
    $("modelNote").innerHTML = N[v];
  })("all");
})();

/* ---------- quiz ---------- */
const QUIZ = [
  ["In what order does the chapter plan the database?", ["Conceptual model, then entities, then relationships, then requirements","Gather information, entities and attributes, relationships, conceptual model","Relationships first, then entities","Tables first, then requirements"], 1, "Each step needs the previous one’s output: you can’t find entities before you know what must be stored, or draw the model before you know the relationships."],
  ["Why does the web store give products a status (active/deleted) instead of deleting them?", ["To save disk space","Deleting a product that has sold would damage historical sales data","Customers asked for it","Databases can’t delete rows"], 1, "A status flag hides the product from customers while keeping the order history intact."],
  ["“Product category or categories” appears in the owner’s product requirements. Where does it end up?", ["As an attribute of Product","As the Category–Product relationship","As an attribute of Order","It is dropped"], 1, "It names another entity, so it is a relationship and is left off Product’s attribute list."],
  ["How is Product related to Customer in the model?", ["Directly, many-to-many","Directly, one-to-many","Only through Order","Through Category"], 2, "Products relate to customers only via the orders that customers place."],
  ["On the Product–Order line, what does the small circle at the Order end mean?", ["An order may have no products","A product may be on zero orders","Each order has exactly one product","The relationship is optional in both directions"], 1, "The marker at the Order end counts orders per product; the circle allows zero, e.g. a newly added product."],
  ["Why is Subcategory not a separate entity?", ["It has too many attributes","It is intrinsically the same as a category, so a recursive relationship on Category handles it","Subcategories aren’t needed","Databases can’t store hierarchies"], 1, "Both have only a name and description, and levels can nest, so Category is related to itself."],
  ["What cardinality did the book choose for “each (sub)category belongs to … category”?", ["Exactly one","One or more","Zero or one","Zero or more"], 2, "Zero for top-level categories, and at most one parent as a design decision to keep the hierarchy understandable."],
  ["Spot the mistake: “Our checkout won’t submit until the customer says whether the item is a gift.”", ["Nothing is wrong","Customer information should be optional; forcing it may lose the order","It should also require a phone number","Gift status should be stored on Product"], 1, "The book’s rule of thumb is that all customer information should be optional."],
  ["What should the store database keep about payment?", ["The full card number for repeat orders","Card number and expiry, encrypted","Only the outcome (approved or denied) from a third-party processor","Nothing about the order"], 2, "Payment details go to the processor’s secure site; the store records only the result on the order."],
  ["Why does it matter that each category must contain at least one product?", ["It makes the table smaller","It tells developers to hide empty categories from shoppers","It enforces a one-to-one relationship","It removes the need for subcategories"], 1, "Recording the minimum in the ER diagram communicates a requirement: empty categories shouldn’t be shown."]
];
const quizEl = $("quiz"); let answered = 0, right = 0;
function buildQuiz(){
  quizEl.innerHTML = ""; answered = 0; right = 0; $("score").textContent = `0 of ${QUIZ.length} answered`;
  QUIZ.forEach(([q, opts, ans, why], qi) => {
    const bx = document.createElement("div"); bx.className = "q";
    bx.innerHTML = `<p>${qi + 1}. ${esc(q)}</p><div class="opts"></div><div class="why" hidden></div>`;
    const o = bx.querySelector(".opts");
    opts.forEach((txt, i) => {
      const b = document.createElement("button"); b.textContent = txt;
      b.addEventListener("click", () => {
        o.querySelectorAll("button").forEach((x, j) => { x.disabled = true; if (j === ans) x.classList.add("right"); });
        if (i !== ans) b.classList.add("wrong"); else right++;
        answered++;
        const w = bx.querySelector(".why"); w.hidden = false; w.textContent = (i === ans ? "Correct. " : "Not quite. ") + why;
        $("score").textContent = answered === QUIZ.length ? `You scored ${right} of ${QUIZ.length}.` : `${answered} of ${QUIZ.length} answered, ${right} correct`;
      });
      o.appendChild(b);
    });
    quizEl.appendChild(bx);
  });
}
$("quizReset").addEventListener("click", buildQuiz);
buildQuiz();

  }
