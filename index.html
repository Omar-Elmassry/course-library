  <!-- 5.1 -->
  <section class="chap" id="p5-1">
    <h2><span class="num">5.1</span>The web store project</h2>
    <p>The chapter opens with an idea that people often credit to Einstein: spend most of your time understanding a problem before you solve it. The book does not ask you to spend five-sixths of the project on this. But its point is still true. If you plan a database in a hurry, you will have to redesign it later, and that costs much more.</p>
    <p>Web databases do many different jobs. For example, they run content management systems, store links for search engines, and hold forum posts and product catalogs. This chapter and the next build one example from start to finish, to show planning and design in practice. The example is <strong>the database behind a web store</strong>. It has two <strong>stakeholders</strong>. A stakeholder is a person whose needs shape the data:</p>
    <dl class="notation">
      <dt>The store owner</dt><dd>Wants to manage the product inventory (the stock of products). Also wants reports that show how well the store is doing.</dd>
      <dt>The customer</dt><dd>Wants to browse products, place an order and track the status of the order. The customer does all of this in a web browser.</dd>
    </dl>
    <p>You play the role of the database designer. The project also has web designers, developers and a project manager. The book assumes that the interviews with the stakeholders have already happened. Your job is to search those interviews for <em>data</em>. The planning steps always run in the same order, because each step needs the output of the step before it:</p>
    <ul>
      <li>You can’t draw a model until you know the entities and relationships.</li>
      <li>You can’t know those until you know what the database must store.</li>
    </ul>
  </section>
  <figure class="wide">
    <div class="plate" data-dg="steps"></div>
    <div class="note" id="stepsNote" aria-live="polite"></div>
    <figcaption><span class="src ill">Course illustration</span><b>Figure A.</b> The chapter’s planning steps, drawn as a pipeline (a chain of steps). Under each step you see what it produces. Click a step to see what it involves. Chapter 6 starts from the finished model.</figcaption>
  </figure>

  <!-- 5.2 -->
  <section class="chap" id="p5-2">
    <h2><span class="num">5.2</span>Gather information</h2>
    <p>Most requirements come from the <strong>store owner</strong>. The book gives this advice. Respect the size of the application design, which includes pages for browsing and for ordering. But do not let <em>how the store will work</em> take all your attention. Focus on the product data and the customer data that the database must store and process.</p>

    <h3>Product details</h3>
    <p>The owner gives this list of product information: name, short description, long description, size, color, weight, price, availability (quantity on hand), a picture, special discounts, comments from satisfied customers, shipping cost, and the product’s category or categories. Whatever tables you end up with, each of these items must be stored somewhere. Most of them are attributes of a product. A few, such as categories, are really <strong>relationships</strong>: links between two kinds of things. At this stage you only collect them.</p>
    <p>Two more owner requirements shape the data:</p>
    <ul>
      <li><strong>Searchable products.</strong> If search is hard to use, customers buy from another store. A keyword search might later need keyword tables. That is a detail of physical design (how the data is actually stored), so for now you only write it down.</li>
      <li><strong>Categories.</strong> Products belong to categories. Each category needs a name, a description and subcategories, like the directories of Yahoo or the Open Directory Project. Keep the number of levels small, because shoppers do not like to click down through many layers.</li>
    </ul>

    <h3>Product administration</h3>
    <p>The owner needs pages to add products, remove products that sell badly, edit descriptions and set discounts. These pages are mostly processing (work the application does). But you still read through them quickly to find anything that must be <em>stored</em>:</p>
    <ul>
      <li>Only the owner may use the add-product page. So the application needs an owner ID and a password. The book leaves this for Chapter 7 (security) and does not include it in the example model.</li>
      <li>You <strong>can’t simply delete</strong> a product that has ever sold, because that would damage the sales history. So products get one more item: a <strong>status</strong> (active or deleted). Changing the status to deleted hides the product from customers. The history stays complete.</li>
      <li>The owner wants reports. For example: which products or categories sell most, which customers buy what, and whether discounts worked. Check each report against the data you plan to store. If you can’t produce a report from the stored data, a requirement is missing.</li>
    </ul>
    <p class="codehead">Course addition · the status flag in SQL (a “soft delete”: the row is hidden, not removed)</p>
<pre><code class="sql">ALTER TABLE product ADD COLUMN status VARCHAR(10) NOT NULL DEFAULT 'active';

-- "Delete" a product that has sales: hide it, keep the history
UPDATE product SET status = 'deleted' WHERE product_id = 42;

-- The storefront only ever lists active products
SELECT name, price FROM product WHERE status = 'active';</code></pre>

    <h3>Order details</h3>
    <p>This owner ships the orders, instead of passing them to a third-party fulfiller (an outside company that packs and ships orders). So the store should record as much as it can about each order. This helps with tracking and with sales analysis. The product side is easy: the products ordered, the quantity of each, discounts, the total shipping cost, taxes and the total cost. Without these, the order can’t be fulfilled (completed and shipped). The <em>customer</em> side is harder, because it is a question of privacy.</p>

    <h3>The customer’s view</h3>
    <p>To buy anything, a customer must give two things:</p>
    <ul>
      <li><strong>valid payment authorization</strong> (permission to take the payment);</li>
      <li><strong>where to ship the order</strong>, and perhaps how.</li>
    </ul>
    <p>Both may include a name, and the shipping details include an address. The owner may want to keep names and addresses for reports. If so, check the privacy law where the store operates. The book mentions European data protection rules. Unless the customer agrees, these rules allow only the minimum data, kept for a short time.</p>
    <p>The book’s general rule is: <q>all items of customer information should be optional</q>. Take a question like “gift or personal use?”. The answer is useful to the owner, but the customer gains nothing by answering. If the form won’t submit until the customer answers, the store may lose the sale. Two items are safe and useful to ask for:</p>
    <ul>
      <li><strong>E-mail address</strong>, to send a shipping confirmation. (This is not needed if the products are downloads.)</li>
      <li><strong>A customer ID and password</strong>, so a customer can come back and track their orders.</li>
    </ul>

    <h3>Payment processing</h3>
    <p>Best practice is <strong>not to store payment details at all</strong>. Instead, it works like this:</p>
    <ul>
      <li>The customer pays on the secure site of a third-party processor (an outside company that handles payments).</li>
      <li>The processor answers “approved” or “denied”.</li>
      <li>The store records only that result on the order.</li>
    </ul>
    <p>If the payment is denied, the customer may want to abandon the order. Or the customer may want to save it and come back later with a different payment method. The book gives these processors as examples: Authorize.Net, LinkPoint, VeriSign, PayPal and 2CheckOut.</p>
  </section>
  <figure class="wide">
    <div class="plate" data-dg="pay"></div>
    <figcaption><span class="src ill">Course illustration</span><b>Figure B.</b> The payment flow that the chapter describes. The card details go to the processor. They never go into the store’s database. The store saves only the result.</figcaption>
  </figure>
  <div class="aside"><b>Then vs now.</b> The book’s privacy warning matters even more today. The EU’s GDPR (2018) and similar laws make <em>data minimization</em> a legal duty. Data minimization means keeping only the data you really need. It is the same as the chapter’s “store the bare minimum” advice. Card data is covered by PCI DSS, a security standard for card payments. Hosted checkouts (Stripe Checkout, PayPal and others) do exactly what the figure shows: you store a payment ID and a status, never the card. Store password <em>hashes</em> (bcrypt or Argon2), never the passwords themselves. A hash is a scrambled value that can’t be turned back into the password.</div>
  <h3>Try it: where does this requirement go?</h3>
  <p>Gathering means noticing what each requirement means for the data. Pick one:</p>
  <div class="chips" id="reqBtns" aria-label="Pick a requirement"></div>
  <div class="note" id="reqNote" aria-live="polite"></div>
  <div class="aside pitfalls"><b>Common mistakes.</b>
    <ul>
      <li>Designing from the page layouts instead of from the data.</li>
      <li>Deleting rows that the history depends on.</li>
      <li>Making every customer field required.</li>
      <li>Storing card numbers “just for repeat orders”.</li>
    </ul>
    Each one either loses data you need or keeps data you shouldn’t have.</div>

  <!-- 5.3 -->
  <section class="chap" id="p5-3">
    <h2><span class="num">5.3</span>Identify entities and attributes</h2>
    <p>As in Chapter 4, a conceptual (ER) design starts with a list of the <strong>entities</strong> and their <strong>attributes</strong>. An entity is a kind of thing the database stores facts about, such as Product. Its attributes are those facts, such as the price. The most important rule here is to <strong>leave out anything that looks like a relationship</strong>. If you list the plain attributes first, they are out of the way. Then the next step can focus on relationships. That is where the real design decisions are.</p>
    <p>Compare the lists with the requirements. “Product category or categories” is no longer on Product. “Subcategories” is no longer on Category. Both will come back as relationships. The book’s lists already hint at the relationships: products are classified by category, and customers have orders.</p>
  </section>
  <figure class="wide">
    <div class="plate" data-dg="ents"></div>
    <div class="chips" id="entsBtns" aria-label="Choose a view"></div>
    <div class="note" id="entsNote" aria-live="polite"></div>
    <figcaption><span class="src book">From the book</span><b>Entity lists, pp. 146–147, redrawn.</b> The book gives these as bullet lists. Here they are drawn as entity boxes, with the book’s attribute names. The “Hidden relationships” view and its notes are course additions.</figcaption>
  </figure>
  <p>The book’s own lists show two things worth noticing:</p>
  <ul>
    <li>The <strong>status</strong> attribute from the administration requirements is not on Product’s list, although the design needs it.</li>
    <li>Order still lists “product(s) ordered” and “quantity of each product”. Strictly, these describe the Order–Product relationship. Chapter 6 is where they find their real home.</li>
  </ul>
  <div class="aside pitfalls"><b>Common mistakes.</b>
    <ul>
      <li>Putting a <code>categories</code> attribute on Product (a list stored in one field).</li>
      <li>Putting a <code>customer</code> attribute that holds a name on Order.</li>
    </ul>
    If an “attribute” names another entity, it is a relationship. Also, don’t create a separate entity for every word in the requirements. For example, Subcategory turns out not to be an entity (section 5.4).</div>

  <!-- 5.4 -->
  <section class="chap" id="p5-4">
    <h2><span class="num">5.4</span>Identify entity relationships</h2>
    <p>Now comes the real work: <strong>cardinality</strong>. Cardinality is how many instances of one entity relate to one instance of another. (An instance is one actual item, such as one product.) The book’s method is to examine every relationship <strong>in both directions</strong>. For each direction, you write a sentence of the form <q>each X is related to how many Y</q>. Then:</p>
    <ul>
      <li>“Related” becomes a verb, such as contains or orders.</li>
      <li>“How many” is the cardinality in that direction.</li>
      <li>Each answer has a minimum (must there be any?) and a maximum (can there be more than one?).</li>
    </ul>
    <p>Take each entity in turn. Product relates to Category and to Order. It does <em>not</em> relate directly to Customer. Products reach customers only through the orders that customers place.</p>
  </section>
  <figure class="wide">
    <div class="plate" data-dg="decoder"></div>
    <div class="chips" id="decMin" aria-label="Minimum"></div>
    <div class="chips" id="decMax" aria-label="Maximum"></div>
    <div class="note" id="decNote" aria-live="polite"></div>
    <figcaption><span class="src ill">Course illustration</span><b>Figure C.</b> Build a cardinality sentence. Choose the minimum number of orders per customer (first row of buttons) and the maximum (second row). Watch the crow’s-foot marker and the sentence change. (A crow’s foot is the three-line mark that means “many”.) The legend shows the four combinations.</figcaption>
  </figure>

  <h3>Category and Product</h3>
  <p>The book first draws this as a general many-to-many relationship. It has crow’s feet at both ends. It also has two verb phrases (labels), one for each direction: a category <strong>contains</strong> products, and a product <strong>belongs to</strong> categories. Then two design decisions settle the minimums:</p>
  <ul>
    <li><strong>Must a category contain a product?</strong> Yes. Empty categories frustrate shoppers. When you record this in the diagram, it tells the developers to hide empty categories.</li>
    <li><strong>Must a product belong to a category?</strong> Yes. Otherwise it never appears on the category listing pages. A product may also belong to <em>more than one</em> category. This raises a reporting question: which category gets credit for a sale? The answer is a <strong>default category</strong> for sales tracking. It is an example of <strong>relationship data</strong>, a fact that belongs to the link between two entities. Chapter 6 returns to it.</li>
  </ul>
  <figure class="wide">
    <div class="plate" data-dg="catprod"></div>
    <figcaption><span class="src book">From the book</span><b>Book figure, p. 148, redrawn.</b> Category and Product, many-to-many. There are no circles, so neither side may be zero.</figcaption>
  </figure>
  <p>A database can’t build a many-to-many relationship directly. In Chapter 6 it will be split into two one-to-many relationships through an <strong>associative entity</strong>. This is an extra entity that sits between the two entities and links them.</p>

  <h3>Order and Product</h3>
  <p>This relationship is also many-to-many. Read it in both directions:</p>
  <ul>
    <li>A new product isn’t on any order yet, so a product may be on <strong>zero</strong> orders. Most products sell again and again, so the maximum is many. A one-of-a-kind item fits too: after one order, its quantity on hand simply drops from 1 to 0.</li>
    <li>An order without a product isn’t an order. One product per order would be very unfriendly. So an order is for <strong>one or more</strong> products.</li>
  </ul>
  <p>The zero shows up as the small circle at the Order end.</p>
  <figure class="wide">
    <div class="plate" data-dg="ordprod"></div>
    <figcaption><span class="src book">From the book</span><b>Book figure, p. 149, redrawn.</b> Order and Product. The circle at the Order end records that a product may not have been ordered yet.</figcaption>
  </figure>
  <p>The book adds that ER conventions (the ways people draw these diagrams) vary. Perfect notation matters less than two things: confirming each cardinality, and recording it for the later stages.</p>

  <h3>Category and subcategory</h3>
  <p>Is Subcategory an entity of its own? The test is whether it is <strong>intrinsically different</strong> from a category, that is, different in its basic nature. It isn’t. Both have a name and a description, and there can be sub-sub-levels. So the book models it as a <strong>one-to-many recursive relationship</strong>. A recursive relationship links an entity to itself: here, Category to Category.</p>
  <ul>
    <li>A category may contain many subcategories, or none (at the bottom level). So the answer is <strong>zero or more</strong>.</li>
    <li>A subcategory belongs to <strong>zero or one</strong> parent. Zero is for top-level categories. “At most one” is a design choice. Categories with several parents are possible, but users find them confusing. Also, a recursive relationship isn’t many-to-many anyway.</li>
  </ul>
  <figure class="wide">
    <div class="plate" data-dg="recur"></div>
    <figcaption><span class="src book">From the book</span><b>Book figure, p. 150, redrawn.</b> The recursive relationship on Category. The line leaves the entity and comes back into the same entity.</figcaption>
  </figure>
  <p>But surely “Programming” can sit under several parents? The book’s Open Directory example shows that it doesn’t need to. Look at these three:</p>
  <ul>
    <li>Computers: Programming</li>
    <li>Computers: Education: Programming</li>
    <li>Computers: Parallel Computing: Programming</li>
  </ul>
  <p>They are <strong>three different categories</strong> that share a name. Each one has one parent.</p>
  <figure class="wide">
    <div class="plate" data-dg="subcat"></div>
    <div class="note" id="subcatNote" aria-live="polite"></div>
    <figcaption><span class="src ill">Course illustration</span><b>Figure D.</b> The book’s Open Directory example, drawn as a tree. Beside it are the rows that a self-referencing table would hold. (In a self-referencing table, a column points to another row of the same table.) Click a category to see its full path and its row. The table is a course preview of Chapter 6.</figcaption>
  </figure>
  <p class="codehead">Course addition · a recursive relationship is a foreign key (a column that points to a row) to the same table</p>
<pre><code class="sql">CREATE TABLE category (
  category_id INT PRIMARY KEY,
  name        VARCHAR(80) NOT NULL,
  description TEXT,
  parent_id   INT NULL REFERENCES category(category_id)  -- zero or one parent
);

-- Top-level categories have no parent
SELECT name FROM category WHERE parent_id IS NULL;</code></pre>

  <h3>Order and Customer</h3>
  <p>Customer relates only to Order, and this relationship is <strong>one-to-many</strong>. Read it in both directions:</p>
  <ul>
    <li>A customer can place many orders, or none yet. They may register first, or just join a mailing list (for that, only the e-mail is needed).</li>
    <li>An order must belong to a customer. The application shouldn’t create an order without knowing who placed it. Orders shared between customers are too complex and unrealistic. So each order has exactly one customer.</li>
  </ul>
  <figure class="wide">
    <div class="plate" data-dg="custord"></div>
    <figcaption><span class="src book">From the book</span><b>Book figure, p. 151, redrawn.</b> Customer and Order, one-to-many. The book leaves the Customer end of the line unmarked. The “exactly one” bars (in the accent color) are added here, to match the book’s text.</figcaption>
  </figure>
  <div class="aside"><b>Then vs now.</b> The book’s two directory examples no longer exist. The Yahoo Directory closed in 2014, and the Open Directory Project (dmoz) closed in 2017. But category trees with one parent per node (per item in the tree) are as common as ever. Think of the breadcrumbs on any store (the path of links, such as Home › Books, at the top of a page), or nested routes in a React app.</div>
  <div class="aside pitfalls"><b>Common mistakes.</b>
    <ul>
      <li>Reading a relationship in one direction only. You get the maximum, but you miss a minimum.</li>
      <li>Drawing a direct Product–Customer relationship that really goes “through Order”.</li>
      <li>Creating a Subcategory table that duplicates Category.</li>
      <li>Treating a shared name as a shared category.</li>
    </ul></div>

  <!-- 5.5 -->
  <section class="chap" id="p5-5">
    <h2><span class="num">5.5</span>Prepare the conceptual data model</h2>
    <p>The <strong>conceptual data model</strong> shows every entity of interest and the relationships between them. It has no tables or columns. You get it by putting the small ER diagrams from the previous step together into one diagram. Crow’s feet mark the “many” ends: product–category is many-to-many, and customer–order is one-to-many. Circles mark where zero is allowed: for example, a customer may have no orders.</p>
  </section>
  <figure class="wide">
    <div class="plate" data-dg="model"></div>
    <div class="chips" id="modelBtns" aria-label="Highlight a relationship"></div>
    <div class="note" id="modelNote" aria-live="polite"></div>
    <figcaption><span class="src book">From the book</span><b>Book figure, p. 152, redrawn.</b> The web store’s conceptual data model. The layout, labels and markers follow the book. The accent bars at the Customer end are added, as in the Order and Customer figure.</figcaption>
  </figure>
  <p>Two of the four relationships are many-to-many: Category–Product and Product–Order. Each one will need an associative entity. But that belongs to physical design, which is Chapter 6. The book also reminds you of this: without the gathering step, all of this would be guesswork. A guess that is good for one project can be a disaster for another.</p>
  <div class="aside"><b>Front-end tie-in.</b> Think of this model as the TypeScript types you would sketch before you write any API. For example: <code>Category</code> with an optional <code>parentId</code>, and <code>Order</code> with a required <code>customerId</code>. The many-to-many lines are the ones that can’t be a single ID field on either side. They need their own type, and that is exactly what Chapter 6 adds.</div>

function chips(rowId, items, onPick){
  const row = $(rowId);
  items.forEach(([v, l]) => { const b = document.createElement("button"); b.className = "btn"; b.dataset.v = v; b.textContent = l; b.addEventListener("click", () => pick(v)); row.appendChild(b); });

}

(function(){

  const WORD = { "01":"zero or one order", "11":"exactly one order", "0N":"zero, one or more orders", "1N":"one or more orders" };
  function upd(){
    const k = mn + mx;
    p.querySelector('path[marker-end]').setAttribute("marker-end", `url(#${MK[k]})`);

      : k === "1N" ? "<b>One or more</b> would mean that nobody can register without ordering. There would be no signing up first, and no mailing list."
      : k === "11" ? "<b>Exactly one</b> would make Customer and Order one-to-one. Every customer could only ever buy once."
      : "<b>Zero or one</b> allows registering first, but limits each customer to a single order.") +
      " The minimum is drawn nearer the middle of the line (circle = 0, bar = 1). The maximum sits against the entity (bar = 1, crow’s foot = many).";
  }
  chips("decMin", [["0","Minimum: zero (optional)"],["1","Minimum: one (mandatory)"]], v => { mn = v; upd(); })("0");

})();

const quizEl = $("quiz"); let answered = 0, right = 0;
function buildQuiz(){
  quizEl.innerHTML = ""; answered = 0; right = 0; $("score").textContent = `0 of ${QUIZ.length} answered`;
  QUIZ.forEach(([q, opts, ans, why], qi) => {
    const bx = document.createElement("div"); bx.className = "q";
    bx.innerHTML = `<p>${qi + 1}. ${esc(q)}</p><div class="opts"></div><div class="why" hidden></div>`;
    const o = bx.querySelector(".opts");
    opts.forEach((txt, i) => {
      const b = document.createElement("button"); b.textContent = txt;
      b.addEventListener("click", () => {
        o.querySelectorAll("button").forEach((x, j) => { x.disabled = true; if (j === ans) x.classList.add("right"); });
        if (i !== ans) b.classList.add("wrong"); else right++;
        answered++;
        const w = bx.querySelector(".why"); w.hidden = false; w.textContent = (i === ans ? "Correct. " : "Not quite. ") + why;
        $("score").textContent = answered === QUIZ.length ? `You scored ${right} of ${QUIZ.length}.` : `${answered} of ${QUIZ.length} answered, ${right} correct`;
      });
      o.appendChild(b);
    });
    quizEl.appendChild(bx);
  });
}
$("quizReset").addEventListener("click", buildQuiz);
