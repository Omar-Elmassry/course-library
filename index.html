  <h1>Core database concepts</h1>
  <p class="lede">A short course on Chapter 2 of <em>Practical Database Design for the Web</em>. It covers these topics:</p>
  <ul>
    <li>what a data model is;</li>
    <li>how the relational model gives data a structure;</li>
    <li>how nulls and keys work;</li>
    <li>why we normalize;</li>
    <li>how integrity rules protect data;</li>
    <li>what indexes and hashing do at the physical level (on the disk).</li>
  </ul>
  <p class="byline">Hover over or tap any part of a diagram to see an explanation. Every figure has a Full screen button. The interactive parts are:</p>
  <ul>
    <li>a toggle for physical data independence;</li>
    <li>a builder that turns sets into a table;</li>
    <li>an experiment that asks “is it still the same table?”;</li>
    <li>foreign keys that you can click;</li>
    <li>a tool to explore anomalies;</li>
    <li>a step-by-step normalization view;</li>
    <li>pickers for nulls and for integrity rules;</li>
    <li>a tool that traces a B-tree search;</li>
    <li>a comparison of disk access methods.</li>
  </ul>
  <p class="byline">Figures marked <span class="src book">From the book</span> are redrawn from the chapter. <span class="src ill">Course illustration</span> marks diagrams drawn for this course. The book’s headings have no numbers. The numbers here belong to the course. Notes marked <em>Then vs now</em> are course additions, because the book was written around 2002–2003.</p>

  <!-- 2.1 -->
  <section class="chap" id="p2-1">
    <h2><span class="num">2.1</span>What is a data model?</h2>
    <p>The chapter starts by explaining why theory matters. You can build a database without theory. It will mostly work, until you put heavy demands on it. Well-designed databases stay fast as they grow. They are also easier to maintain and extend. With a poor design, a catalog search that works well with 500 products can become very slow with 5,000. The good news is this: the ideas behind the relational model are simple. Designing large systems is still hard.</p>
    <p>The term “data model” has two accepted meanings. The book asks you to keep them separate:</p>
    <dl class="notation">
      <dt>Meaning 1: a framework</dt><dd>A formal way to structure and work with data. A DBMS (database management system) is built on it. The relational model is one example. Mostly theorists and DBMS vendors use this meaning.</dd>
      <dt>Meaning 2: a description</dt><dd>A structured description of one real-world problem, such as an ER diagram of a library database. People often call it a <strong>schema</strong>. Designers and analysts use this meaning.</dd>
    </dl>
    <p>The book compares them like this. Meaning 1 is like building regulations. Meaning 2 is like the floor plans for one particular building. This chapter and the next use meaning 1. In this sense, every data model has three aspects:</p>
    <dl class="notation">
      <dt>Structure</dt><dd>How data is represented.</dd>
      <dt>Integrity</dt><dd>How invalid data is kept out, and how valid data stays valid.</dd>
      <dt>Operations</dt><dd>How you add, delete, change and retrieve data. Query languages such as SQL belong here (Chapter 3).</dd>
    </dl>
    <p>The biggest benefit of modern models is <strong>physical data independence</strong>. This means programs do not depend on how data is stored on disk. In the 1960s there was no DBMS. You wrote your own code to manage data. You had to know where every file was and how it was laid out. The solution was a <em>logical</em> data model placed on top of the physical storage. Programs talk to the logical model. The DBMS maps it to files. In theory, you can completely reorganize storage without rewriting a single program. It also makes a general query language possible, because nobody needs to know where the data physically sits.</p>
  </section>
  <figure class="wide">
    <div class="plate" data-dg="dmodel"></div>
    <div class="chips" id="dmBtns" aria-label="Choose a setup"></div>
    <div class="note" id="dmNote" aria-live="polite"></div>
    <figcaption><span class="src ill">Course illustration</span><b>Figure A.</b> The three aspects of a data model, and physical data independence. Switch between three views: the 1960s approach, a logical model, and what happens when storage is reorganized. The file names are invented for the illustration.</figcaption>
  </figure>
  <p>Three logical models appeared in the late 1960s and early 1970s: hierarchical, network and relational. The first two (Chapter 1) turned out to be inflexible. The relational model replaced them in the early 1980s. That is why the rest of the chapter focuses on it.</p>
  <div class="aside"><b>Front-end tie-in.</b> The book notes that the Web was meant to have its own physical independence. URLs are physical paths. Logical URIs that never change were supposed to hide them. You see the same idea when an API returns stable resource ids. Behind the API, the server can move files around.</div>

  <!-- 2.2 -->
  <section class="chap" id="p2-2">
    <h2><span class="num">2.2</span>The relational model: tables, rows and columns</h2>
    <p>Edgar Codd was a mathematician at IBM. He did not like the early models, because they were put together without a clear plan. So he built a model on <strong>set theory and predicate logic</strong> (two branches of mathematics). He published it in the July 1970 issue of <em>Communications of the ACM</em>. Next came IBM’s System R prototype in the mid-1970s. Then came SQL/DS in 1981, which later became DB2. But a small company, Relational Software, Inc., shipped a product first, in 1979. Its product was Oracle. The 1980s brought DB2, Sybase, Informix and many more.</p>
    <p>The core idea is a <strong>relation</strong>. Take four sets: employee names, positions, locations and salaries. Each employee takes one value from each set. Put those choices in a line, one line per employee, and you get a table. Each column takes its values from one set. Each row is one employee. Build it below.</p>
  </section>
  <figure class="wide">
    <div class="plate" data-dg="sets"></div>
    <div class="chips" id="setBtns" aria-label="Choose a step"></div>
    <div class="note" id="setNote" aria-live="polite"></div>
    <figcaption><span class="src book">From the book</span><b>Book figures, p. 28, redrawn.</b> Four sets of values, and the EMPLOYEE relation built by taking one value from each.</figcaption>
  </figure>
  <p>It looks like a spreadsheet. But the book stresses that the similarity is only on the surface. Note two things. First, a <em>relation</em> (a table) is not a <em>relationship</em> (a link between tables). Second, from here on the book just says “table”. These rules make a table different:</p>
  <ul>
    <li>It has a <strong>name</strong> (EMPLOYEE) and named <strong>columns</strong>. Each column takes its values from a set. This set is called the column’s <strong>domain</strong>.</li>
    <li>Each cell holds <strong>one value</strong>. No employee has two positions in one cell. This rule is first normal form (section 2.5).</li>
    <li>It can have any number of rows: four, four billion, or none. It can have as many columns as you need. But columns are properties of one kind of thing, so a very large number of columns is unusual.</li>
    <li><strong>No two rows are identical</strong>, because each row is a different real-world thing.</li>
    <li><strong>Row order and column order don’t matter.</strong> Shuffle the rows, or swap whole columns, and it is still the same table. Moving single values is different. Try it:</li>
  </ul>
  <figure class="wide">
    <div class="plate" data-dg="props"></div>
    <div class="chips" id="propBtns" aria-label="Try a change"></div>
    <div class="note" id="propNote" aria-live="polite"></div>
    <figcaption><span class="src ill">Course illustration</span><b>Figure B.</b> The book’s rules about order and duplicates, shown as an experiment on its EMPLOYEE table. The “Paris” salary is the book’s own example of nonsense data.</figcaption>
  </figure>
  <p>In formal terms, tables are <strong>relations</strong>, rows are <strong>tuples</strong> and columns are <strong>attributes</strong>. The book uses the everyday names. But it does not accept file, record and field as other names for them. Those are <em>physical</em> structures. One logical table may be split across several physical files.</p>
  <p>A table usually stands for something real (employees, products, customers) or something abstract (orders, invoices, contracts). Columns are the properties you store. Each row is one occurrence. The chapter’s running example has three more tables: PRODUCT, CUSTOMER and SALE (shown in section 2.4). Drawing whole tables takes a lot of space, so the book uses a short notation:</p>
<pre><code>EMPLOYEE(Name, Position, Location, Salary)
PRODUCT(ProductNo, Description, ReorderLevel, Price, QtyInStock)
CUSTOMER(CustomerNo, First, Last, Address, CreditLimit)
SALE(SaleNo, SaleDate, CustomerNo, ProductNo, Qty, Amount, Salesrep)</code></pre>
  <div class="aside pitfalls"><b>Common mistakes.</b>
    <ul>
      <li>Depending on row order, for example “the newest order is the last row”. A table has no order unless you ask for one with <code>ORDER BY</code>.</li>
      <li>Treating a table like a spreadsheet, with duplicate rows or several values packed into one cell.</li>
    </ul></div>

  <!-- 2.3 -->
  <section class="chap" id="p2-3">
    <h2><span class="num">2.3</span>Domains, data types and nulls</h2>
    <h3>Data types and domains</h3>
    <p>On disk, everything is bits. But a DBMS offers <strong>data types</strong>. A data type says how to store and return values, and it hides the physical form. You can expect these types:</p>
    <ul>
      <li>integers and decimals;</li>
      <li>a date type (often with time, sometimes with time as a separate type);</li>
      <li>strings of fixed or variable length.</li>
    </ul>
    <p>Many products also add time intervals, <strong>BLOBs</strong> (binary large objects, such as images or documents), <strong>CLOBs</strong> (character large objects, for megabytes of text or XML) and Booleans.</p>
    <p>Strictly speaking, data types are not part of the relational model. The model talks about <strong>domains</strong> instead. A domain is the set of allowed values for a column. A domain can be “any integer greater than 4000”. It can even be a mixed group of values of different kinds, but domains of a single type are normal. Few products supported domains directly (the book names Oracle). You get most of the same effect with constraints (rules on a column), covered in Chapter 3.</p>
    <div class="aside"><b>Then vs now.</b> PostgreSQL has <code>CREATE DOMAIN</code>, for example <code>CREATE DOMAIN salary AS integer CHECK (VALUE &gt; 20000)</code>. This is exactly the book’s restricted domain of a single type. In most products, a <code>CHECK</code> constraint on the column is the everyday way to do the same thing.</div>
    <h3>Missing data: null</h3>
    <p>Sometimes there is no value to store. There are two different reasons for this:</p>
    <ul>
      <li>The value may be <strong>unknown</strong>. For example, the customer did not give an email address.</li>
      <li>The value may be <strong>inapplicable</strong> (it does not apply). For example, the customer has no email address at all.</li>
    </ul>
    <p>An empty string means “a blank string”, not “no value”. Numbers and dates have no blank. Old tricks, such as <code>-1</code> for a missing price, fail as soon as you calculate a sum, an average or a date difference.</p>
    <p>Codd’s answer is <strong>null</strong>. Null is a marker that stands in place of a value. You can use it with any type. Null is not itself a value, so the term “null value” is slightly wrong. In the SALE table, sale 12348 has a null CustomerNo. Perhaps it was a cash sale. In CUSTOMER, a null CreditLimit means “not allowed credit”. A zero would give the wrong meaning. Zero suggests that the customer has credit, but none is left.</p>
    <p>Null is not a value, so comparisons and arithmetic with it have no meaning. The book compares “is null &gt; 2000?” to asking “is fish &gt; 2000?”. The usual answer is “unknown”. Pick an expression below to see what SQL does.</p>
  </section>
  <div class="chips" id="nullBtns" aria-label="Pick an expression"></div>
  <div class="note" id="nullNote" aria-live="polite"></div>
  <p class="codehead">PostgreSQL · nulls in the book’s CUSTOMER table (course addition; SQL arrives in Chapter 3)</p>
<pre><code class="sql">SELECT AVG(credit_limit) FROM customer;               -- 1250: the three nulls are skipped
SELECT * FROM customer WHERE credit_limit = NULL;     -- no rows, ever: the test is unknown
SELECT * FROM customer WHERE credit_limit IS NULL;    -- Amelia, Antonio and Wayne
SELECT COALESCE(credit_limit, 0) FROM customer;       -- show 0 instead of null, explicitly</code></pre>
  <p>The chapter gives practical advice:</p>
  <ul>
    <li>Check how your RDBMS (relational DBMS) handles nulls.</li>
    <li>For each column, say whether nulls are allowed.</li>
    <li>If a product does not support nulls, imitate them with a flag column. For example, put <code>AllowedCredit</code> = Y/N next to <code>CreditLimit</code>.</li>
    <li>The other option is a <strong>default value</strong>. For example, a dummy “Cash Sale” customer can be the default CustomerNo.</li>
  </ul>
  <p>The general guideline: use a sensible default if one exists. Use null when no default makes sense.</p>
  <div class="aside pitfalls"><b>Common mistakes.</b>
    <ul>
      <li>Writing <code>= NULL</code> instead of <code>IS NULL</code>.</li>
      <li>Expecting <code>AVG</code> to count missing rows.</li>
      <li>Using 0, <code>-1</code> or <code>''</code> to mean “missing” in a column that can really hold those values.</li>
    </ul>
    In TypeScript, the same split appears as <code>null</code> versus <code>undefined</code> versus <code>""</code>. Decide which one means “no value”. Then always map it to SQL null in the same way.</div>

  <!-- 2.4 -->
  <section class="chap" id="p2-4">
    <h2><span class="num">2.4</span>Primary keys and foreign keys</h2>
    <h3>Identifying rows: primary keys</h3>
    <p>If two rows were identical, you could not tell the real-world things apart. So the relational model requires a <strong>primary key</strong> in every table. This is a column, or a combination of columns, that identifies each row uniquely. A single column is better. But <strong>composite keys</strong> (keys made of several columns, such as order number plus product number) appear naturally. The model insists on a primary key, even though many RDBMSs do not.</p>
    <p>In PRODUCT, <code>ProductNo</code> is clearly a unique code. <code>Description</code> is not safe. Names and descriptions are not guaranteed to stay unique or unchanged. And <strong>primary key values shouldn’t change</strong>. EMPLOYEE is harder:</p>
    <div class="tablewrap"><table>
      <thead><tr><th>Name</th><th>Position</th><th>Location</th><th>Salary</th></tr></thead>
      <tbody>
        <tr><td>Jane Smith</td><td>Manager</td><td>London</td><td>35000</td></tr>
        <tr><td>Richard Jones</td><td>Analyst</td><td>New York</td><td>35000</td></tr>
        <tr><td>Anna Horton</td><td>Programmer</td><td>London</td><td>22000</td></tr>
        <tr><td>Alex de Tocqueville</td><td>Programmer</td><td>Paris</td><td>21000</td></tr>
      </tbody>
    </table></div>
    <p class="hint">The book’s EMPLOYEE table as shown on p. 35. (On p. 28, Richard Jones earns 34000. On p. 35, the top two rows both have 35000. That is why Salary can’t be the key.)</p>
    <p>Position, Location and Salary all repeat. Name looks unique, but many people share a name. You could join all the columns together into one key. This works on paper, but it makes searching slow. Also, two London programmers called Anna Horton, both earning 22000, are not impossible. A better answer is an invented <strong>surrogate key</strong>, such as an employee number. The RDBMS often generates it (Chapter 4).</p>
    <p>A table has exactly one primary key. But it may have several unique identifiers. Suppose you store both an employee number and a social security number. One becomes the primary key. The other is an <strong>alternate key</strong>. From here on, the book underlines primary keys. In the diagrams here, they are bold and underlined.</p>
    <h3>Linking tables: foreign keys</h3>
    <p>Customers place orders and books have authors, so tables also need links. Look at SALE. It contains <code>CustomerNo</code>, which is the primary key of CUSTOMER. Take a sale’s CustomerNo, and you can look up the right customer. This embedded column is a <strong>foreign key</strong>. It is called “foreign” because it is the primary (or alternate) key of another table. SALE is the <strong>child table</strong>. CUSTOMER is a <strong>parent table</strong>. SALE has a second foreign key, <code>ProductNo</code>, which points to PRODUCT. Click a sale to follow both.</p>
  </section>
  <figure class="wide">
    <div class="plate" data-dg="salesfk"></div>
    <div class="chips" id="fkBtns" aria-label="Highlight a property"></div>
    <div class="note" id="fkNote" aria-live="polite"></div>
    <figcaption><span class="src book">From the book</span><b>Book figure, p. 37, redrawn</b> (the tables themselves are on pp. 30–31). The book draws a line from every foreign-key value to its parent row. Here, one arrow per foreign key shows the link. Click a sale to highlight the rows it points to.</figcaption>
  </figure>
  <p>Notice three things. You can see all of them in the figure:</p>
  <ul>
    <li>A foreign key should only hold values that exist as keys in the parent, or null. Sale 12348 has a null CustomerNo. This is fine: there is no customer to find.</li>
    <li>Parent rows don’t need children. The left-handed doodad and the grunge nut have never been sold.</li>
    <li>Foreign key values don’t need to be unique in the child. Customer 1166-3461 appears twice. Product DHU69863 appears three times.</li>
  </ul>
  <p>Foreign keys exist mainly so you can <strong>join</strong> related rows (combine them in one result). For example, you can join sale 12347 with Amelia Waverley’s customer row (Chapter 3). Like primary keys, foreign keys can be composite. Unlike primary keys, a table can have several of them. People sometimes call them <em>references</em>.</p>
  <div class="aside pitfalls"><b>Common mistakes.</b>
    <ul>
      <li>Using a name or email as the primary key. Both can change.</li>
      <li>Copying customer details into the sale, instead of the customer’s key.</li>
      <li>Assuming the database checks foreign keys when you never declared them.</li>
    </ul></div>

  <!-- 2.5 -->
  <section class="chap" id="p2-5">
    <h2><span class="num">2.5</span>Normalization</h2>
    <p>Why split data into tables and then join them back? One big table is faster to read, up to a point. This was an early criticism of the relational model. The cost is <strong>data redundancy</strong>: the same data stored more than once. Here is the book’s BIG_UGLY_TABLE, with customers and sales in one table. Pick a problem to see it.</p>
  </section>
  <figure class="wide">
    <div class="plate" data-dg="bigugly"></div>
    <div class="chips" id="bugBtns" aria-label="Show a problem"></div>
    <div class="note" id="bugNote" aria-live="polite"></div>
    <figcaption><span class="src book">From the book</span><b>Book figure, p. 38, redrawn.</b> BIG_UGLY_TABLE. The anomaly views act out the book’s three examples. The new address (12 New Road) and the new customer in the insert view are invented for the illustration.</figcaption>
  </figure>
  <dl class="notation">
    <dt>Wasted space</dt><dd>About 50 bytes of Amelia’s details per sale. Over ten million sales, that is 500 MB.</dd>
    <dt>Update anomaly</dt><dd>An anomaly is an error caused by the design. When she moves, every copy must change. If you miss one, the data contradicts itself.</dd>
    <dt>Delete anomaly</dt><dd>Delete Richard Johnston’s only sale, and his customer details disappear with it.</dd>
    <dt>Insert anomaly</dt><dd>You can’t record a customer until they buy something.</dd>
  </dl>
  <p>Splitting data into related tables removes the redundancy. This is called <strong>normalization</strong>. (The book says the name came from Codd hearing that Nixon was “normalizing relations” with China.) Normalization is a set of rules called the <strong>normal forms</strong>. They go from first (1NF) to fifth (5NF). Each one removes more redundancy by splitting tables further. Boyce/Codd (BCNF) and Domain-Key (DK/NF) are outside this series of steps, and the book skips them. By definition, every table is in at least 1NF. Well-designed databases usually reach 3NF or 4NF.</p>
  <p>The worked example starts by combining PRODUCT, CUSTOMER and SALE into one table, ALL_SALES. Then it normalizes it back. The key idea is the <strong>functional dependency</strong>. <code>A → B</code> means that if you know A, you know B. Step through it:</p>
  <figure class="wide">
    <div class="plate" data-dg="normal"></div>
    <div class="chips" id="nfBtns" aria-label="Choose a normal form"></div>
    <div class="note" id="nfNote" aria-live="polite"></div>
    <figcaption><span class="src ill">Course illustration</span><b>Figure C.</b> The book’s normalization example (pp. 39–42). The book writes it in text notation. Here it is drawn as entities with crow’s-foot links. ALL_SALES lists CustomerNo and ProductNo once here. The book’s list repeats them.</figcaption>
  </figure>
  <div class="tablewrap"><table>
    <thead><tr><th>Form</th><th>Rule (the book’s definitions, reworded)</th><th>Problem it removes</th></tr></thead>
    <tbody>
      <tr><td>1NF</td><td>No repeating groups: every cell holds one value</td><td>Lists inside cells</td></tr>
      <tr><td>2NF</td><td>Every column depends on the <em>whole</em> primary key</td><td>Partial dependencies: columns that depend on only part of a composite key</td></tr>
      <tr><td>3NF</td><td>Every column depends on the primary key <em>alone</em></td><td>Transitive dependencies: a column depends on the key through another column (key → X → Y)</td></tr>
      <tr><td>4NF</td><td>The key determines single values, not collections (groups of values)</td><td>Multi-valued dependencies (key →→ many values)</td></tr>
    </tbody>
  </table></div>
  <p>Two shortcuts help:</p>
  <ul>
    <li>A table with a single-column primary key is automatically in 2NF. (A table with a composite key can still be in 2NF.)</li>
    <li>A short summary of 3NF: every column depends on “the key, the whole key, and nothing but the key”.</li>
  </ul>
  <p>The book tells you not to worry: 4NF confuses experts too, and most 3NF tables are already in 4NF. 5NF is the theoretical limit. In practice, there is little reason to go beyond 4NF, or even beyond 3NF.</p>
  <p>Normalization makes reading more expensive. The DBMS has to put the pieces back together, and on the Web, response time matters. So the book advises you to choose based on the workload:</p>
  <ul>
    <li>Data that is mostly read, like a catalog, can be <strong>denormalized</strong> (kept in fewer, larger tables).</li>
    <li>Mission-critical data, such as finance data, should stay normalized, even if it is slower.</li>
  </ul>
  <p>A common pattern keeps both. A normalized operational database feeds a denormalized <strong>data warehouse</strong> (a separate database for reports and analysis). Normalization is a bottom-up technique: it starts from the columns. Chapter 4 designs top-down, with ER diagrams.</p>
  <div class="aside pitfalls"><b>Common mistakes.</b>
    <ul>
      <li>Adding <code>address2</code>, <code>address3</code> columns for “any number” of addresses. That is the 4NF problem. Use a child table instead.</li>
      <li>Denormalizing before you have measured a slow query.</li>
      <li>Creating a surrogate key before the table is fully normalized. The book’s example waits until the end on purpose.</li>
    </ul></div>

  <!-- 2.6 -->
  <section class="chap" id="p2-6">
    <h2><span class="num">2.6</span>Data integrity</h2>
    <p>Data has <strong>integrity</strong> when it is valid and consistent with itself. To get there, you define integrity rules, usually during design (Chapter 4). Then you let the DBMS enforce them. Some data is old (legacy data), or you do not control it. For that data, the best you can do may be to find where it breaks the rules. The idea applies to every data model, including the hierarchical one.</p>
    <p>There are two kinds of rule:</p>
    <ul>
      <li><strong>Built-in</strong> rules come with the data model. They are mandatory.</li>
      <li><strong>User-defined</strong> rules are the ones you, the developer, add. They are optional, which means they may never get implemented.</li>
    </ul>
    <p>The book gives an example. Everyone “knows” that no customer gets more than a 30% discount. But if that is not a rule in the database, nothing stops a program from giving 50%.</p>
    <dl class="notation">
      <dt>Entity integrity</dt><dd>Every row has a primary key that is unique across the table. <strong>No part of it may be null</strong>. You can’t prove uniqueness with nulls, because null can’t be compared.</dd>
      <dt>Referential integrity</dt><dd>A foreign key value must match an existing primary key in the parent table, <strong>or be null</strong>. This is why sale 12348 is allowed.</dd>
      <dt>Domain integrity</dt><dd>Every value in a column comes from the column’s domain.</dd>
    </dl>
    <p>The book gives these sample rules:</p>
    <ul>
      <li>Two employees can’t share a social security number. This is entity integrity, which is built in.</li>
      <li>Every employee must have a name.</li>
      <li>Gender must be present, and it must be ‘f’ or ‘m’.</li>
      <li>A credit limit must be 0–5000 or null.</li>
    </ul>
    <p>The last three rules are all user-defined. Try some changes against the chapter’s tables:</p>
  </section>
  <div class="chips" id="intBtns" aria-label="Pick a change"></div>
  <div class="note" id="intNote" aria-live="polite"></div>
  <p class="codehead">PostgreSQL · the rules declared in the database (course addition)</p>
<pre><code class="sql">CREATE TABLE customer (
  customer_no  char(9)      PRIMARY KEY,                              -- entity integrity
  first        varchar(40)  NOT NULL,
  last         varchar(40)  NOT NULL,
  address      varchar(120),
  credit_limit numeric(8,2) CHECK (credit_limit BETWEEN 0 AND 5000)   -- null passes
);
CREATE TABLE sale (
  sale_no     int         PRIMARY KEY,
  sale_date   date        NOT NULL,
  customer_no char(9)     REFERENCES customer (customer_no),          -- null = cash sale
  product_no  char(8)     NOT NULL REFERENCES product (product_no),   -- referential integrity
  qty         int         NOT NULL CHECK (qty &gt; 0),                    -- a domain-style rule
  amount      numeric(10,2),
  salesrep    varchar(60)
);</code></pre>
  <p>Rules belong as close to the data as possible. The best place is inside the database, where a badly behaved program can’t get around them. On the Web, you also want instant feedback. So the book suggests sending some rules to the browser with the form, as JavaScript. But these rules must come from <strong>one authoritative source</strong> (one official place where each rule is defined).</p>
  <p>Integrity rules guarantee that data is <em>valid</em>. They do not guarantee that it is <em>correct</em>. As an employee name, “Brain Watlers” passes every rule, but it is still a typo. The book’s protection is double entry or verification, in addition to the rules. If you put wrong data in, you get wrong data out.</p>
  <div class="aside"><b>Front-end tie-in.</b> Today, “one authoritative source” is usually a shared schema. An example is a Zod schema that both the React form and the API handler import. Keep the database constraints too. They are the only rules that every client, script and migration must pass through.</div>

  <!-- 2.7 -->
  <section class="chap" id="p2-7">
    <h2><span class="num">2.7</span>Metadata and the data dictionary</h2>
    <p>Creating a database involves two jobs:</p>
    <ul>
      <li>defining its structures (tables, columns, types, keys);</li>
      <li>filling it with data.</li>
    </ul>
    <p>The first job produces <strong>metadata</strong>, which is data about the database. The DBMS stores it in the <strong>catalog</strong>, also called the <strong>data dictionary</strong>. It holds:</p>
    <ul>
      <li>table definitions (name, number of columns, primary key, physical storage) and column definitions (name, type, size, the table it belongs to);</li>
      <li>integrity rules, index details, users and passwords, and access privileges (Chapter 7);</li>
      <li>statistics such as table sizes, row sizes and query counts.</li>
    </ul>
    <p>The dictionary can be huge. The book notes that Oracle’s has hundreds of tables. It usually uses the same model as the data. So in an RDBMS, it is just more tables. The DBMS uses it mainly to run itself.</p>
  </section>
  <p class="codehead">PostgreSQL · reading the data dictionary (course addition)</p>
<pre><code class="sql">SELECT column_name, data_type, is_nullable
FROM information_schema.columns
WHERE table_name = 'customer';</code></pre>
  <div class="aside"><b>Front-end tie-in.</b> Tools like Drizzle Kit and Prisma read exactly these catalog tables. They do this when they introspect a database (read its structure) or generate a migration diff. Typed query builders are metadata turned into TypeScript types.</div>

  <!-- 2.8 -->
  <section class="chap" id="p2-8">
    <h2><span class="num">2.8</span>Physical data access methods</h2>
    <p>Everything so far was logical. But performance is decided at the <strong>physical storage level</strong>. This level sits below the relational model, and the model itself says nothing about it. The slowest part is the disk. Memory answers in nanoseconds, but the disk answers in milliseconds. So RAM can be up to a million times faster. One slow read doesn’t matter. Millions of reads per second on a busy site do matter. The book reminds you that users become impatient after about three seconds.</p>
    <p>Disks can’t be made much faster. Whole databases rarely fit in RAM (the book mentions companies with 10 to 40 terabytes). So the goal is <strong>to touch the disk as rarely as possible</strong>. Data lives in files. The files are split into <strong>blocks</strong> (also called <strong>pages</strong>) of a fixed size. Each block holds several records. A block is the smallest unit the DBMS reads or writes. There are three ways to find a record by a key value. (Here “key” means a search key, not necessarily the primary key.)</p>
    <dl class="notation">
      <dt>Sequential access</dt><dd>Read from the start of the file until the key appears. This is a <strong>table scan</strong>. It is like reading the phone book from the first page to the last. On average you read half the records. This is fine for fifty rows, but far too slow for fifty million.</dd>
      <dt>Indexed access</dt><dd>Look up the key in an <strong>index</strong>. An index is a directory, stored separately, that says where the record is. The usual kind is the <strong>B-tree</strong>.</dd>
      <dt>Direct access</dt><dd>Give the key to a <strong>hash function</strong>. The function calculates the record’s location on disk. This usually needs one disk access.</dd>
    </dl>
  </section>
  <figure class="wide">
    <div class="plate" data-dg="btree"></div>
    <div class="chips" id="btBtns" aria-label="Choose a search"></div>
    <div class="note" id="btNote" aria-live="polite"></div>
    <figcaption><span class="src book">From the book</span><b>Book figure, p. 47, redrawn.</b> A three-level B-tree on client surnames. The book draws a pointer from every leaf entry to the records. Here there is one pointer per leaf. Two leaves in the book are slightly out of order (Hart before Harris, Wilson before Van plat). They are kept as printed. The “Ellis” and “starts with S” searches are course additions.</figcaption>
  </figure>
  <p>Each node holds key values in sorted order, plus pointers down to the next level. Look at the second-level node “Chen | Fenton”:</p>
  <ul>
    <li>Keys up to Chen are under the left pointer.</li>
    <li>Keys after Chen, up to Fenton, are under the middle pointer.</li>
    <li>The rest (up to Harris) are under the right pointer.</li>
  </ul>
  <p><strong>Leaf nodes</strong> (the nodes on the bottom level) point to the records on disk. Finding “Tudor” takes at most four disk reads: three nodes and the record. A small index like this stays in RAM, so it usually takes just one read. Now take the worst case for a table scan, with one record per block. A scan of these 27 records would need fourteen reads on average.</p>
  <p>The keys are sorted, so B-trees are good at <strong>range retrievals</strong>, such as “surnames starting with C”. Find the first match, then scan to the right. Records with similar keys also tend to be in the same block. So the next record is often already in memory. An index can be <strong>unique</strong> or <strong>non-unique</strong>. This one is non-unique (two Joneses, two Smiths).</p>
  <p>Indexes have a cost. Inserts, deletes and key changes force the DBMS to keep the tree in order. Sometimes it rebuilds part of the tree, and nobody can use that part during the rebuild. So add indexes freely when data rarely changes. Add them carefully when data changes a lot. Indexing primary keys is usually safe, because primary keys shouldn’t change. Many products index them automatically. Very small tables don’t need indexes at all: ten rows probably fit in one block.</p>
  <p><strong>Hashing</strong> decides where each record is placed, inside a reserved “hash space”. It spreads the records out evenly. This makes single-record lookups on very large tables (millions of rows) as fast as possible. But neighbouring keys end up in different blocks, so ranges are slow. The book’s conclusion: hashing is a very heavy tool, and for most databases indexes are enough. Compare all three:</p>
  <figure class="wide">
    <div class="plate" data-dg="access"></div>
    <div class="chips" id="accBtns" aria-label="Choose an access method"></div>
    <div class="note" id="accNote" aria-live="polite"></div>
    <figcaption><span class="src ill">Course illustration</span><b>Figure D.</b> The three access methods on a small example file of 24 surnames in 8 blocks. The block contents are invented. The read counts follow the book’s reasoning.</figcaption>
  </figure>
  <p class="codehead">PostgreSQL · the two index kinds (course addition; the book covers indexes in Chapter 8)</p>
<pre><code class="sql">CREATE INDEX customer_last_idx ON customer (last);               -- B-tree, the default
CREATE INDEX sale_no_hash      ON sale USING hash (sale_no);     -- equality lookups only</code></pre>
  <div class="aside"><b>Then vs now.</b> SSDs cut a random read from milliseconds to tens or hundreds of microseconds. But RAM is still around a thousand times faster. So the book’s general guideline still holds: fewer disk reads mean faster queries. Terabyte databases are normal now. In-memory stores like Redis cover the “keep it all in RAM” case for small data that is used very often.</div>
  <div class="aside pitfalls"><b>Common mistakes.</b>
    <ul>
      <li>Indexing every column “just in case” on a table with many writes.</li>
      <li>Expecting a hash index to help <code>WHERE last LIKE 'S%'</code> or <code>ORDER BY</code>.</li>
      <li>Forgetting to index the foreign key columns you join on.</li>
    </ul></div>

  <!-- 2.9 -->
  <section class="chap" id="p2-9">
    <h2><span class="num">2.9</span>Fitting it all together</h2>
    <p>The chapter ends with one picture. Data and metadata are at the center. Indexes and integrity rules surround them. Together they form one <strong>database</strong>. The <strong>DBMS</strong> manages it, and possibly other databases too. All access by users and applications goes through the DBMS. Security, transactions, APIs and data manipulation are left for later chapters. Click a layer.</p>
  </section>
  <figure class="wide">
    <div class="plate" data-dg="layers"></div>
    <div class="note" id="layNote" aria-live="polite"></div>
    <figcaption><span class="src book">From the book</span><b>Book figure, p. 49, redrawn.</b> How the chapter’s concepts fit together. The book’s database ring is slightly off-center. Here it is centered.</figcaption>
  </figure>
  <p>The summary puts things in a wider context. The relational model won against the hierarchical and network models because it is more flexible and simpler. But both older models have come back in new forms: <strong>hierarchical as XML</strong> and <strong>network as objects</strong>. Mapping between tables and objects is fairly easy. But there was no single accepted object model. (The ODMG tried to create one, but only some products adopted it.) Also, relational vendors were adding object and XML features anyway. Inside the relational world, the one big argument has been about nulls. One group supports them. The other group prefers default values.</p>
  <div class="aside"><b>Then vs now.</b> Today, the idea “XML is the new hierarchical model” would be “JSON is”. Document stores and <code>JSONB</code> columns hold data shaped like a tree, with the same trade-offs the book describes. And the debate about nulls never ended. It just moved into language design (<code>strictNullChecks</code>, <code>Option</code> types).</div>

    <div class="tablewrap"><table>

      <tbody>
        <tr><td>Relation</td><td>Table</td><td>File (physical); relationship (a link)</td></tr>
        <tr><td>Tuple</td><td>Row</td><td>Record (physical)</td></tr>
        <tr><td>Attribute</td><td>Column</td><td>Field (physical)</td></tr>
        <tr><td>Domain</td><td>Allowed values of a column</td><td>Data type (close, but narrower)</td></tr>
      </tbody>
    </table></div>
    <h3>Keys and integrity</h3>
    <dl class="notation">
      <dt>Primary key</dt><dd>Unique. Never null (not even partly). Shouldn’t change. Exactly one per table.</dd>
      <dt>Alternate key</dt><dd>Any other unique identifier.</dd>
      <dt>Surrogate key</dt><dd>An invented identifier, often generated by the RDBMS.</dd>
      <dt>Foreign key</dt><dd>Another table’s key, stored in a child table. Must match a parent row or be null. May repeat.</dd>
      <dt>Built-in rules</dt><dd>Entity, referential and domain integrity. All other rules are user-defined and optional.</dd>
    </dl>
    <h3>Access methods</h3>
    <div class="tablewrap"><table>
      <thead><tr><th>Method</th><th>One record</th><th>A range of keys</th><th>Best for</th></tr></thead>
      <tbody>
        <tr><td>Sequential (table scan)</td><td>Half the file on average</td><td>Whole file</td><td>Tiny tables</td></tr>
        <tr><td>Indexed (B-tree)</td><td>A few reads, often 1</td><td>Good: keys sorted</td><td>Almost everything</td></tr>
        <tr><td>Direct (hashing)</td><td>Usually 1 read</td><td>Poor: records scattered</td><td>Frequent single lookups on huge tables</td></tr>
      </tbody>
    </table></div>

  orig:{ order:[0,1,2,3], cols:[0,1,2,3], ok:true, v1:"The original table.", v2:"Four rows, four columns." },
  shuffle:{ order:[2,0,3,1], cols:[0,1,2,3], ok:true, v1:"Same table.", v2:"Every row still holds its own values." },
  cols:{ order:[0,1,2,3], cols:[3,1,2,0], ok:true, v1:"Same table.", v2:"Whole columns moved, with their names." },
  val:{ order:[0,1,2,3], cols:[0,1,2,3], ok:false, swap:true, v1:"Different, and wrong.", v2:"Alex now earns “Paris”." },
  dup:{ order:[0,1,2,3,0], cols:[0,1,2,3], ok:false, v1:"Not a relation.", v2:"Identical rows can’t be told apart." }
};
function propsBody(k){
  const st = PROPS[k], HD = [["Name",150],["Position",110],["Location",100],["Salary",80,"r"]];
  const cols = st.cols.map(i => HD[i]);
  const rows = st.order.map(ri => { const r = EMP[ri].slice(); if (st.swap && ri === 3) { const t = r[2]; r[2] = r[3]; r[3] = t; } return st.cols.map(i => r[i]); });
  let s = tbl(30, 18, "EMPLOYEE", cols, rows, {
    rowTip: i => (k === "dup" && i === 4) ? "A duplicate of row 1. A relation can’t contain two identical rows." : `Employee ${EMP[st.order[i]][0]}.`,
    cellAttr: (ri, ci) => {
      if (k === "dup" && ri === 4) return BAD;
      if (st.swap && st.order[ri] === 3 && (cols[ci][0] === "Location" || cols[ci][0] === "Salary")) return BAD;
      if (k === "shuffle" || k === "cols") return "";
      return "";
    }
  });
  s += G(st.ok ? "The data values haven’t changed, so it is the same relation." : "The data itself has changed, or it breaks a rule of the relational model.",
    R(510, 40, 190, 74, st.ok ? "b" : "dashb", 6) + T(605, 70, st.v1, "hd", "middle", st.ok ? ACC : BAD) + T(605, 92, st.v2, "sm"));
  return s;
}
D.props = () => SVG(720, 182, "An experiment on the EMPLOYEE table: shuffling rows, swapping columns, swapping values and duplicating a row", `<g id="propBody">${propsBody("orig")}</g>`);

/* normalization stepper */
D.normal = () => {
  let s = "";
  /* 1NF */
  const ALL = ["PK ProductNo","PK CustomerNo","PK SaleNo","Description","ReorderLevel","Price","QtyInStock","First","Last","Address","CreditLimit","SaleDate","Qty","Amount","Salesrep"];
  let v1 = entity(40, 16, 190, "ALL_SALES", ALL, "ALL_SALES: everything in one table. It is already in 1NF (no repeating groups). Its key is ProductNo + CustomerNo + SaleNo.");
  const br = (a, b, label, tip) => { const top = 16 + 50 + 18 * a - 9, bot = 16 + 50 + 18 * b + 2, mid = (top + bot) / 2;
    return G(tip, P(`M242 ${top}H250V${bot}H242`) + T(262, mid + 4, label, "sm2", "start")); };
  v1 += br(3, 6, "ProductNo → Description, ReorderLevel, Price, QtyInStock", "These four columns depend on ProductNo alone. That is only part of the key, so this is a partial dependency.");
  v1 += br(7, 10, "CustomerNo → First, Last, Address, CreditLimit", "Customer details depend on CustomerNo alone.");
  v1 += br(11, 14, "SaleNo → SaleDate, Qty, Amount, Salesrep", "Sale details depend on SaleNo alone.");
  v1 += G("The composite primary key, and the problem with it.", R(262, 18, 430, 50, "dashb", 6) + T(276, 38, "Key: ProductNo + CustomerNo + SaleNo", "sm2 hd", "start") + T(276, 56, "but each group of columns depends on only part of it", "sm", "start"));
  s += `<g class="nf" data-nf="1">${v1}</g>`;
  /* shared pieces */
  const CU5 = ["PK CustomerNo","First","Last","Address","CreditLimit"], CU4 = ["PK CustomerNo","First","Last","CreditLimit"];
  const SA = ["PK SaleNo","SaleDate","FK CustomerNo","FK ProductNo","Qty","Amount","Salesrep"];
  const PR5 = ["PK ProductNo","Description","ReorderLevel","Price","QtyInStock"], PR6 = PR5.concat(["FK SupplierCode"]);
  const links = () =>
    REL("CUSTOMER to SALE: a customer has many sales. A sale has zero or one customer (null for a cash sale).", "M200 80H270", "l", "cfN", `<path d="M200 80H202" class="l" marker-start="url(#cf01)"/>`) +
    REL("PRODUCT to SALE: a product appears in many sales. Each sale is for exactly one product.", "M530 80H460", "l", "cfN", `<path d="M530 80H528" class="l" marker-start="url(#cf11)"/>`);
  const sale = () => entity(270, 40, 190, "SALE", SA, "SALE: everything that SaleNo determines. It has foreign keys to CUSTOMER and PRODUCT.");
  /* 2NF */
  s += `<g class="nf" data-nf="2">` + links() + entity(10, 40, 190, "CUSTOMER", CU5, "CUSTOMER: everything that CustomerNo determines.") + sale() +
    entity(530, 40, 180, "PRODUCT", PR5, "PRODUCT: everything that ProductNo determines.") +
    G("Each table now has a single-column key, so every column depends on the whole key.", R(150, 250, 420, 44, "dashb", 6) + T(360, 270, "Back to the original three tables:", "sm2 hd") + T(360, 286, "single-column keys, so automatically 2NF", "sm")) + `</g>`;
  /* 3NF */
  const sup = () => REL("SUPPLIER to PRODUCT: a supplier supplies many products. SupplierCode stays in PRODUCT as a foreign key.", "M620 240V184", "l", "cfN", `<path d="M620 240V238" class="l" marker-start="url(#cf11)"/>`) +
    entity(530, 240, 180, "SUPPLIER", ["PK SupplierCode","SupplierName","SupplierAddress"], "SUPPLIER: split out of PRODUCT to remove the transitive dependency.");
  s += `<g class="nf" data-nf="3">` + links() + sup() + entity(10, 40, 190, "CUSTOMER", CU5, "CUSTOMER, unchanged.") + sale() +
    entity(530, 40, 180, "PRODUCT", PR6, "PRODUCT keeps SupplierCode as a foreign key. The supplier name and address moved out.") +
    G("The book first adds supplier columns to PRODUCT. Then the supplier details depend on SupplierCode, and SupplierCode depends on ProductNo. This is a transitive dependency.",
      R(10, 250, 490, 62, "dashb", 6) + T(22, 270, "Before the split:", "sm2 hd", "start") + T(22, 287, "PRODUCT(ProductNo, …, SupplierCode, SupplierName, SupplierAddress)", "sm2", "start") + T(22, 304, "ProductNo → SupplierCode → {SupplierName, SupplierAddress}", "sm", "start")) + `</g>`;
  /* 4NF */
  s += `<g class="nf" data-nf="4">` + links() + sup() +
    REL("CUSTOMER to CUSTOMER_ADDRESS: a customer can have any number of addresses.", "M105 148V240", "l", "cf0N", `<path d="M105 148V150" class="l" marker-start="url(#cf11)"/>`) +
    entity(10, 40, 190, "CUSTOMER", CU4, "CUSTOMER without Address.") + sale() + entity(530, 40, 180, "PRODUCT", PR6, "PRODUCT, as in 3NF.") +
    entity(10, 240, 190, "CUSTOMER_ADDRESS", ["PK CustomerNo","PK Address"], "CUSTOMER_ADDRESS: one row per customer and address. The key is both columns. CustomerNo is also a foreign key.") +
    G("Suppose customers can have any number of addresses. Then CustomerNo determines a group of addresses, not one value. This is a multi-valued dependency.",
      R(240, 250, 250, 50, "dashb", 6) + T(365, 270, "Multi-valued dependency:", "sm2 hd") + T(365, 288, "CustomerNo →→ Address", "sm2")) + `</g>`;
  return SVG(720, 340, "Normalizing ALL_SALES to first, second, third and fourth normal form", s);
};

/* B-tree */
const LEAVES = [["Alberts","Anson","Chen"],["Davis","Ellis","Fenton"],["Glenn","Hart","Harris"],["Jarrow","Jones","Jones"],["Korth","Leyton","Martin"],["Nagel","Orly","Peters"],["Robb","Smith","Smith"],["Tong","Tudor","Walton"],["Wilson","Van plat","Zoltan"]];
const L2 = [["Chen","Fenton"],["Jones","Martin"],["Smith","Walton"]];
const L2X = [60, 300, 540], LX = i => 10 + i * 79;
D.btree = () => {
  let s = "";
  const ptr = (id, d, tip) => G(tip, P(d, "l", "mf") + HIT(d), `data-p="${id}"`);
  [0, 1, 2].forEach(k => s += ptr("r" + k, `M${305 + 55 * k} 48L${L2X[k] + 60} 98`, ["Root, left pointer: keys up to Harris.","Root, middle pointer: keys after Harris, up to Peters.","Root, right pointer: keys after Peters."][k]));
  L2.forEach((n, j) => [0, 1, 2].forEach(k => {
    const lo = k === 0 ? `keys up to ${n[0]}` : k === 1 ? `keys after ${n[0]}, up to ${n[1]}` : `keys after ${n[1]}`;
    s += ptr(`n${j}${k}`, `M${L2X[j] + 60 * k} 128L${LX(3 * j + k) + 35} 168`, `Pointer to a leaf node: ${lo}.`);
  }));
  LEAVES.forEach((_, i) => s += ptr("d" + i, `M${LX(i) + 35} 236L${275 + i * 21} 290`, "Leaf pointers lead to the records on disk. Each entry points to its own record."));
  const node = (x, y, w, keys, tip, attr) => G(tip, R(x, y, w, 30, "b", 3) + P(`M${x + w / 2} ${y}V${y + 30}`) + T(x + w / 4, y + 20, keys[0], "sm2") + T(x + 3 * w / 4, y + 20, keys[1], "sm2"), attr);
  s += node(305, 18, 110, ["Harris","Peters"], "Root node: two key values and three pointers. Every search starts here.", 'data-n="root"');
  L2.forEach((n, j) => s += node(L2X[j], 98, 120, n, `Second-level node: ${n[0]} | ${n[1]}. Keys are sorted from left to right across the whole tree.`, `data-n="l${j}"`));
  LEAVES.forEach((lf, i) => lf.forEach((nm, k) => s += G(`Leaf entry “${nm}”. It points to that client’s record on disk.`, R(LX(i), 168 + 22 * k, 70, 22, "b", 0) + T(LX(i) + 35, 183 + 22 * k, nm, "sm2"), `data-e="${i}-${k}"`)));
  s += G("The records themselves, on disk. The index stores only keys and pointers.", cyl(260, 288, 200, 52, "Records on disk"));
  s += G("Levels of the tree.", T(712, 37, "root", "sm", "end") + T(712, 117, "level 2", "sm", "end"));
  s += T(712, 256, "leaves", "sm", "end");
  return SVG(720, 352, "A three-level B-tree index on surnames, with leaf pointers to records on disk", s);
};

/* access methods */
const SORTED = [["Alberts","Anson","Chen"],["Davis","Ellis","Fenton"],["Glenn","Harris","Hart"],["Jarrow","Jones","Jones"],["Korth","Leyton","Martin"],["Nagel","Orly","Peters"],["Robb","Smith","Smith"],["Tong","Tudor","Walton"]];
const HASHED = [["Jones","Tong","Anson"],["Smith","Peters","Glenn"],["Tudor","Davis","Korth"],["Harris","Alberts","Robb"],["Nagel","Jones","Chen"],["Ellis","Walton","Smith"],["Martin","Jarrow","Hart"],["Leyton","Fenton","Orly"]];
const ACCESS = {
  seq:{ want:"Tudor", m:["Sequential access","read every block in order"], blocks:SORTED, read:[0,1,2,3,4,5,6,7], hit:{7:[1]}, reads:"8, one per block until Tudor turns up", scan:true },
  idx:{ want:"Tudor", m:["Indexed access","B-tree: root → level 2 → leaf"], blocks:SORTED, read:[7], hit:{7:[1]}, reads:"Up to 4 reads (3 index nodes + 1 block); 1 if the index is in RAM" },
  hash:{ want:"Tudor", m:["Direct access","hash(\"Tudor\") → block 3"], blocks:HASHED, read:[2], hit:{2:[0]}, reads:"1 read: the hash function computes the block" },
  ridx:{ want:"S…", m:["Indexed range","find first S, scan right"], blocks:SORTED, read:[6], hit:{6:[1,2]}, reads:"1 block: neighbouring keys sit together" },
  rhash:{ want:"S…", m:["Hashed range","hash can’t list a range"], blocks:HASHED, read:[0,1,2,3,4,5,6,7], hit:{1:[0],5:[2]}, reads:"Smiths scattered over blocks 2 and 6: every block must be read", scan:true }
};
function accessBody(k){
  const a = ACCESS[k]; let s = "";
  s += G("The search key we are looking for.", box(20, 20, 150, 50, "Looking for", a.want, 6));
  s += G("How the DBMS locates the record.", box(250, 20, 220, 50, a.m[0], a.m[1], 6));
  s += P("M170 45H250", "l", "mf");
  if (a.scan) s += G("A table scan: blocks are read one after another.", P("M30 238H690", "acc-l", "mfa") + T(360, 254, "reading blocks in order", "sm"));
  else a.read.forEach(b => s += G("The method goes straight to this block.", P(`M360 70L${60 + b * 86} 118`, "acc-l", "mfa")));
  a.blocks.forEach((blk, b) => {
    const x = 20 + b * 86, rd = a.read.includes(b);
    let g = R(x, 120, 80, 96, rd ? "acc" : "b", 4) + T(x + 40, 138, `block ${b + 1}`, "sm");
    blk.forEach((nm, j) => g += T(x + 40, 162 + 18 * j, nm, "sm2", "middle", (a.hit[b] || []).includes(j) ? ACC : ""));
    s += G(rd ? `Block ${b + 1} is read from disk.` : `Block ${b + 1} is never read.`, g);
  });
  s += G("Disk reads for this search.", T(360, 286, "Disk reads: " + a.reads, "sm2 hd"));
  return s;
}
D.access = () => SVG(720, 300, "Sequential, indexed and hashed access to records stored in disk blocks", `<g id="accBody">${accessBody("seq")}</g>`);
