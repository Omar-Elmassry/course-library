  <!-- 4.3 -->
  <section class="chap" id="p4-3">
    <h2><span class="num">4.3</span>Common structures</h2>
    <p>Most models are built from a few patterns of related tables that appear again and again. Each pattern is named by the cardinality of its relationships. If you learn to spot them, you have a toolkit for most real-world data. The chapter covers five, from the most common to the least common:</p>
    <ol>
      <li><strong>one-to-many</strong>;</li>
      <li><strong>many-to-many</strong>;</li>
      <li><strong>one-to-many recursive</strong>;</li>
      <li><strong>many-to-many recursive</strong>;</li>
      <li><strong>one-to-one</strong>.</li>
    </ol>
    <p>Most examples come from a small, hypothetical (imagined) e-commerce store that sells sports clothing. Its full diagram ends this section.</p>

    <h3>One-to-many</h3>
    <p>One row in a <strong>parent</strong> table relates to many rows in a <strong>child</strong> table. But each child row has only one parent. You will find this in nearly every database. The child stores the parent’s key in a foreign-key column. The book’s first example is Categories and Products. Each product’s <code>CategoryID</code> says which category it belongs to. The Tracksuits category holds three products. Strictly, the many end can be zero, one or many. But nobody says “one-to-zero-one-or-many”.</p>
  </section>
  <figure class="wide">
    <div class="plate" data-dg="oneMany"></div>
    <div class="chips" id="oneManyBtns" aria-label="Pick a customer"></div>
    <div class="note" id="oneManyNote" aria-live="polite"></div>
    <figcaption><span class="src book">From the book</span><b>Book figures and sample data, p. 107, redrawn.</b> Customers and Orders. The book shows the data as Access tables. The order dates are copied exactly as printed.</figcaption>
  </figure>

  <h3>Many-to-many</h3>
  <p>A student takes many classes, and a class holds many students. People understand this easily. But a relational database can’t store it directly. With only two tables, the only way is a repeating group of foreign-key columns (<code>Class1</code>, <code>Class2</code>…). This puts a limit on how many you can have. And it isn’t a true many-to-many at all.</p>
  <p>The fix is a third table, called an <strong>associative entity</strong> (or a joining table). It holds one row for each pairing. It turns the many-to-many into two one-to-many relationships. In the store, <strong>OrderItems</strong> links Orders and Products. Its key is the pair of foreign keys. It also holds facts about the pairing itself: the quantity ordered, and the price actually paid at the time.</p>
  <figure class="wide">
    <div class="plate" data-dg="manyMany"></div>
    <div class="chips" id="manyManyBtns" aria-label="Follow an order or a product"></div>
    <div class="note" id="manyManyNote" aria-live="polite"></div>
    <figcaption><span class="src book">From the book</span><b>Book figure and sample data, p. 108, redrawn.</b> Orders, OrderItems and Products. To save space, some columns (OrderDate, ProductDescription, CategoryID) are left out of the data tables.</figcaption>
  </figure>
  <p>Often the associative table holds nothing but the two keys. The book’s example links <strong>User</strong> and <strong>Group</strong> through <strong>UserGroup</strong>. This name joins the two table names together. It is a common naming convention for pure link tables. Here it is as SQL (a course addition; the book shows only the diagram):</p>
  <p class="codehead">PostgreSQL · a pure link table</p>
<pre><code class="sql">CREATE TABLE user_group (
  user_guid UUID NOT NULL REFERENCES "user"(user_guid),
  group_id  INT  NOT NULL REFERENCES "group"(group_id),
  PRIMARY KEY (user_guid, group_id)   -- a user joins a group once
);</code></pre>
  <p><strong>One-to-many or many-to-many?</strong> A many-to-many structure can hold one-to-many data. The reverse is not true. To decide, say the relationship out loud in both directions. Then ask the customer both sentences as questions: <em>Can a user belong to many groups? Can a group contain many users?</em> If both answers are yes, it is many-to-many.</p>
  <div class="aside pitfalls"><b>Common mistakes.</b>
    <ul>
      <li>Repeating columns (<code>product1</code>, <code>product2</code>…) or a comma-separated list instead of a link table.</li>
      <li>Forgetting that the link table is a good place for facts about the pairing. The price paid belongs on OrderItems, not on Products, because the product’s price will change.</li>
    </ul></div>

  <h3>One-to-many recursive</h3>
  <p>A <strong>recursive</strong> (or reflexive) relationship relates a table to itself. The classic use is a tree. Stores put categories inside other categories. On Amazon, this book might sit under Computers, then Databases, then Database Design. To model this, give <strong>Categories</strong> a <code>ParentCategory</code> column. It is a foreign key to the table’s own <code>CategoryID</code>. Rows with no parent (null) are the top level. Every other row points at its parent. So the tree can be as deep as you like.</p>
  <figure class="wide">
    <div class="plate" data-dg="tree"></div>
    <div class="chips" id="treeBtns" aria-label="Choose a state"></div>
    <div class="note" id="treeNote" aria-live="polite"></div>
    <figcaption><span class="src book">From the book</span><b>Book figures and sample data, p. 110, redrawn.</b> The recursive Categories table, its data, and the tree that the data describes. The corrupted state acts out the book’s example of a bad update.</figcaption>
  </figure>
  <p>There is a problem: the database can’t protect the shape of the tree. Suppose you set a node’s parent to one of its own descendants (its children, their children, and so on). An example is Sweatshirts under College Teams. The foreign key is satisfied. But that branch is cut off from the tree and becomes a loop. So check for this before you insert or update rows. You can check in application code. A better way is a <strong>trigger</strong> (Chapter 8): code that runs inside the database on every change.</p>
  <p>The same pattern models a <strong>management hierarchy</strong>. An Employees table has a <code>Manager</code> column that points at another employee. The book’s data:</p>
  <ul>
    <li>Simon Smit is the CEO, with no manager.</li>
    <li>James Bacon (footwear) and Robert Jones (clothing) report to him.</li>
    <li>Richard Smith is a storeman in the shoes warehouse. He reports to James Bacon.</li>
  </ul>
  <p>The recursive foreign key <strong>must allow null</strong>. The top of the tree has no parent. Any made-up non-null value would point at a row that doesn’t exist. That would break referential integrity (section 4.6).</p>
  <h3>Programming for recursive relationships</h3>
  <p>Walking <em>up</em> from a node to the root (the top of the tree) is easy: you follow the parent pointers. Walking <em>down</em> to build the whole tree is harder. You need this for a menu, for example. The book sketches a recursive function (a function that calls itself):</p>
  <ol>
    <li>Fetch the top-level rows.</li>
    <li>For each row, print it and query its children.</li>
    <li>Call the function again for the children, one level deeper. Pass the depth, so the output can be indented.</li>
  </ol>
  <p>To show only one branch, start from a single category instead.</p>
  <div class="aside"><b>A fix to the book’s pseudo-code.</b> Its first query selects every category as the “top level”. So each subtree would be printed again under its own row. To start at the roots (the top-level rows), filter with <code>WHERE ParentCategory IS NULL</code>.</div>
  <p>The book warns that this approach can run tens or hundreds of queries for each page view. This hurts performance when the site is under heavy load. The book gives two alternatives:</p>
  <ul>
    <li>Cache the tree in a format that suits trees. The book suggests XML.</li>
    <li>Fetch all the rows, flat, in one query. Then build the tree in code.</li>
  </ul>
  <p>The second one is still the everyday answer:</p>
  <p class="codehead">TypeScript · one query, tree built in memory</p>
<pre><code class="ts">type Cat = { categoryId: number; name: string; parentCategory: number | null };
type Node = Cat &amp; { children: Node[] };

function buildTree(rows: Cat[]): Node[] {
  const byId = new Map(rows.map(r =&gt; [r.categoryId, { ...r, children: [] as Node[] }]));
  const roots: Node[] = [];
  for (const n of byId.values()) {
    const parent = n.parentCategory == null ? undefined : byId.get(n.parentCategory);
    (parent ? parent.children : roots).push(n);   // null parent = top level
  }
  return roots;
}</code></pre>
  <div class="aside"><b>Then vs now.</b> SQL:1999 added recursive common table expressions (CTEs). PostgreSQL, SQL Server, Oracle, SQLite and MySQL 8 now support them. With a CTE, one query walks the whole tree on the server. It returns each row with its depth: <code>WITH RECURSIVE t AS (SELECT …, 0 AS depth FROM categories WHERE parent_category IS NULL UNION ALL SELECT c.…, t.depth + 1 FROM categories c JOIN t ON c.parent_category = t.category_id) SELECT * FROM t;</code></div>

  <h3>Many-to-many recursive</h3>
  <p>Here a table relates to itself <em>through</em> an associative table. It fits anything that is made up of things of the same kind. An example is a computer built from other products. This is called a <strong>parts explosion</strong> or a <strong>bill of materials</strong>. The store uses it for <strong>bundles</strong>. <strong>ProductBundles</strong> holds pairs of product IDs: the bundle, and a product inside it. To read the diagram, imagine the Products table drawn twice. Switch between the views below.</p>
  <figure class="wide">
    <div class="plate" data-dg="bundle"></div>
    <div class="chips" id="bundleBtns" aria-label="Choose a view"></div>
    <div class="note" id="bundleNote" aria-live="polite"></div>
    <figcaption><span class="src book">From the book</span><b>Book figures and sample data, pp. 112–113, redrawn.</b> The book itself says that its “same table twice” view is not a valid diagram. It is only an aid for reading. The single-table view is drawn to match the e-commerce diagram on p. 116.</figcaption>
  </figure>
  <p>The Tracksuit Combo Deal (product 5) is a product like any other. So it has a price, and it can go in an order. But its ProductBundles rows say that it contains products 3 and 4. A bundle is just a product, so you can even put bundles inside bundles. That is more than a clothing store needs. But it is useful for, say, a computer hardware company. As with trees, block circular references. A bundle must never contain itself, either directly or further down.</p>

  <h3>One-to-one</h3>
  <p>This is not common. It comes in two forms, and they have different design consequences.</p>
  <p><strong>Actual one-to-one.</strong> Two real things pair exactly. Each department has one manager, and each manager runs one department. <code>Departments.DepartmentManager</code> records this by pointing at an employee. In the data it looks just like one-to-many, except that the child side never has more than one row. The book says to be careful here. One-to-one is no more efficient than one-to-many, and it is less flexible. So check with the client. Consider modeling it as one-to-many, even if the data is usually one-to-one.</p>
  <p><strong>Sub-type/super-type.</strong> This is the more common form. Several kinds of entity share some attributes, but each kind also has its own attributes. The shared part is the super-type, and each kind is a sub-type. Which side gets the foreign key depends on how many sub-types there are.</p>
  <figure class="wide">
    <div class="plate" data-dg="subtype"></div>
    <div class="chips" id="subtypeBtns" aria-label="Choose an example"></div>
    <div class="note" id="subtypeNote" aria-live="polite"></div>
    <figcaption><span class="src book">From the book</span><b>Book figures, p. 115, redrawn.</b> A file system with one sub-type (Files), and employees with two sub-types (contract and salaried). The accent labels are added for this course.</figcaption>
  </figure>
  <div class="aside"><b>A caution on the book’s fix (course addition).</b> The book suggests a check constraint to stop one employee from being both contract and salaried. But a CHECK constraint only sees the row it is checking. It can’t look into the other sub-type table. Common workarounds:
    <ul>
      <li>Add an <code>EmployeeType</code> column to Employees. Copy it into each sub-type table, with a CHECK that fixes its value (<code>'C'</code> or <code>'S'</code>). Then make the foreign key the pair <code>(EmployeeID, EmployeeType)</code>.</li>
      <li>Or use a trigger.</li>
    </ul></div>
  <div class="aside pitfalls"><b>Common mistakes.</b>
    <ul>
      <li>Allowing a recursive structure to contain cycles because “the foreign key accepted it”.</li>
      <li>Using a non-null sentinel like 0 for “no parent”. (A sentinel is a special value that stands for “nothing”.)</li>
      <li>Splitting a table one-to-one without a reason.</li>
      <li>With several sub-types, putting one nullable foreign key per sub-type on the super-type.</li>
    </ul></div>

  <h3>The whole e-commerce model</h3>
  <p>Put together, the store’s diagram uses every structure in this section. Hover over each relationship to see which one it is.</p>
  <figure class="wide">
    <div class="plate" data-dg="ecom"></div>
    <figcaption><span class="src book">From the book</span><b>Book figure, p. 116, redrawn.</b> The complete e-commerce database diagram. Data types are left out so that it fits. They match the earlier figures. The layout is rearranged, but the tables and relationships are the book’s.</figcaption>
  </figure>

  <!-- 4.4 -->
  <section class="chap" id="p4-4">
    <h2><span class="num">4.4</span>Integrity constraints and entity integrity</h2>
    <p><strong>Integrity constraints</strong> are rules that keep the data valid. They do this by limiting what applications may do. Put them <em>in the database</em>, not in the application layer. Then they hold for every program that connects. This matters most when you don’t control every application or developer that will use your data. There are three kinds:</p>
    <dl class="notation">
      <dt>Entity integrity</dt><dd>Every row can be identified uniquely by its primary key (this section).</dd>
      <dt>Attribute (domain) integrity</dt><dd>Every value is a legal value for its column (4.5).</dd>
      <dt>Referential integrity</dt><dd>Every foreign key points at a row that exists (4.6). The book’s list calls this “relational integrity”, but its section heading uses the usual name.</dd>
    </dl>
    <h3>The primary-key rules</h3>
    <p>Other columns may repeat, but the primary key must be unique. This is because every relationship to the row goes through it. The rules:</p>
    <ul>
      <li><strong>Single-column key:</strong> the values are unique and never null.</li>
      <li><strong>Composite</strong> (concatenated) key, made of several columns: the <em>combination</em> is unique, and <em>no</em> part is null.</li>
    </ul>
    <p>The ban on null comes from Chapter 2. Null isn’t a value, and null doesn’t equal null. So you couldn’t compare null keys to prove that they are unique.</p>
    <p>In a composite key, no single column has to be unique. In the book’s small catalog, the key is Author + Title + Publisher:</p>
    <div class="tablewrap"><table>
      <thead><tr><th>Author</th><th>Title</th><th>Publisher</th><th>Price</th></tr></thead>
      <tbody>
        <tr><td>J. Smith</td><td>Advanced Spoonbending</td><td>XYZ Press</td><td>23.95</td></tr>
        <tr><td>J. Smith</td><td>Elementary Spoonbending</td><td>XYZ Press</td><td>23.95</td></tr>
        <tr><td>R. Jones</td><td>Top Golf Holes</td><td>ABC Books</td><td>18.5</td></tr>
        <tr><td>S. Robinson</td><td>Top Golf Holes</td><td>Greenkeeper Publishing</td><td>22.95</td></tr>
      </tbody>
    </table></div>
    <p class="hint">From the book’s table on p. 117.</p>
    <h3>Natural versus surrogate keys</h3>
    <p>Keys made of data that means something to users are called <strong>intelligent</strong> or <strong>natural keys</strong>. When you use one, you are betting that the data will always be unique. Suppose XYZ Press releases a hardback <em>Advanced Spoonbending</em> at $53.95. It has the same author, title and publisher, so the key breaks. You must then search for another non-null column to add to the key. And there is no guarantee that the new key won’t break too. Even ISBNs fail. Old books and some publishers have no ISBN. And if the shop starts selling second-hand copies next to new ones, the ISBN repeats.</p>
    <p>The usual argument for natural keys is that they make ad-hoc reporting queries easier to read. (An ad-hoc query is one that someone writes on the spot for one question.) The book points out that web applications almost never offer ad-hoc queries to end users. So on the web, that argument is weak.</p>
    <p>A <strong>surrogate key</strong> is an artificial unique value: it is created only to be the key, and it does not come from the real-world data. It gives you a single-column key where you would otherwise need a composite one. This is more efficient. You can generate it in the database or in your application. There are two kinds:</p>
    <dl class="notation">
      <dt>Numeric sequence</dt><dd>Integers that count up from 1. Access calls them <code>autonumber</code>, SQL Server calls them <code>identity</code>, and MySQL calls them <code>auto_increment</code>. Oracle uses a <code>sequence</code> object. PostgreSQL offers sequences or the <code>serial</code> type. Chapter 6 uses these.</dd>
      <dt>GUID</dt><dd>A globally unique identifier. It is unique even across different databases. This is why replication (copying data between databases) uses GUIDs. SQL Server has <code>uniqueidentifier</code>. Access has an autonumber set to Replication ID. Oracle offers <code>SYS_OP_GUID()</code>. PostgreSQL needed an extension at the time.</dd>
    </dl>
    <p>Use GUIDs in two cases: when keys must be unique beyond one database, or to stop people from guessing keys. Suppose a profile page is <code>view_user.asp?userid=463</code>. Anyone can write a script that loops over every ID. With a GUID, even one correct guess is practically impossible. A side note in the book adds that some developers use timestamps as keys. This fails if two rows arrive within the timestamp’s precision (its smallest step of time).</p>
    <h3>When not to use a surrogate</h3>
    <p>Not every table needs a surrogate key. The UserGroup link table already has a perfect key: the pair of foreign keys, which are surrogates themselves. And a user can be in a group only once. An extra ID column would add an index, and every index slows down inserts (Chapter 8). Natural keys can also <strong>save joins</strong>. Suppose Customers references a Countries lookup table by <code>CountryName</code>. Then the name is already in the customer row.</p>
  </section>
  <p class="codehead">SQL · natural key: no join needed</p>
<pre><code class="sql">SELECT CustomerName, CountryName FROM Customers;</code></pre>
  <p class="codehead">SQL · surrogate key: join to get the name</p>
<pre><code class="sql">SELECT Customers.CustomerName, Countries.CountryName
FROM Customers
INNER JOIN Countries ON Customers.CountryID = Countries.CountryID;</code></pre>
  <p>The book’s conclusion: use intelligent keys sensibly, where they avoid overhead (extra work). But as a general rule, surrogate keys suit web databases well. The book also mentions a naming habit. End the name of each surrogate key column in <code>ID</code> or <code>GUID</code>, according to its type.</p>
  <div class="aside"><b>Then vs now.</b> PostgreSQL now has standard identity columns (<code>GENERATED ALWAYS AS IDENTITY</code>, from version 10). It also has a built-in <code>gen_random_uuid()</code> function (from version 13). Random UUIDs spread inserts all over an index. Time-ordered UUIDv7 values are still fairly hard to guess, and they are inserted in order.</div>
  <div class="aside pitfalls"><b>Common mistakes.</b>
    <ul>
      <li>Treating an unguessable ID as security. A GUID stops enumeration (trying IDs one by one). But the page must still check that the signed-in user is allowed to see that record.</li>
      <li>Natural keys built from data that the business can change (emails, names, ISBNs).</li>
      <li>Nullable columns in a primary key.</li>
    </ul></div>

  <!-- 4.5 -->
  <section class="chap" id="p4-5">
    <h2><span class="num">4.5</span>Attribute (domain) integrity</h2>
    <p>The <strong>domain</strong> of an attribute is the full set of values that it may hold. You discover domains by asking the customer questions like these:</p>
    <ul>
      <li>Do we need “unknown” as a gender?</li>
      <li>How long can a product description be?</li>
      <li>To how many decimal places is a stock price stored?</li>
    </ul>
    <p>The worked example is an online stock-portfolio system. <strong>Customers</strong> hold many <strong>EquitySecurities</strong> (shares), and each security is held by many customers. So <strong>SecurityHolding</strong> resolves the many-to-many. The business rules are:</p>
    <ul>
      <li>store each customer’s age;</li>
      <li>track whether a customer is a credit risk;</li>
      <li>let customers record optional details for each holding;</li>
      <li>every security has a unique ticker code of exactly four characters.</li>
    </ul>
    <p>Most RDBMSs don’t support domains as such. Instead, a domain is the sum of several column settings: <strong>data type</strong>, <strong>length</strong>, <strong>constraints</strong>, <strong>optionality</strong> and <strong>default value</strong>.</p>
    <h3>Data type and size</h3>
    <p>The data type is the most important setting. When you choose one, you balance three goals:</p>
    <ul>
      <li><strong>Efficiency:</strong> the smallest type that still leaves room for surprises.</li>
      <li><strong>A format that the application can use directly</strong>, without converting it.</li>
      <li><strong>Flexibility</strong> for likely future needs.</li>
    </ul>
    <p>Type names are different in each product, so check your DBMS’s documentation. Some modeling tools let you design with generic types. The tool then picks the platform’s type when it generates the database.</p>
    <div class="tablewrap"><table>
      <thead><tr><th>Type</th><th>What it is</th><th>Watch out for</th></tr></thead>
      <tbody>
        <tr><td><code>INTEGER</code></td><td>Whole numbers. Usually 32-bit (about ±2.1 billion). There are smaller and larger variants</td><td>Match your language’s integer size. The book’s example: VBScript’s 16-bit Integer overflows above about 32,000</td></tr>
        <tr><td><code>CHAR(n)</code></td><td>Fixed length. Short values are padded (filled up) to n. Plain <code>CHAR</code> is one character</td><td>Wastes space when lengths vary a lot</td></tr>
        <tr><td><code>VARCHAR(n)</code></td><td>Variable length, up to n. Stores only the actual data</td><td>Making a value longer may need new space on disk. Older platforms limited n to 255</td></tr>
        <tr><td><code>DECIMAL(p,s)</code></td><td>Exact number. Precision p is the number of digits; scale s is the digits after the point (157.4568 is p = 7, s = 4)</td><td>Choose p and s from real requirements</td></tr>
        <tr><td><code>FLOAT</code>, <code>REAL</code>, <code>MONEY</code>…</td><td>Floating-point or platform-specific numeric types</td><td>Sizes differ between products (the book compares MONEY in PostgreSQL and SQL Server). Floats bring rounding errors</td></tr>
        <tr><td><code>DATETIME</code></td><td>Date and time together. The standard also defines separate <code>DATE</code> and <code>TIME</code> types</td><td>Usually the best choice when you need either one</td></tr>
      </tbody>
    </table></div>
    <p class="hint">Summarized from the book’s type descriptions, pp. 123–124.</p>
    <p><strong>The simple choices.</strong> Names are <code>VARCHAR</code>. <code>SecurityCode</code> and <code>MiddleInitial</code> are <code>CHAR</code>. The author has two rules for length:</p>
    <ul>
      <li>A <code>CHAR</code> is as long as its longest value.</li>
      <li>A <code>VARCHAR</code> gets the next size up from a fixed ladder of sizes: 20, 50, 100, 250, 1000, 2000. This way you can remember the limit of any column while you write code.</li>
    </ul>
    <p>The phone number is a <code>CHAR</code> too, because the application never does arithmetic on it. As text, it can also hold codes like <code>*999</code> or <code>2377544#44</code>. Rule of thumb: use numeric types only when you will treat the data as a number.</p>
    <p><strong>The harder choices</strong> needed another round of questions to the client. This is the iterative cycle from 4.1 in action. The answers:</p>
    <ul>
      <li>Credit risk turned out to be yes/no.</li>
      <li>Prices need four decimal places, with room for values above a few thousand dollars.</li>
      <li>Purchases need the time, to the minute.</li>
    </ul>
    <p>And the rule “store the customer’s age” hides a trap.</p>
  </section>
  <figure class="wide">
    <div class="plate" data-dg="domain"></div>
    <div class="chips" id="domainBtns" aria-label="Pick a design decision"></div>
    <div class="note" id="domainNote" aria-live="polite"></div>
    <figcaption><span class="src book">From the book</span><b>Book figures, pp. 121 and 126, redrawn.</b> The portfolio schema with the book’s final types. Bold columns are required; plain ones are optional. Pick a decision to highlight its column.</figcaption>
  </figure>
  <h3>Optionality, defaults and checks</h3>
  <p><strong>Optionality</strong> decides whether a column may be null. Platforms implement it in different ways, and a modeling tool can handle that for you. You only decide which columns are optional. Null is useful to mean “no value was given”. But remember that you can’t compare null with the ordinary operators. In the example:</p>
  <ul>
    <li>The three detail columns of SecurityHolding allow null. So you can tell when a customer chose not to enter them.</li>
    <li><code>MiddleInitial</code> allows null. So people without a middle initial don’t get a padded blank.</li>
  </ul>
  <p>A <strong>default value</strong> fills a column when an insert doesn’t mention that column. Some databases accept a function as the default, such as the current date. Use defaults with care. Where “not entered” matters, null is better. A default of 0 for <code>PricePaid</code> would be wrong, because 0 is a real possibility. For example, a customer may receive shares as part of a pay package. The example uses one default. <code>CreditRisk</code> starts at 0, so the system is never unsure whether a risk exists.</p>
  <p>A <strong>check constraint</strong> (or check clause) is a rule that the database tests on every insert and update. Examples: <code>SecurityCode</code> must be letters, and <code>PricePaid</code> must not be negative. Ideally you set it in the modeling tool, so that the tool creates it. Here is the example table written out in full. This is a course addition in PostgreSQL syntax; the book shows the constraint in SQL Server form:</p>
  <p class="codehead">PostgreSQL · the holding table with its domain rules</p>
<pre><code class="sql">CREATE TABLE security_holding (
  holding_id     INT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
  customer_id    INT NOT NULL REFERENCES customers(customer_id),
  security_id    INT NOT NULL REFERENCES equity_securities(security_id),
  number_held    INT,                       -- optional: NULL = not entered
  price_paid     DECIMAL(9,4),              -- e.g. 3.6525; no float rounding
  date_purchased TIMESTAMP,                 -- to the minute
  CONSTRAINT price_paid_chk CHECK (price_paid &gt;= 0 OR price_paid IS NULL)
);
-- and on customers: credit_risk BOOLEAN NOT NULL DEFAULT false</code></pre>
  <div class="aside"><b>A correction on NULL in checks.</b> The book says that without <code>OR PricePaid IS NULL</code>, the check would reject nulls. But in standard SQL (including SQL Server and PostgreSQL), a CHECK fails only when its condition is <em>false</em>. <code>NULL &gt;= 0</code> is unknown, so the row is accepted anyway. The extra clause does no harm, and it states the intent. But it is still <code>NOT NULL</code> that controls whether nulls are allowed.</div>
  <div class="aside"><b>Front-end tie-in.</b> The VBScript overflow has a modern twin. A JavaScript <code>number</code> is exact only up to 2<sup>53</sup>. So Node drivers such as node-postgres return <code>BIGINT</code> and <code>DECIMAL</code> values as strings. Decide on purpose what to do with them: parse them, use <code>BigInt</code>, or use a decimal library for money.</div>
  <div class="aside pitfalls"><b>Common mistakes.</b>
    <ul>
      <li>Storing values that change over time (age, “days since signup”) instead of the fact that they come from.</li>
      <li>Floats for money.</li>
      <li>Numeric types for codes that only look like numbers (phone numbers, postcodes, IDs with leading zeros).</li>
      <li>Defaults that hide “unknown” behind a value that looks real.</li>
    </ul></div>

  <!-- 4.6 -->
  <section class="chap" id="p4-6">
    <h2><span class="num">4.6</span>Referential integrity</h2>
    <p><strong>Referential integrity</strong> (RI) keeps relationships valid. Every foreign key is either null or matches a primary key in the related table. The database enforces this with a foreign-key constraint. Diagram tools and database editors usually write these constraints for you. The DDL is different on each platform. The book’s example is a SQL Server link table, <code>PropertyFeature</code>, with a composite primary key and two foreign keys.</p>
    <p>RI blocks three problems. Each one would leave an <strong>orphaned row</strong>: a child whose foreign key points at no parent.</p>
    <dl class="notation">
      <dt>Insert anomaly</dt><dd>Inserting a child that references a parent that doesn’t exist. An example is an order for a customer who doesn’t exist. RI rejects the insert.</dd>
      <dt>Update anomaly</dt><dd>Changing a parent’s primary key while children still hold the old value. By default, RI refuses the change.</dd>
      <dt>Delete anomaly</dt><dd>Deleting a parent that children still reference. By default, RI refuses the delete.</dd>
    </dl>
    <p>In practice, this means:</p>
    <ul>
      <li>Insert the parent first (a customer before their holdings).</li>
      <li>Delete the children before the parent.</li>
      <li>You can never change a referenced primary key. The parent can’t change while children point at it. And the children can’t point at a value that doesn’t exist yet.</li>
    </ul>
    <p>You could write code for all of this. But it is better to tell the database what to do.</p>
    <h3>Referential actions</h3>
    <p>A <strong>referential action</strong> tells the DBMS what to do to repair things when a change to a parent would break the rules. It can’t let you break the rules. It can only repair things automatically. The refusing behavior above is itself an action, called <code>RESTRICT</code>.</p>
    <div class="tablewrap"><table>
      <thead><tr><th>Action</th><th>Update parent key</th><th>Delete parent row</th></tr></thead>
      <tbody>
        <tr><td><code>RESTRICT</code> (default in most RDBMSs)</td><td>Refused</td><td>Refused</td></tr>
        <tr><td><code>CASCADE</code></td><td>Children’s foreign keys change to the new value</td><td>Children are deleted too</td></tr>
        <tr><td><code>SET NULL</code></td><td>Children’s foreign keys become null</td><td>Children’s foreign keys become null</td></tr>
      </tbody>
    </table></div>
    <p class="hint">Based on the book’s table on p. 130, reworded.</p>
    <p>Some products leave out <code>SET NULL</code>, because people see it as less than ideal. A trigger can imitate it. Try every combination below.</p>
  </section>
  <figure class="wide">
    <div class="plate" data-dg="ri"></div>
    <div class="chips" id="riModes" aria-label="Choose how the foreign key is enforced"></div>
    <div class="chips" id="riOps" aria-label="Choose a change to make"></div>
    <div class="note" id="riNote" aria-live="polite"></div>
    <figcaption><span class="src ill">Course illustration</span><b>Figure A.</b> A referential-integrity simulator that uses the book’s Customers and Orders data. Pick an enforcement mode, then a change. Each change starts from the original data.</figcaption>
  </figure>
  <p>Choosing the action is a design decision. <code>CASCADE</code> fits true parent–child ownership. For example, deleting a folder deletes its files. One statement does the work of three: check for children, delete them, delete the parent. But <code>CASCADE</code> is wrong when the children have value of their own. Suppose an employee manages many projects. <code>ON DELETE CASCADE</code> would delete the projects when the employee leaves. <code>RESTRICT</code> forces you to reassign or delete them on purpose.</p>
  <p class="codehead">PostgreSQL · choosing actions per relationship</p>
<pre><code class="sql">CREATE TABLE orders (
  order_id    INT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
  customer_id INT NOT NULL
    REFERENCES customers(customer_id) ON DELETE RESTRICT,   -- keep order history
  order_date  TIMESTAMP NOT NULL DEFAULT now()
);
CREATE TABLE order_items (
  order_id   INT NOT NULL REFERENCES orders(order_id) ON DELETE CASCADE,   -- lines belong to the order
  product_id INT NOT NULL REFERENCES products(product_id),
  quantity   INT NOT NULL,
  purchase_price DECIMAL(10,2) NOT NULL,
  PRIMARY KEY (order_id, product_id)
);</code></pre>
  <div class="aside"><b>Then vs now.</b> The book notes that MySQL let you declare relationships but never enforced them. That was true of its default engine, MyISAM. The InnoDB engine enforces foreign keys. InnoDB has been MySQL’s default engine since version 5.5 (2010).</div>
  <div class="aside pitfalls"><b>Common mistakes.</b>
    <ul>
      <li>Putting <code>CASCADE</code> on everything because it makes deletes “just work”.</li>
      <li>Using <code>SET NULL</code> on a foreign key declared <code>NOT NULL</code>.</li>
      <li>Relying on application code for RI when other programs, scripts or admins also write to the database.</li>
    </ul></div>

  <!-- 4.7 -->
  <section class="chap" id="p4-7">
    <h2><span class="num">4.7</span>Denormalizing for performance</h2>
    <p>Remember the publisher’s book count from 4.2. You can count the matching rows every time you show a publisher. That is correct, but it costs work on every read. Or you can store the count. That is redundant, but instant. Web databases often have a much higher read load than traditional systems. So sometimes the redundant, <strong>denormalized</strong> form is the better choice. (Denormalized means that you break the normalization rules on purpose and store some data twice.)</p>
    <p>That should be the exception. The book’s order of steps:</p>
    <ol>
      <li>Build a properly normalized design first.</li>
      <li>Test it under a realistic load, similar to production.</li>
      <li>Only then denormalize, in the places where the measurements show a need.</li>
    </ol>
    <p>For web projects, this often means that you decide after development is complete.</p>
    <p>Denormalized models make <em>reads</em> cheaper and <em>writes</em> more expensive. This suits most sites, where selects are far more common than inserts and updates. Sometimes the summary is costly to keep up to date. Then don’t update it during the user’s request. The book’s example is “customers who bought X also bought…”. Rebuild those summary tables in the background, or as a nightly or weekly batch job. Chapter 8 returns to these trade-offs, together with indexing.</p>
  </section>
  <div class="aside"><b>Then vs now.</b> Today’s tools for the same idea:
    <ul>
      <li>a counter column that a trigger keeps up to date;</li>
      <li>a materialized view (a stored query result) that is refreshed on a schedule (<code>REFRESH MATERIALIZED VIEW</code>);</li>
      <li>a cache such as Redis in front of the database.</li>
    </ul>
    The rule hasn’t changed: measure first.</div>
  <div class="aside pitfalls"><b>Common mistakes.</b>
    <ul>
      <li>Denormalizing at the start “for speed”, without a load test.</li>
      <li>Forgetting that every redundant copy needs a mechanism (a trigger, a job, or application code) that keeps it correct. Without one, the copy will drift: it slowly stops matching the real data.</li>
    </ul></div>

  <!-- 4.8 -->
  <section class="chap" id="p4-8">
    <h2><span class="num">4.8</span>CASE tools for modeling</h2>
    <p><strong>CASE</strong> (Computer Aided Software Engineering) tools let you draw the model in software. Then they generate the database from it. The book lists options from free to many thousands of dollars:</p>
    <ul>
      <li><strong>Free:</strong> Dia.</li>
      <li><strong>Low end:</strong> Datanamic DeZign and Model Creator ERCreator.</li>
      <li><strong>Low to mid:</strong> Charonware Case Studio.</li>
      <li><strong>Mid:</strong> Oracle Designer and Microsoft Visio.</li>
      <li><strong>High end:</strong> Quest Q Designer, Sybase PowerDesigner, Embarcadero ER/Studio and Computer Associates ERwin.</li>
    </ul>
    <p>Whichever tool you choose, make sure it supports your target databases and really does entity modeling.</p>
    <p>The demonstration uses <strong>Visio 2002</strong> and its Database Model Diagram template. Its window has four parts:</p>
    <dl class="notation">
      <dt>Tables and Views</dt><dd>Every entity in the model. One model can have several diagrams. Each diagram shows part of a large system.</dd>
      <dt>Shapes</dt><dd>What you can drop onto a diagram, mainly the Entity and Relationship shapes. When you drop an entity, it is added to the underlying model.</dd>
      <dt>Database Properties</dt><dd>Detailed settings for the selected entity or relationship: columns, types, keys, check clauses and so on.</dd>
      <dt>Drawing surface</dt><dd>Where you lay out the diagram.</dd>
    </dl>
    <h3>Forward, reverse and round-trip engineering</h3>
    <p><strong>Forward engineering</strong> turns the model into a database. First the tool validates the model. At a minimum, it checks that the type of each foreign key matches its primary key. Then it does one or both of these things:</p>
    <ul>
      <li>It writes a DDL script of <code>CREATE TABLE</code> statements.</li>
      <li>It builds the database directly, through a driver for your DBMS.</li>
    </ul>
    <p>Visio can also merge changes into an existing database. In the past, people had to do the work twice: draw a model, then type every table again by hand. That double work was the main reason why people skipped modeling. Forward engineering removes it.</p>
    <p><strong>Reverse engineering</strong> goes the other way. You point the tool at an existing database, and you get a model and diagram back. You can use it to document a legacy system. You can also use it for a project that started in the database and then grew too big for that. It also rescues models that drifted away from the database. Developers will always change the live database at some point without updating the diagram. In the book’s walk-through, a phone-number column is added to Publishers in Access. This column then shows up in the reverse-engineered diagram. The steps of the Visio wizard:</p>
    <ol>
      <li>Choose the data source.</li>
      <li>Choose the object types (procedures and triggers on bigger platforms).</li>
      <li>Choose the specific objects.</li>
      <li>Choose whether to add them to the current diagram.</li>
    </ol>
    <p>For more than about 30 tables, say no. Then place the tables on several diagrams yourself. Visio draws the relationship lines when you drag tables in.</p>
    <p><strong>Round-trip engineering</strong> combines both directions. It tracks changes over the whole life of the database. ER diagrams make excellent documentation. But a CASE tool isn’t essential. Many good designers prefer pen and paper or a whiteboard.</p>
  </section>
  <div class="aside"><b>Then vs now.</b> In a TypeScript stack, the same ideas live in your ORM or migration tool. (An ORM maps database tables to objects in your code.) A schema file in Drizzle or Prisma is the model. Generating and running migrations is forward engineering. <code>drizzle-kit pull</code> or <code>prisma db pull</code> is reverse engineering. Diagram-first tools such as dbdiagram.io export DDL. Database clients like DBeaver draw ER diagrams from live databases.</div>

  <!-- 4.9 -->
  <section class="chap" id="p4-9">
    <h2><span class="num">4.9</span>The importance of sample data</h2>
    <p>Keep checking the model, and later the database, against <strong>sample data</strong>. Ideally this is real data from the client, in a format that they can work with. It shows whether your normalization matches the way the client really handles their information. The book describes three layers:</p>
    <ol>
      <li><strong>From the client</strong> (or from someone who didn’t build the model). This proves that the model can represent all their data, workflows and processes.</li>
      <li><strong>Once the database exists.</strong> Client data, plus data that is corrupted on purpose. This proves that the database enforces the integrity rules from 4.4–4.6.</li>
      <li><strong>As the application nears completion.</strong> Enough realistic data to run a load test. This exposes weaknesses in the model and guides tuning (Chapter 8).</li>
    </ol>
    <p>Stress testing matters especially on the web, where traffic can rise suddenly, without warning. You need to know your breaking point. Then you can plan hardware and hosting before the problem hits you. (The book recommends a free Microsoft web stress tool of that time. Today you would use k6, JMeter or Locust.)</p>
  </section>
  <div class="aside pitfalls"><b>Common mistakes.</b> Testing only with neat rows typed by hand. The second layer exists to throw bad data at the constraints. The third layer exists to find out what happens with production-sized tables.</div>

  <!-- Review -->
  <section class="chap" id="review">
    <h2><span class="num">✓</span>Cheat sheet and quiz</h2>
    <h3>The five structures</h3>
    <div class="tablewrap"><table>
      <thead><tr><th>Structure</th><th>How it’s built</th><th>Book example</th><th>Watch for</th></tr></thead>
      <tbody>
        <tr><td>One-to-many</td><td>Foreign key on the child</td><td>Customers → Orders</td><td>The many end may be zero</td></tr>
        <tr><td>Many-to-many</td><td>Associative table that holds both keys</td><td>Orders ↔ Products via OrderItems</td><td>Never use repeating columns</td></tr>
        <tr><td>One-to-many recursive</td><td>Nullable foreign key to the same table</td><td>Category tree, manager hierarchy</td><td>Cycles (loops); null at the top</td></tr>
        <tr><td>Many-to-many recursive</td><td>Associative table with two keys to the same table</td><td>Product bundles</td><td>A bundle must not contain itself</td></tr>
        <tr><td>One-to-one</td><td>Actual: an FK with at most one row. Sub-type: the FK is on the super-type (one sub-type), or each sub-type’s PK is also its FK (several sub-types)</td><td>Department manager; Items/Files; contract and salaried employees</td><td>Often better as one-to-many</td></tr>
      </tbody>
    </table></div>
    <h3>Key terms</h3>
    <dl class="notation">
      <dt>Cardinality / optionality</dt><dd>How many (fork = many, bar = one), and whether it is required (circle = optional, bar = mandatory).</dd>
      <dt>Entity integrity</dt><dd>The primary key is unique and never null. For composite keys, the combination is unique and no part is null.</dd>
      <dt>Natural vs surrogate key</dt><dd>Natural: meaningful data that may stop being unique. Surrogate: a generated sequence number or GUID.</dd>
      <dt>Domain</dt><dd>All legal values for a column. It is the sum of the data type, length, constraints, optionality and default.</dd>
      <dt>Referential integrity</dt><dd>Every foreign key is null or matches a parent key. It prevents insert, update and delete anomalies.</dd>
      <dt>Referential actions</dt><dd>RESTRICT (refuse), CASCADE (follow the change), SET NULL (detach the children).</dd>
      <dt>Forward / reverse engineering</dt><dd>Forward: model to database. Reverse: database to model. Both together are round-trip engineering.</dd>
    </dl>

  toc:[["#p4-1","4.1","Data modeling"],["#p4-2","4.2","Entities, attributes and relationships"],["#p4-3","4.3","Common structures"],["#p4-4","4.4","Integrity constraints and entity integrity"],["#p4-5","4.5","Attribute (domain) integrity"],["#p4-6","4.6","Referential integrity"],["#p4-7","4.7","Denormalizing for performance"],["#p4-8","4.8","CASE tools for modeling"],["#p4-9","4.9","The importance of sample data"],["#review","✓","Cheat sheet and quiz"]],
  run(K){
"use strict";
const { $, esc, T, R, P, HIT, G, REL, SVG, dot, fin, diamond, pkg, comp, node3d, artifact, actor, usecase, action, cls, obj, frame, entity } = K;

const ACC = 'style="fill:var(--accent);font-weight:600"';
const BAD = 'style="fill:var(--bad);font-weight:600"';
const stub = (x, y, dx, dy, m) => `<path d="M${x} ${y}l${dx} ${dy}" class="l" marker-start="url(#${m})"/>`;

/* Visio-style entity: rows are [key, name, type, required]. Bold = NOT NULL, underlined = PK. */
function entH(pk, rest){ return 26 + 8 + 18 * pk.length + (rest.length ? 8 + 18 * rest.length : 10); }
function rowY(y, pk, i, inRest){ return inRest ? y + 34 + 18 * pk.length + 13 + 18 * i : y + 39 + 18 * i; }
function ent(x, y, w, name, pk, rest, tip, o = {}){
  const h = entH(pk, rest), kw = o.kw || 34;
  let s = R(x, y, w, h, "b", 3) + `<rect x="${x}" y="${y}" width="${w}" height="26" rx="3" class="b2"/>` + T(x + w / 2, y + 18, name, "hd") + P(`M${x} ${y + 26}H${x + w}`);
  const row = ([k, n, t, req], ry, isPk) => {
    let g = "";
    if (o.hl) g += `<rect x="${x + 3}" y="${ry - 13}" width="${w - 6}" height="18" rx="2" class="acc" style="opacity:0" data-a="${n}"/>`;
    if (k) g += T(x + 7, ry, k, "sm2", "start");
    g += T(x + kw + 6, ry, n, "m" + (req ? " hd" : ""), "start", isPk ? 'text-decoration="underline"' : "");
    if (t) g += T(x + w - 8, ry, t, "sm", "end");
    return g;
  };
  pk.forEach((r, i) => s += row(r, y + 43 + 18 * i, true));
  const y2 = y + 34 + 18 * pk.length;
  s += P(`M${x} ${y2}H${x + w}`);
  rest.forEach((r, i) => s += row(r, y2 + 17 + 18 * i, false));
  s += P(`M${x + kw} ${y + 26}V${y + h}`);
  return G(tip, s);
}
/* data grid; each row is a hoverable .cell group so it can be highlighted */
function grid(x, y, cols, rows, o = {}){
  const rh = 22, W = cols.reduce((a, c) => a + c[1], 0), H = rh * (rows.length + 1);
  let s = R(x, y, W, rh, "b2", 0);
  let cx = x; cols.forEach(c => { s += T(cx + 6, y + 15, c[0], "sm2 hd", "start"); cx += c[1]; });
  rows.forEach((r, ri) => {
    const ry = y + rh * (ri + 1); let inner = R(x, ry, W, rh, "b", 0); let cx = x;
    r.forEach((v, ci) => {
      const hot = o.hl && o.hl(ri, ci), nul = v === "NULL";
      inner += T(cx + 6, ry + 15, v, nul ? "sm" : "sm2", "start", hot ? ACC : ""); cx += cols[ci][1];
    });
    const tip = o.tips ? o.tips[ri] : "A row of sample data.";
    s += `<g class="tip cell" tabindex="0" data-tip="${esc(tip)}" data-r="${o.keys ? o.keys[ri] : ""}">${inner}</g>`;
  });
  cx = x; cols.forEach((c, i) => { if (i) s += P(`M${cx} ${y}V${y + H}`); cx += c[1]; });
  s += R(x, y, W, H, "l", 0);
  return s;
}
const PH = (tip, inner, attrs) => `<g class="tip phase" tabindex="0" role="button" data-tip="${esc(tip)}" ${attrs}>${inner}</g>`;

/* ---------- diagrams ---------- */
const D = {};

/* modeling cycle */
const CYC = {
  an:["Analysis","interview client or users","<b>Analysis.</b> Interview the client or users to understand what data they need. Early on, they may not know this themselves. The model helps them find out."],
  de:["Design","entities, attributes, relationships","<b>Design.</b> Decide which data items become entities, attributes and relationships. This turns the user’s needs into the data model."],
  va:["Validation","check it with the user","<b>Validation.</b> Share the model with the user or customer to check that it meets the requirements. This usually raises new questions, so you loop back to analysis."],
  im:["Implementation","create it on the chosen DBMS","<b>Implementation.</b> This comes only after enough loops. Create the physical database from the model, on the DBMS you chose. The model doesn’t depend on any product, so you can make that choice late."]
};
D.cycle = () => {
  let s = "";
  s += REL("Analysis feeds design: what you learned becomes entities and relationships.", "M140 130V44H270", "l", "mf");
  s += REL("The design goes to the customer for validation.", "M450 44H580V130", "l", "mf");
  s += REL("Validation sends you back to analysis with new questions. This loop repeats several times.", "M580 186V214H140V190", "l", "mf");
  s += REL("When the model has gone through enough loops, implement it.", "M360 214V256", "l", "mf", T(372, 240, "after sufficient iterations", "sm", "start"));
  s += G("The data model is the result of several complete loops, not of a single pass.", R(275, 128, 170, 52, "dashb", 26) + T(360, 151, "the data model is", "sm") + T(360, 167, "refined on each loop", "sm"));
  const box = (k, x, y, w) => PH(`${CYC[k][0]}. Click for details.`, R(x, y, w, 56, "b", 28) + T(x + w / 2, y + 24, CYC[k][0], "hd") + T(x + w / 2, y + 42, CYC[k][1], "sm"), `data-p="${k}"`);
  s += box("de", 270, 16, 180) + box("va", 480, 130, 200) + box("an", 40, 130, 200) + box("im", 250, 256, 220);
  return SVG(720, 324, "The iterative data-modeling cycle: analysis, design, validation, then implementation", s);
};

/* Books and Publishers */
const BOOKS_PK = [["PK","ISBN","char(20)",1]], BOOKS_R = [["FK1","PublisherID","int",1],["","Title","varchar(100)",0],["","Author","varchar(100)",0]];
const PUB_PK = [["PK","PublisherID","int",1]], PUB_R = [["","Name","char(10)",0],["","Address","char(10)",0]];
D.bookEr = () => {
  let s = "";
  const y1 = rowY(70, BOOKS_PK, 0, true), y2 = rowY(70, PUB_PK, 0, false);
  s += REL("The relationship. A book must have exactly one publisher (two bars at Publishers). A publisher has zero or many books (circle and fork at Books). Dashed line: PublisherID is an ordinary column in Books.",
    `M310 ${y1}H380V${y2}H450`, "d", "cf11", stub(310, y1, 2, 0, "cf0N"));
  s += ent(40, 70, 270, "Books", BOOKS_PK, BOOKS_R, "Entity Books. ISBN is the primary key (underlined). FK1 PublisherID is a foreign key to Publishers. Bold ISBN and PublisherID may not be null. Title and Author may be null.");
  s += ent(450, 70, 230, "Publishers", PUB_PK, PUB_R, "Entity Publishers, with the primary key PublisherID. There is no column for the number of books. This is on purpose, because the books can be counted.");
  s += `<g data-part="ent">` + G("Entities: each box is one entity, and it becomes one table. The name is in the header.",
    T(360, 22, "entities (tables)", "sm2 hd") + P("M310 28L200 66", "dot-line") + P("M410 28L540 66", "dot-line")) + `</g>`;
  s += `<g data-part="att">` + G("Attributes become columns. Each row shows the key marker, the name and the data type. Bold = NOT NULL.",
    T(175, 214, "attributes (columns): key · name · type", "sm2 hd") + P("M175 202V188", "dot-line")) + `</g>`;
  s += `<g data-part="rel">` + G("Cardinality: the fork is the many end, and the bar is the one end. Optionality: the circle means optional, and two bars mean mandatory.",
    T(318, 152, "many end", "sm2", "start", ACC) + T(444, 90, "one end", "sm2", "end", ACC) +
    T(430, 214, "relationship", "sm2 hd") + P(`M430 202L382 ${y1 + 6}`, "dot-line")) + `</g>`;
  s += T(360, 244, "PK = primary key (underlined) · FK1 = foreign key no. 1 · bold = NOT NULL", "sm");
  return SVG(720, 256, "ER diagram: Books and Publishers in crow’s-foot notation with callouts", s);
};

/* one-to-many: Customers and Orders */
const CUST = [["1","John Smith","jsmith@smith.com"],["2","Bill Young","byoung@billsboats.com"],["3","James Jones","james@jonesshoes.com"]];
const ORD = [["1","11/7/2002","1"],["2","12/9/2002","1"],["3","9/2/2013","2"]];
D.oneMany = () => {
  let s = "";
  const pk = [["PK","CustomerID","int",1]], opk = [["PK","OrderID","int",1]], orest = [["","OrderDate","datetime",1],["FK1","CustomerID","int",1]];
  const yb = rowY(20, opk, 1, true);
  const yc = 20 + 39;
  s += REL("One customer places zero or many orders (circle and fork at Orders). Each order has exactly one customer (two bars at Customers).",
    `M270 ${yc}H360V${yb}H450`, "d", "cf0N", stub(270, yc, 2, 0, "cf11"));
  s += ent(20, 20, 250, "Customers", pk, [["","Name","varchar(50)",1],["","EMail","varchar(250)",1]], "Parent table Customers.");
  s += ent(450, 20, 240, "Orders", opk, orest, "Child table Orders. FK1 CustomerID holds the ID of the customer who placed the order.");
  s += T(20, 152, "Customers rows", "sm", "start") + T(450, 152, "Orders rows", "sm", "start");
  s += grid(20, 160, [["CustomerID",84],["Name",100],["EMail",176]], CUST, { keys:["c1","c2","c3"],
    tips:["John Smith: two orders point at CustomerID 1.","Bill Young: one order points at CustomerID 2.","James Jones: no orders yet. This is allowed, because the many end includes zero."] });
  s += grid(450, 160, [["OrderID",66],["OrderDate",90],["CustomerID",84]], ORD, { keys:["o1c1","o2c1","o3c2"], hl:(r, c) => c === 2,
    tips:["Order 1 belongs to customer 1.","Order 2 also belongs to customer 1.","Order 3 belongs to customer 2."] });
  return SVG(720, 258, "Customers and Orders: a one-to-many relationship with sample rows", s);
};

/* many-to-many: Orders, OrderItems, Products */
const ITEMS = [["1","2","1","$160.00"],["2","4","2","$90.00"],["2","5","1","$150.00"],["3","4","1","$90.00"]];
const PRODS = [["1","Super Sprint Shoes","$89.95"],["2","Alpine Boots","$160.00"],["3","Summer Tracksuit","$75.00"],["4","Winter Tracksuit","$90.00"],["5","Tracksuit Combo Deal","$150.00"]];
D.manyMany = () => {
  let s = "";
  const opk = [["PK","OrderID","int",1]], ipk = [["PK,FK1","ProductID","int",1],["PK,FK2","OrderID","int",1]], ppk = [["PK","ProductID","int",1]];
  const yO = rowY(20, opk, 0, false), yI1 = rowY(20, ipk, 0, false), yI2 = rowY(20, ipk, 1, false), yP = rowY(20, ppk, 0, false);
  s += REL("Orders to OrderItems: one order has zero or many item rows. Each item row belongs to exactly one order. Solid line: OrderID is part of OrderItems’ primary key.",
    `M210 ${yO}H245V${yI2}H280`, "l", "cf0N", stub(210, yO, 2, 0, "cf11"));
  s += REL("Products to OrderItems: one product appears in zero or many item rows. Each item row is for exactly one product.",
    `M545 ${yP}H475`, "l", "cf0N", stub(545, yP, -2, 0, "cf11"));
  s += ent(10, 20, 200, "Orders", opk, [["","OrderDate","datetime",1],["FK1","CustomerID","int",1]], "Orders: when and by whom each order was placed.");
  s += ent(280, 20, 195, "OrderItems", ipk, [["","Quantity","int",0],["","PurchasePrice","money",0]], "OrderItems, the associative entity. Its primary key is the pair (ProductID, OrderID). It also stores the quantity and the price paid at the time.", { kw:52 });
  s += ent(545, 20, 235, "Products", ppk, [["","ProductShortName","varchar(50)",1],["","ProductDescription","text",1],["","ProductPrice","money",1],["FK1","CategoryID","int",0]], "Products for sale.");
  s += T(10, 167, "Orders", "sm", "start") + T(180, 167, "OrderItems", "sm", "start") + T(495, 167, "Products", "sm", "start");
  s += grid(10, 175, [["OrderID",64],["CustomerID",84]], ORD.map(r => [r[0], r[2]]), { keys:["o1","o2","o3"],
    tips:["Order 1: one item row.","Order 2: two item rows, so two products.","Order 3: one item row."] });
  s += grid(180, 175, [["OrderID",62],["ProductID",70],["Quantity",62],["PurchasePrice",96]], ITEMS, { keys:["i1","i2","i3","i4"], hl:(r, c) => c < 2,
    tips:ITEMS.map(r => `Order ${r[0]} contains product ${r[1]}: quantity ${r[2]} at ${r[3]}.`) });
  s += grid(495, 175, [["ProductID",66],["ProductShortName",134],["ProductPrice",88]], PRODS, { keys:["p1","p2","p3","p4","p5"],
    tips:PRODS.map(r => `Product ${r[0]}: ${r[1]}.`) });
  return SVG(790, 320, "Orders and Products linked many-to-many through OrderItems, with sample rows", s);
};

/* recursive category tree */
const CATS = [["1","Running Shoes","NULL"],["2","Hiking Boots","NULL"],["3","Sweatshirts","NULL"],["4","Hooded Sweats","3"],["5","V Neck Sweats","3"],["6","Tracksuits","NULL"],["7","College Teams","4"]];
D.tree = () => {
  let s = "";
  const cpk = [["PK","CategoryID","int",1]], crest = [["","CategoryName","varchar(50)",1],["FK1","ParentCategory","int",0],["FK2","DepartmentID","int",0]];
  s += REL("The recursive relationship. ParentCategory is a foreign key to CategoryID in the same table. A category has zero or one parent (circle and bar), and zero or many children (circle and fork).",
    "M90 50V26H210V50", "d", "cf0N", stub(90, 50, 0, -2, "cf01") + T(150, 18, "ParentCategory → CategoryID", "sm"));
  s += ent(20, 50, 260, "Categories", cpk, crest, "Categories. FK1 ParentCategory points at another category, or it is null for a top-level category. It must allow null.");
  const bodyGrid = bad => T(20, 192, "Categories rows", "sm", "start") +
    grid(20, 200, [["CategoryID",76],["CategoryName",124],["ParentCategory",104]], CATS.map((r, i) => i === 2 && bad ? [r[0], r[1], "7"] : r), {
      hl:(r, c) => c === 2 && (bad ? r === 2 : r === 3 || r === 4 || r === 6),
      tips:CATS.map((r, i) => i === 2 && bad ? "Sweatshirts now has College Teams (7) as its parent. The foreign key is satisfied, because row 7 exists." :
        r[2] === "NULL" ? `${r[1]}: ParentCategory is null, so it is top level.` : `${r[1]}: its parent is category ${r[2]}.`) });
  const node = (name, depth, i, tip, hot) => G(tip, R(370 + depth * 36, 50 + i * 34, 150, 26, hot ? "acc" : "b", 4) + T(380 + depth * 36, 68 + i * 34, name, "m", "start"));
  const yc = i => 63 + i * 34;
  /* valid tree */
  const OK = [["Running Shoes",0],["Hiking Boots",0],["Sweatshirts",0],["Hooded Sweats",1],["College Teams",2],["V Neck Sweats",1],["Tracksuits",0]];
  let ok = bodyGrid(false) + G("The top level: rows whose ParentCategory is null.", T(352, 40, "top level (parent NULL)", "sm", "start") + P(`M356 46V${yc(6)}`, "l"));
  OK.forEach(([n, d], i) => { if (d === 0) ok += P(`M356 ${yc(i)}H370`, "l"); });
  ok += P(`M384 ${50 + 2 * 34 + 26}V${yc(3)}H406`) + P(`M384 ${yc(3)}V${yc(5)}H406`) + P(`M420 ${50 + 3 * 34 + 26}V${yc(4)}H442`);
  OK.forEach(([n, d], i) => ok += node(n, d, i, d === 0 ? `${n}: a top-level category.` : `${n}: a subcategory, depth ${d}.`));
  /* corrupted */
  let bad = bodyGrid(true) + G("Only the categories that you can still reach from a null parent.", T(352, 40, "top level (parent NULL)", "sm", "start") + P(`M356 46V${yc(2)}`, "l"));
  [["Running Shoes",0],["Hiking Boots",0],["Tracksuits",0]].forEach(([n], i) => { bad += P(`M356 ${yc(i)}H370`, "l") + node(n, 0, i, `${n}: still top level.`); });
  bad += T(370, 50 + 3 * 34 + 18, "detached loop: no path from the top", "sm2", "start", ACC);
  bad += P(`M384 ${50 + 4 * 34 + 26}V${yc(5)}H406`) + P(`M384 ${yc(5)}V${yc(7)}H406`) + P(`M420 ${50 + 5 * 34 + 26}V${yc(6)}H442`);
  bad += REL("The bad update: the parent of Sweatshirts is now College Teams, which is the grandchild of Sweatshirts. If you follow the parents, you go round forever and never reach a null.",
    `M592 ${yc(6)}H640V${yc(4)}H526`, "d", "mfa", "");
  bad += node("Sweatshirts", 0, 4, "Sweatshirts: its parent is now College Teams.", true) + node("Hooded Sweats", 1, 5, "Hooded Sweats: still under Sweatshirts.") +
    node("College Teams", 2, 6, "College Teams: under Hooded Sweats, and now also the parent of Sweatshirts.", true) + node("V Neck Sweats", 1, 7, "V Neck Sweats: cut off together with its parent.");
  s += `<g class="v-ok">${ok}</g><g class="v-bad">${bad}</g>`;
  return SVG(720, 386, "A recursive Categories table, its rows, and the category tree they encode", s);
};

/* many-to-many recursive: bundles */
D.bundle = () => {
  const ppk = [["PK","ProductID","int",1]], prest = [["","ProductShortName","varchar(50)",1],["","ProductDescription","text",1],["","ProductPrice","money",1],["FK1","CategoryID","int",0]];
  const bpk = [["PK,FK1","BundleID","int",1],["PK,FK2","BundledProductID","int",1]];
  const yP = rowY(20, ppk, 0, false), yB1 = rowY(20, bpk, 0, false), yB2 = rowY(20, bpk, 1, false), yP2 = rowY(20, ppk, 1, true);
  const prodTip = "Products. The bundle itself is an ordinary product row with its own price.";
  const pbTip = "ProductBundles: one row for each (bundle, product inside it) pair. Both columns are foreign keys to Products. Together they form the primary key.";
  let one = "";
  one += REL("BundleID → Products: a product can be a bundle with zero or many contents rows.", `M240 ${yP}H420`, "d", "cf0N", stub(240, yP, 2, 0, "cf11"));
  one += REL("BundledProductID → Products: a product can be inside zero or many bundles.", `M240 ${yP2}H330V${yB2}H420`, "d", "cf0N", stub(240, yP2, 2, 0, "cf11"));
  one += ent(10, 20, 230, "Products", ppk, prest, prodTip, { kw:30 }) + ent(420, 20, 200, "ProductBundles", bpk, [], pbTip, { kw:52 });
  one += T(520, 118, "BundleID = the bundle", "sm2") + T(520, 136, "BundledProductID = a part", "sm2");
  let two = "";
  two += REL("Read as: Products (the bundle) to ProductBundles.", `M240 ${yP}H315`, "d", "cf0N", stub(240, yP, 2, 0, "cf11"));
  two += REL("Read as: ProductBundles to Products (a part).", `M515 ${yB2}H535V${yP}H555`, "d", "cf11", stub(515, yB2, 2, 0, "cf0N"));
  two += ent(10, 20, 230, "Products", ppk, prest, prodTip + " Here: the bundle.", { kw:30 }) + ent(315, 20, 200, "ProductBundles", bpk, [], pbTip, { kw:52 }) +
    ent(555, 20, 230, "Products", ppk, prest, "The same Products table drawn a second time, in the role of the part. This is not a valid diagram, only a way to read it.", { kw:30 });
  two += T(415, 118, "BundleID = the bundle", "sm2") + T(415, 136, "BundledProductID = a part", "sm2");
  let s = `<g class="v-one">${one}</g><g class="v-two">${two}</g>`;
  s += T(10, 192, "Products rows (3–5)", "sm", "start") + T(300, 192, "ProductBundles rows", "sm", "start");
  s += grid(10, 200, [["ProductID",70],["ProductShortName",160]], PRODS.slice(2).map(r => [r[0], r[1]]), { hl:(r, c) => r === 2,
    tips:["Summer Tracksuit: a part of bundle 5.","Winter Tracksuit: a part of bundle 5.","Tracksuit Combo Deal: a product that is also a bundle."] });
  s += grid(300, 200, [["BundleID",76],["BundledProductID",124]], [["5","3"],["5","4"]], { hl:(r, c) => c === 0,
    tips:["Bundle 5 contains product 3.","Bundle 5 contains product 4."] });
  return SVG(790, 300, "A many-to-many recursive relationship: Products bundled through ProductBundles", s);
};

/* one-to-one sub-types */
D.subtype = () => {
  let a = "";
  const ipk = [["PK","ItemID","int",1]], irest = [["","ItemName","varchar(50)",1],["FK1","ItemParent","int",0],["FK2","FileID","int",0]];
  const fpk = [["PK","FileID","int",1]];
  const yF = rowY(50, ipk, 2, true), yFile = rowY(50, fpk, 0, false);
  a += REL("Items is a tree of files and folders: ItemParent points at the containing folder (one-to-many recursive).", "M110 50V26H230V50", "d", "cf0N", stub(110, 50, 0, -2, "cf01"));
  a += REL("One-to-one: an item has zero or one Files row, and a Files row belongs to zero or one item. The foreign key FileID is on the super-type, Items.",
    `M290 ${yF}H370V${yFile}H450`, "d", "cf01", stub(290, yF, 2, 0, "cf01"));
  a += ent(40, 50, 250, "Items", ipk, irest, "Items, the super-type: anything in the tree. FileID is null for a folder and points at a Files row for a file.");
  a += ent(450, 50, 230, "Files", fpk, [["","FileSize","int",1],["","FileBinaryContent","blob",0]], "Files, the only sub-type. It holds the file-specific columns, so they stay out of Items.");
  a += T(165, 196, "one sub-type: FK on the super-type", "sm2", "middle", ACC) + T(165, 214, "FileID NULL = folder, no join needed", "sm");
  let b = "";
  const epk = [["PK","EmployeeID","int",1]], spk = [["PK,FK1","EmployeeID","int",1]];
  b += REL("Employees to ContractEmployees: an employee has zero or one contract row. Each contract row is exactly one employee.", "M310 98V134H155V170", "l", "cf01", stub(310, 98, 0, 2, "cf11"));
  b += REL("Employees to SalariedEmployees: an employee has zero or one salaried row. Each salaried row is exactly one employee.", "M410 98V134H565V170", "l", "cf01", stub(410, 98, 0, 2, "cf11"));
  b += ent(245, 20, 230, "Employees", epk, [["","EmployeeName","varchar(50)",1]], "Employees, the super-type: columns every employee has.");
  b += ent(20, 170, 270, "ContractEmployees", spk, [["","HourlyRate","money",1],["","ContractingCompany","varchar(50)",1]], "Sub-type for contractors. Its primary key is also the foreign key to Employees.", { kw:52 });
  b += ent(430, 170, 270, "SalariedEmployees", spk, [["","Salary","money",1]], "Sub-type for salaried staff. Same key pattern.", { kw:52 });
  b += T(565, 278, "several sub-types: FK on each sub-type,", "sm2", "middle", ACC) + T(565, 294, "where the PK doubles as the FK", "sm2", "middle", ACC);
  return SVG(720, 304, "Sub-type/super-type one-to-one relationships", `<g class="v-a">${a}</g><g class="v-b">${b}</g>`);
};

/* full e-commerce diagram */
D.ecom = () => {
  let s = "";
  const r = (y, i) => y + 46 + 18 * i;
  s += REL("One-to-many recursive: Manager points at another employee (null for the CEO).", `M240 ${r(40,0)}H275V${r(40,3)}H240`, "d", "cf0N", stub(240, r(40,0), 2, 0, "cf01"));

/* referential-integrity simulator */
(function(){
  let mode = "restrict", op = null;
  const p = plate("ri");
  const MODES = { none:"No RI enforced", restrict:"RESTRICT", cascade:"CASCADE", setnull:"SET NULL" };
  function run(){
    let cust = RI0.cust.map(c => c.slice()), ord = RI0.ord.map(o => o.slice()), chg = { c:[], o:[] }, banner = "", rej = false, note = "";
    if (!op) { banner = "Pick a change below."; note = "Choose how the foreign key is enforced. Then choose a change to make."; }
    else if (op === "ins") {
      if (mode === "none") { ord.push([4,"1/1/2003",9]); chg.o = [3]; banner = "Inserted order 4 for customer 9, who doesn’t exist."; note = "<b>Insert anomaly.</b> Nothing enforces the foreign key, so order 4 is an orphan from the start."; }
      else { rej = true; banner = "✕ Rejected: there is no customer 9."; note = "<b>Insert anomaly prevented.</b> Every enforced mode blocks this. Referential actions only apply when you update or delete the parent. Insert the parent first."; }
    } else if (op === "upd") {
      const idx = [0,1];
      if (mode === "restrict") { rej = true; banner = "✕ Rejected: orders 1 and 2 still reference customer 1."; note = "<b>RESTRICT.</b> A referenced primary key can’t change. Without a referential action, you are stuck. The parent can’t change first, and the children can’t change first either."; }
      else {
        cust[0][0] = 10; chg.c = [0];
        if (mode === "none") { banner = "Customer 1 is now 10; orders 1 and 2 still say 1."; note = "<b>Update anomaly.</b> The children point at a key value that no longer exists."; }
        if (mode === "cascade") { idx.forEach(i => ord[i][2] = 10); chg.o = idx; banner = "Customer 1 is now 10, and orders 1 and 2 followed."; note = "<b>ON UPDATE CASCADE.</b> The new key value is copied down to every child."; }
        if (mode === "setnull") { idx.forEach(i => ord[i][2] = null); chg.o = idx; banner = "Customer 1 is now 10; orders 1 and 2 now have no customer."; note = "<b>ON UPDATE SET NULL.</b> The children are detached from their parent. This is only possible if Orders.CustomerID allows null."; }
      }
    } else if (op === "del1") {
      if (mode === "restrict") { rej = true; banner = "✕ Rejected: orders 1 and 2 still reference customer 1."; note = "<b>RESTRICT.</b> Delete or reassign the orders first. This is right for valuable children, like an employee’s projects."; }
      else {
        cust.splice(0, 1);
        if (mode === "none") { banner = "John Smith deleted; orders 1 and 2 are orphans."; note = "<b>Delete anomaly.</b> Two orders now point at a customer who doesn’t exist."; }
        if (mode === "cascade") { ord.splice(0, 2); banner = "John Smith and his orders 1 and 2 were deleted."; note = "<b>ON DELETE CASCADE.</b> One statement removes the parent and its children, like deleting a folder with its files. This is dangerous if the children matter on their own."; }
        if (mode === "setnull") { ord[0][2] = null; ord[1][2] = null; chg.o = [0,1]; banner = "John Smith deleted; orders 1 and 2 kept, with no customer."; note = "<b>ON DELETE SET NULL.</b> The children survive, but they lose their parent. Some products don’t offer this action. A trigger can imitate it."; }
      }
    } else if (op === "del3") {
      cust.splice(2, 1); banner = "James Jones deleted. No orders referenced him."; note = "<b>No conflict.</b> A parent with no children can always be deleted, in every mode.";
    }
    p.innerHTML = riDraw(cust, ord, chg, banner, rej);
    $("riNote").innerHTML = note;
  }
  chips("riModes", Object.entries(MODES), v => { mode = v; run(); })("restrict");
  chips("riOps", [["ins","Insert order for customer 9"],["upd","Change customer 1’s ID to 10"],["del1","Delete John Smith"],["del3","Delete James Jones"]], v => { op = v; run(); });
})();

/* ---------- quiz ---------- */
const QUIZ = [
  ["In the book’s crow’s-foot notation, what does a circle at the end of a relationship line mean?", ["Exactly one","Many","That end is optional","A primary key"], 2, "A circle means optional and a bar means mandatory (optionality). A fork means many and a single bar means one (cardinality)."],
  ["Why can’t a relational database store a many-to-many relationship in just two tables?", ["SQL has no JOIN for it","You’d need repeating groups of foreign-key columns, which limit the count and aren’t a true many-to-many","Primary keys can’t be integers","Foreign keys can’t be null"], 1, "The fix is an associative table, like OrderItems, that holds one row for each pairing."],
  ["Which pair of questions does the book suggest, to decide between one-to-many and many-to-many for users and groups?", ["Is the table large? Is it indexed?","Can a user belong to many groups? Can a group contain many users?","Does a user have a GUID? Does a group?","Is the data read more than written?"], 1, "Say the relationship in both directions and ask the customer. If both answers are yes, it is many-to-many."],
  ["Why must ParentCategory in a recursive Categories table allow null?", ["To save space","Top-level categories have no parent, and a made-up value would break referential integrity","Nulls make queries faster","The book’s DBMS requires it"], 1, "The top of the tree has nothing to point at, so its foreign key must be null."],
  ["Spot the mistake: “The foreign key on ParentCategory guarantees our category tree is always valid.”", ["Nothing is wrong","A foreign key can’t point at its own table","The FK only checks that the parent exists. It can’t stop cycles like Sweatshirts under College Teams","Trees need a many-to-many table"], 2, "Cycles (loops) satisfy the foreign key. Check before inserts and updates, in code or with a trigger."],
  ["With two sub-types (contract and salaried employees), where does the book put the foreign key?", ["On Employees, one per sub-type","On each sub-type table, where the primary key is also the foreign key","In a separate link table","Nowhere; it uses a single wide table"], 1, "With one sub-type, the FK can go on the super-type (Items.FileID). With several, it goes on the sub-types."],
  ["Which is a rule of entity integrity for a composite primary key?", ["Each key column must be unique on its own","The combination must be unique and no key column may be null","Only the first column may be null","It must be a GUID"], 1, "On their own, the columns can repeat, as Author, Title and Publisher do in the book’s example."],
  ["Why does the book like GUID keys for things like user profile URLs?", ["They are shorter than integers","They sort in time order","They can’t be guessed, so nobody can try every key in the range","They make joins unnecessary"], 2, "Sequential IDs invite scripts that fetch userid=1, 2, 3… (You still need an authorization check: a check that the user may see that record.)"],
  ["The client asks to store each customer’s age. What does the book do?", ["Store age as a small integer","Store DOB and calculate age when needed","Store age as text","Recalculate age with a nightly job"], 1, "Age is temporal (it changes with time), so it is wrong soon after you store it. A date of birth doesn’t change."],
  ["An employee manages many projects. Which referential action on the projects’ foreign key does the book recommend?", ["ON DELETE CASCADE","ON DELETE SET NULL","The default RESTRICT, so projects are reassigned or deleted on purpose","No foreign key at all"], 2, "CASCADE would silently delete valuable project data whenever an employee left."]
];
const quizEl = $("quiz"); let answered = 0, right = 0;
function buildQuiz(){
  quizEl.innerHTML = ""; answered = 0; right = 0; $("score").textContent = `0 of ${QUIZ.length} answered`;
  QUIZ.forEach(([q, opts, ans, why], qi) => {
    const bx = document.createElement("div"); bx.className = "q";
    bx.innerHTML = `<p>${qi + 1}. ${esc(q)}</p><div class="opts"></div><div class="why" hidden></div>`;
    const o = bx.querySelector(".opts");
    opts.forEach((txt, i) => {
      const b = document.createElement("button"); b.textContent = txt;
      b.addEventListener("click", () => {
        o.querySelectorAll("button").forEach((x, j) => { x.disabled = true; if (j === ans) x.classList.add("right"); });
        if (i !== ans) b.classList.add("wrong"); else right++;
        answered++;
        const w = bx.querySelector(".why"); w.hidden = false; w.textContent = (i === ans ? "Correct. " : "Not quite. ") + why;
        $("score").textContent = answered === QUIZ.length ? `You scored ${right} of ${QUIZ.length}.` : `${answered} of ${QUIZ.length} answered, ${right} correct`;
      });
      o.appendChild(b);
    });
    quizEl.appendChild(bx);
  });
}
$("quizReset").addEventListener("click", buildQuiz);

<template id="tpl-pddw-05">
  <h1>Planning the database: from stakeholder wish lists to a conceptual model</h1>
  <p class="lede">A short course on Chapter 5 of <em>Practical Database Design for the Web</em>. In this chapter the book starts its running example: a web store. You will learn to:</p>
  <ul>
    <li>gather the data requirements from the store owner and the customer;</li>
    <li>sort them into entities (the kinds of things the database stores facts about) and attributes (those facts);</li>
    <li>test every relationship in both directions until its cardinality (the “how many” on each side) is settled;</li>
    <li>put everything together in one conceptual ER diagram. Chapter 6 will turn this diagram into tables.</li>
  </ul>
  <p class="byline">Hover over or tap any part of a diagram to see an explanation. Every figure has a Full screen button. The interactive parts are:</p>
  <ul>
    <li>a planning pipeline that you can click;</li>
    <li>a sorter that asks “where does this requirement go?”;</li>
    <li>a toggle that shows hidden relationships;</li>
    <li>a category tree that you can click;</li>
    <li>a cardinality builder;</li>
    <li>a relationship filter on the full model.</li>
  </ul>
