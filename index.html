<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Course Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --fs:18px; --lh:1.65; --measure:680px;
  --serif:"Literata","Iowan Old Style","Charter","Georgia",serif;
  --sans:"Source Sans 3","Segoe UI","Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --body:var(--serif);
  --bar:56px;
}
html[data-font="sans"]{--body:var(--sans)}

html[data-theme="paper"]{--bg:#fbfbf9;--surface:#ffffff;--text:#1e232c;--muted:#5d6675;--rule:#e2e4e8;--accent:#1d5fae;--accent-soft:rgba(29,95,174,.12);--d-bg:#f6f8fb;--d-fill:#ffffff;--d-line:#3b4656;--grid:rgba(29,95,174,.07);--code-bg:#f1f3f6;--ok:#1f7a4d;--bad:#b4332e;color-scheme:light}
html[data-theme="sepia"]{--bg:#f3e9d4;--surface:#f9f1df;--text:#3b2f22;--muted:#7a6650;--rule:#dfd0b1;--accent:#8c4a12;--accent-soft:rgba(140,74,18,.13);--d-bg:#f7eedb;--d-fill:#fcf6e9;--d-line:#5a4630;--grid:rgba(140,74,18,.07);--code-bg:#ecdfc2;--ok:#4f6b1d;--bad:#a23a1c;color-scheme:light}
html[data-theme="mist"]{--bg:#e7ebef;--surface:#f2f4f6;--text:#222a38;--muted:#566173;--rule:#cdd4dc;--accent:#2c6a5c;--accent-soft:rgba(44,106,92,.13);--d-bg:#eef1f4;--d-fill:#f8f9fa;--d-line:#3a4658;--grid:rgba(44,106,92,.08);--code-bg:#dde3e8;--ok:#2c6a3c;--bad:#a8332f;color-scheme:light}
html[data-theme="night"]{--bg:#14171c;--surface:#1b1f26;--text:#d9dde4;--muted:#919aa9;--rule:#2b313b;--accent:#86b3ff;--accent-soft:rgba(134,179,255,.16);--d-bg:#171b21;--d-fill:#1f242c;--d-line:#a9b3c2;--grid:rgba(134,179,255,.06);--code-bg:#1f242c;--ok:#6fcf97;--bad:#f28b82;color-scheme:dark}

*{box-sizing:border-box}
html{scroll-padding-top:calc(var(--bar) + 16px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:var(--fs);line-height:var(--lh);-webkit-font-smoothing:antialiased;transition:background-color .2s,color .2s}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.topbar{position:sticky;top:0;z-index:30;height:var(--bar);display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--bg);border-bottom:1px solid var(--rule);font-family:var(--sans)}
.topbar .title{font-size:15px;line-height:1.2;flex:1;min-width:0}
.topbar .title b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .title span{color:var(--muted);font-size:13px}
.iconbtn{font:600 15px var(--sans);color:var(--text);background:transparent;border:1px solid var(--rule);border-radius:8px;height:38px;min-width:42px;padding:0 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.iconbtn:hover{border-color:var(--muted)}
.iconbtn[aria-expanded="true"]{background:var(--accent-soft);border-color:var(--accent)}
.aa{font-family:var(--serif);font-size:18px;letter-spacing:-.5px}
.aa small{font-size:13px}
#tocBtn{display:inline-flex}
.progress{position:absolute;left:0;bottom:-1px;height:2px;background:var(--accent);width:0}

/* layout */
.layout{display:grid;grid-template-columns:270px minmax(0,1fr)}
nav.toc{position:sticky;top:var(--bar);height:calc(100vh - var(--bar));overflow:auto;padding:24px 12px 40px 20px;border-right:1px solid var(--rule);font-family:var(--sans);font-size:15px;line-height:1.35;background:var(--bg)}
nav.toc h2{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 10px 8px}
nav.toc ol{list-style:none;margin:0;padding:0}
nav.toc a{display:flex;gap:10px;padding:6px 8px;border-radius:6px;color:var(--text);text-decoration:none}
nav.toc a span{color:var(--muted);font-variant-numeric:tabular-nums;min-width:2.4em}
nav.toc a:hover{background:var(--accent-soft)}
nav.toc a.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav.toc a.active span{color:var(--accent)}
@media (max-width:1000px){
  .layout{grid-template-columns:1fr}
  #tocBtn{display:inline-flex}
  nav.toc{position:fixed;left:0;top:var(--bar);width:min(300px,85vw);z-index:25;transform:translateX(-105%);transition:transform .2s;box-shadow:none}
  nav.toc.open{transform:none;box-shadow:8px 0 30px rgba(0,0,0,.18)}
}

/* article: text column + wide figures */
main{padding:40px 24px 120px}
article{display:grid;grid-template-columns:1fr min(var(--measure),100%) 1fr}
article>*{grid-column:2}
article>.wide{grid-column:1/-1;justify-self:center;width:min(840px,100%)}
h1,h2,h3{font-family:var(--sans);line-height:1.2;font-weight:700;letter-spacing:-.01em}
h1{font-size:calc(var(--fs)*2.3);margin:.2em 0 .3em}
.lede{font-size:calc(var(--fs)*1.15);color:var(--muted);margin-top:0}
.byline{font-family:var(--sans);font-size:14px;color:var(--muted);margin-bottom:2.5em}
section.chap{margin-top:3.5em;padding-top:1.5em;border-top:1px solid var(--rule)}
h2{font-size:calc(var(--fs)*1.6);margin:0 0 .6em;display:flex;gap:.55em;align-items:baseline}
h2 .num{color:var(--accent);font-variant-numeric:tabular-nums;font-weight:600}
h3{font-size:calc(var(--fs)*1.08);margin:1.8em 0 .5em}
p,ul,ol{margin:0 0 1em}
li{margin:.25em 0}
code{font-family:var(--mono);font-size:.84em;background:var(--code-bg);padding:.1em .35em;border-radius:4px}
strong{font-weight:600}
dl.notation{margin:0 0 1.2em;display:grid;grid-template-columns:auto 1fr;gap:.45em 1.1em}
dl.notation dt{font-family:var(--sans);font-weight:600;font-size:.92em}
dl.notation dd{margin:0}
@media (max-width:560px){dl.notation{grid-template-columns:1fr}dl.notation dd{margin-bottom:.5em}}

table{border-collapse:collapse;width:100%;font-size:.88em;font-family:var(--sans);line-height:1.4;margin:0 0 1.4em}
th,td{text-align:left;padding:.55em .7em;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-weight:600;color:var(--muted);border-bottom:2px solid var(--rule)}
.tablewrap{overflow-x:auto}

pre{background:var(--code-bg);border-radius:8px;padding:16px 18px;overflow-x:auto;font-family:var(--mono);font-size:14px;line-height:1.55;margin:0 0 1.4em}
pre code{background:none;padding:0;font-size:inherit}
pre .k{color:var(--accent);font-weight:600}
pre .s{color:var(--ok)}
pre .c{color:var(--muted);font-style:italic}
pre .t{color:var(--bad)}
.codehead{font-family:var(--sans);font-size:13px;color:var(--muted);margin:-.3em 0 .4em}

.aside{border-left:3px solid var(--accent);padding:.2em 0 .2em 1em;margin:0 0 1.4em;font-size:.95em}
.aside b{font-family:var(--sans)}
.pitfalls{border-left:3px solid var(--bad)}

/* figures */
figure{margin:1.6em 0 2em}
.plate{background-color:var(--d-bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:20px 20px;border:1px solid var(--rule);border-radius:10px;padding:14px;overflow-x:auto}
figcaption{font-family:var(--sans);font-size:14px;color:var(--muted);margin-top:.6em;line-height:1.45}
figcaption b{color:var(--text)}
.dg{display:block;width:100%;min-width:600px;height:auto}
.dg text{fill:var(--text);font-family:var(--sans);font-size:13px}
.dg .m{font-size:12.5px}
.dg .sm{font-size:11.5px;fill:var(--muted)}
.dg .sm2{font-size:11.5px}
.dg .hd{font-weight:600}
.dg .it{font-style:italic}
.dg .b{fill:var(--d-fill);stroke:var(--d-line);stroke-width:1.4}
.dg .b2{fill:var(--d-bg);stroke:var(--d-line);stroke-width:1.4}
.dg .dashb{fill:var(--d-fill);stroke:var(--d-line);stroke-width:1.4;stroke-dasharray:6 4}
.dg .grp{fill:var(--accent-soft);fill-opacity:.45;stroke:var(--d-line);stroke-width:1;stroke-dasharray:4 4}
.dg .acc{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2}
.dg .l{fill:none;stroke:var(--d-line);stroke-width:1.4}
.dg .d{fill:none;stroke:var(--d-line);stroke-width:1.4;stroke-dasharray:6 4}
.dg .dot-line{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-dasharray:2 4}
.dg .solid{fill:var(--d-line);stroke:none}
.dg .hit{fill:none;stroke:transparent;stroke-width:14;pointer-events:stroke}
.dg .tip{cursor:help;outline:none}
.dg .tip:hover>.b,.dg .tip:hover>.dashb,.dg .tip:focus-visible>.b{stroke:var(--accent);stroke-width:2}
.dg .tip:hover>.l,.dg .tip:hover>.d,.dg .tip:focus-visible>.l,.dg .tip:focus-visible>.d{stroke:var(--accent)}
.dg a{cursor:pointer}
.dg a:hover .b{fill:var(--accent-soft);stroke:var(--accent)}
.mk-fill{fill:var(--d-line)}
.mk-line{fill:none;stroke:var(--d-line);stroke-width:1.4}
.mk-hollow{fill:var(--d-fill);stroke:var(--d-line);stroke-width:1.4}
.mk-acc{fill:var(--accent)}
.mk-acc-line{fill:none;stroke:var(--accent);stroke-width:2}

/* sequence stepper */
.dg .msg{transition:opacity .25s}
.dg .msg.future{opacity:.13}
.dg .msg.now path.l,.dg .msg.now path.d{stroke:var(--accent);stroke-width:2.2}
.dg .msg.now text{fill:var(--accent);font-weight:600}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px;font-family:var(--sans)}
.btn{font:600 14px var(--sans);color:var(--text);background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:7px 12px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.note{font-family:var(--sans);font-size:15px;line-height:1.5;margin-top:10px;padding:10px 14px;border-radius:8px;background:var(--surface);border:1px solid var(--rule);min-height:3em}
.note b{color:var(--accent)}

/* state machine sim */
.dg .cur>rect.b{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2.4}
.dg .cur>text{fill:var(--accent);font-weight:600}
.dg .live>rect.grp{stroke:var(--accent);stroke-width:1.6;fill-opacity:.9}
.events{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.events .btn{font-family:var(--mono);font-size:13px;font-weight:400}
.log{font-family:var(--mono);font-size:13px;color:var(--muted);margin-top:8px;max-height:7.5em;overflow:auto}
.log div{padding:1px 0}
.log .ok{color:var(--ok)}
.log .no{color:var(--bad)}

/* tooltip */
#tip{position:fixed;z-index:60;max-width:300px;pointer-events:none;background:var(--text);color:var(--bg);font:14px/1.45 var(--sans);padding:8px 11px;border-radius:7px;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s}
#tip.show{opacity:1;transform:none}
.hint{font-family:var(--sans);font-size:14px;color:var(--muted)}

/* quiz */
.q{border:1px solid var(--rule);border-radius:10px;padding:16px 18px;margin:0 0 14px;background:var(--surface)}
.q p{margin:0 0 .7em;font-weight:600;font-family:var(--sans);font-size:.95em}
.q .opts{display:grid;gap:6px}
.q button{font:15px/1.4 var(--sans);text-align:left;color:var(--text);background:var(--bg);border:1px solid var(--rule);border-radius:8px;padding:9px 12px;cursor:pointer}
.q button:hover:not(:disabled){border-color:var(--accent)}
.q button.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.q button.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.q .why{font-family:var(--sans);font-size:14.5px;margin-top:.7em;color:var(--muted)}
.score{font-family:var(--sans);font-weight:600}

/* settings panel */
.panel{position:fixed;top:calc(var(--bar) + 8px);right:16px;z-index:50;width:min(340px,calc(100vw - 24px));background:var(--surface);color:var(--text);border:1px solid var(--rule);border-radius:12px;box-shadow:0 18px 50px rgba(0,0,0,.2);padding:18px;font-family:var(--sans);font-size:15px}
.panel[hidden]{display:none}
.panel h2{font-size:16px;margin:0 0 14px;display:flex;justify-content:space-between;align-items:center}
.panel h2 button{background:none;border:none;color:var(--muted);font-size:22px;line-height:1;cursor:pointer;padding:2px 6px;border-radius:6px}
.prow{margin:0 0 16px}
.prow>.lab{display:flex;justify-content:space-between;color:var(--muted);font-size:13.5px;margin-bottom:7px}
.prow>.lab output{color:var(--text);font-variant-numeric:tabular-nums}
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sw{border:2px solid var(--rule);border-radius:10px;padding:8px 4px 6px;cursor:pointer;font:600 12.5px var(--sans);display:flex;flex-direction:column;align-items:center;gap:5px}
.sw i{display:block;width:30px;height:20px;border-radius:5px;font:600 13px/20px var(--serif);font-style:normal;text-align:center}
.sw[aria-checked="true"]{border-color:var(--accent)}
.sw.paper{background:#fbfbf9;color:#1e232c}.sw.paper i{background:#fff;border:1px solid #d9dce1}
.sw.sepia{background:#f3e9d4;color:#3b2f22}.sw.sepia i{background:#f9f1df;border:1px solid #d8c7a5}
.sw.mist{background:#e7ebef;color:#222a38}.sw.mist i{background:#f2f4f6;border:1px solid #c6ced7}
.sw.night{background:#14171c;color:#d9dde4}.sw.night i{background:#1f242c;border:1px solid #39404b}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--rule);border-radius:9px;overflow:hidden}
.seg button{border:none;background:transparent;color:var(--text);padding:9px;cursor:pointer;font-size:16px}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-checked="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.seg .f-serif{font-family:var(--serif)}
.seg .f-sans{font-family:var(--sans)}
.slider{display:flex;align-items:center;gap:10px}
.slider button{flex:none;width:32px;height:32px;border:1px solid var(--rule);background:var(--bg);color:var(--text);border-radius:8px;cursor:pointer;font:600 14px var(--sans)}
.slider input{flex:1;accent-color:var(--accent)}
.reset{width:100%;margin-top:4px;padding:10px;border-radius:9px;border:1px solid var(--rule);background:var(--bg);color:var(--text);font:600 14px var(--sans);cursor:pointer}
.reset:hover{border-color:var(--bad);color:var(--bad)}
.scrim{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.25)}
.scrim[hidden]{display:none}

.src{display:inline-block;font:600 12px/1.7 var(--sans);padding:0 7px;border-radius:5px;margin-right:7px;vertical-align:1px}
.src.book{background:var(--accent-soft);color:var(--accent)}
.src.ill{background:var(--code-bg);color:var(--muted)}
.dg .acc-l{fill:none;stroke:var(--accent);stroke-width:1.6}
.dg .uc-dim{opacity:.16}
.dg [data-actors],.dg [data-line],.dg [data-actor]{transition:opacity .2s}
.dg .hl>ellipse.b{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2.2}
.dg .hl>text{fill:var(--accent);font-weight:600}
.dg .hl>path.l,.dg .hl>path.acc-l{stroke:var(--accent);stroke-width:2.4}
.dg .cur>circle.l{stroke:var(--accent);stroke-width:2.6}
.dg .cur>circle.solid{fill:var(--accent)}
.dg .phase{cursor:pointer}
.dg .phase:hover>rect.b{stroke:var(--accent);stroke-width:2}
.dg .phase.sel>rect.b{fill:var(--accent);stroke:var(--accent)}
.dg .phase.sel>text{fill:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

/* --- contents toggle on desktop --- */
@media (min-width:1001px){
  .layout.toc-collapsed{grid-template-columns:minmax(0,1fr)}
  .layout.toc-collapsed nav.toc{display:none}
}
/* --- diagram header: name + full screen --- */
.dgbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 8px;font-family:var(--sans)}
.dgkind{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--accent)}
.dgkind small{font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted);font-size:13px;margin-left:6px}
.fsbtn{font:600 13px var(--sans);color:var(--text);background:var(--surface);border:1px solid var(--rule);border-radius:7px;padding:5px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.fsbtn:hover{border-color:var(--accent);color:var(--accent)}
.fsbtn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2}
figure.is-fs{background:var(--bg);margin:0;padding:20px 24px;overflow:auto;display:flex;flex-direction:column;width:100%!important;max-width:none}
figure.is-fs .plate{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
figure.is-fs .dg{width:100%;height:100%;max-height:calc(100vh - 110px);min-width:0}
figure.is-fs:has(.controls) .dg,figure.is-fs:has(.events) .dg{max-height:calc(100vh - 290px)}
figure.is-fs figcaption{display:none}
figure.fs-fallback{position:fixed;inset:0;z-index:100;height:100vh}
body.fs-lock{overflow:hidden}

.checkcols{display:grid;grid-template-columns:1fr 1fr;gap:6px 20px;margin-top:12px;font-family:var(--sans);font-size:14.5px;line-height:1.35}
.checkcols h4{margin:4px 0;font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.checkcols label{display:flex;gap:8px;align-items:flex-start;padding:4px 6px;border-radius:6px;cursor:pointer}
.checkcols label:hover{background:var(--accent-soft)}
.checkcols input{accent-color:var(--accent);margin-top:3px;flex:none}
@media (max-width:640px){.checkcols{grid-template-columns:1fr}}
#contMarker{transition:transform .35s ease}
.dg .cell{transition:opacity .2s}
.dg .cell.cur>rect.b{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2.4}
.dg .cell.cur>text{fill:var(--text);font-weight:400}
.dg .cell.cur>text.hd{fill:var(--accent);font-weight:600}
.dg .cell.peek>rect.b{stroke:var(--accent);stroke-width:2;stroke-dasharray:6 4}
.dg .cell.dim{opacity:.3}
.dg .act{cursor:pointer}
.dg .act:hover>rect.b{stroke:var(--accent);stroke-width:2}
.dg .act.sel>rect.b{fill:var(--accent);stroke:var(--accent)}
.dg .act.sel>text{fill:var(--bg)}
[data-dg="refine"].stage-b .v-before,[data-dg="refine"]:not(.stage-b) .v-after{display:none}

/* ---------- library shell ---------- */
nav.toc .book{margin:0 0 18px}
nav.toc .bookttl{font-weight:700;font-size:14px;line-height:1.3;padding:6px 8px 8px}
nav.toc .bookttl span{display:block;font-weight:400;color:var(--muted);font-size:12.5px;margin-top:3px}
nav.toc a.chap-link span{color:var(--muted)}
nav.toc a.chap-link.current{font-weight:700;color:var(--accent);background:transparent}
nav.toc a.chap-link.current span{color:var(--accent)}
nav.toc ol.secs{margin:2px 0 10px 16px;padding-left:6px;border-left:1px solid var(--rule)}
nav.toc ol.secs a{font-size:14px;padding:4px 8px}
.kicker{font-family:var(--sans);font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin:0}
.chapnav{display:flex;gap:12px;margin-top:3.5em;padding-top:1.5em;border-top:1px solid var(--rule);font-family:var(--sans)}
.chapnav a{display:block;text-decoration:none;border:1px solid var(--rule);border-radius:10px;padding:12px 16px;max-width:48%;color:var(--text);line-height:1.35}
.chapnav a small{display:block;color:var(--muted);font-size:13px;margin-bottom:2px}
.chapnav a:hover{border-color:var(--accent)}
.chapnav .next{margin-left:auto;text-align:right}
</style>
</head>
<body>
<!-- shared SVG markers -->

<!-- ============ SHELL (shared by every chapter) ============ -->
<script>
(function(){
"use strict";
/* ---------- reading settings ---------- */
const KEY = "uml-crash-course-settings";
const sysDark = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
const DEF = { theme: sysDark ? "night" : "paper", font: "serif", size: 18, lh: 1.65, width: 680 };
let S = Object.assign({}, DEF);
try { const saved = JSON.parse(localStorage.getItem(KEY) || "null"); if (saved) S = Object.assign(S, saved); } catch (e) {}
const root = document.documentElement;
const $ = id => document.getElementById(id);

function apply(){
  root.dataset.theme = S.theme;
  root.dataset.font = S.font;
  root.style.setProperty("--fs", S.size + "px");
  root.style.setProperty("--lh", S.lh);
  root.style.setProperty("--measure", S.width + "px");
  document.querySelectorAll(".sw").forEach(b => b.setAttribute("aria-checked", b.dataset.theme === S.theme));
  document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-checked", b.dataset.font === S.font));
  $("rSize").value = S.size; $("oSize").textContent = S.size + " px";
  $("rLh").value = S.lh; $("oLh").textContent = Number(S.lh).toFixed(2);
  $("rW").value = S.width; $("oW").textContent = S.width + " px";
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
}
document.querySelectorAll(".sw").forEach(b => b.addEventListener("click", () => { S.theme = b.dataset.theme; apply(); }));
document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => { S.font = b.dataset.font; apply(); }));
const map = { rSize: "size", rLh: "lh", rW: "width" };
Object.keys(map).forEach(id => $(id).addEventListener("input", e => { S[map[id]] = parseFloat(e.target.value); apply(); }));
document.querySelectorAll("[data-step]").forEach(b => b.addEventListener("click", () => {
  const [id, d] = b.dataset.step.split(":"); const el = $(id);
  const v = Math.min(parseFloat(el.max), Math.max(parseFloat(el.min), parseFloat(el.value) + parseFloat(d)));
  S[map[id]] = Math.round(v * 100) / 100; apply();
}));
$("reset").addEventListener("click", () => { S = Object.assign({}, DEF); try { localStorage.removeItem(KEY); } catch (e) {} apply(); });
apply();

const panel = $("panel"), setBtn = $("setBtn");
function openPanel(open){
  panel.hidden = !open; setBtn.setAttribute("aria-expanded", open);
  if (open) panel.querySelector(".sw[aria-checked='true']").focus();
}
setBtn.addEventListener("click", () => openPanel(panel.hidden));
$("panelClose").addEventListener("click", () => { openPanel(false); setBtn.focus(); });
document.addEventListener("click", e => { if (!panel.hidden && !panel.contains(e.target) && !setBtn.contains(e.target)) openPanel(false); });


/* ---------- sidebar (library + chapter sections) ---------- */
const toc = $("toc"), tocBtn = $("tocBtn"), scrim = $("scrim");
function openToc(open){ toc.classList.toggle("open", open); tocBtn.setAttribute("aria-expanded", open); scrim.hidden = !open; }
scrim.addEventListener("click", () => openToc(false));
document.addEventListener("keydown", e => { if (e.key === "Escape") { if (!panel.hidden) { openPanel(false); setBtn.focus(); } if (!isDesk()) { openToc(false); syncTocBtn(); } } });

let spyLinks = [], spySecs = [];
function onScroll(){
  const h = document.documentElement;
  $("progress").style.width = (h.scrollTop / Math.max(1, h.scrollHeight - h.clientHeight) * 100) + "%";
  let idx = 0;
  spySecs.forEach((s, i) => { if (s && s.getBoundingClientRect().top < window.innerHeight * 0.3) idx = i; });
  spyLinks.forEach((a, i) => a.classList.toggle("active", i === idx));
}
window.addEventListener("scroll", onScroll, { passive: true });

/* in-page anchors scroll; #c-… anchors switch chapter */
document.addEventListener("click", e => {
  const a = e.target.closest && e.target.closest("a"); if (!a) return;
  const href = a.getAttribute("href") || "";
  if (!href.startsWith("#") || href.startsWith("#c-") || href === "#") return;
  const el = document.getElementById(href.slice(1)); if (!el) return;
  e.preventDefault(); el.scrollIntoView({ behavior: "smooth", block: "start" });
  if (!isDesk()) { openToc(false); syncTocBtn(); }
});

/* ---------- code highlighting ---------- */
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
function highlight(root){
  const KW = "const|let|function|async|await|return|if|else|switch|case|default|type|interface|class|implements|extends|private|public|abstract|new|constructor";
  const SQLKW = "select|from|where|join|left|right|inner|outer|on|as|insert|into|values|update|set|delete|create|alter|drop|table|view|index|primary|foreign|key|references|not|null|unique|default|check|constraint|and|or|in|is|group|by|order|having|limit|distinct|count|sum|avg|min|max|int|integer|varchar|char|text|date|datetime|decimal|boolean|cascade";
  root.querySelectorAll("pre code.ts, pre code.sql").forEach(el => {
    const sql = el.classList.contains("sql");
    const re = sql
      ? new RegExp(String.raw`(--[^\n]*|\/\*[\s\S]*?\*\/)|('(?:[^']|'')*')|\b(` + SQLKW + String.raw`)\b`, "gi")
      : /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|\b(const|let|function|async|await|return|if|else|switch|case|default|type|interface|class|implements|extends|private|public|abstract|new|constructor)\b|\b([A-Z][A-Za-z0-9]*)\b/g;
    const src = el.textContent; let out = "", last = 0, m;
    while ((m = re.exec(src))) {
      out += esc(src.slice(last, m.index));
      const c = m[1] ? "c" : m[2] ? "s" : m[3] ? "k" : (sql ? "" : "t");
      out += c ? `<span class="${c}">${esc(m[0])}</span>` : esc(m[0]); last = re.lastIndex;
    }
    el.innerHTML = out + esc(src.slice(last));
  });
}

/* ---------- SVG helpers ---------- */
const T = (x,y,s,c="",a="middle",extra="") => `<text x="${x}" y="${y}" text-anchor="${a}" class="${c}" ${extra}>${esc(s)}</text>`;
const R = (x,y,w,h,c="b",rx=4) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" class="${c}"/>`;
const P = (d,c="l",me="") => `<path d="${d}" class="${c}"${me ? ` marker-end="url(#${me})"` : ""}/>`;
const HIT = d => `<path d="${d}" class="hit"/>`;
const G = (tip,inner,attrs="") => `<g class="tip" tabindex="0" data-tip="${esc(tip)}" ${attrs}>${inner}</g>`;
const REL = (tip,d,c,me,extra="") => G(tip, P(d,c,me) + HIT(d) + extra);
const SVG = (w,h,label,inner) => `<svg viewBox="0 0 ${w} ${h}" class="dg" role="img" aria-label="${esc(label)}">${inner}</svg>`;
const dot = (x,y,r=8) => `<circle cx="${x}" cy="${y}" r="${r}" class="solid"/>`;
const fin = (x,y) => `<circle cx="${x}" cy="${y}" r="10" class="l"/><circle cx="${x}" cy="${y}" r="6" class="solid"/>`;
const diamond = (cx,cy,h=20) => `<path d="M${cx} ${cy-h}L${cx+h} ${cy}L${cx} ${cy+h}L${cx-h} ${cy}Z" class="b"/>`;

function pkg(x,y,w,h,name,items,tip){
  let s = `<path d="M${x} ${y}V${y-16}H${x+64}V${y}Z" class="b"/>` + R(x,y,w,h,"b",2) + T(x+12,y+23,name,"hd","start");
  items.forEach((it,i) => s += T(x+12,y+45+17*i,it,"m","start"));
  return G(tip,s);
}
function comp(x,y,w,h,name,tip){
  const ix = x+w-24, iy = y+8;
  return G(tip, R(x,y,w,h,"b",3) +
    `<rect x="${ix}" y="${iy}" width="14" height="18" class="b2"/><rect x="${ix-4}" y="${iy+3}" width="8" height="4" class="b2"/><rect x="${ix-4}" y="${iy+11}" width="8" height="4" class="b2"/>` +
    T(x+w/2-8,y+h/2-4,"«component»","sm") + T(x+w/2-8,y+h/2+14,name,"hd"));
}
function node3d(x,y,w,h,stereo,name,tip,d=12){
  return G(tip,
    `<path d="M${x} ${y+d}L${x+d} ${y}H${x+w}L${x+w-d} ${y+d}Z" class="b2"/><path d="M${x+w-d} ${y+d}L${x+w} ${y}V${y+h-d}L${x+w-d} ${y+h}Z" class="b2"/>` +
    R(x,y+d,w-d,h-d,"b",0) + T(x+(w-d)/2,y+d+18,`«${stereo}»`,"sm") + T(x+(w-d)/2,y+d+35,name,"hd"));
}
function artifact(x,y,w,name,tip){
  return G(tip, R(x,y,w,26,"b",2) + `<path d="M${x+9} ${y+5}h8l4 4v12h-12z" class="l"/>` + T(x+30,y+18,name,"m","start"));
}
function actor(x,y,name,tip){
  return G(tip, `<circle cx="${x}" cy="${y-30}" r="9" class="b"/><path d="M${x} ${y-21}V${y+4}M${x-15} ${y-11}H${x+15}M${x} ${y+4}L${x-12} ${y+26}M${x} ${y+4}L${x+12} ${y+26}" class="l"/>` + T(x,y+44,name,"hd"));
}
function usecase(cx,cy,rx,label,tip){
  return G(tip, `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="24" class="b"/>` + T(cx,cy+4,label));
}
function action(x,y,w,label,tip){
  return G(tip, R(x,y,w,36,"b",16) + T(x+w/2,y+22,label,"m"));
}
function cls(x,y,w,o){
  const h0 = o.stereo ? 40 : 28;
  const ah = o.hideAttrs ? 0 : (o.attrs && o.attrs.length ? 8 + 18*o.attrs.length : 10);
  const oh = o.hideOps ? 0 : (o.ops && o.ops.length ? 8 + 18*o.ops.length : 10);
  let s = R(x,y,w,h0+ah+oh,"b",3);
  if (o.stereo) s += T(x+w/2,y+16,`«${o.stereo}»`,"sm");
  s += T(x+w/2,y+(o.stereo?33:19),o.name,"hd"+(o.italic?" it":""));
  let cy = y+h0;
  if (ah || oh) s += P(`M${x} ${cy}H${x+w}`);
  if (ah) { (o.attrs||[]).forEach((a,i) => s += T(x+10,cy+22+18*i,a,"m","start")); cy += ah; if (oh) s += P(`M${x} ${cy}H${x+w}`); }
  (o.ops||[]).forEach((op,i) => s += T(x+10,cy+22+18*i,op,"m","start"));
  return G(o.tip, s);
}
function obj(x,y,w,name,slots,tip){
  const h = 28 + 8 + 18*slots.length;
  let s = R(x,y,w,h,"b",3) + T(x+w/2,y+19,name,"hd","middle",'text-decoration="underline"') + P(`M${x} ${y+28}H${x+w}`);
  slots.forEach((sl,i) => s += T(x+10,y+50+18*i,sl,"m","start"));
  return G(tip,s);
}
function frame(x,y,w,h,tag,tagW,name){
  let s = `<rect x="${x}" y="${y}" width="${w}" height="${h}" class="l"/>` +
    `<path d="M${x} ${y}H${x+tagW}V${y+12}L${x+tagW-8} ${y+20}H${x}Z" class="b2"/>` + T(x+7,y+15,tag,"sm2 hd","start");
  if (name) s += T(x+w/2,y+h/2+10,name,"hd");
  return s;
}


function entity(x,y,w,name,cols,tip){
  const h = 36 + 18*cols.length;
  let s = R(x,y,w,h,"b",3) + `<rect x="${x}" y="${y}" width="${w}" height="28" rx="3" class="b2"/>` + T(x+w/2,y+19,name,"hd") + P(`M${x} ${y+28}H${x+w}`);
  cols.forEach((c,i) => { const pk = /^PK\b/.test(c); s += T(x+10,y+50+18*i,c,"m"+(pk?" hd":""),"start", pk ? 'text-decoration="underline"' : ""); });
  return G(tip,s);
}

/* ---------- tooltips ---------- */
const tip = $("tip");
function showTip(g, x, y){
  tip.textContent = g.dataset.tip; tip.classList.add("show");
  const r = tip.getBoundingClientRect();
  let left = x + 14, top = y + 16;
  if (left + r.width > innerWidth - 8) left = x - r.width - 14;
  if (top + r.height > innerHeight - 8) top = y - r.height - 12;
  tip.style.left = Math.max(8,left) + "px"; tip.style.top = Math.max(8,top) + "px";
}
function hideTip(){ tip.classList.remove("show"); }
document.addEventListener("pointermove", e => { const g = e.target.closest && e.target.closest(".dg .tip"); if (g) showTip(g, e.clientX, e.clientY); else hideTip(); });
document.addEventListener("focusin", e => { const g = e.target.closest && e.target.closest(".dg .tip"); if (g) { const r = g.getBoundingClientRect(); showTip(g, r.left + r.width/2, r.bottom); } });
document.addEventListener("focusout", hideTip);
window.addEventListener("scroll", hideTip, { passive: true });


/* ---------- contents toggle (desktop and mobile) ---------- */
const layoutEl = document.querySelector(".layout");
const isDesk = () => window.innerWidth > 1000;
let tocCollapsed = false;
try { tocCollapsed = localStorage.getItem("ooad-toc-collapsed") === "1"; } catch (e) {}
function syncTocBtn(){
  const shown = isDesk() ? !tocCollapsed : toc.classList.contains("open");
  tocBtn.setAttribute("aria-expanded", shown);
  tocBtn.title = shown ? "Hide contents" : "Show contents";
  tocBtn.setAttribute("aria-label", tocBtn.title);
}
function applyCollapse(){ layoutEl.classList.toggle("toc-collapsed", tocCollapsed); syncTocBtn(); }
tocBtn.addEventListener("click", () => {
  if (isDesk()) {
    tocCollapsed = !tocCollapsed;
    try { localStorage.setItem("ooad-toc-collapsed", tocCollapsed ? "1" : "0"); } catch (e) {}
    applyCollapse();
  } else { openToc(!toc.classList.contains("open")); syncTocBtn(); }
});
window.addEventListener("resize", () => { if (isDesk()) openToc(false); syncTocBtn(); });
applyCollapse();


/* ---------- diagram names + full screen ---------- */
const FS_ICON = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg>';
const EXIT_ICON = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 2v4H2M14 6h-4V2M10 14v-4h4M2 10h4v4"/></svg>';
let fsFig = null;
function setFsButton(fig, on){
  const b = fig.querySelector(".fsbtn");
  b.innerHTML = (on ? EXIT_ICON + "Exit full screen" : FS_ICON + "Full screen");
  b.setAttribute("aria-pressed", on);
}
function enterFs(fig){
  fsFig = fig; fig.classList.add("is-fs"); fig.appendChild(tip); setFsButton(fig, true);
  if (fig.requestFullscreen) fig.requestFullscreen().catch(() => { fig.classList.add("fs-fallback"); document.body.classList.add("fs-lock"); });
  else if (fig.webkitRequestFullscreen) fig.webkitRequestFullscreen();
  else { fig.classList.add("fs-fallback"); document.body.classList.add("fs-lock"); }
}
function leaveFs(){
  if (!fsFig) return;
  const fig = fsFig; fsFig = null;
  fig.classList.remove("is-fs","fs-fallback"); document.body.classList.remove("fs-lock");
  document.body.appendChild(tip); hideTip(); setFsButton(fig, false);
  if (document.fullscreenElement) document.exitFullscreen();
  else if (document.webkitFullscreenElement) document.webkitExitFullscreen();
}
document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement && fsFig && !fsFig.classList.contains("fs-fallback")) leaveFs(); });
document.addEventListener("webkitfullscreenchange", () => { if (!document.webkitFullscreenElement && fsFig && !fsFig.classList.contains("fs-fallback")) leaveFs(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && fsFig) leaveFs(); });


function decorate(kinds){
  document.querySelectorAll("figure .plate[data-dg]").forEach(plate => {
    const info = (kinds || {})[plate.dataset.dg]; if (!info) return;
    const fig = plate.closest("figure");
    const bar = document.createElement("div"); bar.className = "dgbar";
    bar.innerHTML = `<span class="dgkind">${esc(info[0])}${info[1] ? `<small>${esc(info[1])}</small>` : ""}</span><button class="fsbtn" type="button"></button>`;
    fig.insertBefore(bar, plate);
    setFsButton(fig, false);
    bar.querySelector(".fsbtn").addEventListener("click", () => fsFig === fig ? leaveFs() : enterFs(fig));
  });
}

/* ---------- library: books, chapters, routing ---------- */
const BOOKS = [], CHAPTERS = [];
const K = { $, esc, T, R, P, HIT, G, REL, SVG, dot, fin, diamond, pkg, comp, node3d, artifact, actor, usecase, action, cls, obj, frame, entity };
const LAST = "course-library-last-chapter";
function ordered(){
  return CHAPTERS.slice().sort((a,b) => {
    const ba = BOOKS.findIndex(x => x.id === a.book), bb = BOOKS.findIndex(x => x.id === b.book);
    return ba - bb || a.num - b.num;
  });
}
function buildNav(cur){
  let h = `<h2>Library</h2>`;
  BOOKS.forEach(b => {
    const chs = ordered().filter(c => c.book === b.id); if (!chs.length) return;
    h += `<div class="book"><div class="bookttl">${esc(b.title)}<span>${esc(b.author)}${b.note ? " · " + esc(b.note) : ""}</span></div><ol>`;
    chs.forEach(c => {
      const on = c.id === cur.id;
      h += `<li><a class="chap-link${on ? " current" : ""}" href="#c-${c.id}"${on ? ' aria-current="page"' : ""}><span>${c.num}</span>${esc(c.title)}</a>`;
      if (on) h += `<ol class="secs">` + c.toc.map(([href,n,l]) => `<li><a href="${href}"><span>${esc(n)}</span>${esc(l)}</a></li>`).join("") + `</ol>`;
      h += `</li>`;
    });
    h += `</ol></div>`;
  });
  toc.innerHTML = h;
  spyLinks = [...toc.querySelectorAll("ol.secs a")];
  spySecs = spyLinks.map(a => document.getElementById(a.getAttribute("href").slice(1)));
}
function render(id){
  const list = ordered();
  const ch = list.find(c => c.id === id) || list[0];
  if (!ch) { $("main").innerHTML = `<article><h1>Your course library</h1><p class="lede">No chapters yet. Add a chapter block before the “ADD NEW CHAPTERS” marker.</p></article>`; buildNav({}); return; }
  if (fsFig) leaveFs();
  hideTip();
  const book = BOOKS.find(b => b.id === ch.book) || { title:"", short:"" };
  const i = list.indexOf(ch), prev = list[i-1], next = list[i+1];
  const link = (c, cls, lab) => c ? `<a class="${cls}" href="#c-${c.id}"><small>${lab}</small>${esc((BOOKS.find(b => b.id === c.book)||{}).short || "")} ${c.num}: ${esc(c.title)}</a>` : "";
  const main = $("main");
  main.innerHTML = `<article><p class="kicker">${esc(book.short || book.title)} · Chapter ${ch.num}</p>` +
    document.getElementById("tpl-" + ch.id).innerHTML +
    `<nav class="chapnav" aria-label="Chapters">${link(prev,"prev","← Previous")}${link(next,"next","Next →")}</nav></article>`;
  $("hdrTitle").textContent = `Chapter ${ch.num}: ${ch.title}`;
  $("hdrSub").textContent = book.title;
  document.title = `${book.short || book.title} ${ch.num}: ${ch.title}`;
  buildNav(ch);
  try { highlight(main); } catch (err) { console.error("highlight failed:", err); }
  let kinds = {};
  try { kinds = ch.run(K) || {}; } catch (err) { console.error("Chapter " + ch.id + " failed:", err); }
  decorate(kinds);
  try { localStorage.setItem(LAST, ch.id); } catch (e) {}
  window.scrollTo(0, 0); onScroll();
}
window.addEventListener("hashchange", () => { if (location.hash.startsWith("#c-")) render(location.hash.slice(3)); });

window.CourseKit = {

    if (!id) { try { id = localStorage.getItem(LAST); } catch (e) {} }

  }
};

<template id="tpl-ooad-05">
  <h1>Reading UML in an afternoon</h1>
  <p class="lede">A crash course on the 13 diagram types in Chapter 5 of <em>Object-Oriented Analysis and Design with Applications</em>, each drawn for the same web shop so you can see how the views fit together.</p>
  <p class="byline">Hover or tap any part of a diagram to see what it means. Two diagrams are interactive: step through the sequence diagram and fire events at the state machine.</p>

  <!-- 5.1 -->
  <section class="chap" id="s5-1">
    <h2><span class="num">5.1</span>The Unified Modeling Language</h2>
    <p>UML is a standard visual language for describing software: what it is made of and how it behaves. Booch, Rumbaugh and Jacobson merged their competing notations into UML in the late 1990s. The book uses UML 2.0, which defines 13 diagram types.</p>
    <p>A <strong>model</strong> is a simplification of a system built for a purpose. A <strong>diagram</strong> is one view into that model. No diagram shows everything, and no project needs all 13. You pick the view that answers the question in front of you.</p>
  </section>
  <figure class="wide">
    <div class="plate" data-dg="overview"></div>
    <figcaption><b>Figure 5-1.</b> The 13 diagrams fall into two families. Interaction diagrams are a subset of behavioral ones. Click a diagram to jump to its section.</figcaption>
  </figure>
  <h3>The running example</h3>
  <p>Every diagram in this course describes <strong>ShopFast</strong>, an online store with a React front end, a Node API, PostgreSQL, and Stripe for payments. Seeing one system from 13 angles is the fastest way to understand what each angle is for.</p>
  <h3>Vocabulary used in every diagram</h3>
  <dl class="notation">
    <dt>Classifier</dt><dd>Anything that describes a set of instances: class, interface, component, actor, use case, node.</dd>
    <dt>Dependency</dt><dd>Dashed arrow. “Uses, and would be affected if the target changed.”</dd>
    <dt>Association</dt><dd>Solid line. “Knows about” in a lasting way.</dd>
    <dt>Generalization</dt><dd>Solid line with a hollow triangle at the parent. “Is a kind of.”</dd>
    <dt>Realization</dt><dd>Dashed line with a hollow triangle at the interface. “Implements.”</dd>
    <dt>Stereotype</dt><dd>A label in guillemets, like «interface» or «database», that specializes an element.</dd>
    <dt>Constraint</dt><dd>A rule in braces: <code>{ordered}</code>, <code>{total &gt; 0}</code>.</dd>
    <dt>Note</dt><dd>A dog-eared rectangle holding a comment, attached by a dashed line.</dd>
  </dl>
  <h3>The four architectural views</h3>
  <p>Booch frames UML around views of an architecture. The <strong>logical view</strong> (classes, packages) shows the design. The <strong>process view</strong> (activity, sequence, state) shows runtime behavior. The <strong>implementation view</strong> (components) shows how code is organized, and the <strong>deployment view</strong> (nodes) shows where it runs. Use cases tie the four together as the scenarios every view must support.</p>

  <!-- 5.2 -->
  <section class="chap" id="s5-2">
    <h2><span class="num">5.2</span>Package diagrams</h2>
    <p>A package diagram shows how a large model is split into groups and which groups depend on which. It answers one question: how is this system organized, and are the dependencies sane?</p>
    <dl class="notation">
      <dt>Package</dt><dd>A folder shape: a rectangle with a tab. Contents can be listed or drawn inside.</dd>
      <dt>Dependency</dt><dd>Dashed arrow from the package that uses to the package it needs.</dd>
      <dt>«import» / «access»</dt><dd>A dependency that brings names in publicly (re-exported) or privately.</dd>
      <dt>Qualified name</dt><dd><code>Ordering::Cart</code> means the Cart element inside the Ordering package.</dd>
      <dt>Visibility</dt><dd><code>+</code> public and <code>-</code> private, as with class members.</dd>
    </dl>
  </section>
  <figure class="wide">
    <div class="plate" data-dg="package"></div>
    <figcaption><b>Figure 5-2.</b> ShopFast’s layers. Every arrow points toward the stable Domain package, and nothing in Domain depends on React or Postgres.</figcaption>
  </figure>
  <h3>Design rules Booch emphasizes</h3>
  <ol>
    <li><strong>No cycles.</strong> If A depends on B and B on A, they are really one package. Break the cycle by extracting an interface package.</li>
    <li><strong>High cohesion inside, low coupling between.</strong> Things that change together live together.</li>
    <li><strong>Depend in the direction of stability.</strong> Volatile packages like UI depend on stable ones like Domain, never the reverse.</li>
  </ol>
  <div class="aside pitfalls"><b>Common mistakes.</b> Mirroring the folder tree instead of the logical design, and drawing every dependency until the picture is a hairball. Draw only the arrows that matter for your question.</div>
  <div class="aside"><b>Front-end tie-in.</b> In a monorepo, packages map neatly onto workspaces like <code>@shop/ui</code> and <code>@shop/domain</code>. Lint rules such as import boundaries are a package diagram enforced in CI.</div>

  <!-- 5.3 -->
  <section class="chap" id="s5-3">
    <h2><span class="num">5.3</span>Component diagrams</h2>
    <p>A component diagram shows the replaceable building blocks of a system and the interfaces each one offers and needs. A package groups design elements; a component is a unit of implementation you could swap out without touching its neighbours.</p>
    <dl class="notation">
      <dt>Component</dt><dd>A rectangle marked «component» or with the small two-pronged icon.</dd>
      <dt>Provided interface</dt><dd>A lollipop: a line ending in a circle. “I offer this.”</dd>
      <dt>Required interface</dt><dd>A socket: a line ending in a half-circle. “I need this.”</dd>
      <dt>Assembly connector</dt><dd>A lollipop sitting in a socket, wiring a provider to a consumer.</dd>
      <dt>Port</dt><dd>A small square on the border, a named interaction point that groups interfaces.</dd>
    </dl>
  </section>
  <figure class="wide">
    <div class="plate" data-dg="component"></div>
    <figcaption><b>Figure 5-3.</b> OrderService knows only the <code>IPayment</code> and <code>IOrderRepo</code> contracts. Replace PaymentAdapter to move from Stripe to PayPal and nothing else changes.</figcaption>
  </figure>
  <p>Use component diagrams to plan service boundaries, plugin points or micro-frontends, and to agree on contracts between teams before code exists. Show components as black boxes (interfaces only) for consumers, or as white boxes (inner parts visible) for the team that owns them.</p>
  <div class="aside pitfalls"><b>Common mistakes.</b> Treating every class as a component (components are coarse-grained), and leaving interfaces unnamed, which hides the very contract the diagram exists to show.</div>
  <div class="aside"><b>Fullstack tie-in.</b> A tRPC router is a provided interface, the client hook that calls it is a required one, and the shared router type is the assembly connector.</div>

  <!-- 5.4 -->
  <section class="chap" id="s5-4">
    <h2><span class="num">5.4</span>Deployment diagrams</h2>
    <p>A deployment diagram shows the physical runtime: which machines or environments exist, what software runs on each, and how they talk. It is the only UML diagram about infrastructure.</p>
    <dl class="notation">
      <dt>Node</dt><dd>A 3D box. A «device» is hardware; an «executionEnvironment» hosts software (a browser, a Node runtime, a container).</dd>
      <dt>Nesting</dt><dd>Nodes sit inside nodes: a container in a VM in a cloud region.</dd>
      <dt>Artifact</dt><dd>A concrete deployable file: <code>bundle.js</code>, <code>api.zip</code>, a Docker image.</dd>
      <dt>Communication path</dt><dd>A solid line between nodes, labelled with its protocol.</dd>
      <dt>«manifest»</dt><dd>Dashed arrow from an artifact to the component it implements.</dd>
    </dl>
  </section>
  <figure class="wide">
    <div class="plate" data-dg="deployment"></div>
    <figcaption><b>Figure 5-4.</b> Where ShopFast runs. The protocol on each path is often the most useful fact in the diagram.</figcaption>
  </figure>
  <p><strong>Specification vs instance level.</strong> A specification-level diagram says “a Lambda node and a Postgres node.” An instance-level diagram names real machines, such as <code>prod-db-1 : PostgreSQL</code>, underlined like objects. Use instance level in runbooks and incident write-ups.</p>
  <div class="aside"><b>Fullstack tie-in.</b> Infrastructure-as-code tools like SST already describe a deployment model. Drawing it once speeds up reviews and onboarding.</div>

  <!-- 5.5 -->
  <section class="chap" id="s5-5">
    <h2><span class="num">5.5</span>Use case diagrams</h2>
    <p>A use case diagram shows who uses the system and what goals they reach with it. It captures requirements from the outside, with no internal design at all.</p>
    <dl class="notation">
      <dt>Actor</dt><dd>A stick figure for a role played by a person or an external system: Customer, Admin, Stripe.</dd>
      <dt>Use case</dt><dd>An oval named with a goal that delivers value: “Place order,” never “Click button.”</dd>
      <dt>System boundary</dt><dd>A rectangle around the use cases. Actors stay outside it.</dd>
      <dt>«include»</dt><dd>Dashed arrow from the base to behavior that always runs as part of it.</dd>
      <dt>«extend»</dt><dd>Dashed arrow from optional behavior to the base it extends, under a condition.</dd>
      <dt>Generalization</dt><dd>Hollow triangle between actors (Admin is a kind of User) or use cases.</dd>
    </dl>
  </section>
  <figure class="wide">
    <div class="plate" data-dg="usecase"></div>
    <figcaption><b>Figure 5-5.</b> Placing an order always includes authentication; applying a coupon only sometimes extends it. Note that the «extend» arrow points at the base use case.</figcaption>
  </figure>
  <h3>The diagram is the index; the text is the content</h3>
  <p>Booch stresses that the diagram alone is thin. Each use case needs a written specification: actors, preconditions, a numbered main success scenario, alternate flows, and postconditions. For <em>Place order</em>:</p>
  <ol>
    <li>Customer reviews the cart.</li>
    <li>System shows the total, including tax and shipping.</li>
    <li>Customer enters payment details.</li>
    <li>System charges the card through Stripe.</li>
    <li>System confirms the order and emails a receipt.</li>
  </ol>
  <p><em>Alternate flow 4a:</em> the card is declined. The system shows the reason and returns to step 3.</p>
  <div class="aside pitfalls"><b>Common mistakes.</b> Functional decomposition (“Validate email field” is a step, not a goal), wiring «include» and «extend» until the diagram turns into a flowchart, and drawing the «extend» arrow backwards.</div>

  <!-- 5.6 -->
  <section class="chap" id="s5-6">
    <h2><span class="num">5.6</span>Activity diagrams</h2>
    <p>An activity diagram shows a flow of work: steps, decisions, parallel branches, and who does each step. Think of a flowchart with real semantics for concurrency. It suits business processes and the scenario inside a use case.</p>
    <dl class="notation">
      <dt>Initial / final</dt><dd>A filled dot starts the activity; a bullseye ends all of it. A circled X ends one branch only.</dd>
      <dt>Action</dt><dd>A rounded rectangle for one step.</dd>
      <dt>Decision / merge</dt><dd>A diamond. Outgoing flows carry guards in brackets, such as <code>[in stock]</code>.</dd>
      <dt>Fork / join</dt><dd>A thick bar. A fork starts parallel flows; a join waits for all of them.</dd>
      <dt>Swimlane</dt><dd>A partition showing who is responsible for the actions inside it.</dd>
      <dt>Object node</dt><dd>A rectangle on a flow for data passed between actions, such as <code>Order [paid]</code>.</dd>
    </dl>
    <p>The semantics come from Petri nets. Picture a token travelling along the arrows: a fork copies the token, and a join waits until every copy has arrived.</p>
  </section>
  <figure class="wide">
    <div class="plate" data-dg="activity"></div>
    <figcaption><b>Figure 5-6.</b> Checkout across three swimlanes. The email and the shipment run in parallel, and the customer sees confirmation only when both are done.</figcaption>
  </figure>
  <div class="aside pitfalls"><b>Common mistakes.</b> Using a decision where you mean a fork (a decision takes one path, a fork takes all of them), guards that overlap or leave cases uncovered, and confusing activities (steps of work) with state machines (conditions an object waits in).</div>

  <!-- 5.7 -->
  <section class="chap" id="s5-7">
    <h2><span class="num">5.7</span>Class diagrams</h2>
    <p>The class diagram is the heart of object-oriented design. It shows classes, their attributes and operations, and the relationships between them. If you learn one diagram deeply, learn this one.</p>
    <h3>The class box</h3>
    <p>Three compartments: name, attributes, operations. Hide a compartment when it doesn’t help the reader.</p>
    <dl class="notation">
      <dt>Attribute</dt><dd><code>visibility name : Type [mult] = default</code>, for example <code>- total : Money = 0</code></dd>
      <dt>Operation</dt><dd><code>visibility name(param : Type) : Return</code>, for example <code>+ addItem(p : Product) : void</code></dd>
      <dt>Visibility</dt><dd><code>+</code> public, <code>-</code> private, <code>#</code> protected, <code>~</code> package.</dd>
      <dt>Italics / underline</dt><dd>An italic name is abstract; an underlined member is static.</dd>
    </dl>
  </section>
  <figure class="wide">
    <div class="plate" data-dg="class"></div>
    <figcaption><b>Figure 5-7.</b> ShopFast’s order model. Hover a line to see what kind of relationship it is and how to read it.</figcaption>
  </figure>
  <h3>Relationships to memorize</h3>
  <div class="tablewrap"><table>
    <thead><tr><th>Relationship</th><th>Drawn as</th><th>Meaning</th><th>In Figure 5-7</th></tr></thead>
    <tbody>
      <tr><td>Association</td><td>Solid line, optional arrow for navigability</td><td>Objects know about each other</td><td>Customer places Order</td></tr>
      <tr><td>Aggregation</td><td>Hollow diamond at the whole</td><td>Has-a; parts can outlive the whole</td><td>(Category has Products)</td></tr>
      <tr><td>Composition</td><td>Filled diamond at the whole</td><td>Owns; parts die with the whole</td><td>Order contains OrderLines</td></tr>
      <tr><td>Generalization</td><td>Hollow triangle at the parent</td><td>Is-a (inheritance)</td><td>PhysicalProduct is a Product</td></tr>
      <tr><td>Realization</td><td>Dashed line, hollow triangle</td><td>Implements an interface</td><td>StripeGateway implements PaymentGateway</td></tr>
      <tr><td>Dependency</td><td>Dashed open arrow</td><td>Uses temporarily</td><td>Order uses PaymentGateway in <code>pay()</code></td></tr>
    </tbody>
  </table></div>
  <p><strong>Multiplicity</strong> sits at each end of an association: <code>1</code>, <code>0..1</code>, <code>*</code> (the same as <code>0..*</code>), <code>1..*</code>. Read Figure 5-7 out loud: a customer places zero or more orders; an order is composed of one or more lines; each line refers to exactly one product.</p>
  <h3>The same model in TypeScript</h3>
  <p class="codehead">Each UML relationship has a direct code shape.</p>
<pre><code class="ts">interface PaymentGateway {                 // «interface»
  charge(amount: Money): Promise&lt;PaymentResult&gt;;
}

class StripeGateway implements PaymentGateway { /* … */ }   // realization

abstract class Product {                    // italic name = abstract
  constructor(private sku: string, private price: Money) {}
}
class PhysicalProduct extends Product { weightKg = 0; }   // generalization

class Order {
  private lines: OrderLine[] = [];          // composition, 1..*
  private status: OrderStatus = "PENDING";

  async pay(gateway: PaymentGateway) {      // dependency: parameter only
    return gateway.charge(this.total());
  }
}</code></pre>
  <p>Booch distinguishes <strong>conceptual</strong> class diagrams (domain ideas, no types) from <strong>specification</strong> diagrams (real types and operations). Start conceptual with stakeholders and add detail as the design firms up.</p>
  <div class="aside pitfalls"><b>Common mistakes.</b> Composition everywhere (ask: does the part die with the whole, and can it belong to only one whole?), inheritance for code reuse rather than a true is-a, and listing every getter instead of the operations that show responsibility.</div>

  <!-- 5.8 -->
  <section class="chap" id="s5-8">
    <h2><span class="num">5.8</span>Sequence diagrams</h2>
    <p>A sequence diagram shows one scenario as messages passed between participants, with time flowing down the page. After class diagrams, it is the diagram you will draw most.</p>
    <dl class="notation">
      <dt>Lifeline</dt><dd>A head box <code>name : Type</code> (or <code>: Type</code> when anonymous) with a dashed line running down.</dd>
      <dt>Synchronous call</dt><dd>Solid line, filled arrowhead. The caller waits.</dd>
      <dt>Asynchronous call</dt><dd>Solid line, open arrowhead. Fire and forget.</dd>
      <dt>Return</dt><dd>Dashed line, open arrowhead. Often omitted when obvious.</dd>
      <dt>Activation bar</dt><dd>A thin rectangle on a lifeline while it is busy.</dd>
      <dt>Combined fragment</dt><dd>A labelled frame adding logic: <code>alt</code>, <code>opt</code>, <code>loop</code>, <code>par</code>, <code>ref</code>.</dd>
    </dl>
  </section>
  <figure class="wide">
    <div class="plate" data-dg="sequence"></div>
    <div class="controls">
      <button class="btn primary" id="seqStart">Step through</button>
      <button class="btn" id="seqPrev">Previous</button>
      <button class="btn" id="seqNext">Next</button>
      <button class="btn" id="seqAll">Show all</button>
      <span class="hint" id="seqCount"></span>
    </div>
    <div class="note" id="seqNote" aria-live="polite">Press <b>Step through</b> to replay the payment one message at a time.</div>
    <figcaption><b>Figure 5-8.</b> Paying for an order. The <code>alt</code> frame holds the two possible outcomes.</figcaption>
  </figure>
  <h3>Combined fragments</h3>
  <div class="tablewrap"><table>
    <thead><tr><th>Operator</th><th>Meaning</th><th>Code equivalent</th></tr></thead>
    <tbody>
      <tr><td><code>alt</code></td><td>Alternatives, each with a guard</td><td><code>if / else</code></td></tr>
      <tr><td><code>opt</code></td><td>Runs only when the guard is true</td><td><code>if</code> without <code>else</code></td></tr>
      <tr><td><code>loop</code></td><td>Repeats while the guard holds</td><td><code>for</code>, <code>while</code></td></tr>
      <tr><td><code>par</code></td><td>Regions run in parallel</td><td><code>Promise.all</code></td></tr>
      <tr><td><code>ref</code></td><td>Points to another sequence diagram</td><td>a function call</td></tr>
      <tr><td><code>break</code></td><td>Runs, then leaves the enclosing fragment</td><td>early <code>return</code></td></tr>
      <tr><td><code>critical</code></td><td>An atomic region</td><td>a lock or transaction</td></tr>
    </tbody>
  </table></div>
  <p class="codehead">The handler that Figure 5-8 describes. Every arrow is a line you can mock or assert in a test.</p>
<pre><code class="ts">async function payForOrder(id: string) {            // OrderService
  const order = await orderRepo.findById(id);        // 3, 4
  const result = await stripe.charge(order.total()); // 5, 6
  if (result.ok) {                                    // alt [payment succeeded]
    await orderRepo.save(order.markPaid());          // 7
    return { status: 200 };                          // 8
  } else {                                            // [card declined]
    return { status: 402 };                          // 9
  }
}</code></pre>
  <div class="aside pitfalls"><b>Common mistakes.</b> Messages that don’t match operations in the class diagram (the two should agree), and nesting fragments so deeply that reading the code would be easier. One diagram should show one scenario; link others with <code>ref</code>.</div>

  <!-- 5.9 -->
  <section class="chap" id="s5-9">
    <h2><span class="num">5.9</span>Interaction overview diagrams</h2>
    <p>An interaction overview diagram is an activity diagram whose nodes are whole interactions, usually sequence diagrams. It shows the big-picture control flow while each box holds the detailed conversation.</p>
    <dl class="notation">
      <dt>Activity notation</dt><dd>Initial and final nodes, decisions, forks and joins, exactly as in 5.6.</dd>
      <dt>Interaction use</dt><dd>A frame labelled <code>ref</code> that points to a sequence diagram drawn elsewhere.</dd>
      <dt>Inline interaction</dt><dd>A small sequence diagram drawn directly inside a frame labelled <code>sd</code>.</dd>
    </dl>
  </section>
  <figure class="wide">
    <div class="plate" data-dg="overviewInt"></div>
    <figcaption><b>Figure 5-9.</b> The whole purchase journey. Each <code>ref</code> box is a separate sequence diagram; the one on the right is drawn inline.</figcaption>
  </figure>
  <p>Use it when a scenario has so many steps and branches that a single sequence diagram becomes unreadable. The difference from a plain activity diagram: every node is a conversation between objects, not a single action.</p>

  <!-- 5.10 -->
  <section class="chap" id="s5-10">
    <h2><span class="num">5.10</span>Composite structure diagrams</h2>
    <p>A composite structure diagram looks inside one class or component and shows the parts it is built from, how they are wired, and the ports it uses to reach the outside. A class diagram describes types in general; this diagram shows how parts collaborate in one specific context.</p>
    <dl class="notation">
      <dt>Structured classifier</dt><dd>A large rectangle for the class being opened up.</dd>
      <dt>Part</dt><dd>An inner box <code>role : Type [mult]</code>. Solid border means owned; dashed means a reference to something owned elsewhere.</dd>
      <dt>Port</dt><dd>A small square on the outer border: the class’s interaction point.</dd>
      <dt>Connector</dt><dd>A line between parts, or between a port and a part, showing they talk in this context.</dd>
      <dt>Collaboration</dt><dd>A dashed oval naming a pattern of roles, such as Observer, bound to the classes that play them.</dd>
    </dl>
  </section>
  <figure class="wide">
    <div class="plate" data-dg="composite"></div>
    <figcaption><b>Figure 5-10.</b> Inside CheckoutService. Requests enter through the <code>http</code> port and payments leave through the <code>payments</code> port.</figcaption>
  </figure>
  <p>You’ll mostly meet this diagram in architecture documents and systems engineering. A React analogy helps: a page component built from child components, with props as ports and the data passed between children as connectors.</p>

  <!-- 5.11 -->
  <section class="chap" id="s5-11">
    <h2><span class="num">5.11</span>State machine diagrams</h2>
    <p>A state machine diagram shows the lifecycle of one object: the states it can be in, the events that move it between them, and what happens on each move. Booch gives it a lot of space because objects with interesting state are where most bugs hide.</p>
    <dl class="notation">
      <dt>State</dt><dd>A rounded rectangle: a condition the object waits in, such as Pending or Paid.</dd>
      <dt>Transition</dt><dd>An arrow labelled <code>event [guard] / action</code>. All three parts are optional.</dd>
      <dt>Internal behavior</dt><dd><code>entry /</code> on arriving, <code>exit /</code> on leaving, <code>do /</code> while inside.</dd>
      <dt>Composite state</dt><dd>A state holding substates. A transition from its border applies to every substate.</dd>
      <dt>Orthogonal regions</dt><dd>A composite split by dashed lines into regions active at the same time.</dd>
      <dt>History <code>(H)</code></dt><dd>Re-enter whichever substate was active last.</dd>
    </dl>
  </section>
  <figure class="wide">
    <div class="plate" data-dg="state"></div>
    <div class="events" id="smEvents" aria-label="Fire an event"></div>
    <div class="controls"><button class="btn" id="smReset">Start a new order</button><span class="hint">Fire events and watch which ones the current state accepts.</span></div>
    <div class="note" id="smNote" aria-live="polite">The order is <b>Pending</b>. Try <code>refund</code> first: nothing happens, because Pending has no such transition.</div>
    <div class="log" id="smLog"></div>
    <figcaption><b>Figure 5-11.</b> The Order lifecycle. Fulfilment is a composite state with its own initial state.</figcaption>
  </figure>
  <p>A state machine makes illegal states visible. Ask of every state which events are allowed and what happens to the others. Every missing answer is a bug report waiting to be filed: can a cancelled order be paid?</p>
  <p class="codehead">The same machine as a reducer. Unhandled events return the state unchanged.</p>
<pre><code class="ts">type State = "Pending" | "Paid" | "Picking" | "Packed" | "Shipped"
           | "Delivered" | "Cancelled" | "Refunded";

function next(state: State, event: string): State {
  switch (state) {
    case "Pending":
      if (event === "payment_succeeded") { sendReceipt(); return "Paid"; }
      if (event === "cancel" || event === "timeout") return "Cancelled";
      return state;
    case "Paid":
      if (event === "fulfil") return "Picking";   // enters the composite
      if (event === "refund" &amp;&amp; withinDays(14)) return "Refunded";
      return state;
    // … Picking → Packed → Shipped → Delivered
    default:
      return state;
  }
}</code></pre>
  <div class="aside pitfalls"><b>Common mistakes.</b> Naming states as actions (“Send email” is an action; “Awaiting payment” is a state), and drawing a flowchart and calling it a state machine. If nothing waits for an event, it’s an activity diagram.</div>
  <div class="aside"><b>Front-end tie-in.</b> UI components are state machines. XState implements this exact notation, and a form wizard modelled this way can no longer reach states like <code>loading &amp;&amp; error</code>.</div>

  <!-- 5.12 -->
  <section class="chap" id="s5-12">
    <h2><span class="num">5.12</span>Timing diagrams</h2>
    <p>A timing diagram shows how the states of one or more objects change along a precise time axis, and the timing constraints between those changes. Time runs left to right, unlike sequence diagrams.</p>
    <dl class="notation">
      <dt>State lifeline</dt><dd>A horizontal band per object; a stepped line jumps between the states listed on its left.</dd>
      <dt>Value lifeline</dt><dd>A compact form: a row of hexagonal segments, each holding the current value.</dd>
      <dt>Time ruler</dt><dd>Ticks along the bottom in real units.</dd>
      <dt>Timing constraint</dt><dd>A rule in braces between two moments: <code>{&lt; 10 s}</code>.</dd>
      <dt>Message</dt><dd>An arrow between lifelines showing which change caused another.</dd>
    </dl>
  </section>
  <figure class="wide">
    <div class="plate" data-dg="timing"></div>
    <figcaption><b>Figure 5-12.</b> An order and its Stripe charge over six seconds. The constraint says Stripe must answer within 10 seconds or the order times out.</figcaption>
  </figure>
  <p>Use timing diagrams for real-time and embedded systems, and on the web for debounce and throttle logic, animations, timeouts and retries: anywhere “how long” matters as much as “in what order.”</p>

  <!-- 5.13 -->
  <section class="chap" id="s5-13">
    <h2><span class="num">5.13</span>Object diagrams</h2>
    <p>An object diagram is a snapshot of real instances and their links at one moment. Classes state the rules; objects show one situation that obeys them.</p>
    <dl class="notation">
      <dt>Object</dt><dd>A rectangle with an underlined name <code>name : Class</code>, or <code>: Class</code> when anonymous.</dd>
      <dt>Slots</dt><dd>Attribute values, such as <code>status = PAID</code>. Objects show no operations.</dd>
      <dt>Link</dt><dd>A plain line: one instance of an association. Links carry no multiplicities.</dd>
    </dl>
  </section>
  <figure class="wide">
    <div class="plate" data-dg="object"></div>
    <figcaption><b>Figure 5-13.</b> Alice’s order right after payment. It obeys Figure 5-7: one order, two lines, each line pointing at one product.</figcaption>
  </figure>
  <p>Use object diagrams to sanity-check a class diagram, to explain a tricky structure with a concrete case, or to describe test fixtures. If you can’t draw a sensible object diagram, the class diagram is probably wrong. It is also, in effect, a picture of a normalized client cache or a JSON fixture.</p>

  <!-- 5.14 -->
  <section class="chap" id="s5-14">
    <h2><span class="num">5.14</span>Communication diagrams</h2>
    <p>A communication diagram carries the same information as a sequence diagram but lays it out by who is linked to whom, with numbers giving the order. UML 1.x called it a collaboration diagram.</p>
    <dl class="notation">
      <dt>Lifelines</dt><dd>Boxes placed freely on the page.</dd>
      <dt>Links</dt><dd>Lines between objects that can message each other.</dd>
      <dt>Messages</dt><dd>Small arrows along a link with a sequence number: <code>1: pay()</code>.</dd>
      <dt>Nested numbers</dt><dd>Calls made while handling another call: <code>1.1</code>, <code>1.2</code>, <code>1.2.1</code>.</dd>
      <dt>Iteration and guards</dt><dd><code>2 *[for each line]: subtotal()</code></dd>
    </dl>
  </section>
  <figure class="wide">
    <div class="plate" data-dg="comm"></div>
    <figcaption><b>Figure 5-14.</b> The payment from Figure 5-8, redrawn around links. Numbers replace vertical position as the record of order.</figcaption>
  </figure>
  <div class="tablewrap"><table>
    <thead><tr><th>Choose</th><th>When the reader needs to see</th></tr></thead>
    <tbody>
      <tr><td>Sequence diagram</td><td>Exact order, loops, alternatives, timing of replies</td></tr>
      <tr><td>Communication diagram</td><td>The network of objects and which ones are coupled</td></tr>
    </tbody>
  </table></div>
  <p>Rule of thumb: sequence for <em>when</em>, communication for <em>who knows whom</em>. Many objects and few messages favour communication; few objects and many messages favour sequence.</p>

  <!-- review -->
  <section class="chap" id="review">
    <h2><span class="num">✓</span>Cheat sheet and quiz</h2>
    <h3>Which diagram answers which question</h3>
  </section>
  <div class="tablewrap"><table>
    <thead><tr><th>Question you’re asking</th><th>Diagram</th><th>How often</th></tr></thead>
    <tbody>
      <tr><td>What types exist and how are they related?</td><td><a href="#s5-7">Class</a></td><td>Constantly</td></tr>
      <tr><td>What happens, step by step, in this scenario?</td><td><a href="#s5-8">Sequence</a></td><td>Constantly</td></tr>
      <tr><td>What states can this object be in?</td><td><a href="#s5-11">State machine</a></td><td>Often</td></tr>
      <tr><td>What is the workflow, with branches and parallel work?</td><td><a href="#s5-6">Activity</a></td><td>Often</td></tr>
      <tr><td>Who uses the system and for what?</td><td><a href="#s5-5">Use case</a></td><td>Often, early</td></tr>
      <tr><td>How is the codebase organized? Any cycles?</td><td><a href="#s5-2">Package</a></td><td>Sometimes</td></tr>
      <tr><td>What are the swappable parts and their contracts?</td><td><a href="#s5-3">Component</a></td><td>Sometimes</td></tr>
      <tr><td>Where does everything run?</td><td><a href="#s5-4">Deployment</a></td><td>Sometimes</td></tr>
      <tr><td>What does a real example of this structure look like?</td><td><a href="#s5-13">Object</a></td><td>Sometimes</td></tr>
      <tr><td>Which objects are coupled to which?</td><td><a href="#s5-14">Communication</a></td><td>Rarely</td></tr>
      <tr><td>How do many scenarios chain together?</td><td><a href="#s5-9">Interaction overview</a></td><td>Rarely</td></tr>
      <tr><td>What is inside this complex class?</td><td><a href="#s5-10">Composite structure</a></td><td>Rarely</td></tr>
      <tr><td>How long do state changes take?</td><td><a href="#s5-12">Timing</a></td><td>Rarely</td></tr>
    </tbody>
  </table></div>
  <h3>Symbols people mix up</h3>
  <ul>
    <li>Hollow diamond is aggregation (shared); filled diamond is composition (owned, dies with the whole).</li>
    <li>Solid line with a hollow triangle is inheritance; dashed line with a hollow triangle implements an interface.</li>
    <li>«include» points from the base to the included case; «extend» points from the extension to the base.</li>
    <li>A decision diamond takes one path; a fork bar takes all paths at once.</li>
    <li>An underlined name is an object, not a class.</li>
  </ul>

  const t = (SM[state] || {})[ev];
