<template id="tpl-ooad-05">
  <h1>Reading UML in an afternoon</h1>
  <p class="lede">A crash course on the 13 diagram types in Chapter 5 of <em>Object-Oriented Analysis and Design with Applications</em>, each drawn for the same web shop so you can see how the views fit together.</p>
  <p class="byline">Hover or tap any part of a diagram to see what it means. Two diagrams are interactive: step through the sequence diagram and fire events at the state machine.</p>

  <!-- 5.1 -->
  <section class="chap" id="s5-1">
    <h2><span class="num">5.1</span>The Unified Modeling Language</h2>
    <p>UML is a standard visual language for describing software: what it is made of and how it behaves. Booch, Rumbaugh and Jacobson merged their competing notations into UML in the late 1990s. The book uses UML 2.0, which defines 13 diagram types.</p>
    <p>A <strong>model</strong> is a simplification of a system built for a purpose. A <strong>diagram</strong> is one view into that model. No diagram shows everything, and no project needs all 13. You pick the view that answers the question in front of you.</p>
  </section>
  <figure class="wide">
    <div class="plate" data-dg="overview"></div>
    <figcaption><b>Figure 5-1.</b> The 13 diagrams fall into two families. Interaction diagrams are a subset of behavioral ones. Click a diagram to jump to its section.</figcaption>
  </figure>
  <h3>The running example</h3>
  <p>Every diagram in this course describes <strong>ShopFast</strong>, an online store with a React front end, a Node API, PostgreSQL, and Stripe for payments. Seeing one system from 13 angles is the fastest way to understand what each angle is for.</p>
  <h3>Vocabulary used in every diagram</h3>
  <dl class="notation">
    <dt>Classifier</dt><dd>Anything that describes a set of instances: class, interface, component, actor, use case, node.</dd>
    <dt>Dependency</dt><dd>Dashed arrow. “Uses, and would be affected if the target changed.”</dd>
    <dt>Association</dt><dd>Solid line. “Knows about” in a lasting way.</dd>
    <dt>Generalization</dt><dd>Solid line with a hollow triangle at the parent. “Is a kind of.”</dd>
    <dt>Realization</dt><dd>Dashed line with a hollow triangle at the interface. “Implements.”</dd>
    <dt>Stereotype</dt><dd>A label in guillemets, like «interface» or «database», that specializes an element.</dd>
    <dt>Constraint</dt><dd>A rule in braces: <code>{ordered}</code>, <code>{total &gt; 0}</code>.</dd>
    <dt>Note</dt><dd>A dog-eared rectangle holding a comment, attached by a dashed line.</dd>
  </dl>
  <h3>The four architectural views</h3>
  <p>Booch frames UML around views of an architecture. The <strong>logical view</strong> (classes, packages) shows the design. The <strong>process view</strong> (activity, sequence, state) shows runtime behavior. The <strong>implementation view</strong> (components) shows how code is organized, and the <strong>deployment view</strong> (nodes) shows where it runs. Use cases tie the four together as the scenarios every view must support.</p>

  <!-- 5.2 -->
  <section class="chap" id="s5-2">
    <h2><span class="num">5.2</span>Package diagrams</h2>
    <p>A package diagram shows how a large model is split into groups and which groups depend on which. It answers one question: how is this system organized, and are the dependencies sane?</p>
    <dl class="notation">
      <dt>Package</dt><dd>A folder shape: a rectangle with a tab. Contents can be listed or drawn inside.</dd>
      <dt>Dependency</dt><dd>Dashed arrow from the package that uses to the package it needs.</dd>
      <dt>«import» / «access»</dt><dd>A dependency that brings names in publicly (re-exported) or privately.</dd>
      <dt>Qualified name</dt><dd><code>Ordering::Cart</code> means the Cart element inside the Ordering package.</dd>
      <dt>Visibility</dt><dd><code>+</code> public and <code>-</code> private, as with class members.</dd>
    </dl>
  </section>
  <figure class="wide">
    <div class="plate" data-dg="package"></div>
    <figcaption><b>Figure 5-2.</b> ShopFast’s layers. Every arrow points toward the stable Domain package, and nothing in Domain depends on React or Postgres.</figcaption>
  </figure>
  <h3>Design rules Booch emphasizes</h3>
  <ol>
    <li><strong>No cycles.</strong> If A depends on B and B on A, they are really one package. Break the cycle by extracting an interface package.</li>
    <li><strong>High cohesion inside, low coupling between.</strong> Things that change together live together.</li>
    <li><strong>Depend in the direction of stability.</strong> Volatile packages like UI depend on stable ones like Domain, never the reverse.</li>
  </ol>
  <div class="aside pitfalls"><b>Common mistakes.</b> Mirroring the folder tree instead of the logical design, and drawing every dependency until the picture is a hairball. Draw only the arrows that matter for your question.</div>
  <div class="aside"><b>Front-end tie-in.</b> In a monorepo, packages map neatly onto workspaces like <code>@shop/ui</code> and <code>@shop/domain</code>. Lint rules such as import boundaries are a package diagram enforced in CI.</div>

  <!-- 5.3 -->
  <section class="chap" id="s5-3">
    <h2><span class="num">5.3</span>Component diagrams</h2>
    <p>A component diagram shows the replaceable building blocks of a system and the interfaces each one offers and needs. A package groups design elements; a component is a unit of implementation you could swap out without touching its neighbours.</p>
    <dl class="notation">
      <dt>Component</dt><dd>A rectangle marked «component» or with the small two-pronged icon.</dd>
      <dt>Provided interface</dt><dd>A lollipop: a line ending in a circle. “I offer this.”</dd>
      <dt>Required interface</dt><dd>A socket: a line ending in a half-circle. “I need this.”</dd>
      <dt>Assembly connector</dt><dd>A lollipop sitting in a socket, wiring a provider to a consumer.</dd>
      <dt>Port</dt><dd>A small square on the border, a named interaction point that groups interfaces.</dd>
    </dl>
  </section>
  <figure class="wide">
    <div class="plate" data-dg="component"></div>
    <figcaption><b>Figure 5-3.</b> OrderService knows only the <code>IPayment</code> and <code>IOrderRepo</code> contracts. Replace PaymentAdapter to move from Stripe to PayPal and nothing else changes.</figcaption>
  </figure>
  <p>Use component diagrams to plan service boundaries, plugin points or micro-frontends, and to agree on contracts between teams before code exists. Show components as black boxes (interfaces only) for consumers, or as white boxes (inner parts visible) for the team that owns them.</p>
  <div class="aside pitfalls"><b>Common mistakes.</b> Treating every class as a component (components are coarse-grained), and leaving interfaces unnamed, which hides the very contract the diagram exists to show.</div>
  <div class="aside"><b>Fullstack tie-in.</b> A tRPC router is a provided interface, the client hook that calls it is a required one, and the shared router type is the assembly connector.</div>

  <!-- 5.4 -->
  <section class="chap" id="s5-4">
    <h2><span class="num">5.4</span>Deployment diagrams</h2>
    <p>A deployment diagram shows the physical runtime: which machines or environments exist, what software runs on each, and how they talk. It is the only UML diagram about infrastructure.</p>
    <dl class="notation">
      <dt>Node</dt><dd>A 3D box. A «device» is hardware; an «executionEnvironment» hosts software (a browser, a Node runtime, a container).</dd>
      <dt>Nesting</dt><dd>Nodes sit inside nodes: a container in a VM in a cloud region.</dd>
      <dt>Artifact</dt><dd>A concrete deployable file: <code>bundle.js</code>, <code>api.zip</code>, a Docker image.</dd>
      <dt>Communication path</dt><dd>A solid line between nodes, labelled with its protocol.</dd>
      <dt>«manifest»</dt><dd>Dashed arrow from an artifact to the component it implements.</dd>
    </dl>
  </section>
  <figure class="wide">
    <div class="plate" data-dg="deployment"></div>
    <figcaption><b>Figure 5-4.</b> Where ShopFast runs. The protocol on each path is often the most useful fact in the diagram.</figcaption>
  </figure>
  <p><strong>Specification vs instance level.</strong> A specification-level diagram says “a Lambda node and a Postgres node.” An instance-level diagram names real machines, such as <code>prod-db-1 : PostgreSQL</code>, underlined like objects. Use instance level in runbooks and incident write-ups.</p>
  <div class="aside"><b>Fullstack tie-in.</b> Infrastructure-as-code tools like SST already describe a deployment model. Drawing it once speeds up reviews and onboarding.</div>

  <!-- 5.5 -->
  <section class="chap" id="s5-5">
    <h2><span class="num">5.5</span>Use case diagrams</h2>
    <p>A use case diagram shows who uses the system and what goals they reach with it. It captures requirements from the outside, with no internal design at all.</p>
    <dl class="notation">
      <dt>Actor</dt><dd>A stick figure for a role played by a person or an external system: Customer, Admin, Stripe.</dd>
      <dt>Use case</dt><dd>An oval named with a goal that delivers value: “Place order,” never “Click button.”</dd>
      <dt>System boundary</dt><dd>A rectangle around the use cases. Actors stay outside it.</dd>
      <dt>«include»</dt><dd>Dashed arrow from the base to behavior that always runs as part of it.</dd>
      <dt>«extend»</dt><dd>Dashed arrow from optional behavior to the base it extends, under a condition.</dd>
      <dt>Generalization</dt><dd>Hollow triangle between actors (Admin is a kind of User) or use cases.</dd>
    </dl>
  </section>
  <figure class="wide">
    <div class="plate" data-dg="usecase"></div>
    <figcaption><b>Figure 5-5.</b> Placing an order always includes authentication; applying a coupon only sometimes extends it. Note that the «extend» arrow points at the base use case.</figcaption>
  </figure>
  <h3>The diagram is the index; the text is the content</h3>
  <p>Booch stresses that the diagram alone is thin. Each use case needs a written specification: actors, preconditions, a numbered main success scenario, alternate flows, and postconditions. For <em>Place order</em>:</p>
  <ol>
    <li>Customer reviews the cart.</li>
    <li>System shows the total, including tax and shipping.</li>
    <li>Customer enters payment details.</li>
    <li>System charges the card through Stripe.</li>
    <li>System confirms the order and emails a receipt.</li>
  </ol>
  <p><em>Alternate flow 4a:</em> the card is declined. The system shows the reason and returns to step 3.</p>
  <div class="aside pitfalls"><b>Common mistakes.</b> Functional decomposition (“Validate email field” is a step, not a goal), wiring «include» and «extend» until the diagram turns into a flowchart, and drawing the «extend» arrow backwards.</div>

  <!-- 5.6 -->
  <section class="chap" id="s5-6">
    <h2><span class="num">5.6</span>Activity diagrams</h2>
    <p>An activity diagram shows a flow of work: steps, decisions, parallel branches, and who does each step. Think of a flowchart with real semantics for concurrency. It suits business processes and the scenario inside a use case.</p>
    <dl class="notation">
      <dt>Initial / final</dt><dd>A filled dot starts the activity; a bullseye ends all of it. A circled X ends one branch only.</dd>
      <dt>Action</dt><dd>A rounded rectangle for one step.</dd>
      <dt>Decision / merge</dt><dd>A diamond. Outgoing flows carry guards in brackets, such as <code>[in stock]</code>.</dd>
      <dt>Fork / join</dt><dd>A thick bar. A fork starts parallel flows; a join waits for all of them.</dd>
      <dt>Swimlane</dt><dd>A partition showing who is responsible for the actions inside it.</dd>
      <dt>Object node</dt><dd>A rectangle on a flow for data passed between actions, such as <code>Order [paid]</code>.</dd>
    </dl>
    <p>The semantics come from Petri nets. Picture a token travelling along the arrows: a fork copies the token, and a join waits until every copy has arrived.</p>
  </section>
  <figure class="wide">
    <div class="plate" data-dg="activity"></div>
    <figcaption><b>Figure 5-6.</b> Checkout across three swimlanes. The email and the shipment run in parallel, and the customer sees confirmation only when both are done.</figcaption>
  </figure>
  <div class="aside pitfalls"><b>Common mistakes.</b> Using a decision where you mean a fork (a decision takes one path, a fork takes all of them), guards that overlap or leave cases uncovered, and confusing activities (steps of work) with state machines (conditions an object waits in).</div>

  <!-- 5.7 -->
  <section class="chap" id="s5-7">
    <h2><span class="num">5.7</span>Class diagrams</h2>
    <p>The class diagram is the heart of object-oriented design. It shows classes, their attributes and operations, and the relationships between them. If you learn one diagram deeply, learn this one.</p>
    <h3>The class box</h3>
    <p>Three compartments: name, attributes, operations. Hide a compartment when it doesn’t help the reader.</p>
    <dl class="notation">
      <dt>Attribute</dt><dd><code>visibility name : Type [mult] = default</code>, for example <code>- total : Money = 0</code></dd>
      <dt>Operation</dt><dd><code>visibility name(param : Type) : Return</code>, for example <code>+ addItem(p : Product) : void</code></dd>
      <dt>Visibility</dt><dd><code>+</code> public, <code>-</code> private, <code>#</code> protected, <code>~</code> package.</dd>
      <dt>Italics / underline</dt><dd>An italic name is abstract; an underlined member is static.</dd>
    </dl>
  </section>
  <figure class="wide">
    <div class="plate" data-dg="class"></div>
    <figcaption><b>Figure 5-7.</b> ShopFast’s order model. Hover a line to see what kind of relationship it is and how to read it.</figcaption>
  </figure>
  <h3>Relationships to memorize</h3>
  <div class="tablewrap"><table>
    <thead><tr><th>Relationship</th><th>Drawn as</th><th>Meaning</th><th>In Figure 5-7</th></tr></thead>
    <tbody>
      <tr><td>Association</td><td>Solid line, optional arrow for navigability</td><td>Objects know about each other</td><td>Customer places Order</td></tr>
      <tr><td>Aggregation</td><td>Hollow diamond at the whole</td><td>Has-a; parts can outlive the whole</td><td>(Category has Products)</td></tr>
      <tr><td>Composition</td><td>Filled diamond at the whole</td><td>Owns; parts die with the whole</td><td>Order contains OrderLines</td></tr>
      <tr><td>Generalization</td><td>Hollow triangle at the parent</td><td>Is-a (inheritance)</td><td>PhysicalProduct is a Product</td></tr>
      <tr><td>Realization</td><td>Dashed line, hollow triangle</td><td>Implements an interface</td><td>StripeGateway implements PaymentGateway</td></tr>
      <tr><td>Dependency</td><td>Dashed open arrow</td><td>Uses temporarily</td><td>Order uses PaymentGateway in <code>pay()</code></td></tr>
    </tbody>
  </table></div>
  <p><strong>Multiplicity</strong> sits at each end of an association: <code>1</code>, <code>0..1</code>, <code>*</code> (the same as <code>0..*</code>), <code>1..*</code>. Read Figure 5-7 out loud: a customer places zero or more orders; an order is composed of one or more lines; each line refers to exactly one product.</p>
  <h3>The same model in TypeScript</h3>
  <p class="codehead">Each UML relationship has a direct code shape.</p>
<pre><code class="ts">interface PaymentGateway {                 // «interface»
  charge(amount: Money): Promise&lt;PaymentResult&gt;;
}

class StripeGateway implements PaymentGateway { /* … */ }   // realization

abstract class Product {                    // italic name = abstract
  constructor(private sku: string, private price: Money) {}
}
class PhysicalProduct extends Product { weightKg = 0; }   // generalization

class Order {
  private lines: OrderLine[] = [];          // composition, 1..*
  private status: OrderStatus = "PENDING";

  async pay(gateway: PaymentGateway) {      // dependency: parameter only
    return gateway.charge(this.total());
  }
}</code></pre>
  <p>Booch distinguishes <strong>conceptual</strong> class diagrams (domain ideas, no types) from <strong>specification</strong> diagrams (real types and operations). Start conceptual with stakeholders and add detail as the design firms up.</p>
  <div class="aside pitfalls"><b>Common mistakes.</b> Composition everywhere (ask: does the part die with the whole, and can it belong to only one whole?), inheritance for code reuse rather than a true is-a, and listing every getter instead of the operations that show responsibility.</div>

  <!-- 5.8 -->
  <section class="chap" id="s5-8">
    <h2><span class="num">5.8</span>Sequence diagrams</h2>
    <p>A sequence diagram shows one scenario as messages passed between participants, with time flowing down the page. After class diagrams, it is the diagram you will draw most.</p>
    <dl class="notation">
      <dt>Lifeline</dt><dd>A head box <code>name : Type</code> (or <code>: Type</code> when anonymous) with a dashed line running down.</dd>
      <dt>Synchronous call</dt><dd>Solid line, filled arrowhead. The caller waits.</dd>
      <dt>Asynchronous call</dt><dd>Solid line, open arrowhead. Fire and forget.</dd>
      <dt>Return</dt><dd>Dashed line, open arrowhead. Often omitted when obvious.</dd>
      <dt>Activation bar</dt><dd>A thin rectangle on a lifeline while it is busy.</dd>
      <dt>Combined fragment</dt><dd>A labelled frame adding logic: <code>alt</code>, <code>opt</code>, <code>loop</code>, <code>par</code>, <code>ref</code>.</dd>
    </dl>
  </section>
  <figure class="wide">
    <div class="plate" data-dg="sequence"></div>
    <div class="controls">
      <button class="btn primary" id="seqStart">Step through</button>
      <button class="btn" id="seqPrev">Previous</button>
      <button class="btn" id="seqNext">Next</button>
      <button class="btn" id="seqAll">Show all</button>
      <span class="hint" id="seqCount"></span>
    </div>
    <div class="note" id="seqNote" aria-live="polite">Press <b>Step through</b> to replay the payment one message at a time.</div>
    <figcaption><b>Figure 5-8.</b> Paying for an order. The <code>alt</code> frame holds the two possible outcomes.</figcaption>
  </figure>
  <h3>Combined fragments</h3>
  <div class="tablewrap"><table>
    <thead><tr><th>Operator</th><th>Meaning</th><th>Code equivalent</th></tr></thead>
    <tbody>
      <tr><td><code>alt</code></td><td>Alternatives, each with a guard</td><td><code>if / else</code></td></tr>
      <tr><td><code>opt</code></td><td>Runs only when the guard is true</td><td><code>if</code> without <code>else</code></td></tr>
      <tr><td><code>loop</code></td><td>Repeats while the guard holds</td><td><code>for</code>, <code>while</code></td></tr>
      <tr><td><code>par</code></td><td>Regions run in parallel</td><td><code>Promise.all</code></td></tr>
      <tr><td><code>ref</code></td><td>Points to another sequence diagram</td><td>a function call</td></tr>
      <tr><td><code>break</code></td><td>Runs, then leaves the enclosing fragment</td><td>early <code>return</code></td></tr>
      <tr><td><code>critical</code></td><td>An atomic region</td><td>a lock or transaction</td></tr>
    </tbody>
  </table></div>
  <p class="codehead">The handler that Figure 5-8 describes. Every arrow is a line you can mock or assert in a test.</p>
<pre><code class="ts">async function payForOrder(id: string) {            // OrderService
  const order = await orderRepo.findById(id);        // 3, 4
  const result = await stripe.charge(order.total()); // 5, 6
  if (result.ok) {                                    // alt [payment succeeded]
    await orderRepo.save(order.markPaid());          // 7
    return { status: 200 };                          // 8
  } else {                                            // [card declined]
    return { status: 402 };                          // 9
  }
}</code></pre>
  <div class="aside pitfalls"><b>Common mistakes.</b> Messages that don’t match operations in the class diagram (the two should agree), and nesting fragments so deeply that reading the code would be easier. One diagram should show one scenario; link others with <code>ref</code>.</div>

  <!-- 5.9 -->
  <section class="chap" id="s5-9">
    <h2><span class="num">5.9</span>Interaction overview diagrams</h2>
    <p>An interaction overview diagram is an activity diagram whose nodes are whole interactions, usually sequence diagrams. It shows the big-picture control flow while each box holds the detailed conversation.</p>
    <dl class="notation">
      <dt>Activity notation</dt><dd>Initial and final nodes, decisions, forks and joins, exactly as in 5.6.</dd>
      <dt>Interaction use</dt><dd>A frame labelled <code>ref</code> that points to a sequence diagram drawn elsewhere.</dd>
      <dt>Inline interaction</dt><dd>A small sequence diagram drawn directly inside a frame labelled <code>sd</code>.</dd>
    </dl>
  </section>
  <figure class="wide">
    <div class="plate" data-dg="overviewInt"></div>
    <figcaption><b>Figure 5-9.</b> The whole purchase journey. Each <code>ref</code> box is a separate sequence diagram; the one on the right is drawn inline.</figcaption>
  </figure>
  <p>Use it when a scenario has so many steps and branches that a single sequence diagram becomes unreadable. The difference from a plain activity diagram: every node is a conversation between objects, not a single action.</p>

  <!-- 5.10 -->
  <section class="chap" id="s5-10">
    <h2><span class="num">5.10</span>Composite structure diagrams</h2>
    <p>A composite structure diagram looks inside one class or component and shows the parts it is built from, how they are wired, and the ports it uses to reach the outside. A class diagram describes types in general; this diagram shows how parts collaborate in one specific context.</p>
    <dl class="notation">
      <dt>Structured classifier</dt><dd>A large rectangle for the class being opened up.</dd>
      <dt>Part</dt><dd>An inner box <code>role : Type [mult]</code>. Solid border means owned; dashed means a reference to something owned elsewhere.</dd>
      <dt>Port</dt><dd>A small square on the outer border: the class’s interaction point.</dd>
      <dt>Connector</dt><dd>A line between parts, or between a port and a part, showing they talk in this context.</dd>
      <dt>Collaboration</dt><dd>A dashed oval naming a pattern of roles, such as Observer, bound to the classes that play them.</dd>
    </dl>
  </section>
  <figure class="wide">
    <div class="plate" data-dg="composite"></div>
    <figcaption><b>Figure 5-10.</b> Inside CheckoutService. Requests enter through the <code>http</code> port and payments leave through the <code>payments</code> port.</figcaption>
  </figure>
  <p>You’ll mostly meet this diagram in architecture documents and systems engineering. A React analogy helps: a page component built from child components, with props as ports and the data passed between children as connectors.</p>

  <!-- 5.11 -->
  <section class="chap" id="s5-11">
    <h2><span class="num">5.11</span>State machine diagrams</h2>
    <p>A state machine diagram shows the lifecycle of one object: the states it can be in, the events that move it between them, and what happens on each move. Booch gives it a lot of space because objects with interesting state are where most bugs hide.</p>
    <dl class="notation">
      <dt>State</dt><dd>A rounded rectangle: a condition the object waits in, such as Pending or Paid.</dd>
      <dt>Transition</dt><dd>An arrow labelled <code>event [guard] / action</code>. All three parts are optional.</dd>
      <dt>Internal behavior</dt><dd><code>entry /</code> on arriving, <code>exit /</code> on leaving, <code>do /</code> while inside.</dd>
      <dt>Composite state</dt><dd>A state holding substates. A transition from its border applies to every substate.</dd>
      <dt>Orthogonal regions</dt><dd>A composite split by dashed lines into regions active at the same time.</dd>
      <dt>History <code>(H)</code></dt><dd>Re-enter whichever substate was active last.</dd>
    </dl>
  </section>
  <figure class="wide">
    <div class="plate" data-dg="state"></div>
    <div class="events" id="smEvents" aria-label="Fire an event"></div>
    <div class="controls"><button class="btn" id="smReset">Start a new order</button><span class="hint">Fire events and watch which ones the current state accepts.</span></div>
    <div class="note" id="smNote" aria-live="polite">The order is <b>Pending</b>. Try <code>refund</code> first: nothing happens, because Pending has no such transition.</div>
    <div class="log" id="smLog"></div>
    <figcaption><b>Figure 5-11.</b> The Order lifecycle. Fulfilment is a composite state with its own initial state.</figcaption>
  </figure>
  <p>A state machine makes illegal states visible. Ask of every state which events are allowed and what happens to the others. Every missing answer is a bug report waiting to be filed: can a cancelled order be paid?</p>
  <p class="codehead">The same machine as a reducer. Unhandled events return the state unchanged.</p>
<pre><code class="ts">type State = "Pending" | "Paid" | "Picking" | "Packed" | "Shipped"
           | "Delivered" | "Cancelled" | "Refunded";

function next(state: State, event: string): State {
  switch (state) {
    case "Pending":
      if (event === "payment_succeeded") { sendReceipt(); return "Paid"; }
      if (event === "cancel" || event === "timeout") return "Cancelled";
      return state;
    case "Paid":
      if (event === "fulfil") return "Picking";   // enters the composite
      if (event === "refund" &amp;&amp; withinDays(14)) return "Refunded";
      return state;
    // … Picking → Packed → Shipped → Delivered
    default:
      return state;
  }
}</code></pre>
  <div class="aside pitfalls"><b>Common mistakes.</b> Naming states as actions (“Send email” is an action; “Awaiting payment” is a state), and drawing a flowchart and calling it a state machine. If nothing waits for an event, it’s an activity diagram.</div>
  <div class="aside"><b>Front-end tie-in.</b> UI components are state machines. XState implements this exact notation, and a form wizard modelled this way can no longer reach states like <code>loading &amp;&amp; error</code>.</div>

  <!-- 5.12 -->
  <section class="chap" id="s5-12">
    <h2><span class="num">5.12</span>Timing diagrams</h2>
    <p>A timing diagram shows how the states of one or more objects change along a precise time axis, and the timing constraints between those changes. Time runs left to right, unlike sequence diagrams.</p>
    <dl class="notation">
      <dt>State lifeline</dt><dd>A horizontal band per object; a stepped line jumps between the states listed on its left.</dd>
      <dt>Value lifeline</dt><dd>A compact form: a row of hexagonal segments, each holding the current value.</dd>
      <dt>Time ruler</dt><dd>Ticks along the bottom in real units.</dd>
      <dt>Timing constraint</dt><dd>A rule in braces between two moments: <code>{&lt; 10 s}</code>.</dd>
      <dt>Message</dt><dd>An arrow between lifelines showing which change caused another.</dd>
    </dl>
  </section>
  <figure class="wide">
    <div class="plate" data-dg="timing"></div>
    <figcaption><b>Figure 5-12.</b> An order and its Stripe charge over six seconds. The constraint says Stripe must answer within 10 seconds or the order times out.</figcaption>
  </figure>
  <p>Use timing diagrams for real-time and embedded systems, and on the web for debounce and throttle logic, animations, timeouts and retries: anywhere “how long” matters as much as “in what order.”</p>

  <!-- 5.13 -->
  <section class="chap" id="s5-13">
    <h2><span class="num">5.13</span>Object diagrams</h2>
    <p>An object diagram is a snapshot of real instances and their links at one moment. Classes state the rules; objects show one situation that obeys them.</p>
    <dl class="notation">
      <dt>Object</dt><dd>A rectangle with an underlined name <code>name : Class</code>, or <code>: Class</code> when anonymous.</dd>
      <dt>Slots</dt><dd>Attribute values, such as <code>status = PAID</code>. Objects show no operations.</dd>
      <dt>Link</dt><dd>A plain line: one instance of an association. Links carry no multiplicities.</dd>
    </dl>
  </section>
  <figure class="wide">
    <div class="plate" data-dg="object"></div>
    <figcaption><b>Figure 5-13.</b> Alice’s order right after payment. It obeys Figure 5-7: one order, two lines, each line pointing at one product.</figcaption>
  </figure>
  <p>Use object diagrams to sanity-check a class diagram, to explain a tricky structure with a concrete case, or to describe test fixtures. If you can’t draw a sensible object diagram, the class diagram is probably wrong. It is also, in effect, a picture of a normalized client cache or a JSON fixture.</p>

  <!-- 5.14 -->
  <section class="chap" id="s5-14">
    <h2><span class="num">5.14</span>Communication diagrams</h2>
    <p>A communication diagram carries the same information as a sequence diagram but lays it out by who is linked to whom, with numbers giving the order. UML 1.x called it a collaboration diagram.</p>
    <dl class="notation">
      <dt>Lifelines</dt><dd>Boxes placed freely on the page.</dd>
      <dt>Links</dt><dd>Lines between objects that can message each other.</dd>
      <dt>Messages</dt><dd>Small arrows along a link with a sequence number: <code>1: pay()</code>.</dd>
      <dt>Nested numbers</dt><dd>Calls made while handling another call: <code>1.1</code>, <code>1.2</code>, <code>1.2.1</code>.</dd>
      <dt>Iteration and guards</dt><dd><code>2 *[for each line]: subtotal()</code></dd>
    </dl>
  </section>
  <figure class="wide">
    <div class="plate" data-dg="comm"></div>
    <figcaption><b>Figure 5-14.</b> The payment from Figure 5-8, redrawn around links. Numbers replace vertical position as the record of order.</figcaption>
  </figure>
  <div class="tablewrap"><table>
    <thead><tr><th>Choose</th><th>When the reader needs to see</th></tr></thead>
    <tbody>
      <tr><td>Sequence diagram</td><td>Exact order, loops, alternatives, timing of replies</td></tr>
      <tr><td>Communication diagram</td><td>The network of objects and which ones are coupled</td></tr>
    </tbody>
  </table></div>
  <p>Rule of thumb: sequence for <em>when</em>, communication for <em>who knows whom</em>. Many objects and few messages favour communication; few objects and many messages favour sequence.</p>

  <section class="chap" id="review">
    <h2><span class="num">✓</span>Cheat sheet and quiz</h2>
    <h3>Which diagram answers which question</h3>
  </section>
  <div class="tablewrap"><table>
    <thead><tr><th>Question you’re asking</th><th>Diagram</th><th>How often</th></tr></thead>
    <tbody>
      <tr><td>What types exist and how are they related?</td><td><a href="#s5-7">Class</a></td><td>Constantly</td></tr>
      <tr><td>What happens, step by step, in this scenario?</td><td><a href="#s5-8">Sequence</a></td><td>Constantly</td></tr>
      <tr><td>What states can this object be in?</td><td><a href="#s5-11">State machine</a></td><td>Often</td></tr>
      <tr><td>What is the workflow, with branches and parallel work?</td><td><a href="#s5-6">Activity</a></td><td>Often</td></tr>
      <tr><td>Who uses the system and for what?</td><td><a href="#s5-5">Use case</a></td><td>Often, early</td></tr>
      <tr><td>How is the codebase organized? Any cycles?</td><td><a href="#s5-2">Package</a></td><td>Sometimes</td></tr>
      <tr><td>What are the swappable parts and their contracts?</td><td><a href="#s5-3">Component</a></td><td>Sometimes</td></tr>
      <tr><td>Where does everything run?</td><td><a href="#s5-4">Deployment</a></td><td>Sometimes</td></tr>
      <tr><td>What does a real example of this structure look like?</td><td><a href="#s5-13">Object</a></td><td>Sometimes</td></tr>
      <tr><td>Which objects are coupled to which?</td><td><a href="#s5-14">Communication</a></td><td>Rarely</td></tr>
      <tr><td>How do many scenarios chain together?</td><td><a href="#s5-9">Interaction overview</a></td><td>Rarely</td></tr>
      <tr><td>What is inside this complex class?</td><td><a href="#s5-10">Composite structure</a></td><td>Rarely</td></tr>
      <tr><td>How long do state changes take?</td><td><a href="#s5-12">Timing</a></td><td>Rarely</td></tr>
    </tbody>
  </table></div>
  <h3>Symbols people mix up</h3>
  <ul>
    <li>Hollow diamond is aggregation (shared); filled diamond is composition (owned, dies with the whole).</li>
    <li>Solid line with a hollow triangle is inheritance; dashed line with a hollow triangle implements an interface.</li>
    <li>«include» points from the base to the included case; «extend» points from the extension to the base.</li>
    <li>A decision diamond takes one path; a fork bar takes all paths at once.</li>
    <li>An underlined name is an object, not a class.</li>
  </ul>

D.sequence = () => {
  const X = SEQ.x; let s = "";
  s += G("Combined fragment 'alt': alternatives, each with a guard. Only one operand runs, like if/else.",
    frame(150,280,370,150,"alt",40,"") + T(198,296,"[payment succeeded]","sm","start") + P("M150 365H520","d") + T(160,382,"[card declined]","sm","start"));
  const head = (x,label,tip) => G(tip, R(x-64,30,128,36,"b",3) + T(x,53,label,"hd") ) + P(`M${x} 66V484`,"d");
  s += actor(60,48,"Customer","Actor lifeline.") + P("M60 98V484","d");
  s += head(X.ui,":CheckoutPage","Lifeline for an anonymous CheckoutPage object.");
  s += head(X.api,":OrderService","Lifeline for OrderService.");
  s += head(X.db,":OrderRepository","Lifeline for OrderRepository.");
  s += head(X.pg,":StripeGateway","Lifeline for StripeGateway.");
  s += G("Activation bar: OrderService is executing between these points.", R(324,150,12,265,"b",1));
  SEQ.msgs.forEach((m,i) => {
    let x1 = X[m.f], x2 = X[m.t]; const dir = Math.sign(x2-x1);
    const act = y => y >= 150 && y <= 415;
    if (m.f === "api" && act(m.y)) x1 += dir*6;
    if (m.t === "api" && act(m.y)) x2 -= dir*6;
    const mk = m.k === "sync" ? "mf" : "mo";
    s += `<g class="msg" data-i="${i}">` + `<path d="M${x1} ${m.y}H${x2}" class="${m.k==="sync"?"l":"d"}" marker-end="url(#${mk})" data-mk="${mk}"/>` +
      T((x1+x2)/2, m.y-7, m.l, "m") + T(x1+dir*6, m.y+14, String(i+1), "sm", dir>0?"start":"end") + `</g>`;
  });
  return SVG(720,500,"Sequence diagram: paying for an order",s);
};

  <h1>How good software actually gets built</h1>
  <p class="lede">A crash course on Chapter 6 of <em>Object-Oriented Analysis and Design with Applications</em>: the lifecycle that frames a project, and the analysis-and-design loop that runs inside it.</p>
  <p class="byline">Hover or tap any part of a diagram for an explanation, and use the Full screen button on any figure. Interactive pieces: a process-style calculator, the phase timeline, the shifting-focus chart, the micro-process activity cycle, a levels-of-abstraction walkthrough and a relationship-refinement toggle. Figures marked <span class="src book">From the book</span> are redrawn from the chapter; <span class="src ill">Course illustration</span> marks diagrams drawn for this course.</p>

  <!-- 6.0 -->
  <section class="chap" id="s6-0">
    <h2><span class="num">6</span>Why process matters</h2>
    <p>The chapter opens with a contrast. Amateurs hunt for a magic method or tool that will make development trivial, follow cookbook steps, and either skip documentation or produce it for show. Professionals know there is no silver bullet, that rigid recipes lead to poor designs, and that documents are worth writing only when they serve the substance of the system.</p>
    <p>Booch’s position sits between chaos and cookbook: object-oriented analysis and design can’t be reduced to a recipe, yet it is well defined enough to be <strong>predictable and repeatable</strong> for a mature team. The chapter describes it from two angles:</p>
    <div class="tablewrap"><table>
      <thead><tr><th></th><th>Macro process</th><th>Micro process</th></tr></thead>
      <tbody>
        <tr><td>What it is</td><td>The overall software development lifecycle</td><td>The analysis and design process</td></tr>
        <tr><td>Scope</td><td>The whole team, from idea to first release</td><td>Getting from requirements to an implementable design</td></tr>
        <tr><td>Shaped by</td><td>Your lifecycle style: waterfall, iterative, agile, plan-driven</td><td>Your analysis and design technique: structured, object-oriented</td></tr>
        <tr><td>Covered in</td><td><a href="#s6-2">6.2</a></td><td><a href="#s6-3">6.3</a>, the real focus of the chapter</td></tr>
      </tbody>
    </table></div>
    <p>The separation is the key idea. Because the two concerns are independent, the object-oriented techniques of the micro process work just as well inside an agile lifecycle as inside a plan-driven one.</p>
  </section>

  <!-- 6.1 -->
  <section class="chap" id="s6-1">
    <h2><span class="num">6.1</span>First principles</h2>
    <p>A successful project delivers what the customer expected (or more), on time and on budget, and produces a system that copes well with change. Across the successful object-oriented systems the authors studied, two traits kept appearing, and they were missing from the failures:</p>
    <ol>
      <li>A <strong>strong architectural vision</strong>.</li>
      <li>A <strong>well-managed iterative and incremental lifecycle</strong>.</li>
    </ol>
    <h3>Trait 1: a strong architectural vision</h3>
    <p>IEEE 1471 defines architecture as a system’s fundamental organization: its components, how they relate to each other and to the environment, and the principles that guide its design and evolution. Most definitions agree that architecture covers both structure and behavior, deals only with significant decisions, may follow an architectural style, is shaped by stakeholders and environment, and records the rationale behind decisions.</p>
    <p>A sound architecture gives a system <strong>conceptual integrity</strong>, which Brooks called the most important consideration in system design. End users rarely see it, but a clean internal structure is what makes a system understandable, extensible, maintainable and testable. A clear architecture also reveals common abstractions and mechanisms; exploiting them makes systems smaller, simpler and more reliable. Without one, the book warns, you get the software equivalent of sludge.</p>
    <p>Good architectures share three attributes:</p>
    <ul>
      <li><strong>Well-defined layers of abstraction.</strong> Each layer is a coherent abstraction with a controlled interface, built on equally well-defined lower layers.</li>
      <li><strong>Interface separated from implementation.</strong> A layer’s implementation can change without breaking the assumptions of its clients.</li>
      <li><strong>Simplicity.</strong> Common behavior comes from common abstractions and common mechanisms.</li>
    </ul>
    <div class="aside"><b>What about agile?</b> Agile processes favour simple, emergent design and refactoring instead of architecture up front, so the architecture evolves over time. The book’s point is that <em>when</em> and <em>how</em> you develop the architecture can vary, but having an architectural vision cannot. Without one, the system gets harder to evolve.</div>
    <h3>Trait 2: an iterative and incremental lifecycle</h3>
    <p>In a few mature domains the problem is so well understood that development can be almost fully codified. Most real systems aren’t like that: they balance a unique mix of functional and performance requirements and need the team’s full creativity. That calls for an iterative, incremental process.</p>
    <p><strong>Iterative and incremental development</strong> means delivering functionality in a series of releases (iterations), each more complete than the last (increments). Releases may be internal or external. What goes into each iteration is chosen to <strong>retire the most critical risks first</strong>, and the lessons from one iteration feed the next. This approach underpins most modern methods, including XP and Scrum.</p>
    <div class="tablewrap"><table>
      <thead><tr><th>Advantage of iterating</th><th>Why</th></tr></thead>
      <tbody>
        <tr><td>Requirements changes are accommodated</td><td>Each iteration focuses on a specific set of requirements.</td></tr>
        <tr><td>No “big bang” integration</td><td>Every iteration integrates what it builds, so integration is continual.</td></tr>
        <tr><td>Risks are addressed early</td><td>Early iterations tackle key risks and surface new ones while they’re cheap to handle.</td></tr>
        <tr><td>Tactical product changes are possible</td><td>You can adjust the product or release early, for example to answer a competitor.</td></tr>
        <tr><td>Reuse is easier</td><td>Key architectural components exist early, so reusable pieces are easier to spot.</td></tr>
        <tr><td>Defects are found earlier</td><td>Testing happens every iteration, not only at the end.</td></tr>
        <tr><td>People are used more effectively</td><td>Team members play several roles instead of passing work down a pipeline of handoffs.</td></tr>
        <tr><td>The team learns along the way</td><td>Problems in one iteration are fixed in the next.</td></tr>
        <tr><td>The process improves</td><td>Each iteration ends with an assessment of what worked and what didn’t.</td></tr>
      </tbody>
    </table></div>
  </section>

  <section class="chap" id="s6-1b">
    <h2><span class="num">6.1</span>Agile or plan-driven? Toward a rational process</h2>
    <p>Parnas and Clements argued that no process will ever let us design software in a perfectly rational way, but that we can “fake it”: following an agreed ideal process beats working ad hoc, and makes progress measurable. Booch adds that the process must be <strong>well-managed</strong> (controllable and measurable) without being so rigid that it stifles creativity.</p>
    <p>Rather than a binary choice between RUP, XP, Scrum, Crystal and the rest, every process sits somewhere on a <strong>continuum</strong> with agile at one end and plan-driven at the other.</p>
    <div class="tablewrap"><table>
      <thead><tr><th>Agile processes tend to be…</th><th>Plan-driven processes tend to be…</th></tr></thead>
      <tbody>
        <tr><td>Lightweight, low ceremony</td><td>Heavier, more ceremony and documented artifacts</td></tr>
        <tr><td>Reliant on the team’s tacit knowledge</td><td>Reliant on well-documented processes</td></tr>
        <tr><td>Tactical: don’t build for an unknown future</td><td>Strategic: a strong architectural framework that absorbs future change</td></tr>
        <tr><td>Built on close customer collaboration</td><td>Built on an up-front customer contract</td></tr>
        <tr><td>Self-organizing teams</td><td>Managed and controlled, with explicit milestones</td></tr>
        <tr><td>Emergent: the process evolves as it runs</td><td>Defined up front, then continually improved</td></tr>
      </tbody>
    </table></div>
    <p>For agile, the process is a means to an end: deliver what the customer needs now, as fast as possible. For plan-driven, a predictable, repeatable process is itself a goal. Neither is “all process” or “all creativity”: agile still has process, and an iterative plan-driven process with time for prototyping leaves plenty of room for invention.</p>
  </section>
  <figure class="wide">
    <div class="plate" data-dg="continuum"></div>
    <div class="checkcols" id="traits"></div>
    <div class="note" id="contNote" aria-live="polite"></div>
    <figcaption><span class="src ill">Course illustration</span><b>Figure A.</b> Find your place on the continuum. Tick the traits from the book’s Table 6–1 that describe your project, and the marker moves toward the side with more matches.</figcaption>
  </figure>
  <h3>Choosing your process in two steps</h3>
  <ol>
    <li><strong>Locate yourself</strong> on the continuum by comparing your project and organization with the characteristics in Table 6–1.</li>
    <li><strong>Pick the framework from the nearer end</strong>, then borrow techniques from the other end in proportion to how far you are from that end.</li>
  </ol>
  <p>Let <strong>risk</strong> decide: is it riskier to use a given practice or to go without it? The style can also change over the lifecycle, with more agility early and more rigor later. Treat the process like a recipe you adjust to your ingredients and guests, and keep refining it after every iteration: keep what worked, drop what didn’t, repeat.</p>

  <!-- 6.2 -->
  <section class="chap" id="s6-2">
    <h2><span class="num">6.2</span>The macro process: the software development lifecycle</h2>
    <p>The macro process is the controlling framework for the whole team. It runs from the first idea to the first version of the system that implements it; later versions, for evolution or maintenance, are new runs of the macro process. As its example the chapter uses the <strong>RUP lifecycle</strong>: plan-driven, but architecture-focused and iterative, which supports both of the traits from 6.1.</p>
    <p>Its <strong>primary product</strong> is a stream of executable releases, each a refinement of the last. Secondary products are behavioral prototypes, to explore designs and the system’s “dark corners”, and documentation that records design decisions and rationale.</p>
    <div class="aside"><b>On documentation.</b> Its audience is rarely the current team; it’s integrators, DBAs, operations, help desk staff and future team members. So write a document only if someone will read it later, let it evolve with the system, and generate it from the process where you can.</div>
    <p>The book describes the macro process along two dimensions: <strong>content</strong> (what is done: roles, tasks, work products, grouped into disciplines) and <strong>time</strong> (when it is done: milestones, phases and iterations).</p>
    <h3>The content dimension: disciplines</h3>
  </section>
  <figure class="wide">
    <div class="plate" data-dg="disciplines"></div>
    <figcaption><span class="src book">From the book</span><b>Figure 6–1, redrawn.</b> Five disciplines run in relative order; three run throughout. One pass through all of them is one iteration.</figcaption>
  </figure>
  <dl class="notation">
    <dt>1. Requirements</dt><dd>Agree with customers and stakeholders on what the system should do, and set its boundaries.</dd>
    <dt>2. Analysis and design</dt><dd>Turn requirements into a design that specifies the implementation, including a robust architecture and the common mechanisms all parts must use.</dd>
    <dt>3. Implementation</dt><dd>Implement, unit test and integrate the design into an executable system.</dd>
    <dt>4. Test</dt><dd>Check that the implementation fulfills the requirements and works as designed.</dd>
    <dt>5. Deployment</dt><dd>Make the tested product available to its end users.</dd>
    <dt>Project management</dt><dd>Planning, staffing, monitoring and managing risk, throughout.</dd>
    <dt>Configuration and change management</dt><dd>Identify configuration items and control changes to them, throughout.</dd>
    <dt>Environment</dt><dd>Provide the processes and tools the team uses, throughout.</dd>
  </dl>
  <p>The order doesn’t make it a waterfall. A waterfall makes <em>one</em> pass through the disciplines for the whole system. An iterative process makes <em>many</em> passes, and how much work each discipline gets in a pass depends on where you are in the lifecycle.</p>

  <section class="chap" id="s6-2b">
    <h2><span class="num">6.2</span>The time dimension: milestones and phases</h2>
    <p>Iterations alone could go round in circles forever. A series of <strong>milestones</strong> gives them a strategic frame: each milestone is reached by one or more iterations and ends with an assessment. Pass it and you move to the next phase.</p>
    <p>The book is emphatic that milestones are <strong>quality or maturity gateways, not dates</strong>. If the planned date arrives and the project hasn’t reached the required maturity, the date slips; the criteria don’t.</p>
  </section>
  <figure class="wide">
    <div class="plate" data-dg="lifecycle"></div>
    <div class="note" id="phaseNote" aria-live="polite"></div>
    <figcaption><span class="src book">From the book</span><b>Figure 6–2, redrawn.</b> Phases, iterations and the milestones that end each phase. Click a phase for its purpose, activities, work products and milestone.</figcaption>
  </figure>
  <h3>Measures worth knowing</h3>
  <ul>
    <li><strong>Architectural stability</strong>, at the end of Elaboration, is measured mainly by the <em>rate of change of key architectural interfaces and mechanisms</em>. Local changes are normal; frequent changes to key elements mean Elaboration isn’t finished.</li>
    <li><strong>Defect-discovery rate</strong>, during Construction, is how fast new errors are found. It normally surges after each release. A <em>stagnant</em> rate usually means errors are going undiscovered; an <em>off-scale</em> rate means the architecture isn’t stable yet or new elements are badly designed. Either way, the system isn’t ready for end users.</li>
    <li>In <strong>Transition</strong>, the measure is again a falling defect rate, but now the defects are reported by early adopters.</li>
  </ul>
  <h3>Phases in agile methods</h3>
  <p>Agile methods have phases too, and they line up closely with RUP’s:</p>
  <div class="tablewrap"><table>
    <thead><tr><th>Common purpose</th><th>RUP</th><th>XP</th><th>Scrum</th></tr></thead>
    <tbody>
      <tr><td>Envisioning, feasibility, scoping</td><td>Inception</td><td>Exploration</td><td>Planning</td></tr>
      <tr><td>Release and iteration planning</td><td>Elaboration</td><td>Planning</td><td>Staging</td></tr>
      <tr><td>Implementing and testing</td><td>Construction</td><td>Iterations to release</td><td>Development (sprints)</td></tr>
      <tr><td>Productizing and deploying</td><td>Transition</td><td>Productionizing</td><td>Release</td></tr>
      <tr><td>After release</td><td>New lifecycle</td><td>Maintenance</td><td>—</td></tr>
    </tbody>
  </table></div>
  <p class="hint">The row alignment is a simplification for comparison; the book lists the phases of each method and the four shared purposes, not a one-to-one mapping.</p>

  <section class="chap" id="s6-2c">
    <h2><span class="num">6.2</span>Iterations and release planning</h2>
    <p>Inside each phase, iterations may touch every discipline, but the balance shifts. Inception leans on requirements, Elaboration on analysis and design (especially architecture), Construction on implementation and test, and Transition on deployment. Project management, configuration and change management, and environment run throughout.</p>
  </section>
  <figure class="wide">
    <div class="plate" data-dg="focus"></div>
    <div class="chips" id="focusBtns" aria-label="Choose a phase"></div>
    <figcaption><span class="src ill">Course illustration</span><b>Figure B, based on Figure 6–3.</b> The shifting focus of iterations. The book shows which disciplines dominate in each phase; the bar heights here are illustrative.</figcaption>
  </figure>
  <p>End every iteration with a <strong>postmortem</strong>: assess the system, the environment and the team, and use it to adjust the plan and the process. Recommended iteration lengths differ by method:</p>
  <div class="tablewrap"><table>
    <thead><tr><th>Method</th><th>Recommended iteration length</th></tr></thead>
    <tbody><tr><td>XP</td><td>One to two weeks</td></tr><tr><td>Scrum</td><td>30 days per sprint</td></tr><tr><td>RUP</td><td>Two to six weeks</td></tr></tbody>
  </table></div>
  <h3>Analysis and design across the lifecycle</h3>
  <p>Analysis is most visible early, in Inception and Elaboration, when you analyse the architecturally significant requirements, and tapers off later. Design may start in Inception (for example, if you’ll build on existing components), peaks in the early architectural iterations, and later shifts to peripheral and supporting elements.</p>
  <h3>Release planning</h3>
  <p>Release planning defines a controlled series of releases that grow in functionality until they cover the full production system. Its input is the scope plus constraints such as cost, time and quality; its output is a development plan of releases, team activities and risk assessments.</p>
  <figure class="wide">
    <div class="plate" data-dg="release"></div>
    <figcaption><span class="src ill">Course illustration</span><b>Figure C.</b> The release-planning activities from the book as an activity diagram. After every iteration the plan is reassessed, which is what makes it risk-driven.</figcaption>
  </figure>
  <dl class="notation">
    <dt>Set the heartbeat</dt><dd>Choose the average iteration length. As a guide, a release every 2–6 weeks for a 6–12 month project, every 2–3 months for 12–18 months, and around every six months for much larger efforts. Longer gaps are suspect: they don’t force closure and can hide risk.</dd>
    <dt>Prioritize requirements</dt><dd>Functional and nonfunctional, weighing benefit to stakeholders, architectural impact and coverage, and the risks they retire. Weights change by phase (architecture counts most in Elaboration), and priorities are revisited every iteration by a mixed team: user representative, domain expert, analyst, architect and QA.</dd>
    <dt>Allocate to iterations</dt><dd>Highest priorities first. Each iteration needs a demonstrable capability and clear evaluation criteria.</dd>
    <dt>Internal or external</dt><dd>Early releases are mostly internal and go to QA; later ones go to selected alpha and beta users with carefully set expectations. Releases are costly, especially external ones, so quality can become a bargaining chip under fixed cost, time or scope.</dd>
    <dt>Plan iterations just in time</dt><dd>The overall release plan is made up front; the detailed plan for an iteration is made only when it starts. Precision too early is, in the book’s view, often just dishonest.</dd>
  </dl>
  <h3>Two sidebars worth remembering</h3>
  <p><strong>Prototyping.</strong> A behavioral prototype explores one isolated element, such as an algorithm, a UI model or a database schema, to resolve risk quickly without endangering the production releases. It is deliberately incomplete and meant to be thrown away. Every significant new system should start with a proof of concept, and it’s far better to discover wrong assumptions then than later. Prototypes shouldn’t grow into production code without a compelling reason, and meeting a short-term deadline is explicitly not one.</p>
  <p><strong>Post-transition evolution and maintenance.</strong> Lehman and Belady observed that a program used in the real world must keep changing or become less useful (<em>continuing change</em>), and that its structure grows more complex unless you actively work against it (<em>increasing complexity</em>). Each new release re-runs a lifecycle sized to the change: a small fix may be mostly Transition, while a major release needs Inception and Elaboration too. A <strong>change request list</strong> collects defects and enhancements for prioritizing, and urgent operational problems may need patches outside the normal release rhythm.</p>

  <!-- 6.3 -->
  <section class="chap" id="s6-3">
    <h2><span class="num">6.3</span>The micro process: analysis and design</h2>
    <p>The micro process runs inside the macro process. The macro process sets its scope, hands it requirements (plus any specifications from earlier micro iterations), and takes back design specifications, most importantly the architecture, to implement, test and deploy.</p>
  </section>
  <figure class="wide">
    <div class="plate" data-dg="microInMacro"></div>
    <figcaption><span class="src book">From the book</span><b>Figure 6–4, redrawn.</b> The micro process takes the place of the analysis and design discipline within the macro process.</figcaption>
  </figure>
  <h3>Analysis versus design</h3>
  <p>The micro process deliberately blurs the old analysis and design phases into a continuum of <strong>levels of abstraction</strong>.</p>
  <div class="tablewrap"><table>
    <thead><tr><th></th><th>Analysis</th><th>Design</th></tr></thead>
    <tbody>
      <tr><td>Purpose</td><td>Model the system’s behavior: understand the problem a little better</td><td>Invent the elements that provide the behavior analysis requires</td></tr>
      <tr><td>Focus</td><td>Behavior, not form: <em>what</em> the system does, not how</td><td>A specification that can be implemented efficiently</td></tr>
      <tr><td>Main skill</td><td>Discovery, alongside domain experts</td><td>Invention, from the solution domain</td></tr>
      <tr><td>Done when</td><td>It represents the requirements accurately, is consistent, and is a good basis for design</td><td>It is detailed enough to implement and test</td></tr>
    </tbody>
  </table></div>
  <div class="aside pitfalls"><b>Two failure modes.</b> <em>Premature design</em> starts building before analysis reaches closure. <em>Analysis paralysis</em> keeps polishing an analysis that can never be perfect. The book’s rule: analyse all the primary behaviors and a sprinkling of secondary ones, then design. Building the system raises questions no amount of analysis would have uncovered efficiently.</div>
  <h3>Architectural versus component concerns</h3>
  <p>Architecture is about the relationships between parts: their responsibilities, interfaces and collaborations. It is strategic. Component analysis and design looks inside each part to see how it meets the requirements the architecture places on it, which is more tactical. Combining the two concerns with the two disciplines gives four focuses.</p>
  <figure class="wide">
    <div class="plate" data-dg="levels"></div>
    <div class="controls">
      <button class="btn primary" id="lvStart">Walk through an Elaboration iteration</button>
      <button class="btn" id="lvPrev">Previous</button>
      <button class="btn" id="lvNext">Next</button>
      <button class="btn" id="lvAll">Reset</button>
      <span class="hint" id="lvCount"></span>
    </div>
    <div class="note" id="lvNote" aria-live="polite">The book’s example follows the architecturally significant requirements of one Elaboration iteration through these four focuses. Press the button to step through it.</div>
    <figcaption><span class="src book">From the book</span><b>Figure 6–5, redrawn.</b> The varying focus of analysis and design. The walkthrough follows the five-step scenario in the chapter, including “going deep” on a risky element.</figcaption>
  </figure>
  <p>The number of levels can’t be fixed in advance; it depends mostly on the system’s size. If a component turns out too large to analyse, step back and do another round of architectural analysis to split it. What to take down a level, and when, is <strong>opportunistic and risk-based</strong>: you can dive deep on one poorly understood element, then come back up.</p>

  <h3>The four activities</h3>
  <p>At any level of abstraction and for any scope, the micro process runs the same four activities. They are listed in order but in practice overlap; with experience you need fewer passes.</p>
  <figure class="wide">
    <div class="plate" data-dg="cycle"></div>
    <div class="note" id="cycNote" aria-live="polite"></div>
    <figcaption><span class="src book">From the book</span><b>Figures 6–6 and 6–7, redrawn.</b> The micro process activities and their iterations. Click an activity for its purpose, products, steps and measure of success.</figcaption>
  </figure>
  <h3>Products of the micro process</h3>
  <ul>
    <li>The <strong>architecture description</strong>: the system’s architecture, including its common mechanisms and the architecturally significant parts of the model.</li>
    <li>The <strong>analysis/design model</strong>: the elements, how they’re organized, and the <em>realizations</em> showing how each behavioral requirement is achieved by those elements.</li>
  </ul>
  <p>The model gives the team a shared vocabulary, a central repository that newcomers can browse, and a global view in which architects spot commonalities. UML makes inconsistencies easier to see.</p>
  <p><strong>One model or two?</strong> A separate analysis model pays off for systems that will live for decades, have several variants, or target several platforms, where it acts as a platform-independent view (the idea behind OMG’s Model Driven Architecture). Otherwise, keeping two models in sync is costly, and the analysis model can simply evolve into the design model.</p>
  <h3>Documenting the architecture: the 4+1 views</h3>
  <p>Following IEEE 1471, an architect describes the system through <strong>views</strong>, each guided by a <strong>viewpoint</strong> that names the models, the stakeholders and the concerns it addresses. Kruchten’s 4+1 set is a simple starting point:</p>
  <div class="tablewrap"><table>
    <thead><tr><th>View</th><th>Describes</th></tr></thead>
    <tbody>
      <tr><td>Requirements (use case) view, the “+1”</td><td>The architecturally significant requirements. Significant functional ones drive the scenarios analysed early; nonfunctional ones (qualities such as performance, security and scalability, plus economic, technology and regulatory constraints) are usually the most architecturally significant and drive the mechanisms.</td></tr>
      <tr><td>Logical view</td><td>Significant analysis and design elements, their organization into components, packages and layers, a few key realizations, and the main mechanisms and patterns.</td></tr>
      <tr><td>Implementation view</td><td>Key implementation elements such as executables and directories. It matters for parallel development, configuration management, integration and testing.</td></tr>
      <tr><td>Process view</td><td>Independent threads of control and which logical elements take part in them.</td></tr>
      <tr><td>Deployment view</td><td>Nodes such as computers, routers and containers, and which elements are allocated to them.</td></tr>
    </tbody>
  </table></div>
  <p>The name records a debate over whether requirements count as an architectural view; they’re included because they shape the architecture and should be traced to the other views. Add views you need (data, user experience) and drop ones you don’t. On some projects all of this lives in a <strong>software architecture document (SAD)</strong>, organized by view, reviewed with the team and kept up to date.</p>

  <section class="chap" id="s6-3b">
    <h2><span class="num">6.3</span>The four activities in depth</h2>
    <h3>1. Identifying elements</h3>
    <p>This activity finds the elements that describe the solution at the current level. It is really an <em>evolution</em>: elements at one level become the input for identifying elements at the next. Keep descriptions brief here; later activities refine them. (“Element” is the book’s general term for whatever you’re working with: an analysis class, a component, a design class.)</p>
  </section>
  <div class="tablewrap"><table>
    <thead><tr><th>Focus</th><th>Elements identified</th><th>Why</th></tr></thead>
    <tbody>
      <tr><td rowspan="3">Architectural analysis</td><td>Key abstractions</td><td>Form the domain vocabulary early, so concepts aren’t defined in conflicting ways later.</td></tr>
      <tr><td>Architectural partitions</td><td>Separate areas of concern and give the system its high-level logical organization. In a layered architecture, the partitions are the layers.</td></tr>
      <tr><td>Analysis mechanisms</td><td>Placeholders for common services and policies, foundational (persistence, security, error handling, transactions) or domain-specific, described without implementation detail so analysts solve them consistently.</td></tr>
      <tr><td rowspan="3">Architectural design</td><td>Architecturally significant design elements</td><td>Encapsulate business behavior or data access, specified so they can be implemented efficiently.</td></tr>
      <tr><td>Architectural partitions</td><td>Refined from analysis; used to cluster design elements.</td></tr>
      <tr><td>Design mechanisms</td><td>Analysis mechanisms refined to specific technologies.</td></tr>
      <tr><td>Component analysis</td><td>Analysis classes</td><td>The first object-oriented decomposition of the solution, each with cohesive responsibilities.</td></tr>
      <tr><td>Component design</td><td>Design classes</td><td>As in architectural design but at a lower level, detailed enough to implement.</td></tr>
    </tbody>
  </table></div>
  <p class="hint">Based on the book’s Table 6–2.</p>
  <p>Analysis leans on <strong>discovery</strong>; design leans on <strong>invention</strong>. Some analysis elements become classes, others turn out to be attributes or synonyms, and some are simply wrong, which is fine as long as decisions stay open. Elements are fluid in analysis and solidify in design. Good candidates to become design elements are analysis classes with non-trivial responsibilities, groups whose information should be managed together, groups that collaborate in the same realizations, and groups with the same responsibilities. Patterns and design principles also shape the refinement, and it’s always worth studying similar systems and reusable assets.</p>
  <p>If you keep separate models per level, maintain <strong>traceability</strong> between them so you can assess the impact of changes.</p>
  <p><strong>Done when</strong> you have an ample set of consistently named and described abstractions, and the model isn’t changing wildly on each pass. Finding architecturally significant elements late in the lifecycle points to a flaw in requirements, analysis or design.</p>

  <h3>2. Defining element collaborations</h3>
  <p>This activity describes how the elements work together to deliver the required behavior by distributing responsibilities sensibly. The product is a set of <strong>realizations</strong>, the link between requirements and solution, documented with sequence and communication diagrams, plus state machines for elements whose state drives their collaborations. In analysis, a phrase or a sentence per responsibility is enough; anything longer suggests the responsibility should be split.</p>
  <p><strong>Behavior analysis</strong>, typically use case analysis:</p>
  <ol>
    <li>Pick a scenario or set of scenarios.</li>
    <li>Identify the elements involved.</li>
    <li>Walk through the scenario, giving each element responsibilities. Focus on behavior; add attributes only where essential to the conceptual model.</li>
    <li>Rebalance: split big responsibilities, merge trivial ones, split elements whose responsibilities are disjoint.</li>
    <li>In design, also consider concurrency and distribution, and add or remove paths between objects.</li>
  </ol>
  <p><strong>Pattern scavenging</strong>: look across realizations for repeated interactions, responsibilities and operation signatures, remove gratuitous differences, and capture common collaborations as documented mechanisms, which protects the architectural vision.</p>
  <p><strong>Checkpoints:</strong> responsibilities are balanced (no element “does it all”), consistent within each element, not duplicated across elements, sufficient for the flows each element takes part in, and simple and clear. You don’t need a realization for every scenario, just the primary ones and a meaningful set of secondary ones.</p>

  <h3>3. Defining element relationships</h3>
  <p>Relationships give the solution its shape; at the architectural level they define the system’s overall structure. Draw the interesting ones, where a relationship reflects a fundamental decision or a detail needed for implementation, not every possible view. A good starting set is one diagram per realization.</p>
  <ol>
    <li><strong>Identify associations</strong>: wherever two elements must collaborate or navigate to each other, there must be a relationship. Associations are the weakest kind, which is exactly why they suit analysis: they avoid premature design decisions.</li>
    <li><strong>Refine them</strong>: a simple use becomes a dependency; a structural whole–part becomes aggregation or composition; shared structure or behavior can become inheritance or a parameterized element; constrain navigation to one direction where two-way isn’t needed; add roles and multiplicities only where they matter.</li>
  </ol>
  <figure class="wide">
    <div class="plate" data-dg="refine"></div>
    <div class="chips" id="refineBtns" aria-label="Choose a stage"></div>
    <div class="note" id="refineNote" aria-live="polite"></div>
    <figcaption><span class="src ill">Course illustration</span><b>Figure D.</b> The same four elements, from the ShopFast example in the Chapter 5 course, before and after refining associations.</figcaption>
  </figure>
  <p><strong>Measures:</strong> consistency (if two elements collaborate in a realization, they have a relationship), cohesion, coupling and completeness, so the next level doesn’t need new significant relationships. Relationships that are awkward to specify mean the elements aren’t right yet.</p>

  <h3>4. Detailing element semantics</h3>
  <p>The first three activities look at elements from the outside; this one looks at each element on its own, defining behavior and attributes consistently across every scenario it takes part in, in enough detail to move to the next level. It comes <strong>last on purpose</strong>: deferring detailed decisions avoids premature choices that rule out smaller, simpler architectures and leaves room to change internal representations later.</p>
  <ol>
    <li>Collect each element’s responsibilities from all its incoming collaborations. Its responsibilities are everything others can ask it to do.</li>
    <li>Describe each in more detail with activity, sequence or state machine diagrams; suggest algorithms; in design, add helper operations and weigh storing versus calculating state.</li>
    <li>In design, consider inheritance and delegation, and choose representations that optimize for the expected use.</li>
    <li>Add the attributes the responsibilities need.</li>
    <li>In design, define operations: make each primitive, settle a common policy for construction, copying and destruction, and round out completeness without sacrificing simplicity.</li>
  </ol>
  <div class="aside pitfalls"><b>Inheritance comes late.</b> It is tempting to build elaborate hierarchies during analysis, but introducing inheritance too soon often costs type integrity. Treat it as a design activity, keep the lattice balanced (not too tall, short, wide or skinny), and place each operation at the level where its users need it.</div>
  <p class="codehead">One element at three levels of abstraction. Each level adds only the detail the next one needs.</p>
<pre><code class="ts">// Analysis: a responsibility, one sentence, no representation
//   PaymentHandler: "takes payment for an order"

// Design: a named protocol on an interface
interface PaymentGateway {
  charge(amount: Money): PaymentResult;
}

// Detailed design: full signatures, ready to implement and test
interface PaymentGateway {
  charge(amount: Money, idempotencyKey: string): Promise&lt;PaymentResult&gt;;
  refund(paymentId: string, amount?: Money): Promise&lt;RefundResult&gt;;
}</code></pre>
  <p><strong>Done when</strong> each element’s semantics are sufficient, primitive and complete for the current level: informal responsibilities and attributes in analysis, implementable operations and attributes in design. Not exhaustive detail, just enough for a competent implementer. The main measure is <strong>simplicity</strong>: complex, awkward or inefficient semantics mean the element itself is wrong or poorly represented.</p>
