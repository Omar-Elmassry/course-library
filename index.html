<template id="tpl-pddw-04">
  <h1>Fundamentals of database design</h1>
  <p class="lede">A crash course on Chapter 4 of <em>Practical Database Design for the Web</em>: why you model before you build, how to read a crow’s-foot ER diagram, the five relationship structures that keep coming back, the three kinds of integrity rule a database can enforce for you, when to bend normalization for speed, and how CASE tools turn diagrams into databases.</p>
  <p class="byline">Hover or tap any part of a diagram for an explanation, and use the Full screen button on any figure. Interactive pieces: the modeling cycle, an ER-diagram anatomy filter, foreign-key row tracers for one-to-many and many-to-many, a tree you can corrupt, two sub-type layouts, a domain-decision explorer and a referential-integrity simulator. Figures marked <span class="src book">From the book</span> are redrawn from the chapter; <span class="src ill">Course illustration</span> marks diagrams drawn for this course. Notes marked <em>Then vs now</em> are course additions: the book was written around 2002–2003. The book’s headings are unnumbered; the section numbers here follow their order.</p>

  <!-- 4.1 -->
  <section class="chap" id="p4-1">
    <h2><span class="num">4.1</span>Data modeling</h2>
    <p>A <strong>data model</strong> is an abstract picture of the part of the real world your application cares about. Modeling means keeping the information that matters, dropping what doesn’t, and making the relationships between things explicit. Once you have the model, you generate the tables in your RDBMS from it.</p>
    <p>The chapter’s argument for doing this on purpose: a web application leans entirely on its data, and the graphical table editors that ship with databases tempt you to design “by hand”, one table at a time. That works for a handful of tables. Beyond that you need an overview of the whole system, and a good design is what lets a small database keep growing as requirements change.</p>
    <h3>Why bother modeling?</h3>
    <p>You are building a model anyway, even if only in your head. Writing it down lets you share it with other developers, with the customer, and with yourself after the weekend. Like an architect’s drawing, one misplaced item can sink the project later, and it is far cheaper to fix on paper than months after the site goes live.</p>
    <p>Modeling is <strong>iterative</strong>. Customers rarely know exactly what they need; showing them the model helps them understand their own problem and explain it better, and modeling turns up the questions you didn’t know to ask. Click each phase below.</p>
  </section>
  <figure class="wide">
    <div class="plate" data-dg="cycle"></div>
    <div class="note" id="cycleNote" aria-live="polite"></div>
    <figcaption><span class="src book">From the book</span><b>Book figure, p. 102, redrawn.</b> The data-modeling process. The book draws the phases as circles; the wording is shortened here.</figcaption>
  </figure>
  <p>Two more payoffs. A model is <strong>independent of the database product</strong>, so analysis results (storage size, target response times) can inform which platform you pick, and you can prototype on a desktop database and move to a production server later. And when you inherit a legacy system, extracting its structure into a model explains the original design far better than pages of DDL.</p>
  <div class="aside pitfalls"><b>Common mistakes.</b> Opening the database GUI and creating tables before anyone has agreed what the data is. Treating the first model as final: one interview with the client usually raises more questions than it answers, and the next loop of the cycle is where you ask them.</div>

  <!-- 4.2 -->
  <section class="chap" id="p4-2">
    <h2><span class="num">4.2</span>Entities, attributes and relationships</h2>
    <p>The book uses <strong>Entity Relationship (ER) modeling</strong>, the most common approach, which has three building blocks. Its first example is an online bookstore that stores books and their publishers. The diagrams use <strong>crow’s-foot notation</strong> and were drawn in Microsoft Visio; other tools draw the symbols a little differently, but the ideas are the same.</p>
    <dl class="notation">
      <dt>Entity</dt><dd>An abstract representation of a real-world thing; it becomes a <strong>table</strong>. Drawn as a box with its name in the header. Most tools let you hide the attributes when a big model needs an overview.</dd>
      <dt>Attribute</dt><dd>A property of an entity; it becomes a <strong>column</strong>. In this notation each attribute row has three parts: a key marker (<code>PK</code>, or <code>FK</code> plus a number that just tells foreign keys apart), the name, and the data type. Primary-key attributes sit in their own section at the top. <strong>Bold</strong> attributes may not be null.</dd>
      <dt>Relationship</dt><dd>How entities interact; drawn as a line between them. The symbols at each end give the <strong>cardinality</strong> (a fork means many, a single bar means one) and the <strong>optionality</strong> (a circle means optional, a bar beside it means mandatory).</dd>
    </dl>
  </section>
  <figure class="wide">
    <div class="plate" data-dg="bookEr"></div>
    <div class="chips" id="bookErBtns" aria-label="Highlight a part of the diagram"></div>
    <div class="note" id="bookErNote" aria-live="polite"></div>
    <figcaption><span class="src book">From the book</span><b>Book figures, pp. 103–105, redrawn.</b> Books and Publishers with the book’s callouts for entities, attributes, the relationship, and its many and one ends.</figcaption>
  </figure>
  <p>Read the line from each side: a book <em>must</em> have exactly one publisher (two bars at the Publishers end), and a publisher may have <em>zero or many</em> books (circle and fork at the Books end). The foreign key <code>PublisherID</code> lives on the many side.</p>
  <p>Notice something missing. The bookstore wanted to know how many books each publisher has in the catalog, but there is no attribute for it. Storing the count would be <strong>redundant</strong>: you can get it from the books themselves with <code>COUNT</code> (Chapter 3). Section 4.7 revisits this trade-off.</p>
  <div class="aside"><b>Reading Visio lines (course addition).</b> The book doesn’t explain line styles, but its figures follow Visio’s convention: a <strong>dashed</strong> line is a non-identifying relationship (the foreign key is an ordinary column), and a <strong>solid</strong> line is identifying (the foreign key is part of the child’s primary key, as in OrderItems below).</div>
  <div class="aside pitfalls"><b>Common mistakes.</b> Reading crow’s feet backwards: the symbol <em>next to</em> an entity says how many of <em>that</em> entity relate to one row on the other side. Also, storing values you can derive, such as counts and totals, as ordinary columns “for convenience”.</div>

  <!-- 4.3 -->
  <section class="chap" id="p4-3">
    <h2><span class="num">4.3</span>Common structures</h2>
    <p>Most models are assembled from a few recurring patterns of related tables, named by the cardinality of their relationships. Learn to spot them and you have a toolkit for most real-world data. From most to least common, the chapter covers <strong>one-to-many</strong>, <strong>many-to-many</strong>, <strong>one-to-many recursive</strong>, <strong>many-to-many recursive</strong> and <strong>one-to-one</strong>. Most examples come from a small hypothetical sports-clothing e-commerce store, whose full diagram ends this section.</p>

    <h3>One-to-many</h3>
    <p>One row in a <strong>parent</strong> table relates to many rows in a <strong>child</strong> table, but each child row has only one parent. You’ll find it in nearly every database. The child stores the parent’s key in a foreign-key column. The book’s first example is Categories and Products: each product’s <code>CategoryID</code> says which category it sits in, and the Tracksuits category holds three products. Strictly the many end can be zero, one or many, but nobody says “one-to-zero-one-or-many”.</p>
  </section>
  <figure class="wide">
    <div class="plate" data-dg="oneMany"></div>
    <div class="chips" id="oneManyBtns" aria-label="Pick a customer"></div>
    <div class="note" id="oneManyNote" aria-live="polite"></div>
    <figcaption><span class="src book">From the book</span><b>Book figures and sample data, p. 107, redrawn.</b> Customers and Orders. The book shows the data as Access tables; the order dates are copied as printed.</figcaption>
  </figure>

  <h3>Many-to-many</h3>
  <p>A student takes many classes and a class holds many students. People grasp this easily, but a relational database can’t store it directly. The only way to do it in two tables is a repeating group of foreign-key columns (<code>Class1</code>, <code>Class2</code>…), which caps how many you can have and isn’t a true many-to-many at all.</p>
  <p>The fix is a third table, an <strong>associative entity</strong> (also called a joining table). It holds one row per pairing and turns the many-to-many into two one-to-many relationships. In the store, <strong>OrderItems</strong> links Orders and Products. Its key is the pair of foreign keys, and it carries facts about the pairing itself: the quantity ordered and the price actually paid at the time.</p>
  <figure class="wide">
    <div class="plate" data-dg="manyMany"></div>
    <div class="chips" id="manyManyBtns" aria-label="Follow an order or a product"></div>
    <div class="note" id="manyManyNote" aria-live="polite"></div>
    <figcaption><span class="src book">From the book</span><b>Book figure and sample data, p. 108, redrawn.</b> Orders, OrderItems and Products. Some data columns (OrderDate, ProductDescription, CategoryID) are left out of the data tables to save space.</figcaption>
  </figure>
  <p>Often the associative table has nothing but the two keys. The book’s example links <strong>User</strong> and <strong>Group</strong> through <strong>UserGroup</strong>, a name made by joining the two table names, a common convention for pure link tables. Here it is as SQL (a course addition; the book shows only the diagram):</p>
  <p class="codehead">PostgreSQL · a pure link table</p>
<pre><code class="sql">CREATE TABLE user_group (
  user_guid UUID NOT NULL REFERENCES "user"(user_guid),
  group_id  INT  NOT NULL REFERENCES "group"(group_id),
  PRIMARY KEY (user_guid, group_id)   -- a user joins a group once
);</code></pre>
  <p><strong>One-to-many or many-to-many?</strong> A many-to-many structure can hold one-to-many data, but not the reverse. To decide, say the relationship out loud in both directions and put both sentences to the customer as questions: <em>Can a user belong to many groups? Can a group contain many users?</em> Two yeses mean many-to-many.</p>
  <div class="aside pitfalls"><b>Common mistakes.</b> Repeating columns (<code>product1</code>, <code>product2</code>…) or a comma-separated list instead of a link table. Forgetting that the link table is a good home for facts about the pairing: the price paid belongs on OrderItems, not Products, because the product price will change.</div>

  <h3>One-to-many recursive</h3>
  <p>A <strong>recursive</strong> (or reflexive) relationship relates a table to itself. The classic use is a tree. Stores nest categories inside categories; on Amazon this book might sit under Computers, then Databases, then Database Design. Give <strong>Categories</strong> a <code>ParentCategory</code> column that is a foreign key to its own <code>CategoryID</code>. Rows with no parent (null) are the top level; every other row points at its parent, so the tree can be as deep as you like.</p>
  <figure class="wide">
    <div class="plate" data-dg="tree"></div>
    <div class="chips" id="treeBtns" aria-label="Choose a state"></div>
    <div class="note" id="treeNote" aria-live="polite"></div>
    <figcaption><span class="src book">From the book</span><b>Book figures and sample data, p. 110, redrawn.</b> The recursive Categories table, its data, and the tree it encodes. The corrupted state acts out the book’s example of a bad update.</figcaption>
  </figure>
  <p>The catch: the database can’t protect the shape of the tree. Setting a node’s parent to one of its own descendants (Sweatshirts under College Teams) satisfies the foreign key but cuts that branch off into a loop. So check for this before inserting or updating rows, either in application code or, better, with a <strong>trigger</strong> (Chapter 8) that runs inside the database on every change.</p>
  <p>The same pattern models a <strong>management hierarchy</strong>: an Employees table whose <code>Manager</code> column points at another employee. In the book’s data, Simon Smit is the CEO with no manager; James Bacon (footwear) and Robert Jones (clothing) report to him; Richard Smith, a shoes warehouse storeman, reports to James Bacon. The recursive foreign key <strong>must allow null</strong>: the top of the tree has no parent, and any made-up non-null value would point at a row that doesn’t exist, breaking referential integrity (section 4.6).</p>
  <h3>Programming for recursive relationships</h3>
  <p>Walking <em>up</em> from a node to the root is easy: follow the parent pointers. Walking <em>down</em> to build the whole tree (say, a menu) is harder. The book sketches a recursive function: fetch the top-level rows, and for each row print it, query its children, and call the function again one level deeper, passing the depth for indentation. To show one branch, start from a single category instead.</p>
  <div class="aside"><b>A fix to the book’s pseudo-code.</b> Its first query selects every category as the “top level”, so each subtree would be printed again under its own row. To start at the roots, filter with <code>WHERE ParentCategory IS NULL</code>.</div>
  <p>The book warns that this approach can fire tens or hundreds of queries per page view, which hurts under load. Its alternatives: cache the tree in a tree-friendly format (it suggests XML), or fetch the rows flat in one query and build the tree in code. The second is still the everyday answer:</p>
  <p class="codehead">TypeScript · one query, tree built in memory</p>
<pre><code class="ts">type Cat = { categoryId: number; name: string; parentCategory: number | null };
type Node = Cat &amp; { children: Node[] };

function buildTree(rows: Cat[]): Node[] {
  const byId = new Map(rows.map(r =&gt; [r.categoryId, { ...r, children: [] as Node[] }]));
  const roots: Node[] = [];
  for (const n of byId.values()) {
    const parent = n.parentCategory == null ? undefined : byId.get(n.parentCategory);
    (parent ? parent.children : roots).push(n);   // null parent = top level
  }
  return roots;
}</code></pre>
  <div class="aside"><b>Then vs now.</b> SQL:1999 added recursive common table expressions, now supported by PostgreSQL, SQL Server, Oracle, SQLite and MySQL 8. One query walks the whole tree on the server and returns each row with its depth: <code>WITH RECURSIVE t AS (SELECT …, 0 AS depth FROM categories WHERE parent_category IS NULL UNION ALL SELECT c.…, t.depth + 1 FROM categories c JOIN t ON c.parent_category = t.category_id) SELECT * FROM t;</code></div>

  <h3>Many-to-many recursive</h3>
  <p>Here a table relates to itself <em>through</em> an associative table. It fits anything that is an aggregate of things of the same kind, such as a computer built from other products (a <strong>parts explosion</strong> or <strong>bill of materials</strong>). The store uses it for <strong>bundles</strong>: <strong>ProductBundles</strong> holds pairs of product IDs, the bundle and a product inside it. The trick to reading it is to imagine the Products table drawn twice. Toggle the views below.</p>
  <figure class="wide">
    <div class="plate" data-dg="bundle"></div>
    <div class="chips" id="bundleBtns" aria-label="Choose a view"></div>
    <div class="note" id="bundleNote" aria-live="polite"></div>
    <figcaption><span class="src book">From the book</span><b>Book figures and sample data, pp. 112–113, redrawn.</b> The book’s “same table twice” view is, in its own words, not a valid diagram; it is a reading aid. The single-table view is drawn to match the e-commerce diagram on p. 116.</figcaption>
  </figure>
  <p>The Tracksuit Combo Deal (product 5) is a product like any other, so it has a price and can go in an order, but its ProductBundles rows say it contains products 3 and 4. Because a bundle is just a product, you can even bundle bundles, which is overkill for a clothing store but handy for, say, a computer hardware company. As with trees, block circular references: a bundle must never contain itself, directly or further down.</p>

  <h3>One-to-one</h3>
  <p>Not common, and it comes in two forms with different design consequences.</p>
  <p><strong>Actual one-to-one.</strong> Two real things that pair exactly: each department has one manager and each manager runs one department, recorded by <code>Departments.DepartmentManager</code> pointing at an employee. In the data it looks just like one-to-many, except the child side never has more than one row. The book’s advice is to be wary: one-to-one gives no efficiency gain over one-to-many and is less flexible, so check with the client, and consider modeling it as one-to-many even if the data is usually one-to-one.</p>
  <p><strong>Sub-type/super-type.</strong> The more common form: entities share some attributes but each kind also has its own. Which side gets the foreign key depends on how many sub-types there are.</p>
  <figure class="wide">
    <div class="plate" data-dg="subtype"></div>
    <div class="chips" id="subtypeBtns" aria-label="Choose an example"></div>
    <div class="note" id="subtypeNote" aria-live="polite"></div>
    <figcaption><span class="src book">From the book</span><b>Book figures, p. 115, redrawn.</b> A file system with one sub-type (Files), and employees with two (contract and salaried). The accent labels are added.</figcaption>
  </figure>
  <div class="aside"><b>A caution on the book’s fix (course addition).</b> The book suggests a check constraint to stop one employee being both contract and salaried. A CHECK constraint only sees the row it is checking, so it can’t look into the other sub-type table. Common workarounds: add an <code>EmployeeType</code> column to Employees, copy it into each sub-type table with a CHECK that fixes its value (<code>'C'</code> or <code>'S'</code>), and make the foreign key the pair <code>(EmployeeID, EmployeeType)</code>; or use a trigger.</div>
  <div class="aside pitfalls"><b>Common mistakes.</b> Allowing a recursive structure to contain cycles because “the foreign key accepted it”. Using a non-null sentinel like 0 for “no parent”. Splitting a table one-to-one without a reason. And with several sub-types, putting a nullable foreign key per sub-type on the super-type.</div>

  <h3>The whole e-commerce model</h3>
  <p>Put together, the store’s diagram uses every structure in this section. Hover each relationship to see which one it is.</p>
  <figure class="wide">
    <div class="plate" data-dg="ecom"></div>
    <figcaption><span class="src book">From the book</span><b>Book figure, p. 116, redrawn.</b> The complete e-commerce database diagram. Data types are left out to fit; they match the earlier figures. Layout is rearranged; the tables and relationships are the book’s.</figcaption>
  </figure>

  <!-- 4.4 -->
  <section class="chap" id="p4-4">
    <h2><span class="num">4.4</span>Integrity constraints and entity integrity</h2>
    <p><strong>Integrity constraints</strong> are the rules that keep the data valid by restricting what applications may do. Put them <em>in the database</em> rather than the application layer and they hold whichever program connects, which matters most when you don’t control every application or developer that will use your data. There are three kinds:</p>
    <dl class="notation">
      <dt>Entity integrity</dt><dd>Every row is uniquely identifiable by its primary key (this section).</dd>
      <dt>Attribute (domain) integrity</dt><dd>Every value is a legal value for its column (4.5).</dd>
      <dt>Referential integrity</dt><dd>Every foreign key points at a row that exists (4.6). The book’s list calls this “relational integrity”; its section heading uses the usual name.</dd>
    </dl>
    <h3>The primary-key rules</h3>
    <p>Other columns may repeat, but the primary key must be unique, because every relationship to the row goes through it. For a single-column key: values are unique and never null. For a <strong>composite</strong> (concatenated) key: the <em>combination</em> is unique and <em>no</em> part is null. The ban on null follows from Chapter 2: null isn’t a value and null doesn’t equal null, so you couldn’t compare null keys to prove uniqueness.</p>
    <p>In a composite key no single column has to be unique. In the book’s small catalog the key is Author + Title + Publisher:</p>
    <div class="tablewrap"><table>
      <thead><tr><th>Author</th><th>Title</th><th>Publisher</th><th>Price</th></tr></thead>
      <tbody>
        <tr><td>J. Smith</td><td>Advanced Spoonbending</td><td>XYZ Press</td><td>23.95</td></tr>
        <tr><td>J. Smith</td><td>Elementary Spoonbending</td><td>XYZ Press</td><td>23.95</td></tr>
        <tr><td>R. Jones</td><td>Top Golf Holes</td><td>ABC Books</td><td>18.5</td></tr>
        <tr><td>S. Robinson</td><td>Top Golf Holes</td><td>Greenkeeper Publishing</td><td>22.95</td></tr>
      </tbody>
    </table></div>
    <p class="hint">From the book’s table on p. 117.</p>
    <h3>Natural versus surrogate keys</h3>
    <p>Keys made of data that means something to users are <strong>intelligent</strong> or <strong>natural keys</strong>. They are a bet that the data will always be unique. Suppose XYZ Press releases a hardback <em>Advanced Spoonbending</em> at $53.95: same author, title and publisher, so the key breaks, and you must hunt for another non-null column to add, with no guarantee it won’t break too. Even ISBNs fail: old books and some publishers have none, and if the shop starts selling second-hand copies alongside new ones, the ISBN repeats.</p>
    <p>The usual argument for natural keys is that they make ad-hoc reporting queries easier to read. The book points out that web applications almost never offer end users ad-hoc queries, so that argument is weak on the web.</p>
    <p>A <strong>surrogate key</strong> is an artificial unique value. It gives you a single-column key where you would otherwise need a composite one, which is more efficient. You can generate it in the database or in your application. Two kinds:</p>
    <dl class="notation">
      <dt>Numeric sequence</dt><dd>Integers counting up from 1. Access calls them <code>autonumber</code>, SQL Server <code>identity</code>, MySQL <code>auto_increment</code>; Oracle uses a <code>sequence</code> object; PostgreSQL offers sequences or the <code>serial</code> type. Chapter 6 uses these.</dd>
      <dt>GUID</dt><dd>A globally unique identifier, unique even across databases, which is why replication uses them. SQL Server has <code>uniqueidentifier</code>; Access has an autonumber set to Replication ID; Oracle exposes <code>SYS_OP_GUID()</code>; PostgreSQL needed an extension at the time.</dd>
    </dl>
    <p>Use GUIDs when keys must be unique beyond one database, or to stop people guessing keys. If a profile page is <code>view_user.asp?userid=463</code>, anyone can script a loop over every ID; a GUID makes even one guess practically impossible. A side note in the book adds that some developers use timestamps as keys, which fails if two rows arrive within the timestamp’s precision.</p>
    <h3>When not to use a surrogate</h3>
    <p>Not every table needs one. The UserGroup link table already has a perfect key, the pair of foreign keys (themselves surrogates), and a user can be in a group only once. An extra ID column would add an index, and every index slows inserts (Chapter 8). Natural keys can also <strong>save joins</strong>: if Customers references a Countries lookup by <code>CountryName</code>, the name is already in the customer row.</p>
  </section>
  <p class="codehead">SQL · natural key: no join needed</p>
<pre><code class="sql">SELECT CustomerName, CountryName FROM Customers;</code></pre>
  <p class="codehead">SQL · surrogate key: join to get the name</p>
<pre><code class="sql">SELECT Customers.CustomerName, Countries.CountryName
FROM Customers
INNER JOIN Countries ON Customers.CountryID = Countries.CountryID;</code></pre>
  <p>The book’s verdict: use intelligent keys sensibly where they avoid overhead, but as a general rule surrogate keys suit web databases well. It also mentions a naming habit: end surrogate key columns in <code>ID</code> or <code>GUID</code> according to their type.</p>
  <div class="aside"><b>Then vs now.</b> PostgreSQL now has standard identity columns (<code>GENERATED ALWAYS AS IDENTITY</code>, version 10) and a built-in <code>gen_random_uuid()</code> (version 13). Random UUIDs scatter inserts across an index; time-ordered UUIDv7 keeps them unguessable-ish while inserting in order.</div>
  <div class="aside pitfalls"><b>Common mistakes.</b> Treating an unguessable ID as security. A GUID stops enumeration, but the page must still check that the signed-in user may see that record. Also: natural keys built from data the business can change (emails, names, ISBNs), and nullable columns in a primary key.</div>

  <!-- 4.5 -->
  <section class="chap" id="p4-5">
    <h2><span class="num">4.5</span>Attribute (domain) integrity</h2>
    <p>The <strong>domain</strong> of an attribute is the full set of values it may hold. You discover domains by asking the customer questions like: do we need “unknown” as a gender? How long can a product description be? To how many decimal places is a stock price stored?</p>
    <p>The worked example is an online stock-portfolio system: <strong>Customers</strong> hold many <strong>EquitySecurities</strong> and a security is held by many customers, so <strong>SecurityHolding</strong> resolves the many-to-many. The business rules: store each customer’s age; track whether a customer is a credit risk; let customers record optional details for each holding; and every security has a unique ticker code of exactly four characters.</p>
    <p>Most RDBMSs don’t support domains as such. A domain is the sum of several column settings: <strong>data type</strong>, <strong>length</strong>, <strong>constraints</strong>, <strong>optionality</strong> and <strong>default value</strong>.</p>
    <h3>Data type and size</h3>
    <p>The most important setting. Choosing one balances three goals: <strong>efficiency</strong> (the smallest type that leaves room for surprises), <strong>a format the application can use directly</strong> without converting, and <strong>flexibility</strong> for likely future needs. Names vary by product, so check your DBMS’s documentation; some modeling tools let you design with generic types and pick the platform’s type when generating the database.</p>
    <div class="tablewrap"><table>
      <thead><tr><th>Type</th><th>What it is</th><th>Watch out for</th></tr></thead>
      <tbody>
        <tr><td><code>INTEGER</code></td><td>Whole numbers; usually 32-bit (about ±2.1 billion), with smaller and larger variants</td><td>Match your language’s integer size: the book’s example is VBScript’s 16-bit Integer overflowing above about 32,000</td></tr>
        <tr><td><code>CHAR(n)</code></td><td>Fixed length; short values are padded to n (plain <code>CHAR</code> is one character)</td><td>Wastes space when lengths vary a lot</td></tr>
        <tr><td><code>VARCHAR(n)</code></td><td>Variable length up to n; stores only the actual data</td><td>Growing a value may need new space on disk; older platforms capped n at 255</td></tr>
        <tr><td><code>DECIMAL(p,s)</code></td><td>Exact number; precision p digits, s after the point (157.4568 is p = 7, s = 4)</td><td>Pick p and s from real requirements</td></tr>
        <tr><td><code>FLOAT</code>, <code>REAL</code>, <code>MONEY</code>…</td><td>Floating-point or platform-specific numeric types</td><td>Sizes differ between products (the book contrasts MONEY in PostgreSQL and SQL Server); floats bring rounding errors</td></tr>
        <tr><td><code>DATETIME</code></td><td>Date and time together; the standard also defines separate <code>DATE</code> and <code>TIME</code></td><td>Usually the best choice when you need either</td></tr>
      </tbody>
    </table></div>
    <p class="hint">Summarized from the book’s type descriptions, pp. 123–124.</p>
    <p><strong>The simple choices.</strong> Names are <code>VARCHAR</code>; <code>SecurityCode</code> and <code>MiddleInitial</code> are <code>CHAR</code>. The author’s length rules: a <code>CHAR</code> is as long as its longest value, and a <code>VARCHAR</code> gets the next size up from a fixed ladder (20, 50, 100, 250, 1000, 2000), so you can recall any column’s limit while coding. The phone number is <code>CHAR</code> too, because the application never does arithmetic on it; text keeps codes like <code>*999</code> or <code>2377544#44</code> possible. Rule of thumb: use numeric types only when you will treat the data as a number.</p>
    <p><strong>The harder choices</strong> needed another round of questions to the client, which is the iterative cycle from 4.1 in action. Credit risk turned out to be yes/no; prices need four decimal places with room above a few thousand dollars; purchases need the time to the minute. And “store the customer’s age” hides a trap.</p>
  </section>
  <figure class="wide">
    <div class="plate" data-dg="domain"></div>
    <div class="chips" id="domainBtns" aria-label="Pick a design decision"></div>
    <div class="note" id="domainNote" aria-live="polite"></div>
    <figcaption><span class="src book">From the book</span><b>Book figures, pp. 121 and 126, redrawn.</b> The portfolio schema with the book’s final types. Bold columns are required, plain ones optional. Pick a decision to highlight its column.</figcaption>
  </figure>
  <h3>Optionality, defaults and checks</h3>
  <p><strong>Optionality</strong> decides whether a column may be null. Platforms implement it differently, and a modeling tool can handle that for you; you only decide which columns are optional. Null is useful as “no value was given”, but remember it can’t be compared with ordinary operators. In the example, the three detail columns of SecurityHolding allow null so you can tell when a customer chose not to enter them, and <code>MiddleInitial</code> allows null so people without one don’t get a padded blank.</p>
  <p>A <strong>default value</strong> fills a column when an insert doesn’t mention it, and some databases accept a function, such as the current date. Use defaults with care: where “not entered” matters, null is better. A default of 0 for <code>PricePaid</code> would be wrong, because 0 is a real possibility (shares received as part of a pay package). The example uses one default: <code>CreditRisk</code> starts at 0, so the system is never unsure whether a risk exists.</p>
  <p>A <strong>check constraint</strong> (or check clause) is a rule the database tests on every insert and update: <code>SecurityCode</code> must be letters, <code>PricePaid</code> must not be negative. Ideally you set it in the modeling tool so the tool creates it. Here is the example table written out in full (a course addition in PostgreSQL syntax; the book shows the constraint in SQL Server form):</p>
  <p class="codehead">PostgreSQL · the holding table with its domain rules</p>
<pre><code class="sql">CREATE TABLE security_holding (
  holding_id     INT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
  customer_id    INT NOT NULL REFERENCES customers(customer_id),
  security_id    INT NOT NULL REFERENCES equity_securities(security_id),
  number_held    INT,                       -- optional: NULL = not entered
  price_paid     DECIMAL(9,4),              -- e.g. 3.6525; no float rounding
  date_purchased TIMESTAMP,                 -- to the minute
  CONSTRAINT price_paid_chk CHECK (price_paid &gt;= 0 OR price_paid IS NULL)
);
-- and on customers: credit_risk BOOLEAN NOT NULL DEFAULT false</code></pre>
  <div class="aside"><b>A correction on NULL in checks.</b> The book says that without <code>OR PricePaid IS NULL</code> the check would reject nulls. In standard SQL (including SQL Server and PostgreSQL) a CHECK fails only when its condition is <em>false</em>. <code>NULL &gt;= 0</code> is unknown, so the row is accepted anyway. The extra clause is harmless and states the intent, but nullability is still controlled by <code>NOT NULL</code>.</div>
  <div class="aside"><b>Front-end tie-in.</b> The VBScript overflow has a modern twin. A JavaScript <code>number</code> is exact only up to 2<sup>53</sup>, so Node drivers such as node-postgres return <code>BIGINT</code> and <code>DECIMAL</code> values as strings. Decide on purpose whether to parse them, use <code>BigInt</code>, or use a decimal library for money.</div>
  <div class="aside pitfalls"><b>Common mistakes.</b> Storing values that change over time (age, “days since signup”) instead of the fact they derive from. Floats for money. Numeric types for codes that only look numeric (phone numbers, postcodes, IDs with leading zeros). Defaults that hide “unknown” behind a real-looking value.</div>

  <!-- 4.6 -->
  <section class="chap" id="p4-6">
    <h2><span class="num">4.6</span>Referential integrity</h2>
    <p><strong>Referential integrity</strong> (RI) keeps relationships valid: every foreign key is either null or matches a primary key in the related table. The database enforces it with a foreign-key constraint. Diagram tools and database editors usually write these for you; the DDL varies by platform. The book’s example is a SQL Server link table, <code>PropertyFeature</code>, with a composite primary key and two foreign keys.</p>
    <p>RI blocks three problems. Each would leave an <strong>orphaned row</strong>: a child whose foreign key points at no parent.</p>
    <dl class="notation">
      <dt>Insert anomaly</dt><dd>Inserting a child that references a parent that doesn’t exist, such as an order for a missing customer. RI rejects the insert.</dd>
      <dt>Update anomaly</dt><dd>Changing a parent’s primary key while children still hold the old value. By default RI refuses the change.</dd>
      <dt>Delete anomaly</dt><dd>Deleting a parent that children still reference. By default RI refuses the delete.</dd>
    </dl>
    <p>In practice: insert the parent first (a customer before their holdings); delete the children before the parent; and you can never change a referenced primary key, because the parent can’t change while children point at it and the children can’t point at a value that doesn’t exist yet. You could write code for all of this, but it is better to tell the database what to do.</p>
    <h3>Referential actions</h3>
    <p>A <strong>referential action</strong> tells the DBMS what remedial step to take when a change to a parent would break the rules. It can’t let you break them, only repair things automatically. The refusing behavior above is itself an action, <code>RESTRICT</code>.</p>
    <div class="tablewrap"><table>
      <thead><tr><th>Action</th><th>Update parent key</th><th>Delete parent row</th></tr></thead>
      <tbody>
        <tr><td><code>RESTRICT</code> (default in most RDBMSs)</td><td>Refused</td><td>Refused</td></tr>
        <tr><td><code>CASCADE</code></td><td>Children’s foreign keys change to the new value</td><td>Children are deleted too</td></tr>
        <tr><td><code>SET NULL</code></td><td>Children’s foreign keys become null</td><td>Children’s foreign keys become null</td></tr>
      </tbody>
    </table></div>
    <p class="hint">Based on the book’s table on p. 130, reworded.</p>
    <p>Some products leave out <code>SET NULL</code> because it is seen as less than ideal; a trigger can imitate it. Try every combination below.</p>
  </section>
  <figure class="wide">
    <div class="plate" data-dg="ri"></div>
    <div class="chips" id="riModes" aria-label="Choose how the foreign key is enforced"></div>
    <div class="chips" id="riOps" aria-label="Choose a change to make"></div>
    <div class="note" id="riNote" aria-live="polite"></div>
    <figcaption><span class="src ill">Course illustration</span><b>Figure A.</b> A referential-integrity simulator using the book’s Customers and Orders data. Pick an enforcement mode, then a change. Each change starts from the original data.</figcaption>
  </figure>
  <p>Choosing the action is a design decision. <code>CASCADE</code> fits true parent–child ownership: deleting a folder deletes its files, in one statement instead of three (check for children, delete them, delete the parent). It is wrong when the children have value of their own. If an employee manages many projects, <code>ON DELETE CASCADE</code> would wipe the projects when the employee leaves; <code>RESTRICT</code> forces you to reassign or delete them deliberately.</p>
  <p class="codehead">PostgreSQL · choosing actions per relationship</p>
<pre><code class="sql">CREATE TABLE orders (
  order_id    INT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
  customer_id INT NOT NULL
    REFERENCES customers(customer_id) ON DELETE RESTRICT,   -- keep order history
  order_date  TIMESTAMP NOT NULL DEFAULT now()
);
CREATE TABLE order_items (
  order_id   INT NOT NULL REFERENCES orders(order_id) ON DELETE CASCADE,   -- lines belong to the order
  product_id INT NOT NULL REFERENCES products(product_id),
  quantity   INT NOT NULL,
  purchase_price DECIMAL(10,2) NOT NULL,
  PRIMARY KEY (order_id, product_id)
);</code></pre>
  <div class="aside"><b>Then vs now.</b> The book notes that MySQL let you declare relationships but never enforced them. That was true of its default MyISAM engine. InnoDB enforces foreign keys and has been MySQL’s default engine since version 5.5 (2010).</div>
  <div class="aside pitfalls"><b>Common mistakes.</b> Putting <code>CASCADE</code> on everything because it makes deletes “just work”. Using <code>SET NULL</code> on a foreign key declared <code>NOT NULL</code>. Relying on application code for RI when other programs, scripts or admins also write to the database.</div>

  <!-- 4.7 -->
  <section class="chap" id="p4-7">
    <h2><span class="num">4.7</span>Denormalizing for performance</h2>
    <p>Back to the publisher’s book count from 4.2. Counting matching rows every time you show a publisher is correct but costs work on each read; storing the count is redundant but instant. Web databases often carry a much higher read load than traditional systems, so sometimes the redundant, <strong>denormalized</strong> form wins.</p>
    <p>That should be the exception. The book’s order of operations: build a properly normalized design first, test it under a realistic production-like load, and only then denormalize where the measurements say so. For web projects that often means deciding after development is complete.</p>
    <p>Denormalized models make <em>reads</em> cheaper and <em>writes</em> dearer, which suits most sites, where selects vastly outnumber inserts and updates. When the summary is costly to maintain, don’t update it during the user’s request. The book’s example is “customers who bought X also bought…”: rebuild those summary tables in the background or as a nightly or weekly batch job. Chapter 8 returns to these trade-offs with indexing.</p>
  </section>
  <div class="aside"><b>Then vs now.</b> Today’s tools for the same idea: a counter column kept up to date by a trigger, a materialized view refreshed on a schedule (<code>REFRESH MATERIALIZED VIEW</code>), or a cache such as Redis in front of the database. The rule hasn’t changed: measure first.</div>
  <div class="aside pitfalls"><b>Common mistakes.</b> Denormalizing up front “for speed” without a load test. Forgetting that every redundant copy needs a mechanism (trigger, job, application code) that keeps it right, or it will drift.</div>

  <!-- 4.8 -->
  <section class="chap" id="p4-8">
    <h2><span class="num">4.8</span>CASE tools for modeling</h2>
    <p><strong>CASE</strong> (Computer Aided Software Engineering) tools let you draw the model in software and then generate the database from it. The book lists options from free to many thousands of dollars: Dia (free); Datanamic DeZign and Model Creator ERCreator (low end); Charonware Case Studio (low to mid); Oracle Designer and Microsoft Visio (mid); Quest Q Designer, Sybase PowerDesigner, Embarcadero ER/Studio and Computer Associates ERwin (high end). Whichever you pick, make sure it supports your target databases and really does entity modeling.</p>
    <p>The demonstration uses <strong>Visio 2002</strong> and its Database Model Diagram template, whose window has four parts:</p>
    <dl class="notation">
      <dt>Tables and Views</dt><dd>Every entity in the model. One model can have several diagrams, each showing part of a large system.</dd>
      <dt>Shapes</dt><dd>What you can drop on a diagram, chiefly the Entity and Relationship shapes. Dropping an entity adds it to the underlying model.</dd>
      <dt>Database Properties</dt><dd>Detailed settings for the selected entity or relationship: columns, types, keys, check clauses and so on.</dd>
      <dt>Drawing surface</dt><dd>Where you lay out the diagram.</dd>
    </dl>
    <h3>Forward, reverse and round-trip engineering</h3>
    <p><strong>Forward engineering</strong> turns the model into a database: the tool validates the model (at minimum, that each foreign key’s type matches its primary key) and either writes a DDL script of <code>CREATE TABLE</code> statements, builds the database directly through a driver for your DBMS, or both. Visio can also merge changes into an existing database. This removes the old double work of drawing a model and then retyping every table by hand, which was the main reason people skipped modeling.</p>
    <p><strong>Reverse engineering</strong> goes the other way: point the tool at an existing database and get a model and diagram back, to document a legacy system or a project that started in the database and outgrew it. It also rescues models that drifted, since developers inevitably change the live database without updating the diagram. In the book’s walk-through, a phone-number column added to Publishers in Access shows up in the reverse-engineered diagram. The Visio wizard steps: choose the data source, the object types (procedures and triggers on bigger platforms), the specific objects, and whether to add them to the current diagram. For more than about 30 tables, say no and place them on several diagrams yourself; Visio draws the relationship lines when you drag tables in.</p>
    <p><strong>Round-trip engineering</strong> combines both and tracks changes over the life of the database. ER diagrams make excellent documentation, but a CASE tool isn’t essential: plenty of good designers prefer pen and paper or a whiteboard.</p>
  </section>
  <div class="aside"><b>Then vs now.</b> In a TypeScript stack the same ideas live in your ORM or migration tool. A schema file in Drizzle or Prisma is the model; generating and running migrations is forward engineering; <code>drizzle-kit pull</code> or <code>prisma db pull</code> is reverse engineering. Diagram-first tools such as dbdiagram.io export DDL, and database clients like DBeaver draw ER diagrams from live databases.</div>

  <!-- 4.9 -->
  <section class="chap" id="p4-9">
    <h2><span class="num">4.9</span>The importance of sample data</h2>
    <p>Keep checking the model, and later the database, against <strong>sample data</strong>, ideally real data from the client in a format they can work with. That shows whether your normalization matches how the client actually handles their information. The book describes three layers:</p>
    <ol>
      <li><strong>From the client</strong> (or someone who didn’t build the model). Proves the model can represent all their data, workflows and processes.</li>
      <li><strong>Once the database exists.</strong> Client data plus deliberately corrupted data, to prove the database enforces the integrity rules from 4.4–4.6.</li>
      <li><strong>As the application nears completion.</strong> Enough realistic data to run a load test, exposing weaknesses in the model and guiding tuning (Chapter 8).</li>
    </ol>
    <p>Stress testing matters especially on the web, where traffic can spike without warning: you need to know your breaking point to plan hardware and hosting before it bites. (The book recommends a free Microsoft web stress tool of the time; today you’d reach for k6, JMeter or Locust.)</p>
  </section>
  <div class="aside pitfalls"><b>Common mistakes.</b> Testing only with neat, hand-typed rows. The second layer exists to throw bad data at the constraints, and the third to find out what happens with production-sized tables.</div>

  <!-- Review -->
  <section class="chap" id="review">
    <h2><span class="num">✓</span>Cheat sheet and quiz</h2>
    <h3>The five structures</h3>
    <div class="tablewrap"><table>
      <thead><tr><th>Structure</th><th>How it’s built</th><th>Book example</th><th>Watch for</th></tr></thead>
      <tbody>
        <tr><td>One-to-many</td><td>Foreign key on the child</td><td>Customers → Orders</td><td>The many end may be zero</td></tr>
        <tr><td>Many-to-many</td><td>Associative table holding both keys</td><td>Orders ↔ Products via OrderItems</td><td>Never use repeating columns</td></tr>
        <tr><td>One-to-many recursive</td><td>Nullable foreign key to the same table</td><td>Category tree, manager hierarchy</td><td>Cycles; null at the top</td></tr>
        <tr><td>Many-to-many recursive</td><td>Associative table with two keys to the same table</td><td>Product bundles</td><td>A bundle must not contain itself</td></tr>
        <tr><td>One-to-one</td><td>Actual: FK with one row max. Sub-type: FK on super-type (one sub-type) or sub-type PK = FK (several)</td><td>Department manager; Items/Files; contract and salaried employees</td><td>Often better as one-to-many</td></tr>
      </tbody>
    </table></div>
    <h3>Key terms</h3>
    <dl class="notation">
      <dt>Cardinality / optionality</dt><dd>How many (fork = many, bar = one) and whether it’s required (circle = optional, bar = mandatory).</dd>
      <dt>Entity integrity</dt><dd>Primary key unique and never null; for composite keys, the combination is unique and no part is null.</dd>
      <dt>Natural vs surrogate key</dt><dd>Meaningful data that may stop being unique, versus a generated sequence number or GUID.</dd>
      <dt>Domain</dt><dd>All legal values for a column: data type, length, constraints, optionality, default.</dd>
      <dt>Referential integrity</dt><dd>Every foreign key is null or matches a parent key; prevents insert, update and delete anomalies.</dd>
      <dt>Referential actions</dt><dd>RESTRICT (refuse), CASCADE (follow the change), SET NULL (detach the children).</dd>
      <dt>Forward / reverse engineering</dt><dd>Model to database, database to model; both together is round-trip.</dd>
    </dl>

const CYC = {
  an:["Analysis","interview client or users","<b>Analysis.</b> Interview the client or users to understand what data they need. Early on they may not know themselves; the model helps them find out."],

  va:["Validation","check it with the user","<b>Validation.</b> Share the model with the user or customer to check it meets the requirements. This usually raises new questions, so you loop back to analysis."],

<template id="tpl-pddw-05">
  <h1>Planning the database: from stakeholder wish lists to a conceptual model</h1>
  <p class="lede">A crash course on Chapter 5 of <em>Practical Database Design for the Web</em>: the book starts its running web store project. You gather data requirements from the store owner and the customer, sort them into entities and attributes, test every relationship in both directions until its cardinality is settled, and assemble one conceptual ER diagram that Chapter 6 will turn into tables.</p>
  <p class="byline">Hover or tap any part of a diagram for an explanation, and use the Full screen button on any figure. Interactive pieces: a clickable planning pipeline, a “where does this requirement go?” sorter, a hidden-relationships toggle, a category tree you can click, a cardinality builder, and a relationship filter on the full model. Figures marked <span class="src book">From the book</span> are redrawn from the chapter; <span class="src ill">Course illustration</span> marks diagrams drawn for this course. Notes marked <em>Then vs now</em> are course additions: the book was written around 2002–2003. The book’s headings are unnumbered; the numbers here follow their order.</p>

  <!-- 5.1 -->
  <section class="chap" id="p5-1">
    <h2><span class="num">5.1</span>The web store project</h2>
    <p>The chapter opens with the (reportedly Einstein’s) idea of spending most of your time understanding a problem before solving it. The book doesn’t ask for five-sixths of the project, but its point stands: a database planned in a hurry is redesigned later at much greater cost.</p>
    <p>Web databases do many jobs: content management systems, search engine link stores, forum posts, product catalogs. To show planning and design in practice, this chapter and the next build one example end to end: <strong>the database behind a web store</strong>. It has two <strong>stakeholders</strong>, the people whose needs shape the data:</p>
    <dl class="notation">
      <dt>The store owner</dt><dd>Wants to manage the product inventory and get reports on how well the store is doing.</dd>
      <dt>The customer</dt><dd>Wants to browse products, place an order and track its status, all from a browser.</dd>
    </dl>
    <p>You play the database designer. Web designers, developers and a project manager exist too, and the book assumes the stakeholder interviews have already happened. Your job is to mine them for <em>data</em>. The planning runs in a fixed order, because each step needs the previous one’s output: you can’t draw a model until you know the entities and relationships, and you can’t know those until you know what the database must store.</p>
  </section>
  <figure class="wide">
    <div class="plate" data-dg="steps"></div>
    <div class="note" id="stepsNote" aria-live="polite"></div>
    <figcaption><span class="src ill">Course illustration</span><b>Figure A.</b> The chapter’s planning steps as a pipeline, with what each step produces. Click a step to see what it involves. Chapter 6 picks up from the finished model.</figcaption>
  </figure>

  <!-- 5.2 -->
  <section class="chap" id="p5-2">
    <h2><span class="num">5.2</span>Gather information</h2>
    <p>Most requirements come from the <strong>store owner</strong>. The book’s advice is to respect how big the application design is (pages for browsing and ordering) but not to get absorbed in <em>how the store will work</em>. Focus on the product and customer data that has to be stored and processed.</p>

    <h3>Product details</h3>
    <p>The owner’s list of product information: name, short description, long description, size, color, weight, price, availability (quantity on hand), a picture, special discounts, comments from satisfied customers, shipping cost, and the product’s category or categories. Whatever tables you end up with, each of these must live somewhere. Most are attributes of a product; a few, like categories, are really <strong>relationships</strong>. At this stage you simply collect them.</p>
    <p>Two more owner requirements shape the data:</p>
    <ul>
      <li><strong>Searchable products.</strong> If search is clumsy, customers buy elsewhere. A keyword search might later need keyword tables. That is a physical-design detail, so for now you just note it.</li>
      <li><strong>Categories.</strong> Products belong to categories, and each category needs a name, a description and subcategories, like the directories of Yahoo or the Open Directory Project. Keep the levels shallow: shoppers are reluctant to drill down through many layers.</li>
    </ul>

    <h3>Product administration</h3>
    <p>The owner needs pages to add products, remove poor sellers, edit descriptions and set discounts. These are mostly processing, but you skim them for anything that must be <em>stored</em>:</p>
    <ul>
      <li>An add-product page must be owner-only, so the application needs an owner ID and password. The book defers this to Chapter 7 (security) and leaves it out of the example model.</li>
      <li>A product that has ever sold <strong>can’t simply be deleted</strong>: that would damage the sales history. So products gain one more item, a <strong>status</strong> (active/deleted). Flipping it hides the product from customers while keeping the history intact.</li>
      <li>Reports such as which products or categories sell most, which customers buy what, and whether discounts worked. Check each one against the data you plan to store: a report you can’t produce from stored data means a missing requirement.</li>
    </ul>
    <p class="codehead">Course addition · the status flag in SQL (a “soft delete”)</p>
<pre><code class="sql">ALTER TABLE product ADD COLUMN status VARCHAR(10) NOT NULL DEFAULT 'active';

-- "Delete" a product that has sales: hide it, keep the history
UPDATE product SET status = 'deleted' WHERE product_id = 42;

-- The storefront only ever lists active products
SELECT name, price FROM product WHERE status = 'active';</code></pre>

    <h3>Order details</h3>
    <p>Because this owner ships orders themselves (rather than passing them to a third-party fulfiller), the store should record as much about each order as it can, for tracking and sales analysis. The product side is easy: products ordered, quantity of each, discounts, total shipping cost, taxes, total cost. Without these the order can’t be fulfilled. The <em>customer</em> side is harder, and comes down to privacy.</p>

    <h3>The customer’s view</h3>
    <p>To buy anything, a customer must give two things: <strong>valid payment authorization</strong> and <strong>where (and perhaps how) to ship</strong>. Both may include a name, and the second includes an address. If the owner wants to keep names and addresses for reports, check the privacy law where the store operates; the book cites European data protection rules, which allow only the minimum, kept briefly, unless the customer agrees.</p>
    <p>The book’s rule of thumb: <q>all items of customer information should be optional</q>. A question like “gift or personal use?” is useful to the owner, but the customer gains nothing by answering, and a form that won’t submit until it’s answered may lose the sale. Two items are safe and useful:</p>
    <ul>
      <li><strong>E-mail address</strong>, for a shipping confirmation (unless the products are downloads).</li>
      <li><strong>A customer ID and password</strong>, so a customer can come back and track their orders.</li>
    </ul>

    <h3>Payment processing</h3>
    <p>Best practice is <strong>not to store payment details at all</strong>. The customer pays on a third-party processor’s secure site, the processor answers “approved” or “denied”, and the store records only that outcome on the order. If payment is denied, the customer may want to abandon the order or save it and come back with a different payment method. The book lists Authorize.Net, LinkPoint, VeriSign, PayPal and 2CheckOut as examples.</p>
  </section>
  <figure class="wide">
    <div class="plate" data-dg="pay"></div>
    <figcaption><span class="src ill">Course illustration</span><b>Figure B.</b> The payment flow the chapter describes. The card details go to the processor, never into the store’s database; the store saves only the result.</figcaption>
  </figure>
  <div class="aside"><b>Then vs now.</b> The book’s privacy warning has only grown: the EU’s GDPR (2018) and similar laws make <em>data minimization</em> a legal duty, which is the chapter’s “store the bare minimum” advice. Card data is governed by PCI DSS, and hosted checkouts (Stripe Checkout, PayPal and others) do exactly what the figure shows: you store a payment ID and status, never the card. Store password <em>hashes</em> (bcrypt or Argon2), never passwords.</div>
  <h3>Try it: where does this requirement go?</h3>
  <p>Gathering is about noticing what each requirement means for the data. Pick one:</p>
  <div class="chips" id="reqBtns" aria-label="Pick a requirement"></div>
  <div class="note" id="reqNote" aria-live="polite"></div>
  <div class="aside pitfalls"><b>Common mistakes.</b> Designing from the page layouts instead of the data; deleting rows that history depends on; making every customer field required; and storing card numbers “just for repeat orders”. Each one either loses data you need or keeps data you shouldn’t have.</div>

  <!-- 5.3 -->
  <section class="chap" id="p5-3">
    <h2><span class="num">5.3</span>Identify entities and attributes</h2>
    <p>As in Chapter 4, a conceptual (ER) design starts by listing the <strong>entities</strong> and their <strong>attributes</strong>. The key discipline is to <strong>leave out anything that looks like a relationship</strong>. Listing plain attributes first gets them out of the way, so the next step can concentrate on relationships, which is where the real design decisions are.</p>
    <p>Compare the lists with the requirements: “product category or categories” has gone from Product, and “subcategories” has gone from Category. Both will come back as relationships. The book’s lists already hint at the relationships: products are classified by category, and customers have orders.</p>
  </section>
  <figure class="wide">
    <div class="plate" data-dg="ents"></div>
    <div class="chips" id="entsBtns" aria-label="Choose a view"></div>
    <div class="note" id="entsNote" aria-live="polite"></div>
    <figcaption><span class="src book">From the book</span><b>Entity lists, pp. 146–147, redrawn.</b> The book gives these as bullet lists; here they are drawn as entity boxes with the book’s attribute names. The “hidden relationships” view and its annotations are course additions.</figcaption>
  </figure>
  <p>Two things are worth noticing in the book’s own lists. The <strong>status</strong> attribute from the administration requirements isn’t on Product’s list, though the design needs it. And Order still lists “product(s) ordered” and “quantity of each product”; strictly, those describe the Order–Product relationship, and Chapter 6 is where they find their real home.</p>
  <div class="aside pitfalls"><b>Common mistakes.</b> Putting a <code>categories</code> attribute on Product (a list in one field) or a <code>customer</code> attribute holding a name on Order. If an “attribute” names another entity, it is a relationship. Also, don’t create a separate entity for every word in the requirements: Subcategory turns out not to be one (section 5.4).</div>

  <!-- 5.4 -->
  <section class="chap" id="p5-4">
    <h2><span class="num">5.4</span>Identify entity relationships</h2>
    <p>Now the real work: <strong>cardinality</strong>, how many instances of one entity relate to an instance of another. The book’s technique is to examine every relationship <strong>in both directions</strong>, writing a sentence of the form <q>each X is related to how many Y</q>. “Related” becomes a verb (contains, orders), and “how many” is the cardinality in that direction. Each answer has a minimum (must there be any?) and a maximum (can there be more than one?).</p>
    <p>Taking each entity in turn: Product relates to Category and to Order. It does <em>not</em> relate directly to Customer: products reach customers only through the orders customers place.</p>
  </section>
  <figure class="wide">
    <div class="plate" data-dg="decoder"></div>
    <div class="chips" id="decMin" aria-label="Minimum"></div>
    <div class="chips" id="decMax" aria-label="Maximum"></div>
    <div class="note" id="decNote" aria-live="polite"></div>
    <figcaption><span class="src ill">Course illustration</span><b>Figure C.</b> Build a cardinality sentence. Choose the minimum (first row) and maximum (second row) number of orders per customer and watch the crow’s-foot marker and the sentence change. The legend shows the four combinations.</figcaption>
  </figure>

  <h3>Category and Product</h3>
  <p>The book first draws this as a general many-to-many, with crow’s feet at both ends and two verb phrases, one per direction: a category <strong>contains</strong> products, a product <strong>belongs to</strong> categories. Then two design decisions settle the minimums:</p>
  <ul>
    <li><strong>Must a category contain a product?</strong> Yes. Empty categories frustrate shoppers. Recording it in the diagram tells the developers to hide empty categories.</li>
    <li><strong>Must a product belong to a category?</strong> Yes, or it never appears on the category listing pages. And it may belong to <em>more than one</em>, which raises a reporting question: which category gets credit for a sale? The answer is a <strong>default category</strong> for sales tracking, an example of <strong>relationship data</strong> that Chapter 6 returns to.</li>
  </ul>
  <figure class="wide">
    <div class="plate" data-dg="catprod"></div>
    <figcaption><span class="src book">From the book</span><b>Book figure, p. 148, redrawn.</b> Category and Product, many-to-many. No circles, so neither side may be zero.</figcaption>
  </figure>
  <p>Databases can’t implement a many-to-many directly. It will be split into two one-to-many relationships through an <strong>associative entity</strong>, in Chapter 6.</p>

  <h3>Order and Product</h3>
  <p>Also many-to-many. A new product isn’t on any order yet, so a product may be on <strong>zero</strong> orders; most products sell repeatedly, so many. (A one-of-a-kind item fits too: its quantity on hand simply drops from 1 to 0 after one order.) An order without a product isn’t an order, and one product per order would be very unfriendly, so an order is for <strong>one or more</strong> products. The zero shows up as the small circle at the Order end.</p>
  <figure class="wide">
    <div class="plate" data-dg="ordprod"></div>
    <figcaption><span class="src book">From the book</span><b>Book figure, p. 149, redrawn.</b> Order and Product. The circle at the Order end records that a product may not have been ordered yet.</figcaption>
  </figure>
  <p>The book adds that ER conventions vary and that perfect notation matters less than confirming each cardinality and recording it for later stages.</p>

  <h3>Category and subcategory</h3>
  <p>Is Subcategory its own entity? The test is whether it is <strong>intrinsically different</strong> from a category. It isn’t: both have a name and a description, and there can be sub-sub-levels. So the book models it as a <strong>one-to-many recursive relationship</strong>: Category related to itself.</p>
  <ul>
    <li>A category may contain many subcategories, or none (the bottom level): <strong>zero or more</strong>.</li>
    <li>A subcategory belongs to <strong>zero or one</strong> parent: zero for top-level categories, and at most one by design choice. Multi-parent categories are possible, but users find them confusing, and a recursive relationship isn’t many-to-many anyway.</li>
  </ul>
  <figure class="wide">
    <div class="plate" data-dg="recur"></div>
    <figcaption><span class="src book">From the book</span><b>Book figure, p. 150, redrawn.</b> The recursive relationship on Category. The line leaves and re-enters the same entity.</figcaption>
  </figure>
  <p>But surely “Programming” can sit under several parents? The book’s Open Directory example shows it doesn’t need to: Computers: Programming, Computers: Education: Programming and Computers: Parallel Computing: Programming are <strong>three different categories</strong> that share a name, each with one parent.</p>
  <figure class="wide">
    <div class="plate" data-dg="subcat"></div>
    <div class="note" id="subcatNote" aria-live="polite"></div>
    <figcaption><span class="src ill">Course illustration</span><b>Figure D.</b> The book’s Open Directory example as a tree, beside the rows a self-referencing table would hold. Click a category to see its full path and its row. The table is a course preview of Chapter 6.</figcaption>
  </figure>
  <p class="codehead">Course addition · a recursive relationship is a foreign key to the same table</p>
<pre><code class="sql">CREATE TABLE category (
  category_id INT PRIMARY KEY,
  name        VARCHAR(80) NOT NULL,
  description TEXT,
  parent_id   INT NULL REFERENCES category(category_id)  -- zero or one parent
);

-- Top-level categories have no parent
SELECT name FROM category WHERE parent_id IS NULL;</code></pre>

  <h3>Order and Customer</h3>
  <p>Customer relates only to Order, and this one is <strong>one-to-many</strong>. A customer can place many orders, or none yet: they may register first, or just join a mailing list (only the e-mail is needed). An order must belong to a customer, because the application shouldn’t create an order without knowing who placed it, and orders shared between customers are too complex and unrealistic. So: exactly one customer per order.</p>
  <figure class="wide">
    <div class="plate" data-dg="custord"></div>
    <figcaption><span class="src book">From the book</span><b>Book figure, p. 151, redrawn.</b> Customer and Order, one-to-many. The book leaves the Customer end of the line unmarked; the “exactly one” bars (in the accent color) are added here to match the book’s text.</figcaption>
  </figure>
  <div class="aside"><b>Then vs now.</b> The book’s two directory examples are gone: the Yahoo Directory closed in 2014 and the Open Directory Project (dmoz) in 2017. Category trees with one parent per node are as common as ever, though: think of breadcrumbs on any store, or nested routes in a React app.</div>
  <div class="aside pitfalls"><b>Common mistakes.</b> Reading a relationship in one direction only (you get the maximum but miss a minimum); drawing a direct Product–Customer relationship that is really “through Order”; creating a Subcategory table that duplicates Category; and treating a shared name as a shared category.</div>

  <!-- 5.5 -->
  <section class="chap" id="p5-5">
    <h2><span class="num">5.5</span>Prepare the conceptual data model</h2>
    <p>The <strong>conceptual data model</strong> shows every entity of interest and the relationships between them, without tables or columns. You get it by assembling the small ER diagrams from the previous step into one. Crow’s feet mark the “many” ends (product–category is many-to-many, customer–order is one-to-many) and circles mark where zero is allowed (a customer may have no orders).</p>
  </section>
  <figure class="wide">
    <div class="plate" data-dg="model"></div>
    <div class="chips" id="modelBtns" aria-label="Highlight a relationship"></div>
    <div class="note" id="modelNote" aria-live="polite"></div>
    <figcaption><span class="src book">From the book</span><b>Book figure, p. 152, redrawn.</b> The web store’s conceptual data model. Layout, labels and markers follow the book; the accent bars at the Customer end are added, as in the Order and Customer figure.</figcaption>
  </figure>
  <p>Two of the four relationships are many-to-many (Category–Product, Product–Order). Each will need an associative entity, but that belongs to physical design, which is Chapter 6. Without the gathering step, the book reminds you, all of this would be guesswork, and a good guess for one project can be disastrously wrong for another.</p>
  <div class="aside"><b>Front-end tie-in.</b> Think of this model as the TypeScript types you’d sketch before writing any API: <code>Category</code> with an optional <code>parentId</code>, <code>Order</code> with a required <code>customerId</code>. The many-to-many lines are the ones that can’t be a single ID field on either side. They need their own type, which is exactly what Chapter 6 adds.</div>

  <!-- Review -->
  <section class="chap" id="review">
    <h2><span class="num">✓</span>Cheat sheet and quiz</h2>
    <h3>The web store’s relationships</h3>
    <div class="tablewrap"><table>
      <thead><tr><th>Relationship</th><th>One direction</th><th>Other direction</th><th>Type</th></tr></thead>
      <tbody>
        <tr><td>Category–Product</td><td>Each category contains one or more products</td><td>Each product belongs to one or more categories</td><td>Many-to-many</td></tr>
        <tr><td>Product–Order</td><td>Each product is ordered by zero or more orders</td><td>Each order is for one or more products</td><td>Many-to-many</td></tr>
        <tr><td>Category–Category</td><td>Each category contains zero or more subcategories</td><td>Each subcategory belongs to zero or one category</td><td>One-to-many, recursive</td></tr>
        <tr><td>Customer–Order</td><td>Each customer orders zero or more orders</td><td>Each order is ordered by exactly one customer</td><td>One-to-many</td></tr>
      </tbody>
    </table></div>
    <h3>Key terms</h3>
    <dl class="notation">
      <dt>Stakeholder</dt><dd>Someone whose needs shape the data: here, the store owner and the customer.</dd>
      <dt>Cardinality</dt><dd>How many instances of one entity relate to one instance of another, read in each direction: a minimum (0 or 1) and a maximum (1 or many).</dd>
      <dt>Verb phrase</dt><dd>The label for each direction of a relationship (contains / belongs to).</dd>
      <dt>Recursive relationship</dt><dd>An entity related to itself, such as categories containing subcategories.</dd>
      <dt>Associative entity</dt><dd>The extra entity that splits a many-to-many into two one-to-many relationships (Chapter 6).</dd>
      <dt>Relationship data</dt><dd>Facts that belong to a relationship rather than to either entity, such as a product’s default category.</dd>
      <dt>Conceptual data model</dt><dd>All entities and their relationships in one ER diagram, before any tables.</dd>
    </dl>
    <h3>Test yourself</h3>
  </section>
  <p class="score" id="score" aria-live="polite"></p>
