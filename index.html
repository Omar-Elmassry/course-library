<template id="tpl-pddw-01">
  <h1>What a database is, and where it came from</h1>
  <p class="lede">A crash course on Chapter 1 of <em>Practical Database Design for the Web</em>: why spreadsheets stop working, the short history that produced the relational model, the other database models you’ll hear about, what a DBMS does for you, and when a website actually needs a database.</p>
  <p class="byline">Hover or tap any part of a diagram for an explanation, and use the Full screen button on any figure. Interactive pieces: the spreadsheet-to-database walkthrough, a clickable history timeline, a hierarchical query tracer, a relationship-type filter, distributed and DBMS toggles, and a “does this need a database?” picker. Figures marked <span class="src book">From the book</span> are redrawn from the chapter; <span class="src ill">Course illustration</span> marks diagrams drawn for this course. Notes marked <em>Then vs now</em> are course additions: the book was written around 2002–2003.</p>

  <!-- 1.1 -->
  <section class="chap" id="p1-1">
    <h2><span class="num">1.1</span>What is a database?</h2>
    <p>Loosely, anything that stores data is a database. The chapter makes the idea sharper by walking a small contact list from a word processor, to a spreadsheet, to real database tables, and noticing what breaks at each step.</p>
    <p><strong>A Word document</strong> holds data as paragraphs. You can search for a name with Find and read what is nearby, but the only structure is the one you keep in your head. <strong>A spreadsheet</strong> is better: each column is a field, each row is a record, so you can sort by any column and scan for blanks or near-duplicates. Plenty of small businesses run on exactly this.</p>
    <p>It falls apart when the data grows or a second person needs it at the same time. Records get hard to find, updates are missed in one place, entries are typed inconsistently, the same information is repeated over and over, and you run out of “dimensions” to put new kinds of data in.</p>
    <p>That last problem is the heart of the example. Each client needs a list of dated notes, and you don’t know how many. They won’t fit in one cell, so they go on a second sheet, where each note repeats the client’s name and nothing actually links the two sheets. A database fixes this by storing the client once, giving it an <strong>ID</strong>, and having each note point at that ID. Step through it below.</p>
  </section>
  <figure class="wide">
    <div class="plate" data-dg="evo"></div>
    <div class="chips" id="evoBtns" aria-label="Choose a stage"></div>
    <div class="note" id="evoNote" aria-live="polite"></div>
    <figcaption><span class="src book">From the book</span><b>Book figures, pp. 6–8, redrawn.</b> The same two clients stored four ways. The book shows these as Word, Excel and Microsoft Access screenshots; here they are redrawn as schematics, with the note text shortened.</figcaption>
  </figure>
  <p>With that in mind, the chapter offers a working definition: a database is <q>a program that manages multi-dimensional data for multiple simultaneous users</q>. You describe the structure, hand it the data, and it looks after storage, fast searching, and adding new dimensions such as the notes. The payoff, in the book’s list of five:</p>
  <ol>
    <li>Your data is structured and ordered.</li>
    <li>Many people can work on it at the same time.</li>
    <li>Related information is easier to search.</li>
    <li>It is easier to report on.</li>
    <li>You can build relationships between pieces of data.</li>
  </ol>
  <div class="aside pitfalls"><b>Common mistakes.</b> Packing a list into one field (“notes: called, no answer; sent quote…”) and copying the same name into many rows. Both are the spreadsheet habits this chapter is warning about. Chapter 2 gives them a name and a cure: normalization.</div>
  <div class="aside"><b>Front-end tie-in.</b> You already do this in state management. Instead of nesting a full client object inside every note, you keep <code>clients</code> and <code>notes</code> as separate arrays and store <code>note.clientId</code>. A foreign key is the database version of that normalized store.</div>

  <!-- 1.2 -->
  <section class="chap" id="p1-2">
    <h2><span class="num">1.2</span>A short history</h2>
    <p>The history matters for one idea above all: <strong>separating how data is organized logically from how it is stored on disk</strong>. Early systems didn’t do that, and every model since has been judged partly on how well it does.</p>
    <p>In the 1960s, computers could suddenly hold a lot of data. Storage schemes were built for processing efficiency, with no standard access method, so you had to know how a particular database was laid out on disk to use it. The hierarchical and network models come from this era. In 1970, E. F. Codd at IBM published <em>A Relational Model of Data for Large Shared Data Banks</em>, proposing tables, a mathematical foundation, and an English-like query language. That paper set off the prototypes, products and standards in the timeline.</p>
  </section>
  <figure class="wide">
    <div class="plate" data-dg="hist"></div>
    <div class="note" id="histNote" aria-live="polite"></div>
    <figcaption><span class="src ill">Course illustration</span><b>Figure A.</b> The chapter’s history as a timeline. Click an event for the details. Dates follow the book; “1960s” and “1990s” events cover a span.</figcaption>
  </figure>
  <div class="aside"><b>Two acronyms, corrected.</b> The book expands ODBC as “Object Database Connectivity” and ADO as “Active Data Object”. They are <strong>Open Database Connectivity</strong> and <strong>ActiveX Data Objects</strong>. Neither is object-database technology; both are ways for programs to talk to (mostly relational) databases.</div>
  <div class="aside"><b>Then vs now.</b> The book ends its history with PostgreSQL and MySQL “challenging the big names”. They won: both are now mainstream, alongside SQLite on devices and managed cloud databases. The late 2000s added a wave of non-relational (“NoSQL”) stores, but the relational model and SQL remain the default for web apps, which is why the rest of this book focuses on them.</div>

  <!-- 1.3 -->
  <section class="chap" id="p1-3">
    <h2><span class="num">1.3</span>Hierarchical and network models</h2>
    <h3>Hierarchical</h3>
    <p>The oldest model. Data lives in a tree of tables, and every relationship is <strong>parent/child</strong>: a parent can have many children, but a child has exactly one parent. On tape-based mainframes this was efficient because the logical layout matched the physical one.</p>
    <p>The book’s example is its own publisher, glasshaus, storing divisions, the books in progress, the authors on each book, and author details. Every query must start at the top and walk down. To find the authors of one book, you go from the division to the book, down to the current authors to collect their IDs, then back up to the top and down a different branch to get their details. Trace it below.</p>
  </section>
  <figure class="wide">
    <div class="plate" data-dg="hier"></div>
    <div class="controls"><button class="btn primary" id="hierStart">Trace the query</button><button class="btn" id="hierPrev">Previous</button><button class="btn" id="hierNext">Next</button><span class="hint" id="hierCount"></span></div>
    <div class="note" id="hierNote" aria-live="polite"></div>
    <figcaption><span class="src book">From the book</span><b>Book figure, p. 11, redrawn.</b> The glasshaus hierarchy. The step-through follows the book’s description of finding a book’s authors.</figcaption>
  </figure>
  <div class="tablewrap"><table>
    <thead><tr><th>Table</th><th>Purpose</th></tr></thead>
    <tbody>
      <tr><td>Divisions</td><td>The publisher’s subject divisions</td></tr>
      <tr><td>Books</td><td>Books currently being written</td></tr>
      <tr><td>Current Authors</td><td>Which authors are on a given book</td></tr>
      <tr><td>Authors</td><td>Details for every available author</td></tr>
    </tbody>
  </table></div>
  <p class="hint">Based on the table beside the book’s figure, reworded.</p>
  <p>Two costs follow. Users must know the exact structure to write any query, and data gets duplicated: an author on three books has their details attached in three places. The book’s analogy is a file explorer, where you can only reach a folder by opening every folder above it. IBM’s IMS is the classic commercial example.</p>

  <h3>Network</h3>
  <p>The network model relaxes both limits. You can start a query at any table and move up or down, and because parent/child is replaced by <strong>association</strong>, a table can be linked to more than one “parent”. The links between tables form a network, hence the name. Its vocabulary:</p>
  <dl class="notation">
    <dt>Record</dt><dd>One row: attribute names and their values.</dd>
    <dt>Record Type</dt><dd>A collection of records of the same kind, such as Divisions or Authors.</dd>
    <dt>Set Type</dt><dd>A predefined relationship between two record types, built into the database like a stored query. Fast for the queries it was designed for, inflexible for anything else.</dd>
  </dl>
  <figure class="wide">
    <div class="plate" data-dg="net"></div>
    <figcaption><span class="src ill">Course illustration</span><b>Figure B.</b> The glasshaus example as a network database, using the two set types the book describes, plus a dashed third one added to show a record type with two owners. The book has no figure for this model.</figcaption>
  </figure>
  <p>The book names IBM’s DL/1 and Computer Associates’ IDMS as network products. IDMS is the classic network database (it follows the CODASYL standard); DL/I is more usually described as the data language of IBM’s hierarchical IMS. Either way, both models now survive only for accessing legacy data.</p>
  <div class="aside pitfalls"><b>Common mistakes.</b> Thinking “network model” has something to do with computer networks. It refers to the web of links between record types. Distributed databases (section 1.5) are the ones that involve multiple machines.</div>

  <!-- 1.4 -->
  <section class="chap" id="p1-4">
    <h2><span class="num">1.4</span>The relational model</h2>
    <p>Codd’s model keeps the <strong>structure of the data independent of how it is stored on disk</strong>. You describe tables and relationships; the system decides on files, pages and indexes. This is the model you will meet almost everywhere, and the rest of the book builds on it.</p>
    <dl class="notation">
      <dt>Database</dt><dd>The top level: a collection of tables.</dd>
      <dt>Table</dt><dd>At least one record, all holding the same kind of information, such as author details.</dd>
      <dt>Record</dt><dd>One row, made of at least one field, describing a single thing.</dd>
      <dt>Field</dt><dd>One value that forms part of a record. Today usually called a <em>column</em> (and records <em>rows</em>).</dd>
    </dl>
    <p>An Authors table, for example, might have name, email and billing fields. Fill them in for one author and you have a record; collect every author’s record and you have the table. The model’s power is in the relationships it keeps between tables, of three kinds:</p>
    <dl class="notation">
      <dt>One-to-one</dt><dd>Each record in X matches at most one in Y, and vice versa. Rare, because you could usually merge the two tables. Useful for splitting a very wide table, or for extra data that only some records have.</dd>
      <dt>One-to-many</dt><dd>One record in P can relate to many in S. The most common type: one division has many books, but each book sits in one division.</dd>
      <dt>Many-to-many</dt><dd>Records on both sides can relate to many on the other. Built with a third <strong>linking table</strong>, joined to each side by a one-to-many relationship.</dd>
    </dl>
  </section>
  <figure class="wide">
    <div class="plate" data-dg="rel"></div>
    <div class="chips" id="relBtns" aria-label="Highlight a relationship type"></div>
    <div class="note" id="relNote" aria-live="polite"></div>
    <figcaption><span class="src book">From the book</span><b>Book figure, p. 13, redrawn.</b> The glasshaus tables with all three relationship types. The book shows an Access relationships window; it is redrawn here in crow’s-foot notation, and the PK/FK labels are added for clarity.</figcaption>
  </figure>
  <p>In the figure, <code>division_id</code> links to <code>books.book_division</code> (one-to-many), each author links to one <code>authorbilling</code> row (one-to-one), and <code>books_authors</code> resolves the many-to-many between books and authors. (The book calls this table <code>authors_books</code> once in the text; the figure’s name is <code>books_authors</code>.) Here is the many-to-many in SQL. This is a course addition: the book doesn’t introduce SQL syntax until later.</p>
  <p class="codehead">PostgreSQL · the linking table</p>
<pre><code class="sql">CREATE TABLE books_authors (
  book_id   INT NOT NULL REFERENCES books(book_id),
  author_id INT NOT NULL REFERENCES authors(author_id),
  PRIMARY KEY (book_id, author_id)   -- a pair can appear only once
);

-- Who is writing book 7?
SELECT a.author_name
FROM books_authors ba
JOIN authors a ON a.author_id = ba.author_id
WHERE ba.book_id = 7;</code></pre>
  <div class="aside pitfalls"><b>Common mistakes.</b> Modeling many-to-many with a comma-separated <code>author_ids</code> column, or with an <code>author1</code>, <code>author2</code>, <code>author3</code> column set. Both make querying and integrity checks painful; the linking table is the answer. Also, don’t split tables one-to-one by default: do it only when you have a reason.</div>
  <div class="aside"><b>Front-end tie-in.</b> In Drizzle, the linking table is its own <code>pgTable</code> with two <code>.references()</code> columns and a composite primary key, and the many-to-many is declared as two one-to-many relations through it, exactly as in the figure.</div>

  <!-- 1.5 -->
  <section class="chap" id="p1-5">
    <h2><span class="num">1.5</span>Object, distributed and file-based storage</h2>
    <h3>Object databases</h3>
    <p>Object databases grew up alongside object-oriented languages like C++, for organizations whose data didn’t fit tables well. Stored objects look like the language’s own objects: data plus the methods that operate on it. Because the designer defines how objects may be changed, users have little chance to corrupt them. The trade-offs: there is no standard query language like SQL, and you need someone who can design the objects and program in an OO language. The book’s example is CA’s Jasmine, used to track McLaren’s Formula One car performance.</p>
    <h3>Object-relational</h3>
    <p>A blend of the two, created for two reasons: storing large multimedia data, and the mismatch between how programs structure data and how a relational database stores it. Programmers kept writing code to convert between the two on every read and write. Object databases avoid that, but switching to one later is hard. Object-relational systems let you stay relational while storing information in its native object form.</p>
    <div class="aside"><b>Then vs now.</b> That conversion problem is now called the <strong>object-relational impedance mismatch</strong>, and most teams solve it in code with an ORM or query builder (Drizzle, Prisma) rather than with a different database. PostgreSQL’s custom types and <code>JSONB</code> columns are the object-relational idea alive and well.</div>
    <h3>Multimedia databases</h3>
    <p>Built to store images, video and audio together with <strong>metadata</strong> describing them. Users query the metadata and get the media back. Size is the persistent problem, which is why, in the book’s day, these were mostly used over a fast local network.</p>
    <h3>Distributed systems</h3>
    <p>Not strictly a model but a configuration: several smaller machines share one database’s workload and appear to users as a single database. Each machine is a <strong>node</strong>, connected over a network. This adds power without upgrading one big machine.</p>
  </section>
  <figure class="wide">
    <div class="plate" data-dg="dist"></div>
    <div class="chips" id="distBtns" aria-label="Choose a flavor"></div>
    <div class="note" id="distNote" aria-live="polite"></div>
    <figcaption><span class="src ill">Course illustration</span><b>Figure C.</b> The two flavors of distributed database the book describes. Toggle between them.</figcaption>
  </figure>
  <p>A <strong>homogeneous</strong> system runs the same DBMS with the same layout on every node, for example a busy site’s mirror servers, with each request routed to a node that isn’t overloaded. The hard part is <strong>replication</strong>: every node must stay consistent, so these DBMSs ship with replication and fault tolerance. A <strong>heterogeneous</strong> system usually exists to support legacy systems: nodes may run different DBMSs, data normally isn’t duplicated, and nodes are linked so each can reach data it doesn’t hold.</p>

  <h3>File storage and CSV</h3>
  <p>Strictly speaking, a file with consistently structured data is a database too, and flat files run a lot of the web. The common format is <strong>comma-separated values</strong>: one record per line, fields separated by commas. The application must read each line, split it into fields, and only then decide what to do with the record. Here are the chapter’s two clients as CSV; note the quotes around the address that contains a comma.</p>
<pre><code>Name,Phone,Address
John Smith,555-0404,"1 Queen's Way, Southville"
Jane Doe,555-1234,53 East 17th Avenue</code></pre>
  <h3>XML</h3>
  <p>XML wasn’t designed as a database, but it was often used as a cheap one. As storage it shares the flat-file drawbacks: it’s read from disk and isn’t compressed or optimized, so access is slow. Its advantages over plain text are portability and that it <strong>describes the structure of the data it holds</strong>, which also makes it easier for people to read. Most languages can parse it, query it, and add or change records, and XSLT can transform it into XHTML for display.</p>
<pre><code>&lt;Names&gt;
  &lt;client name="John Smith"&gt;
    &lt;telephone&gt;555-0404&lt;/telephone&gt;
    &lt;address&gt;1 Queen's Way, Southville&lt;/address&gt;
  &lt;/client&gt;
  &lt;client name="Jane Doe"&gt;
    &lt;telephone&gt;555-1234&lt;/telephone&gt;
    &lt;address&gt;53 East 17th Avenue&lt;/address&gt;
  &lt;/client&gt;
&lt;/Names&gt;</code></pre>
  <h3>XML databases</h3>
  <p>A <strong>native XML database</strong> is designed to store XML documents, with DBMS features on top: document collections and XML query languages. <strong>XPath</strong> addresses a specific part of a document but can’t group or sort results. <strong>XQuery</strong> is much more powerful; when the book was written it was read-only. Most mainstream databases were “XML-enabled” (they could import and export XML), but native XML databases came from smaller vendors and open-source projects such as Apache Xindice.</p>
  <div class="aside"><b>Then vs now.</b> Several things here have moved on. XQuery gained update support (the W3C’s XQuery Update Facility, 2011), major vendors added native XML storage, and on the web JSON has largely replaced XML for data exchange. If you see a 2020s app storing documents, it’s more likely a JSON document store or a <code>JSONB</code> column than an XML database.</div>

  <!-- 1.6 -->
  <section class="chap" id="p1-6">
    <h2><span class="num">1.6</span>The DBMS</h2>
    <p>A <strong>database management system</strong> is the software that stores and manages databases. To the DBMS, a database is one named collection of related tables, usually among many. A database built in a DBMS is practically useless without it.</p>
    <dl class="notation">
      <dt>For end users</dt><dd>A single point of entry to any number of databases. A shopper doesn’t care that book titles come from one server and the order goes to another.</dd>
      <dt>For administrators</dt><dd>Security (the right people see the right parts), tools to add, edit and delete data and change permissions, and background work: logging access, running backups, and recovering from faults.</dd>
      <dt>Less redundancy</dt><dd>Departments stop keeping their own copies of shared data; each fact is stored once.</dd>
      <dt>Data integrity</dt><dd>Because a fact lives in one place, an update by one department is immediately seen by all the others.</dd>
    </dl>
  </section>
  <figure class="wide">
    <div class="plate" data-dg="dbms"></div>
    <div class="chips" id="dbmsBtns" aria-label="Choose a setup"></div>
    <div class="note" id="dbmsNote" aria-live="polite"></div>
    <figcaption><span class="src ill">Course illustration</span><b>Figure D.</b> The book’s argument for a DBMS: separate departmental copies versus one shared database. The department names are invented for the illustration.</figcaption>
  </figure>
  <p>The book works with <strong>relational DBMSs</strong> (RDBMSs) from here on. Its examples are the leaders of the time: Oracle 9, Sybase ASE and Microsoft SQL Server 2000.</p>

  <!-- 1.7 -->
  <section class="chap" id="p1-7">
    <h2><span class="num">1.7</span>Databases on the Web</h2>
    <p>The book gives three reasons a website uses a database:</p>
    <dl class="notation">
      <dt>Existing content</dt><dd>You already have a large database. You could export it to static HTML, but keeping it in the DBMS lets visitors search instead of browse, lets many applications reuse the data, and means updates happen once.</dd>
      <dt>Web applications</dt><dd>The database is the back end. Every e-commerce catalog is rows in a database, searched per request; your customer details are stored for next time. Forums store every post and check logins against stored users. Even saved display preferences, or a company’s intranet for projects, estimates and invoicing, run off a central database so cross-department reports are easy.</dd>
      <dt>Dynamic, changing material</dt><dd>News sites change hourly; editors add stories without touching HTML. <strong>Content management systems</strong> rely on a database for separating content from presentation, simultaneous authors, versioning and reporting.</dd>
    </dl>
  </section>
  <figure class="wide">
    <div class="plate" data-dg="web"></div>
    <figcaption><span class="src ill">Course illustration</span><b>Figure E.</b> Where the database sits in a web request. The book names Perl, ASP, ColdFusion, PHP and Java for the middle layer; today it is just as often Node.</figcaption>
  </figure>
  <p>The book also warns that being able to put something in a database doesn’t mean you should. Each one has a cost: the database itself plus the scripts to access it. Its example is a site header and footer, which a server-side include handles more cheaply than a query on every page.</p>
  <h3>Try it: does this need a database?</h3>
  <div class="chips" id="needBtns" aria-label="Pick a scenario"></div>
  <div class="note" id="needNote" aria-live="polite"></div>
  <div class="aside pitfalls"><b>Common mistakes.</b> Reaching for a database for content that never changes or is the same on every page, and going the other way: hand-rolling a JSON or CSV “database” for data with many users and concurrent writes. The questions to ask are the chapter’s: how much data, how many users, and how often it changes.</div>

  <!-- Review -->
  <section class="chap" id="review">
    <h2><span class="num">✓</span>Cheat sheet and quiz</h2>
    <h3>The models at a glance</h3>
    <div class="tablewrap"><table>
      <thead><tr><th>Model</th><th>Structure</th><th>How you query</th><th>Status</th></tr></thead>
      <tbody>
        <tr><td>Hierarchical</td><td>Tree; each child has one parent</td><td>Always from the top, walking down</td><td>Legacy (IMS)</td></tr>
        <tr><td>Network</td><td>Record types linked by set types; many “parents”</td><td>Start anywhere, but only along predefined sets</td><td>Legacy (IDMS)</td></tr>
        <tr><td>Relational</td><td>Tables of records and fields, related by keys</td><td>Declaratively with SQL; storage hidden</td><td>The default</td></tr>
        <tr><td>Object</td><td>Objects with data and methods</td><td>Through the programming language; no SQL</td><td>Niche</td></tr>
        <tr><td>Object-relational</td><td>Relational tables holding object-like values</td><td>SQL plus extensions</td><td>Built into modern RDBMSs</td></tr>
        <tr><td>Flat file / XML</td><td>Text files with consistent structure</td><td>Read and parse the file in code</td><td>Fine for small, simple data</td></tr>
      </tbody>
    </table></div>
    <h3>Key terms</h3>
    <dl class="notation">
      <dt>Data independence</dt><dd>Logical structure separate from physical storage: Codd’s big idea.</dd>
      <dt>One-to-one / one-to-many / many-to-many</dt><dd>The three relational relationship types; many-to-many needs a linking table.</dd>
      <dt>DBMS</dt><dd>The software that stores and manages databases, giving users one entry point and administrators security, backups and recovery.</dd>
      <dt>Homogeneous / heterogeneous</dt><dd>Distributed systems with the same DBMS and layout everywhere (and replication), versus different DBMSs linked together.</dd>
    </dl>

  </section>

<template id="tpl-pddw-02">
  <h1>Core database concepts</h1>
  <p class="lede">A crash course on Chapter 2 of <em>Practical Database Design for the Web</em>: what a data model is, how the relational model structures data, how nulls and keys work, why we normalize, how integrity rules protect data, and what indexes and hashing do at the physical level.</p>
  <p class="byline">Hover or tap any part of a diagram for an explanation, and use the Full screen button on any figure. Interactive pieces: a physical-data-independence toggle, a sets-to-table builder, a “is it still the same table?” experiment, clickable foreign keys, an anomaly explorer, a normalization stepper, null and integrity pickers, a B-tree search tracer and a disk-access comparison. Figures marked <span class="src book">From the book</span> are redrawn from the chapter; <span class="src ill">Course illustration</span> marks diagrams drawn for this course. The book’s headings are unnumbered; the numbers here are the course’s. Notes marked <em>Then vs now</em> are course additions: the book was written around 2002–2003.</p>

  <!-- 2.1 -->
  <section class="chap" id="p2-1">
    <h2><span class="num">2.1</span>What is a data model?</h2>
    <p>The chapter opens by defending theory. You can build a database without it, and it will mostly work, until you push it. Well-designed databases keep their performance as they grow and are easier to maintain and extend. A catalog search that is fine with 500 products can crawl at 5,000 if the design is poor. The good news: the ideas behind the relational model are simple, even if designing large systems isn’t.</p>
    <p>“Data model” has two accepted meanings, and the book asks you to keep them apart:</p>
    <dl class="notation">
      <dt>Meaning 1: a framework</dt><dd>A formal way of structuring and manipulating data. It is what a DBMS is built on. The relational model is one. Used mostly by theorists and DBMS vendors.</dd>
      <dt>Meaning 2: a description</dt><dd>A structured description of one real-world problem, such as an ER diagram of a library database. Often called a <strong>schema</strong>. Used by designers and analysts.</dd>
    </dl>
    <p>The book’s analogy: building regulations versus the floor plans for one particular building. This chapter and the next use meaning 1. In that sense, every data model has three aspects:</p>
    <dl class="notation">
      <dt>Structure</dt><dd>How data is represented.</dd>
      <dt>Integrity</dt><dd>How invalid data is kept out, and valid data kept valid.</dd>
      <dt>Operations</dt><dd>How you add, delete, change and retrieve data. Query languages such as SQL live here (Chapter 3).</dd>
    </dl>
    <p>The big win of modern models is <strong>physical data independence</strong>. In the 1960s there was no DBMS: you wrote your own data-management code and had to know where every file lived and how it was laid out. The fix was a <em>logical</em> data model layered over the physical storage. Programs talk to the logical model; the DBMS maps it to files. In principle, storage can be completely reorganized without rewriting a single program, and a general query language becomes possible because nobody needs to know where data physically sits.</p>
  </section>
  <figure class="wide">
    <div class="plate" data-dg="dmodel"></div>
    <div class="chips" id="dmBtns" aria-label="Choose a setup"></div>
    <div class="note" id="dmNote" aria-live="polite"></div>
    <figcaption><span class="src ill">Course illustration</span><b>Figure A.</b> The three aspects of a data model, and physical data independence. Switch between the 1960s approach, a logical model, and what happens when storage is reorganized. File names are invented for the illustration.</figcaption>
  </figure>
  <p>Three logical models appeared in the late 1960s and early 1970s: hierarchical, network and relational. The first two (Chapter 1) proved inflexible and were overtaken by the relational model in the early 1980s, which is why the rest of the chapter focuses on it.</p>
  <div class="aside"><b>Front-end tie-in.</b> The book points out the Web was meant to have its own physical independence: URLs are physical paths, and logical URIs that never change were supposed to hide them. You meet the same idea every time an API returns stable resource ids while the server moves files around behind it.</div>

  <!-- 2.2 -->
  <section class="chap" id="p2-2">
    <h2><span class="num">2.2</span>The relational model: tables, rows and columns</h2>
    <p>Edgar Codd, a mathematician at IBM, disliked the ad hoc nature of the early models and built one on <strong>set theory and predicate logic</strong>. He published it in the July 1970 <em>Communications of the ACM</em>. IBM’s System R prototype followed in the mid-1970s, then SQL/DS in 1981, which evolved into DB2. But a small company, Relational Software, Inc., shipped first, in 1979; its product was Oracle. The 1980s brought DB2, Sybase, Informix and many more.</p>
    <p>The core idea is a <strong>relation</strong>. Take a set of employee names, a set of positions, a set of locations and a set of salaries. Each employee takes one value from each set. Line those choices up and you get a table: each column draws from one set, each row is one employee. Build it below.</p>
  </section>
  <figure class="wide">
    <div class="plate" data-dg="sets"></div>
    <div class="chips" id="setBtns" aria-label="Choose a step"></div>
    <div class="note" id="setNote" aria-live="polite"></div>
    <figcaption><span class="src book">From the book</span><b>Book figures, p. 28, redrawn.</b> Four sets of values, and the EMPLOYEE relation built by taking one value from each.</figcaption>
  </figure>
  <p>It looks like a spreadsheet, but the book stresses the resemblance is only skin deep. Two warnings: a <em>relation</em> (a table) is not a <em>relationship</em> (a link between tables), and from here on the book just says “table”. The rules that make a table different:</p>
  <ul>
    <li>It has a <strong>name</strong> (EMPLOYEE) and named <strong>columns</strong>, each drawing its values from a set called the column’s <strong>domain</strong>.</li>
    <li>Each cell holds <strong>one value</strong>. No employee has two positions in one cell. This rule is first normal form (section 2.5).</li>
    <li>Any number of rows (four, four billion, none) and as many columns as you need, though columns are properties of one kind of thing, so huge numbers are unusual.</li>
    <li><strong>No two rows are identical</strong>, because each row is a different real-world instance.</li>
    <li><strong>Row order and column order don’t matter.</strong> Shuffle rows, or swap whole columns, and it’s still the same table. Moving individual values is a different matter. Try it:</li>
  </ul>
  <figure class="wide">
    <div class="plate" data-dg="props"></div>
    <div class="chips" id="propBtns" aria-label="Try a change"></div>
    <div class="note" id="propNote" aria-live="polite"></div>
    <figcaption><span class="src ill">Course illustration</span><b>Figure B.</b> The book’s rules about ordering and duplicates, as an experiment on its EMPLOYEE table. The “Paris” salary is the book’s own example of nonsense data.</figcaption>
  </figure>
  <p>Formally, tables are <strong>relations</strong>, rows are <strong>tuples</strong> and columns are <strong>attributes</strong>. The book uses the everyday names, but rejects file, record and field as synonyms: those are <em>physical</em> structures, and a logical table may be split across several physical files.</p>
  <p>A table usually stands for something real (employees, products, customers) or abstract (orders, invoices, contracts). Columns are the properties you store; each row is one occurrence. The chapter’s running example has three more tables, PRODUCT, CUSTOMER and SALE (shown in section 2.4). Drawing whole tables is clumsy, so the book uses a compact notation:</p>
<pre><code>EMPLOYEE(Name, Position, Location, Salary)
PRODUCT(ProductNo, Description, ReorderLevel, Price, QtyInStock)
CUSTOMER(CustomerNo, First, Last, Address, CreditLimit)
SALE(SaleNo, SaleDate, CustomerNo, ProductNo, Qty, Amount, Salesrep)</code></pre>
  <div class="aside pitfalls"><b>Common mistakes.</b> Relying on row order (“the newest order is the last row”): a table has no order unless you ask for one with <code>ORDER BY</code>. And treating a table like a spreadsheet, with duplicate rows or several values crammed into one cell.</div>

  <!-- 2.3 -->
  <section class="chap" id="p2-3">
    <h2><span class="num">2.3</span>Domains, data types and nulls</h2>
    <h3>Data types and domains</h3>
    <p>Everything is bits on disk, but a DBMS offers <strong>data types</strong> that say how to store and return values while hiding the physical form. Expect integers and decimals, a date type (often with time, sometimes separate), and fixed or variable-length strings. Many products add time intervals, <strong>BLOBs</strong> (binary large objects, such as images or documents), <strong>CLOBs</strong> (character large objects, for megabytes of text or XML) and Booleans.</p>
    <p>Strictly, data types aren’t part of the relational model. It speaks of <strong>domains</strong>: the set of allowed values for a column. A domain can be “any integer greater than 4000”, or even a mixed bag of values, though single-type domains are the norm. Few products supported domains directly (the book names Oracle); you get most of the effect with constraints, covered in Chapter 3.</p>
    <div class="aside"><b>Then vs now.</b> PostgreSQL has <code>CREATE DOMAIN</code>, for example <code>CREATE DOMAIN salary AS integer CHECK (VALUE &gt; 20000)</code>, which is exactly the book’s restricted single-type domain. In most products a <code>CHECK</code> constraint on the column is the everyday equivalent.</div>
    <h3>Missing data: null</h3>
    <p>Sometimes there is no value to store, for two different reasons. The value may be <strong>unknown</strong> (the customer didn’t give an email address) or <strong>inapplicable</strong> (the customer has no email address at all). An empty string means “a blank string”, not “no value”, and numbers and dates have no blank. Old tricks such as <code>-1</code> for a missing price break as soon as you compute a sum, an average or a date difference.</p>
    <p>Codd’s answer is <strong>null</strong>: a marker that stands in place of a value, usable with any type. It is not itself a value, so “null value” is a slight misnomer. In the SALE table, sale 12348 has a null CustomerNo, perhaps a cash sale. In CUSTOMER, a null CreditLimit means “not allowed credit”, which a zero would get wrong: zero suggests the customer has credit, just none left.</p>
    <p>Because null isn’t a value, comparisons and arithmetic with it are meaningless: the book likens “is null &gt; 2000?” to asking “is fish &gt; 2000?”. The usual answer is “unknown”. Pick an expression below to see what SQL does.</p>
  </section>
  <div class="chips" id="nullBtns" aria-label="Pick an expression"></div>
  <div class="note" id="nullNote" aria-live="polite"></div>
  <p class="codehead">PostgreSQL · nulls in the book’s CUSTOMER table (course addition; SQL arrives in Chapter 3)</p>
<pre><code class="sql">SELECT AVG(credit_limit) FROM customer;               -- 1250: the three nulls are skipped
SELECT * FROM customer WHERE credit_limit = NULL;     -- no rows, ever: the test is unknown
SELECT * FROM customer WHERE credit_limit IS NULL;    -- Amelia, Antonio and Wayne
SELECT COALESCE(credit_limit, 0) FROM customer;       -- show 0 instead of null, explicitly</code></pre>
  <p>Practical advice from the chapter: check how your RDBMS handles nulls, and say per column whether nulls are allowed. If a product doesn’t support nulls, simulate them with a flag column, for example <code>AllowedCredit</code> = Y/N beside <code>CreditLimit</code>. The other option is a <strong>default value</strong>, such as a dummy “Cash Sale” customer used as the default CustomerNo. The rule of thumb: use a sensible default if one exists; use null when no default makes sense.</p>
  <div class="aside pitfalls"><b>Common mistakes.</b> Writing <code>= NULL</code> instead of <code>IS NULL</code>; expecting <code>AVG</code> to count missing rows; using 0, <code>-1</code> or <code>''</code> as “missing” in a column that can legitimately hold those values. In TypeScript, the same split shows up as <code>null</code> versus <code>undefined</code> versus <code>""</code>: decide which one means “no value” and map it to SQL null consistently.</div>

  <!-- 2.4 -->
  <section class="chap" id="p2-4">
    <h2><span class="num">2.4</span>Primary keys and foreign keys</h2>
    <h3>Identifying rows: primary keys</h3>
    <p>If two rows were identical you couldn’t tell the real-world things apart, so the relational model requires every table to have a column, or combination of columns, that uniquely identifies each row: the <strong>primary key</strong>. A single column is preferable, but <strong>composite keys</strong> (such as order number plus product number) occur naturally. The model insists on a primary key even though many RDBMSs don’t.</p>
    <p>In PRODUCT, <code>ProductNo</code> is clearly a unique code. <code>Description</code> isn’t safe: names and descriptions aren’t guaranteed to stay unique, or unchanged, and <strong>primary key values shouldn’t change</strong>. EMPLOYEE is harder:</p>
    <div class="tablewrap"><table>
      <thead><tr><th>Name</th><th>Position</th><th>Location</th><th>Salary</th></tr></thead>
      <tbody>
        <tr><td>Jane Smith</td><td>Manager</td><td>London</td><td>35000</td></tr>
        <tr><td>Richard Jones</td><td>Analyst</td><td>New York</td><td>35000</td></tr>
        <tr><td>Anna Horton</td><td>Programmer</td><td>London</td><td>22000</td></tr>
        <tr><td>Alex de Tocqueville</td><td>Programmer</td><td>Paris</td><td>21000</td></tr>
      </tbody>
    </table></div>
    <p class="hint">The book’s EMPLOYEE table as shown on p. 35. (On p. 28 Richard Jones earns 34000; on p. 35 the two top rows share 35000, which is why Salary can’t be the key.)</p>
    <p>Position, Location and Salary all repeat. Name looks unique, but plenty of people share a name. Concatenating every column works on paper but makes searching slow, and two London programmers called Anna Horton on 22000 are not impossible. The better answer is an invented <strong>surrogate key</strong>, such as an employee number, often generated by the RDBMS (Chapter 4).</p>
    <p>A table has exactly one primary key but may have several unique identifiers. Store both an employee number and a social security number, and one becomes the primary key while the other is an <strong>alternate key</strong>. The book underlines primary keys from here on; in diagrams here they are bold and underlined.</p>
    <h3>Linking tables: foreign keys</h3>
    <p>Customers place orders and books have authors, so tables need links too. Look at SALE: it contains <code>CustomerNo</code>, the primary key of CUSTOMER. Take a sale’s CustomerNo and you can look up the right customer. That embedded column is a <strong>foreign key</strong>: “foreign” because it is another table’s primary (or alternate) key. SALE is the <strong>child table</strong>; CUSTOMER is a <strong>parent table</strong>. SALE has a second foreign key, <code>ProductNo</code>, pointing at PRODUCT. Click a sale to follow both.</p>
  </section>
  <figure class="wide">
    <div class="plate" data-dg="salesfk"></div>
    <div class="chips" id="fkBtns" aria-label="Highlight a property"></div>
    <div class="note" id="fkNote" aria-live="polite"></div>
    <figcaption><span class="src book">From the book</span><b>Book figure, p. 37, redrawn</b> (the tables themselves are on pp. 30–31). The book draws a line from every foreign-key value to its parent row; here one arrow per foreign key shows the link, and clicking a sale lights up the rows it points to.</figcaption>
  </figure>
  <p>Three things to notice, all visible in the figure:</p>
  <ul>
    <li>A foreign key should only hold values that exist as keys in the parent, or null. Sale 12348’s null CustomerNo is fine: there is no customer to find.</li>
    <li>Parent rows don’t need children: the left-handed doodad and the grunge nut have never been sold.</li>
    <li>Foreign key values needn’t be unique in the child: customer 1166-3461 appears twice, product DHU69863 three times.</li>
  </ul>
  <p>Foreign keys exist mainly so you can <strong>join</strong> related rows, such as sale 12347 with Amelia Waverley’s customer row (Chapter 3). Like primary keys they can be composite, and unlike primary keys a table can have several. You’ll sometimes hear them called <em>references</em>.</p>
  <div class="aside pitfalls"><b>Common mistakes.</b> Using a name or email as the primary key (both change); copying customer details into the sale instead of the customer’s key; and assuming the database checks foreign keys when you never declared them.</div>

  <!-- 2.5 -->
  <section class="chap" id="p2-5">
    <h2><span class="num">2.5</span>Normalization</h2>
    <p>Why split data into tables and join them back? One big table is faster to read, up to a point, and that was an early criticism of the relational model. The cost is <strong>data redundancy</strong>. Here is the book’s BIG_UGLY_TABLE, with customers and sales in one table. Pick a problem to see it.</p>
  </section>
  <figure class="wide">
    <div class="plate" data-dg="bigugly"></div>
    <div class="chips" id="bugBtns" aria-label="Show a problem"></div>
    <div class="note" id="bugNote" aria-live="polite"></div>
    <figcaption><span class="src book">From the book</span><b>Book figure, p. 38, redrawn.</b> BIG_UGLY_TABLE. The anomaly views act out the book’s three examples; the new address (12 New Road) and the new customer in the insert view are invented for the illustration.</figcaption>
  </figure>
  <dl class="notation">
    <dt>Wasted space</dt><dd>About 50 bytes of Amelia’s details per sale: 500 MB over ten million sales.</dd>
    <dt>Update anomaly</dt><dd>When she moves, every copy must change. Miss one and the data contradicts itself.</dd>
    <dt>Delete anomaly</dt><dd>Delete Richard Johnston’s only sale and his customer details vanish with it.</dd>
    <dt>Insert anomaly</dt><dd>You can’t record a customer until they buy something.</dd>
  </dl>
  <p>Splitting data into related tables removes the redundancy. That is <strong>normalization</strong>. (The name, the book says, came from Codd hearing that Nixon was “normalizing relations” with China.) It is a set of rules, the <strong>normal forms</strong>, from first (1NF) to fifth (5NF), each removing more redundancy by splitting tables further. Boyce/Codd (BCNF) and Domain-Key (DK/NF) sit outside that ladder and the book skips them. Every table is in at least 1NF by definition; well-designed databases usually reach 3NF or 4NF.</p>
  <p>The worked example starts by mashing PRODUCT, CUSTOMER and SALE into one table, ALL_SALES, and normalizing it back. The key idea is the <strong>functional dependency</strong>: <code>A → B</code> means that knowing A tells you B. Step through it:</p>
  <figure class="wide">
    <div class="plate" data-dg="normal"></div>
    <div class="chips" id="nfBtns" aria-label="Choose a normal form"></div>
    <div class="note" id="nfNote" aria-live="polite"></div>
    <figcaption><span class="src ill">Course illustration</span><b>Figure C.</b> The book’s normalization example (pp. 39–42), which it writes in text notation, drawn as entities with crow’s-foot links. ALL_SALES lists CustomerNo and ProductNo once here; the book’s list repeats them.</figcaption>
  </figure>
  <div class="tablewrap"><table>
    <thead><tr><th>Form</th><th>Rule (the book’s definitions, reworded)</th><th>Problem it removes</th></tr></thead>
    <tbody>
      <tr><td>1NF</td><td>No repeating groups: every cell holds one value</td><td>Lists inside cells</td></tr>
      <tr><td>2NF</td><td>Every column depends on the <em>whole</em> primary key</td><td>Partial dependencies on part of a composite key</td></tr>
      <tr><td>3NF</td><td>Every column depends on the primary key <em>alone</em></td><td>Transitive dependencies (key → X → Y)</td></tr>
      <tr><td>4NF</td><td>The key determines single values, not collections</td><td>Multi-valued dependencies (key →→ many values)</td></tr>
    </tbody>
  </table></div>
  <p>Two shortcuts: a table with a single-column primary key is automatically in 2NF (though a composite key doesn’t rule 2NF out), and 3NF is summed up as depending on “the key, the whole key, and nothing but the key”. The book reassures you that 4NF trips up experts too, and that most 3NF tables are already 4NF. 5NF is the theoretical limit; in practice there is little reason to go beyond 4NF, or even 3NF.</p>
  <p>Normalization costs reads: the DBMS has to reassemble the pieces, and on the Web response time matters. So the book’s advice is to choose by workload. Mostly-read data like a catalog can be <strong>denormalized</strong>; mission-critical data such as finance should stay normalized even if slower. A common pattern keeps both: a normalized operational database feeding a denormalized <strong>data warehouse</strong>. Normalization is a bottom-up technique; Chapter 4 designs top-down with ER diagrams.</p>
  <div class="aside pitfalls"><b>Common mistakes.</b> Adding <code>address2</code>, <code>address3</code> columns for “any number” of addresses (that is the 4NF problem; use a child table). Denormalizing before you have measured a slow query. And creating a surrogate key before the table is fully normalized: the book’s example deliberately waits until the end.</div>

  <!-- 2.6 -->
  <section class="chap" id="p2-6">
    <h2><span class="num">2.6</span>Data integrity</h2>
    <p>Data has <strong>integrity</strong> when it is valid and internally consistent. You get there by defining integrity rules, usually during design (Chapter 4), and letting the DBMS enforce them. For legacy data or data you don’t control, the best you may manage is to identify where it breaks the rules. The concept applies to every data model, hierarchical included.</p>
    <p>There are two kinds of rule. <strong>Built-in</strong> rules come with the data model and are mandatory. <strong>User-defined</strong> rules are the ones you, the developer, add, and they are optional, which means they may never get implemented. The book’s example: everyone “knows” no customer gets more than a 30% discount, but if that isn’t a rule in the database, nothing stops a program from giving 50%.</p>
    <dl class="notation">
      <dt>Entity integrity</dt><dd>Every row has a primary key, unique across the table, and <strong>no part of it may be null</strong>. You can’t prove uniqueness with nulls, because null can’t be compared.</dd>
      <dt>Referential integrity</dt><dd>A foreign key value must match an existing primary key in the parent table, <strong>or be null</strong>. This is why sale 12348 is allowed.</dd>
      <dt>Domain integrity</dt><dd>Every value in a column comes from the column’s domain.</dd>
    </dl>
    <p>The book’s sample rules: two employees can’t share a social security number (entity integrity, built in); every employee must have a name; gender must be present and be ‘f’ or ‘m’; a credit limit must be 0–5000 or null (all user-defined). Try some changes against the chapter’s tables:</p>
  </section>
  <div class="chips" id="intBtns" aria-label="Pick a change"></div>
  <div class="note" id="intNote" aria-live="polite"></div>
  <p class="codehead">PostgreSQL · the rules declared in the database (course addition)</p>
<pre><code class="sql">CREATE TABLE customer (
  customer_no  char(9)      PRIMARY KEY,                              -- entity integrity
  first        varchar(40)  NOT NULL,
  last         varchar(40)  NOT NULL,
  address      varchar(120),
  credit_limit numeric(8,2) CHECK (credit_limit BETWEEN 0 AND 5000)   -- null passes
);
CREATE TABLE sale (
  sale_no     int         PRIMARY KEY,
  sale_date   date        NOT NULL,
  customer_no char(9)     REFERENCES customer (customer_no),          -- null = cash sale
  product_no  char(8)     NOT NULL REFERENCES product (product_no),   -- referential integrity
  qty         int         NOT NULL CHECK (qty &gt; 0),                    -- a domain-style rule
  amount      numeric(10,2),
  salesrep    varchar(60)
);</code></pre>
  <p>Rules belong as close to the data as possible, ideally inside the database, where a rogue program can’t bypass them. On the Web you also want instant feedback, so the book suggests sending some rules to the browser with the form (as JavaScript), as long as they come from <strong>one authoritative source</strong>.</p>
  <p>Integrity rules guarantee data is <em>valid</em>, not that it is <em>correct</em>. “Brain Watlers” passes every rule as an employee name and is still a typo. The book’s defence is double entry or verification on top of the rules. Garbage in, garbage out.</p>
  <div class="aside"><b>Front-end tie-in.</b> The modern version of “one authoritative source” is a shared schema, for example a Zod schema imported by both the React form and the API handler. Keep the database constraints as well: they are the only rules that every client, script and migration must pass through.</div>

  <!-- 2.7 -->
  <section class="chap" id="p2-7">
    <h2><span class="num">2.7</span>Metadata and the data dictionary</h2>
    <p>Creating a database involves two jobs: defining its structures (tables, columns, types, keys) and filling it with data. The first produces <strong>metadata</strong>, data about the database. The DBMS files it in the <strong>catalog</strong> or <strong>data dictionary</strong>, which holds:</p>
    <ul>
      <li>table definitions (name, number of columns, primary key, physical storage) and column definitions (name, type, size, owning table);</li>
      <li>integrity rules, index details, users and passwords, and access privileges (Chapter 7);</li>
      <li>statistics such as table sizes, row sizes and query counts.</li>
    </ul>
    <p>The dictionary can be huge (the book notes Oracle’s has hundreds of tables) and usually uses the same model as the data, so in an RDBMS it is just more tables. The DBMS uses it mainly to run itself.</p>
  </section>
  <p class="codehead">PostgreSQL · reading the data dictionary (course addition)</p>
<pre><code class="sql">SELECT column_name, data_type, is_nullable
FROM information_schema.columns
WHERE table_name = 'customer';</code></pre>
  <div class="aside"><b>Front-end tie-in.</b> Tools like Drizzle Kit and Prisma read exactly these catalog tables when they introspect a database or generate a migration diff. Typed query builders are metadata turned into TypeScript types.</div>

  <!-- 2.8 -->
  <section class="chap" id="p2-8">
    <h2><span class="num">2.8</span>Physical data access methods</h2>
    <p>Everything so far was logical. Performance, though, is decided at the <strong>physical storage level</strong>, which sits below the relational model; the model itself says nothing about it. The bottleneck is the disk. Memory answers in nanoseconds, disk in milliseconds, so RAM can be up to a million times faster. One slow read doesn’t matter; millions per second on a busy site do, and the book reminds you that users get twitchy after about three seconds.</p>
    <p>Disks can’t be made much faster, and whole databases rarely fit in RAM (the book cites companies with 10 to 40 terabytes), so the goal is <strong>to touch the disk as rarely as possible</strong>. Data lives in files split into fixed-size <strong>blocks</strong> (or <strong>pages</strong>), each holding several records. A block is the smallest unit the DBMS reads or writes. There are three ways to find a record by a key value (here “key” means a search key, not necessarily the primary key):</p>
    <dl class="notation">
      <dt>Sequential access</dt><dd>Read from the start of the file until the key turns up: a <strong>table scan</strong>, like reading the phone book cover to cover. On average you read half the records. Fine for fifty rows, hopeless for fifty million.</dd>
      <dt>Indexed access</dt><dd>Look the key up in an <strong>index</strong>, a separately stored directory that says where the record is. The usual kind is the <strong>B-tree</strong>.</dd>
      <dt>Direct access</dt><dd>Feed the key to a <strong>hash function</strong> that computes the record’s disk location. Usually one disk access.</dd>
    </dl>
  </section>
  <figure class="wide">
    <div class="plate" data-dg="btree"></div>
    <div class="chips" id="btBtns" aria-label="Choose a search"></div>
    <div class="note" id="btNote" aria-live="polite"></div>
    <figcaption><span class="src book">From the book</span><b>Book figure, p. 47, redrawn.</b> A three-level B-tree on client surnames. The book draws a pointer from every leaf entry to the records; here there is one per leaf. Two leaves in the book are slightly out of order (Hart before Harris, Wilson before Van plat); they are kept as printed. The “Ellis” and “starts with S” searches are course additions.</figcaption>
  </figure>
  <p>Each node holds key values in sorted order and pointers down. In the second-level node “Chen | Fenton”, keys up to Chen are under the left pointer, keys after Chen up to Fenton under the middle one, and the rest (up to Harris) under the right. <strong>Leaf nodes</strong> point at the records on disk. Finding “Tudor” takes at most four disk reads (three nodes and the record); a small index like this sits in RAM, so usually just one. A table scan of these 27 records would average fourteen reads in the worst case of one record per block.</p>
  <p>Because keys are sorted, B-trees are good at <strong>range retrievals</strong> (“surnames starting with C”): find the first match and scan right. Records with similar keys also tend to sit in the same block, so the next one is often already in memory. The index can be <strong>unique</strong> or <strong>non-unique</strong>; this one is non-unique (two Joneses, two Smiths).</p>
  <p>The cost: inserts, deletes and key changes make the DBMS keep the tree in order, sometimes rebuilding part of it while nobody can use it. So index freely when data rarely changes, carefully when it changes a lot. Indexing primary keys is usually safe because they shouldn’t change (many products do it automatically), and tiny tables don’t need indexes at all: ten rows probably fit in one block.</p>
  <p><strong>Hashing</strong> decides where each record is placed, inside a reserved “hash space”, and spreads records out evenly. That makes single-record lookups on very large tables (millions of rows) as fast as it gets, but neighbouring keys end up in different blocks, so ranges are slow. The book’s verdict: hashing is a sledgehammer; for most databases indexes are enough. Compare all three:</p>
  <figure class="wide">
    <div class="plate" data-dg="access"></div>
    <div class="chips" id="accBtns" aria-label="Choose an access method"></div>
    <div class="note" id="accNote" aria-live="polite"></div>
    <figcaption><span class="src ill">Course illustration</span><b>Figure D.</b> The three access methods on a toy file of 24 surnames in 8 blocks. Block contents are invented; read counts follow the book’s reasoning.</figcaption>
  </figure>
  <p class="codehead">PostgreSQL · the two index kinds (course addition; the book covers indexes in Chapter 8)</p>
<pre><code class="sql">CREATE INDEX customer_last_idx ON customer (last);               -- B-tree, the default
CREATE INDEX sale_no_hash      ON sale USING hash (sale_no);     -- equality lookups only</code></pre>
  <div class="aside"><b>Then vs now.</b> SSDs cut a random read from milliseconds to tens or hundreds of microseconds, but RAM is still around a thousand times faster, so the book’s rule of thumb holds: fewer disk reads, faster queries. Terabyte databases are routine now, and in-memory stores like Redis cover the “keep it all in RAM” case for small, hot data.</div>
  <div class="aside pitfalls"><b>Common mistakes.</b> Indexing every column “just in case” on a write-heavy table; expecting a hash index to help <code>WHERE last LIKE 'S%'</code> or <code>ORDER BY</code>; and forgetting to index foreign key columns you join on.</div>

  <!-- 2.9 -->
  <section class="chap" id="p2-9">
    <h2><span class="num">2.9</span>Fitting it all together</h2>
    <p>The chapter ends with one picture. Data and metadata sit at the core, wrapped in indexes and integrity rules; together they are one <strong>database</strong>. The <strong>DBMS</strong> manages it and possibly other databases, and all access by users and applications goes through the DBMS. Security, transactions, APIs and data manipulation are left out for later chapters. Click a layer.</p>
  </section>
  <figure class="wide">
    <div class="plate" data-dg="layers"></div>
    <div class="note" id="layNote" aria-live="polite"></div>
    <figcaption><span class="src book">From the book</span><b>Book figure, p. 49, redrawn.</b> How the chapter’s concepts fit together. The book’s database ring is slightly off-center; it is centered here.</figcaption>
  </figure>
  <p>The summary adds some perspective. The relational model beat the hierarchical and network models on flexibility and simplicity, yet both have come back in new forms: <strong>hierarchical as XML</strong> and <strong>network as objects</strong>. Mapping between tables and objects is fairly easy, but there was no single accepted object model (the ODMG’s attempt saw patchy adoption), and relational vendors were adding object and XML features anyway. The one big controversy inside the relational world has been nulls: one camp supports them, the other prefers default values.</p>
  <div class="aside"><b>Then vs now.</b> The “XML is the new hierarchical model” line reads today as “JSON is”: document stores and <code>JSONB</code> columns hold tree-shaped data, with the same trade-offs the book describes. And the nulls debate never ended; it just moved into language design (<code>strictNullChecks</code>, <code>Option</code> types).</div>

      <dt>Foreign key</dt><dd>Another table’s key embedded in a child table; must match a parent row or be null; may repeat.</dd>

        <tr><td>Direct (hashing)</td><td>Usually 1 read</td><td>Poor: records scattered</td><td>Frequent single lookups on huge tables</td></tr>

  L2.forEach((n, j) => s += node(L2X[j], 98, 120, n, `Second-level node: ${n[0]} | ${n[1]}. Keys are sorted left to right across the whole tree.`, `data-n="l${j}"`));
  LEAVES.forEach((lf, i) => lf.forEach((nm, k) => s += G(`Leaf entry “${nm}”: points to that client’s record on disk.`, R(LX(i), 168 + 22 * k, 70, 22, "b", 0) + T(LX(i) + 35, 183 + 22 * k, nm, "sm2"), `data-e="${i}-${k}"`)));
  s += G("The records themselves, on disk. The index only stores keys and pointers.", cyl(260, 288, 200, 52, "Records on disk"));
  s += G("Levels of the tree.", T(712, 37, "root", "sm", "end") + T(712, 117, "level 2", "sm", "end"));
  s += T(712, 256, "leaves", "sm", "end");
  return SVG(720, 352, "A three-level B-tree index on surnames, with leaf pointers to records on disk", s);
};

const SORTED = [["Alberts","Anson","Chen"],["Davis","Ellis","Fenton"],["Glenn","Harris","Hart"],["Jarrow","Jones","Jones"],["Korth","Leyton","Martin"],["Nagel","Orly","Peters"],["Robb","Smith","Smith"],["Tong","Tudor","Walton"]];
const HASHED = [["Jones","Tong","Anson"],["Smith","Peters","Glenn"],["Tudor","Davis","Korth"],["Harris","Alberts","Robb"],["Nagel","Jones","Chen"],["Ellis","Walton","Smith"],["Martin","Jarrow","Hart"],["Leyton","Fenton","Orly"]];
const ACCESS = {
  seq:{ want:"Tudor", m:["Sequential access","read every block in order"], blocks:SORTED, read:[0,1,2,3,4,5,6,7], hit:{7:[1]}, reads:"8, one per block until Tudor turns up", scan:true },
  idx:{ want:"Tudor", m:["Indexed access","B-tree: root → level 2 → leaf"], blocks:SORTED, read:[7], hit:{7:[1]}, reads:"Up to 4 reads (3 index nodes + 1 block); 1 if the index is in RAM" },
  hash:{ want:"Tudor", m:["Direct access","hash(\"Tudor\") → block 3"], blocks:HASHED, read:[2], hit:{2:[0]}, reads:"1 read: the hash function computes the block" },
  ridx:{ want:"S…", m:["Indexed range","find first S, scan right"], blocks:SORTED, read:[6], hit:{6:[1,2]}, reads:"1 block: neighbouring keys sit together" },
  rhash:{ want:"S…", m:["Hashed range","hash can’t list a range"], blocks:HASHED, read:[0,1,2,3,4,5,6,7], hit:{1:[0],5:[2]}, reads:"Smiths scattered over blocks 2 and 6: every block must be read", scan:true }
};
function accessBody(k){
  const a = ACCESS[k]; let s = "";
  s += G("The search key we are looking for.", box(20, 20, 150, 50, "Looking for", a.want, 6));
  s += G("How the DBMS locates the record.", box(250, 20, 220, 50, a.m[0], a.m[1], 6));
  s += P("M170 45H250", "l", "mf");
  if (a.scan) s += G("A table scan: blocks are read one after another.", P("M30 238H690", "acc-l", "mfa") + T(360, 254, "reading blocks in order", "sm"));
  else a.read.forEach(b => s += G("The method goes straight to this block.", P(`M360 70L${60 + b * 86} 118`, "acc-l", "mfa")));
  a.blocks.forEach((blk, b) => {
    const x = 20 + b * 86, rd = a.read.includes(b);
    let g = R(x, 120, 80, 96, rd ? "acc" : "b", 4) + T(x + 40, 138, `block ${b + 1}`, "sm");
    blk.forEach((nm, j) => g += T(x + 40, 162 + 18 * j, nm, "sm2", "middle", (a.hit[b] || []).includes(j) ? ACC : ""));
    s += G(rd ? `Block ${b + 1} is read from disk.` : `Block ${b + 1} is never read.`, g);
  });

}

        o.querySelectorAll("button").forEach((x, j) => { x.disabled = true; if (j === ans) x.classList.add("right"); });
        if (i !== ans) b.classList.add("wrong"); else right++;
        answered++;
        const w = bx.querySelector(".why"); w.hidden = false; w.textContent = (i === ans ? "Correct. " : "Not quite. ") + why;
        $("score").textContent = answered === QUIZ.length ? `You scored ${right} of ${QUIZ.length}.` : `${answered} of ${QUIZ.length} answered, ${right} correct`;
      });
      o.appendChild(b);
    });
    quizEl.appendChild(bx);
  });
}
