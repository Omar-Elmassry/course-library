<template id="tpl-pddw-03">
  <h1>Creating and using relational databases with SQL</h1>
  <p class="lede">A crash course on Chapter 3 of <em>Practical Database Design for the Web</em>: where SQL came from, how to create and change tables, how to insert, update and delete rows safely, and how far one <code>SELECT</code> statement can take you. That means joins, sorting, grouping, aliases and set operations, finishing with a method for building queries one tested step at a time.</p>
  <p class="byline">Hover or tap any part of a diagram for an explanation, and use the Full screen button on any figure. Interactive pieces: an <code>ALTER TABLE</code> step-through, a WHERE-clause tester, a cross-product-versus-join toggle, a join-type explorer, and a <code>SELECT</code> pipeline stepper. Figures marked <span class="src book">From the book</span> are redrawn from the chapter; <span class="src ill">Course illustration</span> marks diagrams drawn for this course. Notes marked <em>Then vs now</em> are course additions: the book targets SQL-92 and was written around 2002–2003. The book doesn’t number its sections; the numbers here are the course’s.</p>

  <!-- 3.1 -->
  <section class="chap" id="p3-1">
    <h2><span class="num">3.1</span>SQL: the language and its dialects</h2>
    <p><strong>SQL</strong> (Structured Query Language) is the standard language for creating and using relational databases. The “query” part undersells it: SQL also creates and drops tables, changes data and manages permissions. It is not a general-purpose language like Java or PHP. Your application is written in one of those and sends SQL to the database.</p>
    <p>The key property is that SQL is <strong>declarative</strong>. You describe the result you want, and the RDBMS works out how to get it. Contrast a loop in application code, where you spell out every step. SQL has well-known theoretical flaws, but it became good enough, and so entrenched, that even object and XML query languages of the time (OQL, SiXDML) were deliberately made to look like it.</p>
    <h3>A short history</h3>
    <p>An IBM research group created the language in 1974 as <strong>SEQUEL</strong> for its System R prototype; it was renamed SQL for legal reasons, which is why many people still say “sequel”. It shipped in IBM’s SQL/DS in 1981, and Oracle and Ingres adopted it too (Ingres after starting with its own language, QUEL). Incompatible dialects followed quickly, so ANSI began standardizing in 1982. The first ANSI standard came in 1986, essentially IBM’s dialect, and ISO accepted it in 1987.</p>
    <div class="tablewrap"><table>
      <thead><tr><th>Standard</th><th>Keywords</th><th>Notes</th></tr></thead>
      <tbody>
        <tr><td>SQL-86</td><td>81</td><td>First ANSI standard</td></tr>
        <tr><td>SQL-89</td><td>100</td><td></td></tr>
        <tr><td>SQL-92 (“SQL2”)</td><td>276</td><td>About 500 pages. Levels: Entry, Intermediate, Full. Most products claim only Entry. The book uses SQL-92.</td></tr>
        <tr><td>SQL:1999 (“SQL3”)</td><td>473</td><td>Over 2,100 pages in 13 parts; Part 2, SQL/Foundation, is the minimum for compliance</td></tr>
        <tr><td>Oracle8i’s dialect</td><td>478</td><td>Shown for comparison</td></tr>
      </tbody>
    </table></div>
    <p class="hint">Keyword counts from the book’s table. The book’s examples were tested in PostgreSQL.</p>
    <p>SQL:1999 added a procedural language for stored procedures, functions and triggers (close to Oracle’s PL/SQL), structured and user-defined types, object storage, and, at last, a Boolean type. Every product speaks its own <strong>dialect</strong>: some version of the standard plus proprietary extensions, so always check your product’s documentation.</p>
    <h3>Three groups of commands</h3>
    <div class="tablewrap"><table>
      <thead><tr><th>Group</th><th>Purpose</th><th>Main statements</th></tr></thead>
      <tbody>
        <tr><td>DDL: Data Definition Language</td><td>Create and change structure (the relational model’s <em>structure</em> part)</td><td><code>CREATE TABLE</code>, <code>ALTER TABLE</code>, <code>DROP TABLE</code>, <code>CREATE INDEX</code>, <code>DROP INDEX</code></td></tr>
        <tr><td>DML: Data Manipulation Language</td><td>Read and change data (the <em>operations</em> part)</td><td><code>SELECT</code>, <code>INSERT</code>, <code>UPDATE</code>, <code>DELETE</code></td></tr>
        <tr><td>DCL: Data Control Language</td><td>Access, ownership and transactions (Chapters 7–8)</td><td><code>GRANT</code>, <code>REVOKE</code>, <code>COMMIT</code>, <code>ROLLBACK</code></td></tr>
      </tbody>
    </table></div>
    <p>One web-specific point from the introduction: real web apps rarely send raw SQL strings. The book recommends wrapping SQL in <strong>stored procedures</strong> kept in the database, which saves bandwidth and avoids SQL being tampered with in transit (Chapter 8).</p>
    <div class="aside"><b>Then vs now.</b> The standard has kept growing (SQL:2003 through SQL:2023, adding window functions, JSON support and more), and <code>BOOLEAN</code> is now ordinary in PostgreSQL and MySQL. On the security point, today the main defence against tampering is <strong>parameterized queries</strong>. Send the SQL with placeholders and the values separately, as every Node driver and ORM does, so user input can never become SQL. TLS protects the connection itself.</div>
  </section>

  <!-- 3.2 -->
  <section class="chap" id="p3-2">
    <h2><span class="num">3.2</span>Creating tables</h2>
    <p>How you create a <em>database</em> isn’t defined by the standard: it is “implementation-defined”. Access uses a menu, Oracle has <code>CREATE DATABASE</code>, PostgreSQL has the <code>createdb</code> command. Creating <em>tables</em> inside it is standard, with <code>CREATE TABLE</code>:</p>
<pre><code class="sql">CREATE TABLE &lt;name&gt;
( &lt;column-name&gt; &lt;data-type&gt; [DEFAULT &lt;value&gt;] [&lt;column-constraints&gt;],
  ...
  [&lt;table-constraints&gt;]
);</code></pre>
    <p>Square brackets mark optional parts. Keywords are not case-sensitive (capitals are a readability convention), and a semicolon ends each statement. The chapter recreates the four tables from Chapter 2, starting with <strong>CUSTOMER</strong>:</p>
  </section>
  <figure class="wide">
    <div class="plate" data-dg="cust"></div>
    <figcaption><span class="src book">From the book</span><b>CUSTOMER table, p. 58, redrawn.</b> The book’s sample data, annotated with each column’s type and constraint from the book’s <code>CREATE TABLE</code> statement. The annotations are added for this course.</figcaption>
  </figure>
<pre><code class="sql">CREATE TABLE CUSTOMER
( CustomerNo   CHAR(9),
  First        CHAR(20)      NOT NULL,
  Last         CHAR(20)      NOT NULL,
  Address      VARCHAR(100)  NOT NULL,
  CreditLimit  SMALLINT      CHECK (CreditLimit &gt;= 0),
  PRIMARY KEY (CustomerNo)
);</code></pre>
    <h3>Data types in SQL-92</h3>
    <p>Integers come in two sizes: <code>SMALLINT</code> (usually up to 32,767) and <code>INTEGER</code> (up to about 2.1 billion). <code>NUMERIC</code> holds exact decimals, <code>FLOAT</code> floating point, <code>DATE</code> dates, and character data is fixed-length <code>CHAR</code> or variable-length <code>VARCHAR</code>. A size in parentheses means different things per type:</p>
    <div class="tablewrap"><table>
      <thead><tr><th>Type</th><th>What the size means</th></tr></thead>
      <tbody>
        <tr><td><code>CHAR(9)</code></td><td>Exactly nine characters; shorter values are padded with blanks</td></tr>
        <tr><td><code>VARCHAR(50)</code></td><td>Up to 50 characters</td></tr>
        <tr><td><code>NUMERIC(6,2)</code></td><td>Six digits in total, two of them after the point: −9999.99 to 9999.99</td></tr>
      </tbody>
    </table></div>
    <p class="hint">Based on the book’s table on p. 59. The book warns that some products read <code>NUMERIC(6,2)</code> as six digits <em>before</em> the point, against the standard.</p>
    <p>Vendors offer supersets of these types (Oracle prefers its own <code>NUMBER</code>). The book’s rule of thumb for <code>CHAR</code> versus <code>VARCHAR</code>: fixed-length is faster but can waste space, so use <code>CHAR</code> for values of near-constant length (phone numbers) or heavily searched columns, and <code>VARCHAR</code> for longer, less-used text. Money should always be <code>NUMERIC</code> or <code>INTEGER</code>, never <code>FLOAT</code>, because floating point can produce slightly wrong totals.</p>
    <div class="aside"><b>Then vs now.</b> The speed argument for <code>CHAR</code> no longer holds in PostgreSQL. Its docs say <code>char(n)</code> has no performance advantage and is usually the slowest of the three because of padding, so use <code>varchar</code> or <code>text</code>. The money rule still stands: in JavaScript, keep money as integer cents or a decimal library, never a float.</div>
    <h3>Column and table constraints</h3>
    <p>A <strong>constraint</strong> is an integrity rule the RDBMS enforces. A <strong>column constraint</strong> is attached to one column and can refer only to that column. A <strong>table constraint</strong> can refer to any column, so a rule comparing two columns must be a table constraint.</p>
    <dl class="notation">
      <dt><code>PRIMARY KEY (cols)</code></dt><dd>Entity integrity: unique and never null. List several columns for a composite key, e.g. <code>PRIMARY KEY (A, B, C)</code>. Adding <code>NOT NULL</code> as well is redundant, and the book notes it may even slow things down.</dd>
      <dt><code>FOREIGN KEY (cols) REFERENCES T</code></dt><dd>Referential integrity: values must match a primary key in T, or be null.</dd>
      <dt><code>NOT NULL</code></dt><dd>A value is required. Columns allow nulls unless you say otherwise.</dd>
      <dt><code>CHECK (condition)</code></dt><dd>Values must make the condition true. It only applies when there is a value, so a null still passes.</dd>
      <dt><code>UNIQUE</code></dt><dd>No duplicates; mainly for alternate keys.</dd>
      <dt><code>CONSTRAINT name …</code></dt><dd>Names a constraint, e.g. <code>CONSTRAINT CreditCheck CHECK (CreditLimit &gt;= 0)</code>, so you can drop it later. Otherwise the system invents a cryptic name.</dd>
    </dl>
    <p>Nulls complicate true/false logic, so the book advises avoiding nulls in columns you will test in conditions. It admits <code>CreditLimit</code> is one of those and fixes it in section 3.3.</p>
    <h3>The rest of the running example</h3>
    <p>PRODUCT (<code>Price NUMERIC(5,2)</code> with <code>CHECK ((Price &gt;= 0) AND (Price &lt;= 999.99))</code>), SALE (a <code>DATE</code> column and two foreign keys), and EMPLOYEE. EMPLOYEE’s only candidate key in Chapter 2 was all its columns together, so the chapter adds a <strong>surrogate key</strong>, <code>EmployeeID</code>, and checks salaries with <code>CHECK (Salary BETWEEN 10000 AND 50000)</code>.</p>
  <figure class="wide">
    <div class="plate" data-dg="schema"></div>
    <figcaption><span class="src ill">Course illustration</span><b>Figure A.</b> The chapter’s four tables, drawn as an ER diagram from the book’s <code>CREATE TABLE</code> statements (the book shows only the tables and SQL). <code>ManagerID</code> (accent) is added later with <code>ALTER TABLE</code>.</figcaption>
  </figure>
<pre><code class="sql">CREATE TABLE SALE
( SaleNo      SMALLINT,
  SaleDate    DATE          NOT NULL,
  CustomerNo  CHAR(9),                          -- null = cash sale
  ProductNo   CHAR(8)       NOT NULL,
  Qty         INTEGER       NOT NULL CHECK (Qty &gt; 0),
  Amount      NUMERIC(6,2)  NOT NULL CHECK (Amount &gt;= 0),
  Salesrep    VARCHAR(50),
  PRIMARY KEY (SaleNo),
  FOREIGN KEY (CustomerNo) REFERENCES CUSTOMER,
  FOREIGN KEY (ProductNo)  REFERENCES PRODUCT
);</code></pre>
  <p>The book admits two shortcuts here. A sale can hold only one product (the proper header-lines structure for many products per sale comes in Chapter 4), and <code>Salesrep</code> should really be a foreign key to another table.</p>
  <div class="aside pitfalls"><b>Common mistakes.</b> Using <code>FLOAT</code> for prices. Thinking <code>CHECK (CreditLimit &gt;= 0)</code> forbids nulls (it doesn’t; add <code>NOT NULL</code>). Writing a two-column rule as a column constraint. Leaving constraints unnamed and then having to find the generated name before you can drop one.</div>

  <!-- 3.3 -->
  <section class="chap" id="p3-3">
    <h2><span class="num">3.3</span>Changing structure: DROP, ALTER and indexes</h2>
    <p><code>DROP TABLE CUSTOMER;</code> deletes the table <em>and all its data</em>, usually without asking. Normally only the table’s creator may do it (security is in Chapter 8; backups, which you will want if it goes wrong, are in Chapter 9).</p>
    <p>Structures change over time, and dropping and recreating a table to add one column is wasteful and means downtime. <code>ALTER TABLE</code> comes in three forms:</p>
    <dl class="notation">
      <dt>ADD</dt><dd><code>ADD [COLUMN] &lt;column-definition&gt;</code> or <code>ADD &lt;table-constraint&gt;</code>. New columns start as nulls, or as the default if one is given, so a <code>NOT NULL</code> column can only be added with a default. Standard SQL-92 can’t add a column constraint to an existing column.</dd>
      <dt>ALTER</dt><dd><code>ALTER [COLUMN] c SET DEFAULT v</code> or <code>DROP DEFAULT</code>. Only defaults in the standard; many products also let you change constraints or types here.</dd>
      <dt>DROP</dt><dd><code>DROP [COLUMN] c</code> (its data is lost) or <code>DROP CONSTRAINT name</code> (you need the name). You can’t drop a column that a constraint such as a foreign key still references.</dd>
    </dl>
    <p>The chapter’s example: employees now manage other employees, so EMPLOYEE gets a <code>ManagerID</code> that points back into EMPLOYEE itself, a <strong>recursive</strong> (unary) relationship covered in Chapter 4. The book assumes everyone has a manager, and the person at the top manages themselves, so the default is 0 until real IDs are filled in with <code>UPDATE</code>.</p>
<pre><code class="sql">ALTER TABLE EMPLOYEE ADD COLUMN ManagerID INTEGER DEFAULT 0 NOT NULL;
ALTER TABLE EMPLOYEE ADD FOREIGN KEY (ManagerID) REFERENCES EMPLOYEE;
ALTER TABLE EMPLOYEE ALTER COLUMN ManagerID SET DEFAULT 0;</code></pre>
    <p class="hint">The book prints the first and third statements with the type at the end (<code>… DEFAULT 0 NOT NULL INTEGER</code>), and the third without <code>SET</code>. The versions above follow the standard order: name, type, default, constraints. In practice the foreign key also needs the real manager IDs in place first, since no employee has ID 0.</p>
    <p>Then the <code>CreditLimit</code> fix. The business decides that “no credit” means 0, not null. Because SQL-92 can’t add <code>NOT NULL</code> to an existing column, the book needs a six-step detour through a temporary column. Step through it:</p>
  </section>
  <figure class="wide">
    <div class="plate" data-dg="alter"></div>
    <div class="chips" id="altBtns" aria-label="Choose a step"></div>
    <div class="note" id="altNote" aria-live="polite"></div>
    <figcaption><span class="src ill">Course illustration</span><b>Figure B.</b> The book’s procedure for making <code>CreditLimit</code> NOT NULL under SQL-92, applied to the five sample customers. New or changed columns are in the accent color.</figcaption>
  </figure>
  <div class="aside"><b>Then vs now.</b> Modern products make this two statements. In PostgreSQL: <code>UPDATE CUSTOMER SET CreditLimit = 0 WHERE CreditLimit IS NULL;</code> then <code>ALTER TABLE CUSTOMER ALTER COLUMN CreditLimit SET NOT NULL;</code>, and <code>SET DEFAULT 0</code> for new rows. That is the shortcut the book wishes for. In a team, these changes live in <strong>migration files</strong> (Prisma, Drizzle, Knex) that are version-controlled and run in order.</div>
  <h3>Indexes</h3>
  <p><code>CREATE [UNIQUE] INDEX name ON table (columns);</code> and <code>DROP INDEX name;</code>. These are technically outside the standard but universal. An index on <code>CUSTOMER (Last, First)</code> speeds up name searches; it can’t be unique, because names repeat. <code>CREATE UNIQUE INDEX … ON EMPLOYEE (EmployeeID)</code> works, but is usually redundant: many products index primary keys automatically. Indexes return in Chapter 8.</p>
  <div class="aside pitfalls"><b>Common mistakes.</b> Running <code>DROP TABLE</code> or <code>DROP COLUMN</code> against production without a backup. Adding a <code>NOT NULL</code> column with no default to a table that already has rows. Trying to drop a column that a foreign key still references.</div>

  <!-- 3.4 -->
  <section class="chap" id="p3-4">
    <h2><span class="num">3.4</span>Changing data: INSERT, UPDATE, DELETE and WHERE</h2>
    <p>The four everyday operations are Create, Read, Update and Delete, known as <strong>CRUD</strong>. Reading gets its own sections; the other three are simple.</p>
    <h3>INSERT</h3>
<pre><code class="sql">INSERT INTO EMPLOYEE (EmployeeID, Name, Position, Location, Salary)
VALUES (617258, 'Jane Smith', 'Manager', 'London', 35000);

-- Key generated by the RDBMS: leave the column out
INSERT INTO EMPLOYEE (Name, Position, Location, Salary)
VALUES ('Heather Ralston', 'Manager', 'Melbourne', 33000);

-- An explicit null, and an ISO date in single quotes
INSERT INTO SALE (SaleNo, SaleDate, CustomerNo, ProductNo, Qty, Amount, Salesrep)
VALUES (12348, '2002-08-13', NULL, 'DHU69863', 50, 118.50, 'Sara Thompson');</code></pre>
    <p>The column list is technically optional, but without it values go in table order, which breaks silently when columns are reordered or added. Always list the columns. You can leave a column out when the RDBMS generates it, or when you want its null or default value (after the 3.3 fix, an omitted <code>CreditLimit</code> becomes 0). Strings and dates use <strong>single</strong> quotes. Double quotes can mean something else entirely, and two single quotes inside a string stand for one apostrophe: <code>'Fred''s fish'</code>. Date formats vary by product, so the book uses ISO dates (year-month-day).</p>
    <h3>UPDATE</h3>
<pre><code class="sql">UPDATE EMPLOYEE SET Salary = 37000 WHERE EmployeeID = 617258;   -- by key: one row
UPDATE CUSTOMER SET CreditLimit = 0, Address = 'Iowa State Penitentiary'
WHERE CustomerNo = '4649-4673';
UPDATE PRODUCT SET Price = Price * 1.1;                        -- every row, from its own value</code></pre>
    <p>Without a <code>WHERE</code>, <code>UPDATE</code> changes every row: <code>UPDATE EMPLOYEE SET Salary = 37000;</code> gives everyone the same salary. Filter on the primary key when you mean one row; <code>WHERE Name = 'Jane Smith'</code> could hit several people. <code>SET c = NULL</code> is the one place null goes with <code>=</code>. In comparisons you write <code>IS NULL</code>.</p>
    <h3>DELETE</h3>
<pre><code class="sql">DELETE FROM PRODUCT  WHERE ProductNo = 'AAD62726';
DELETE FROM EMPLOYEE WHERE Location = 'New York' AND Salary &gt;= 40000;
DELETE FROM SALE     WHERE CustomerNo IS NULL;
DELETE FROM PRODUCT;   -- fails here: sales still reference products</code></pre>
    <p>The last statement tries to delete every product. It should fail, because rows in SALE refer to products through a foreign key, and removing them would break referential integrity. The RDBMS refuses, as long as you declared the keys. Many products also offer a non-standard <code>TRUNCATE</code>, which empties a table much faster than <code>DELETE</code> because it doesn’t log each row. That makes it handy for resetting test data from a script.</p>
    <h3>The WHERE clause</h3>
    <p><code>WHERE</code> <strong>filters</strong> rows: its true/false condition is evaluated for each row, and only rows where it is true go on to the operation. Combine sub-conditions with <code>AND</code>, <code>OR</code> and <code>NOT</code>, and use parentheses to make the grouping explicit. <code>&lt;&gt;</code> is standard “not equal” (some products also accept <code>!=</code>). Forgetting the <code>WHERE</code> on an <code>UPDATE</code> or <code>DELETE</code> is a classic beginner mistake. A wrong <code>WHERE</code> is just as bad. Test the condition as a <code>SELECT</code> first, on a backup with representative data, never on the live system.</p>
  <figure class="wide">
    <div class="plate" data-dg="where"></div>
    <div class="chips" id="whBtns" aria-label="Choose a condition"></div>
    <div class="note" id="whNote" aria-live="polite"></div>
    <figcaption><span class="src book">From the book</span><b>SALE table, p. 62, redrawn</b>, with the sub-conditions of the book’s <code>DELETE</code> example (p. 72). The two null tests are a course addition. Pick a condition to see each row’s result.</figcaption>
  </figure>
  <p class="hint">Two corrections to the book’s worked examples. In its <code>DELETE</code>, the code prints <code>ProductNo &lt;&gt; 'DHU69863'</code>, but the explanation and the row counts only work with <code>=</code>, which is what the tester uses. In the preceding <code>UPDATE PRODUCT SET Price = Price * 2 WHERE ((QtyInStock &gt; 5000) OR (Price &lt;= 10)) AND (ReorderLevel &lt; 1000)</code>, the book says four rows change. Because of the <code>AND</code>, only rows matching both parts change: two (AAD62726 and DHU69863).</p>
  <div class="aside pitfalls"><b>Common mistakes.</b> <code>WHERE CustomerNo = NULL</code>, which matches nothing because any comparison with null is <em>unknown</em>, not true. Use <code>IS NULL</code>. Mixing <code>AND</code> and <code>OR</code> without parentheses. Putting a value in double quotes. Omitting the column list in <code>INSERT</code>.</div>

  <!-- 3.5 -->
  <section class="chap" id="p3-5">
    <h2><span class="num">3.5</span>Querying with SELECT</h2>
    <p>Reading data is called <strong>querying</strong>. When Codd defined the relational model he gave it two query languages. <strong>Relational algebra</strong> is a set of operators on tables, giving step-by-step instructions. <strong>Relational calculus</strong>, based on logic, describes what the result looks like and leaves the how to someone else. SQL’s <code>SELECT</code> is mostly algebra with some calculus. Some queries are awkward to express because of early design decisions, but everyday ones are easy.</p>
<pre><code class="sql">SELECT &lt;columns&gt;
FROM &lt;tables&gt;
[WHERE &lt;conditions&gt;];

SELECT Name, Salary FROM EMPLOYEE WHERE Location = 'Paris';   -- Alex de Tocqueville, 21000</code></pre>
    <p>Read a <code>SELECT</code> in this order: <code>FROM</code> (which tables), then <code>WHERE</code> (which rows), then the <code>SELECT</code> list (which columns). Because <code>WHERE</code> is processed before the output is shaped, it can test columns you don’t return. That suits the web, where you send only what the page needs.</p>
    <p><code>SELECT *</code> returns every column. The book calls it bad practice. It wastes server time and bandwidth on large tables, and it can be a security hole: a column added later for internal use suddenly shows up in every <code>SELECT *</code>. Name your columns.</p>
    <p>The chapter then answers its list of plain-English questions:</p>
<pre><code class="sql">-- How many grunge nuts do we have in stock?
SELECT ProductNo, Description, QtyInStock FROM PRODUCT WHERE ProductNo = 'FGE91822';

-- Any customers with a credit limit over $6,000?  (none)
SELECT CustomerNo, First, Last FROM CUSTOMER WHERE CreditLimit &gt; 6000;

-- Sales on 12 or 13 August 2002: three equivalent filters
WHERE SaleDate = '2002-08-12' OR SaleDate = '2002-08-13'
WHERE SaleDate BETWEEN '2002-08-12' AND '2002-08-13'      -- inclusive range
WHERE SaleDate IN ('2002-08-12', '2002-08-13')            -- value in a list</code></pre>
    <p>Being able to write a query several ways is one of SQL’s strengths. The book points out the downside: it makes the optimizer’s job of finding the fastest plan harder. Totalling the revenue waits for aggregation (3.7). Then comes “all sales to Amelia Waverley”. Her name is in CUSTOMER and her sales are in SALE, so the obvious move is to list both tables in <code>FROM</code>. Doing that without a join condition gives seven rows, five of which aren’t hers, which leads straight into joins.</p>
    <div class="aside"><b>Front-end tie-in.</b> This is also the case against an API that returns whole rows “just in case”. Selecting only the columns a component renders keeps payloads small. ORMs default to all columns, so use their <code>select</code> option on hot paths.</div>
  </section>

  <!-- 3.6 -->
  <section class="chap" id="p3-6">
    <h2><span class="num">3.6</span>Joins</h2>
    <p>Listing several tables in <code>FROM</code> with no further instructions produces the <strong>Cartesian product</strong>: every row of one table combined with every row of the other. It sounds odd, but it is the raw material that join conditions and filters then cut down.</p>
  </section>
  <figure class="wide">
    <div class="plate" data-dg="product"></div>
    <div class="chips" id="prBtns" aria-label="Choose a version"></div>
    <div class="note" id="prNote" aria-live="polite"></div>
    <figcaption><span class="src ill">Course illustration</span><b>Figure C.</b> The book’s Amelia Waverley query, with and without a join condition. The rows are the book’s; the layout and highlighting are added.</figcaption>
  </figure>
  <p>A <strong>join</strong> combines related rows from two tables, normally over a foreign key/primary key link. The chapter covers three kinds.</p>
  <h3>Natural joins</h3>
  <p><code>FROM CUSTOMER NATURAL JOIN SALE</code> matches rows on every column the two tables share by name and type, here <code>CustomerNo</code>. It is fragile. Two tables can share a column name like <code>ItemNo</code> without it meaning the same thing, and the join changes silently when columns are added. Many products don’t support it. The book puts it in the same “potentially dangerous” category as <code>SELECT *</code>, and suggests giving columns descriptive names so that same-named columns really mean the same attribute.</p>
  <h3>Condition-based joins</h3>
  <p>Say exactly how rows match. There are two syntaxes:</p>
<pre><code class="sql">-- Pre-SQL-92: join condition in WHERE, alongside the filters
SELECT SALE.SaleNo, SALE.SaleDate, SALE.Amount, SALE.Salesrep
FROM CUSTOMER, SALE
WHERE CUSTOMER.CustomerNo = SALE.CustomerNo
  AND CUSTOMER.First = 'Amelia' AND CUSTOMER.Last = 'Waverley';

-- SQL-92: JOIN … ON in FROM; WHERE only filters
SELECT SALE.SaleNo, SALE.SaleDate, SALE.Amount, SALE.Salesrep
FROM CUSTOMER JOIN SALE ON CUSTOMER.CustomerNo = SALE.CustomerNo
WHERE CUSTOMER.First = 'Amelia' AND CUSTOMER.Last = 'Waverley';

-- Three tables: sales on 14 August with product and customer names
SELECT SALE.SaleNo, SALE.Qty, SALE.Amount, PRODUCT.ProductNo, PRODUCT.Description,
       CUSTOMER.First, CUSTOMER.Last
FROM (CUSTOMER JOIN SALE ON SALE.CustomerNo = CUSTOMER.CustomerNo)
     JOIN PRODUCT ON SALE.ProductNo = PRODUCT.ProductNo
WHERE SALE.SaleDate = '2002-08-14';</code></pre>
  <p><code>CUSTOMER.CustomerNo</code> is a <strong>qualified</strong> column name: table plus column. It is required when both tables have the column, and the book adopts it everywhere as documentation for whoever maintains the code next. The SQL-92 form keeps join conditions apart from filters and is easier to read. In the book’s day it was less widely supported (Oracle only added it in 9i). In a multi-table SQL-92 join, each <code>JOIN</code> joins onto the result so far, and with outer joins that order can matter.</p>
  <p class="hint">In the book’s side-by-side table on p. 80, the “SQL-92 style” and “Pre-SQL-92 style” column headings are swapped. Go by the syntax: the comma-and-<code>WHERE</code> form is the older one.</p>
  <h3>Outer joins</h3>
  <p>“Show all products, and the value of each sale they’ve been involved in, if any.” An ordinary <code>JOIN</code> returns only the three products that have sold, because the others fail the join condition. All the joins so far are <strong>inner joins</strong>. An <strong>outer join</strong> also keeps rows that have no match and fills the other table’s columns with nulls in the result. Those nulls exist only in the temporary result, so the <code>NOT NULL</code> constraints on SALE aren’t violated.</p>
<pre><code class="sql">SELECT PRODUCT.ProductNo, PRODUCT.Description, SALE.SaleNo, SALE.Amount
FROM PRODUCT LEFT OUTER JOIN SALE ON PRODUCT.ProductNo = SALE.ProductNo;</code></pre>
  <figure class="wide">
    <div class="plate" data-dg="venn"></div>
    <div class="chips" id="jnBtns" aria-label="Choose a join type"></div>
    <div class="note" id="jnNote" aria-live="polite"></div>
    <figcaption><span class="src book">From the book</span><b>Join diagram, p. 82, redrawn</b>, with the result rows from p. 81. The book shades included areas gray, as here. The row highlighting and the right/full results are a course addition, worked out from the book’s data.</figcaption>
  </figure>
  <p><strong>Left</strong> keeps unmatched rows from the table left of <code>JOIN</code>, <strong>right</strong> from the table on the right, <strong>full</strong> from both. <code>OUTER</code> is optional (<code>RIGHT JOIN</code> means <code>RIGHT OUTER JOIN</code>). Support varied in the book’s day: some products had no outer joins, some lacked full outer joins, and Oracle8i used its own <code>WHERE PRODUCT.ProductNo = SALE.ProductNo (+)</code>. There, the <code>(+)</code> marks the side whose rows are <em>not</em> preserved.</p>
  <div class="aside"><b>Then vs now.</b> Oracle has supported standard <code>JOIN</code> syntax since 9i, so write <code>LEFT JOIN</code>. MySQL still has no <code>FULL OUTER JOIN</code>; people emulate it with a <code>UNION</code> of a left and a right join.</div>
  <h3>Joins on the web</h3>
  <p>Joins cost time on large tables, and slow pages lose customers. Normalization is what makes joins necessary, and redundant data has nasty side effects, so the book looks for a middle path. Data that rarely changes once written, such as completed sales or a student’s finished courses, can have its joins <strong>pre-computed</strong>. Run the join once and store the result in a separate, denormalized table, then refresh it regularly (triggers, Chapter 8). That makes order-history pages cheap. The book calls this a <strong>materialized view</strong>, and it is only acceptable when users don’t need up-to-the-second data.</p>
<pre><code class="sql">-- SALE_HISTORY: one wide row per sale (columns from SALE, PRODUCT, CUSTOMER), PK SaleNo
INSERT INTO SALE_HISTORY (SaleNo, SaleDate, Qty, Amount, ProductNo, Description, Price,
                          CustomerNo, First, Last, Address)
SELECT SALE.SaleNo, SALE.SaleDate, SALE.Qty, SALE.Amount,
       PRODUCT.ProductNo, PRODUCT.Description, PRODUCT.Price,
       CUSTOMER.CustomerNo, CUSTOMER.First, CUSTOMER.Last, CUSTOMER.Address
FROM SALE, PRODUCT, CUSTOMER
WHERE SALE.ProductNo = PRODUCT.ProductNo
  AND SALE.CustomerNo = CUSTOMER.CustomerNo;   -- no customer filter: everyone’s history</code></pre>
  <p><code>INSERT … SELECT</code> inserts a query’s result instead of a <code>VALUES</code> list. Some products can create the table straight from a <code>SELECT</code>, which was non-standard then. Some use <code>SELECT INTO</code> for this, which means something different in standard SQL.</p>
  <div class="aside"><b>Then vs now.</b> PostgreSQL now has this built in: <code>CREATE MATERIALIZED VIEW sale_history AS SELECT …</code> and <code>REFRESH MATERIALIZED VIEW sale_history;</code>. <code>CREATE TABLE … AS SELECT</code> is standard and widely supported. Note that the book’s inner join drops cash sales, which have no customer. That is fine for a customer’s order history.</div>
  <div class="aside pitfalls"><b>Common mistakes.</b> Forgetting a join condition, which gives a silent Cartesian product. Joining on columns that only share a name. Using an inner join when the question says “all … if any”. Filtering the preserved side of an outer join in a way that turns it back into an inner join, as the detailed example in 3.9 shows.</div>

  <!-- 3.7 -->
  <section class="chap" id="p3-7">
    <h2><span class="num">3.7</span>Reporting: sorting, duplicates, aggregates and groups</h2>
<pre><code class="sql">SELECT &lt;columns&gt;
FROM &lt;tables&gt;
[WHERE &lt;conditions&gt;]
[GROUP BY &lt;columns&gt; [HAVING &lt;conditions&gt;]]
[ORDER BY &lt;columns&gt;];</code></pre>
    <h3>ORDER BY and DISTINCT</h3>
    <p>The relational model gives rows no order, so without <code>ORDER BY</code> they come back in whatever order is convenient, often insertion order. <code>ORDER BY EMPLOYEE.Position</code> sorts ascending (<code>ASC</code> is the default). <code>ORDER BY EMPLOYEE.Salary DESC</code> sorts descending. <code>ORDER BY EMPLOYEE.Position DESC, EMPLOYEE.Salary</code> sorts by position, then by salary within each position. <code>SELECT DISTINCT SALE.SaleDate FROM SALE</code> returns each of the three dates once instead of seven rows, which also means less output to send.</p>
    <h3>Aggregate functions</h3>
    <p>SQL has five: <code>COUNT</code>, <code>SUM</code>, <code>MIN</code>, <code>MAX</code>, <code>AVG</code>. Each takes a column or expression and returns one value for the set of rows that passed <code>WHERE</code>.</p>
<pre><code class="sql">SELECT COUNT(*), SUM(Salary), MIN(Salary), MAX(Salary), AVG(Salary) FROM EMPLOYEE;
SELECT SUM(PRODUCT.QtyInStock * PRODUCT.Price) FROM PRODUCT;   -- inventory value
SELECT COUNT(DISTINCT Position) FROM EMPLOYEE;                  -- 3: Programmer twice</code></pre>
    <p><code>COUNT(*)</code> counts rows, without looking at values. All the other aggregates ignore nulls. You can’t mix aggregates with ordinary columns in the <code>SELECT</code> list (<code>SELECT COUNT(*), CustomerNo FROM CUSTOMER</code> is an error) unless you group.</p>
    <p class="hint">A precision note. The book suggests <code>COUNT(DISTINCT col)</code> both for counting distinct values and for not counting nulls. For the second case, plain <code>COUNT(col)</code> is enough: it counts non-null values, duplicates included.</p>
    <h3>GROUP BY and HAVING</h3>
    <p><code>GROUP BY</code> splits the rows into groups that share a value, and the aggregate runs once per group, giving one output row each. <code>SELECT Position, COUNT(*) FROM EMPLOYEE GROUP BY Position</code> gives three rows. Grouping by <code>Position, Location</code> gives four, one per distinct combination. Any ordinary column in the <code>SELECT</code> list must also be in <code>GROUP BY</code>. Aggregates can appear only in <code>SELECT</code> and <code>HAVING</code>.</p>
    <p>To list reps with over $2,000 of sales, <code>WHERE SUM(Amount) &gt; 2000</code> fails: <code>WHERE</code> sees single rows, not groups. <code>HAVING</code> is the group-level filter, applied after the groups are built. Step through the evaluation:</p>
  </section>
  <figure class="wide">
    <div class="plate" data-dg="pipe"></div>
    <div class="controls"><button class="btn" id="pipePrev">Previous</button><button class="btn primary" id="pipeNext">Next</button><span class="hint" id="pipeCount"></span></div>
    <div class="note" id="pipeNote" aria-live="polite"></div>
    <figcaption><span class="src ill">Course illustration</span><b>Figure D.</b> How the RDBMS evaluates the book’s query <code>SELECT SALE.Salesrep FROM SALE GROUP BY SALE.Salesrep HAVING SUM(SALE.Amount) &gt; 2000</code>, clause by clause. Click a clause or use Next.</figcaption>
  </figure>
  <p>The book describes grouping as sorting by the group column, then splitting. Modern optimizers may hash instead, but the result is the same. Like joins, a frequently used <code>GROUP BY</code> on a large, fairly static table can be pre-computed into its own table.</p>
  <div class="aside pitfalls"><b>Common mistakes.</b> An aggregate in <code>WHERE</code>. A non-aggregated column in <code>SELECT</code> that isn’t in <code>GROUP BY</code>. Older MySQL allowed this and returned an arbitrary value. Relying on row order without <code>ORDER BY</code>.</div>

  <!-- 3.8 -->
  <section class="chap" id="p3-8">
    <h2><span class="num">3.8</span>Other useful features</h2>
    <h3>Comments, expressions and constants</h3>
    <p>Two hyphens start a comment (<code>-- like this</code>) that runs to the end of the line. Comments matter most in code kept in the database as stored procedures. The <code>SELECT</code> list can hold expressions and constants as well as columns. Each one becomes a new output column:</p>
<pre><code class="sql">SELECT PRODUCT.Description, PRODUCT.QtyInStock - PRODUCT.ReorderLevel FROM PRODUCT;
SELECT SALE.Salesrep, 'has sold to', CUSTOMER.First, CUSTOMER.Last
FROM SALE JOIN CUSTOMER ON SALE.CustomerNo = CUSTOMER.CustomerNo;</code></pre>
    <h3>Renaming tables and columns</h3>
    <p><code>FROM SALE AS S JOIN CUSTOMER AS C ON S.CustomerNo = C.CustomerNo</code> saves typing (<code>AS</code> is optional). An alias is really a <strong>table variable</strong> that ranges over the table’s rows, not a copy of the table. That matters for a <strong>self-join</strong>, where one table plays two roles. To list employees with their managers, EMPLOYEE must appear as both employee and manager. Without aliases the RDBMS rejects the duplicate table name.</p>
<pre><code class="sql">SELECT EMP.Name, MGR.Name
FROM EMPLOYEE EMP JOIN EMPLOYEE MGR ON EMP.ManagerID = MGR.EmployeeID;</code></pre>
  </section>
  <figure class="wide">
    <div class="plate" data-dg="self"></div>
    <figcaption><span class="src ill">Course illustration</span><b>Figure E.</b> The self-join. EMP and MGR are two aliases over the one stored EMPLOYEE table; each line follows a <code>ManagerID</code> to the matching <code>EmployeeID</code>. Rows and result as in the book.</figcaption>
  </figure>
  <p>Columns can be renamed too, which helps when output names would otherwise be blank or ambiguous. <code>SELECT AVG(PRODUCT.Price) AS AveragePrice, AVG(PRODUCT.QtyInStock) AS AverageQty FROM PRODUCT</code> labels two columns that would otherwise both just say AVG. Likewise <code>(QtyInStock - ReorderLevel) AS QtyRemaining</code>.</p>
  <h3>Set operations</h3>
  <p><code>UNION</code>, <code>INTERSECT</code> and <code>EXCEPT</code> (difference) combine the rows of two queries like set union, intersection and difference. Most products had <code>UNION</code> and <code>INTERSECT</code>; fewer had <code>EXCEPT</code>. Both queries must be <strong>compatible</strong>: the same number of columns with matching types (<code>CHAR</code> and <code>VARCHAR</code> count as the same, and sizes are usually ignored).</p>
  <p>The book’s example: count each customer’s sales, sorted by name. An outer join from SALE leaves cash sales as a row of nulls, which application code then has to check for. Instead, union two queries, one for real customers and one that fills the cash-sale row with constants:</p>
<pre><code class="sql">SELECT CUSTOMER.CustomerNo, CUSTOMER.First AS FirstName,
       CUSTOMER.Last AS LastName, COUNT(*) AS NumSales
FROM SALE JOIN CUSTOMER ON SALE.CustomerNo = CUSTOMER.CustomerNo
GROUP BY CUSTOMER.CustomerNo, CUSTOMER.First, CUSTOMER.Last
UNION
SELECT ' ', ' ' AS FirstName, 'Cash sale' AS LastName, COUNT(*) AS NumSales
FROM SALE WHERE SALE.CustomerNo IS NULL
ORDER BY LastName, FirstName;        -- one ORDER BY, after the last query</code></pre>
  <p>The columns are renamed consistently in both halves so that the final <code>ORDER BY</code> can refer to them. Result: Adams 1, Cash sale 1, Gonzales 1, Johnston 1, Jones 1, Waverley 2.</p>
  <div class="aside"><b>Then vs now.</b> Today you would often write <code>COALESCE(CUSTOMER.Last, 'Cash sale')</code> on the outer-join version to replace the null with a label in one query. Also, <code>UNION</code> removes duplicate rows; use <code>UNION ALL</code> when you know there are none, to skip that work.</div>

  <!-- 3.9 -->
  <section class="chap" id="p3-9">
    <h2><span class="num">3.9</span>Building SELECT queries step by step</h2>
    <p>Build a query in the same order you read one, and test every step:</p>
    <ol>
      <li><strong>FROM.</strong> Which tables? If more than one: which joins, inner or outer, and do you need aliases (for a self-join, yes)?</li>
      <li><strong>WHERE.</strong> Which rows? Express the criteria as a true/false condition and test it thoroughly.</li>
      <li><strong>GROUP BY / HAVING.</strong> Do you need groups or aggregates? Grouping columns also go in <code>SELECT</code>.</li>
      <li><strong>SELECT.</strong> Which columns and expressions appear in the output?</li>
      <li><strong>ORDER BY.</strong> Does it need sorting?</li>
    </ol>
    <p>The steps feed back into each other, so expect to loop. Know the answer you expect before you run the query, use good test data, and test complex conditions one part at a time before combining them. The book credits this incremental approach to an <em>Oracle Magazine</em> article (July/August 2000).</p>
    <h3>The detailed example</h3>
    <p>Management’s question: <em>total value of sales to non-credit customers, day by day, during August 2002.</em></p>
    <dl class="notation">
      <dt>1. FROM</dt><dd><code>FROM SALE JOIN CUSTOMER ON …</code>. Test it: there are seven sales, but only six rows come back. The cash sale has a null <code>CustomerNo</code> and fails the join. Switch to <code>SALE LEFT JOIN CUSTOMER</code>: seven rows.</dd>
      <dt>2a. WHERE, date</dt><dd><code>SaleDate BETWEEN '2002-08-01' AND '2002-08-31'</code>. All seven pass, since every sale is in August, so add some other dates if you want a real test.</dd>
      <dt>2b. WHERE, credit</dt><dd>“No credit” means a credit limit of 0. A cash sale has no customer, and a non-existent customer has no credit. That is a business rule worth writing down. The outer join leaves that sale’s <code>CreditLimit</code> null in the <em>result</em>, so the test is <code>(CreditLimit = 0) OR (CreditLimit IS NULL)</code>: five rows.</dd>
      <dt>2c. Combine</dt><dd>Both parts with <code>AND</code>, keeping the parentheses around the <code>OR</code>.</dd>
      <dt>3. GROUP BY</dt><dd>“Day by day” means <code>GROUP BY SaleDate</code>, and “total” means <code>SUM(SALE.Amount)</code>.</dd>
    </dl>
<pre><code class="sql">SELECT SALE.SaleDate, SUM(SALE.Amount) AS DailyTotal
FROM SALE LEFT JOIN CUSTOMER ON SALE.CustomerNo = CUSTOMER.CustomerNo
WHERE ((CUSTOMER.CreditLimit = 0) OR (CUSTOMER.CreditLimit IS NULL))
  AND (SALE.SaleDate BETWEEN '2002-08-01' AND '2002-08-31')
GROUP BY SALE.SaleDate;</code></pre>
    <div class="tablewrap"><table>
      <thead><tr><th>SaleDate</th><th>DailyTotal</th><th>From sales</th></tr></thead>
      <tbody>
        <tr><td>2002-08-12</td><td>167.65</td><td>12346</td></tr>
        <tr><td>2002-08-13</td><td>5120.25</td><td>12347, 12348 (cash)</td></tr>
        <tr><td>2002-08-14</td><td>2327.34</td><td>12349, 12350</td></tr>
      </tbody>
    </table></div>
    <p class="hint">Totals as in the book; the “From sales” column is added. The book’s data here treats Richard Johnston as still having a credit limit of 1000, even though an earlier <code>UPDATE</code> example set it to 0. With that update applied, sale 12345 (23.95) would join the 12 August total.</p>
    <p>The last step is to generalize it. Wrap the query in a <strong>stored procedure</strong> that takes the date range as parameters. The web app then makes one short call instead of sending a long SQL string (Chapter 8).</p>
    <div class="aside"><b>Front-end tie-in.</b> The modern equivalent of “generalize with parameters” in a Node API is <code>WHERE SaleDate BETWEEN $1 AND $2</code> with the dates passed as values, never pasted into the string. Write a test with known data and a known expected total, as the book recommends.</div>
  </section>

  <!-- Review -->
  <section class="chap" id="review">
    <h2><span class="num">✓</span>Cheat sheet and quiz</h2>
    <h3>Statements at a glance</h3>
    <div class="tablewrap"><table>
      <thead><tr><th>Task</th><th>Statement</th><th>Watch out for</th></tr></thead>
      <tbody>
        <tr><td>Create / remove a table</td><td><code>CREATE TABLE</code> / <code>DROP TABLE</code></td><td>Drop deletes all data without asking</td></tr>
        <tr><td>Change a table</td><td><code>ALTER TABLE … ADD | ALTER | DROP</code></td><td>NOT NULL columns need a default</td></tr>
        <tr><td>Add rows</td><td><code>INSERT INTO t (cols) VALUES (…)</code> or <code>… SELECT</code></td><td>Always list the columns</td></tr>
        <tr><td>Change rows</td><td><code>UPDATE t SET c = v WHERE …</code></td><td>No WHERE = every row</td></tr>
        <tr><td>Remove rows</td><td><code>DELETE FROM t WHERE …</code></td><td>Blocked by foreign keys still referencing them</td></tr>
        <tr><td>Read rows</td><td><code>SELECT … FROM … WHERE … GROUP BY … HAVING … ORDER BY</code></td><td>Name columns; avoid <code>SELECT *</code></td></tr>
        <tr><td>Combine tables</td><td><code>JOIN … ON</code>, <code>LEFT | RIGHT | FULL OUTER JOIN</code></td><td>Missing condition = Cartesian product</td></tr>
        <tr><td>Combine queries</td><td><code>UNION</code>, <code>INTERSECT</code>, <code>EXCEPT</code></td><td>Queries must be compatible</td></tr>
      </tbody>
    </table></div>
    <h3>Key terms</h3>
    <dl class="notation">
      <dt>Declarative</dt><dd>You say what result you want; the RDBMS decides how.</dd>
      <dt>Column vs table constraint</dt><dd>One column only, versus any columns of the table (needed for multi-column rules and keys).</dd>
      <dt>Inner vs outer join</dt><dd>Only matching rows, versus also unmatched rows from the left, right or both tables, padded with nulls.</dd>
      <dt>WHERE vs HAVING</dt><dd>Filters rows before grouping, versus filters groups after.</dd>
      <dt>Table alias</dt><dd>A table variable over a table’s rows, which makes self-joins possible.</dd>
      <dt>Materialized view</dt><dd>A stored, periodically refreshed copy of a query’s result, used to avoid repeated joins on static data.</dd>
    </dl>
    <h3>Test yourself</h3>
  </section>
