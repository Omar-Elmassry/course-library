<template id="tpl-pddw-03">
  <h1>Creating and using relational databases with SQL</h1>
  <p class="lede">A short course on Chapter 3 of <em>Practical Database Design for the Web</em>. It covers these topics:</p>
  <ul>
    <li>where SQL came from;</li>
    <li>how to create and change tables;</li>
    <li>how to insert, update and delete rows safely;</li>
    <li>how much one <code>SELECT</code> statement can do: joins, sorting, grouping, aliases and set operations;</li>
    <li>a method for building queries one tested step at a time.</li>
  </ul>
  <p class="byline">Hover over or tap any part of a diagram to see an explanation. Every figure has a Full screen button. The interactive parts are:</p>
  <ul>
    <li>a step-by-step view of <code>ALTER TABLE</code>;</li>
    <li>a tester for WHERE clauses;</li>
    <li>a toggle that compares a cross product with a join;</li>
    <li>a tool to explore join types;</li>
    <li>a step-by-step view of how a <code>SELECT</code> is evaluated.</li>
  </ul>
  <p class="byline">Figures marked <span class="src book">From the book</span> are redrawn from the chapter. <span class="src ill">Course illustration</span> marks diagrams drawn for this course. Notes marked <em>Then vs now</em> are course additions, because the book targets SQL-92 and was written around 2002–2003. The book does not number its sections. The numbers here belong to the course.</p>

  <!-- 3.1 -->
  <section class="chap" id="p3-1">
    <h2><span class="num">3.1</span>SQL: the language and its dialects</h2>
    <p><strong>SQL</strong> (Structured Query Language) is the standard language for creating and using relational databases. The word “query” makes it sound smaller than it is. SQL also creates and drops (deletes) tables, changes data and manages permissions. It is not a general-purpose language like Java or PHP. You write your application in one of those languages, and the application sends SQL to the database.</p>
    <p>The most important property of SQL is that it is <strong>declarative</strong>. This means you describe the result you want, and the RDBMS (relational database management system) works out how to get it. Compare this with a loop in application code, where you write out every step. SQL has well-known theoretical flaws. But it became good enough, and so widely used, that it was very hard to replace. Even the object and XML query languages of that time (OQL, SiXDML) were made to look like SQL on purpose.</p>
    <h3>A short history</h3>
    <p>An IBM research group created the language in 1974 for its System R prototype. They called it <strong>SEQUEL</strong>. It was renamed SQL for legal reasons. That is why many people still say “sequel”. SQL shipped in IBM’s SQL/DS in 1981. Oracle and Ingres adopted it too. (Ingres first used its own language, QUEL.) Soon there were many dialects (versions) that did not work with each other. So ANSI began work on a standard in 1982. The first ANSI standard came in 1986. It was mostly IBM’s dialect. ISO accepted it in 1987.</p>
    <div class="tablewrap"><table>
      <thead><tr><th>Standard</th><th>Keywords</th><th>Notes</th></tr></thead>
      <tbody>
        <tr><td>SQL-86</td><td>81</td><td>The first ANSI standard</td></tr>
        <tr><td>SQL-89</td><td>100</td><td></td></tr>
        <tr><td>SQL-92 (“SQL2”)</td><td>276</td><td>About 500 pages. It has three levels: Entry, Intermediate and Full. Most products claim only the Entry level. The book uses SQL-92.</td></tr>
        <tr><td>SQL:1999 (“SQL3”)</td><td>473</td><td>Over 2,100 pages in 13 parts. Part 2, SQL/Foundation, is the minimum a product needs for compliance.</td></tr>
        <tr><td>Oracle8i’s dialect</td><td>478</td><td>Shown for comparison</td></tr>
      </tbody>
    </table></div>
    <p class="hint">The keyword counts come from the book’s table. The book’s examples were tested in PostgreSQL.</p>
    <p>SQL:1999 added these features:</p>
    <ul>
      <li>a procedural language for stored procedures, functions and triggers (close to Oracle’s PL/SQL);</li>
      <li>structured types and user-defined types;</li>
      <li>object storage;</li>
      <li>and, finally, a Boolean type.</li>
    </ul>
    <p>Every product speaks its own <strong>dialect</strong>. A dialect is some version of the standard plus the vendor’s own extensions. So always check your product’s documentation.</p>
    <h3>Three groups of commands</h3>
    <div class="tablewrap"><table>
      <thead><tr><th>Group</th><th>Purpose</th><th>Main statements</th></tr></thead>
      <tbody>
        <tr><td>DDL: Data Definition Language</td><td>Create and change the structure of the database (the <em>structure</em> part of the relational model)</td><td><code>CREATE TABLE</code>, <code>ALTER TABLE</code>, <code>DROP TABLE</code>, <code>CREATE INDEX</code>, <code>DROP INDEX</code></td></tr>
        <tr><td>DML: Data Manipulation Language</td><td>Read and change data (the <em>operations</em> part)</td><td><code>SELECT</code>, <code>INSERT</code>, <code>UPDATE</code>, <code>DELETE</code></td></tr>
        <tr><td>DCL: Data Control Language</td><td>Control access, ownership and transactions (Chapters 7–8)</td><td><code>GRANT</code>, <code>REVOKE</code>, <code>COMMIT</code>, <code>ROLLBACK</code></td></tr>
      </tbody>
    </table></div>
    <p>The introduction makes one point that is special to the Web. Real web apps rarely send raw SQL strings. The book recommends that you wrap SQL in <strong>stored procedures</strong>. A stored procedure is a named piece of SQL code that is kept inside the database. This saves bandwidth. It also stops anyone from changing the SQL while it travels over the network (Chapter 8).</p>
    <div class="aside"><b>Then vs now.</b> The standard has kept growing, from SQL:2003 to SQL:2023. New versions added window functions, JSON support and more. <code>BOOLEAN</code> is now a normal type in PostgreSQL and MySQL. On security: today the main defence against changed SQL is <strong>parameterized queries</strong>. You send the SQL with placeholders, and you send the values separately. Every Node driver and ORM does this. Because of this, user input can never become SQL. TLS (encryption for network connections) protects the connection itself.</div>
  </section>

  <!-- 3.2 -->
  <section class="chap" id="p3-2">
    <h2><span class="num">3.2</span>Creating tables</h2>
    <p>The standard does not say how to create a <em>database</em>. It calls this “implementation-defined”, which means each product decides. Access uses a menu. Oracle has <code>CREATE DATABASE</code>. PostgreSQL has the <code>createdb</code> command. But creating <em>tables</em> inside the database is standard. You use <code>CREATE TABLE</code>:</p>
<pre><code class="sql">CREATE TABLE &lt;name&gt;
( &lt;column-name&gt; &lt;data-type&gt; [DEFAULT &lt;value&gt;] [&lt;column-constraints&gt;],
  ...
  [&lt;table-constraints&gt;]
);</code></pre>
    <p>Square brackets mark optional parts. Keywords are not case-sensitive. Capital letters are only a habit that makes code easier to read. A semicolon ends each statement. The chapter creates the four tables from Chapter 2 again. It starts with <strong>CUSTOMER</strong>:</p>
  </section>
  <figure class="wide">
    <div class="plate" data-dg="cust"></div>
    <figcaption><span class="src book">From the book</span><b>CUSTOMER table, p. 58, redrawn.</b> This is the book’s sample data. Each column has a note with its type and constraint from the book’s <code>CREATE TABLE</code> statement. The notes are added for this course.</figcaption>
  </figure>
<pre><code class="sql">CREATE TABLE CUSTOMER
( CustomerNo   CHAR(9),
  First        CHAR(20)      NOT NULL,
  Last         CHAR(20)      NOT NULL,
  Address      VARCHAR(100)  NOT NULL,
  CreditLimit  SMALLINT      CHECK (CreditLimit &gt;= 0),
  PRIMARY KEY (CustomerNo)
);</code></pre>
    <h3>Data types in SQL-92</h3>
    <p>SQL-92 has these main data types:</p>
    <ul>
      <li>Integers come in two sizes: <code>SMALLINT</code> (usually up to 32,767) and <code>INTEGER</code> (up to about 2.1 billion).</li>
      <li><code>NUMERIC</code> holds exact decimal numbers.</li>
      <li><code>FLOAT</code> holds floating-point numbers (approximate numbers).</li>
      <li><code>DATE</code> holds dates.</li>
      <li>Character data is either fixed-length <code>CHAR</code> or variable-length <code>VARCHAR</code>.</li>
    </ul>
    <p>A size in parentheses means different things for different types:</p>
    <div class="tablewrap"><table>
      <thead><tr><th>Type</th><th>What the size means</th></tr></thead>
      <tbody>
        <tr><td><code>CHAR(9)</code></td><td>Exactly nine characters. Shorter values are filled with blanks.</td></tr>
        <tr><td><code>VARCHAR(50)</code></td><td>Up to 50 characters</td></tr>
        <tr><td><code>NUMERIC(6,2)</code></td><td>Six digits in total, and two of them come after the decimal point: −9999.99 to 9999.99</td></tr>
      </tbody>
    </table></div>
    <p class="hint">Based on the book’s table on p. 59. The book warns that some products read <code>NUMERIC(6,2)</code> as six digits <em>before</em> the point. This goes against the standard.</p>
    <p>Vendors offer more types than these (Oracle prefers its own <code>NUMBER</code>). The book gives a general guideline for <code>CHAR</code> versus <code>VARCHAR</code>. Fixed-length is faster, but it can waste space. So:</p>
    <ul>
      <li>use <code>CHAR</code> for values whose length is almost always the same (phone numbers), or for columns you search very often;</li>
      <li>use <code>VARCHAR</code> for longer text that is used less often.</li>
    </ul>
    <p>Always store money as <code>NUMERIC</code> or <code>INTEGER</code>, never as <code>FLOAT</code>. Floating point can give totals that are slightly wrong.</p>
    <div class="aside"><b>Then vs now.</b> In PostgreSQL, the speed argument for <code>CHAR</code> is no longer true. Its documentation says <code>char(n)</code> has no speed advantage. It is usually the slowest of the three types, because of the padding (the extra blanks). So use <code>varchar</code> or <code>text</code>. The money rule is still true. In JavaScript, keep money as whole cents (an integer) or use a decimal library. Never use a float.</div>
    <h3>Column and table constraints</h3>
    <p>A <strong>constraint</strong> is an integrity rule that the RDBMS enforces. There are two kinds:</p>
    <ul>
      <li>A <strong>column constraint</strong> belongs to one column. It can refer only to that column.</li>
      <li>A <strong>table constraint</strong> can refer to any column. So a rule that compares two columns must be a table constraint.</li>
    </ul>
    <dl class="notation">
      <dt><code>PRIMARY KEY (cols)</code></dt><dd>Entity integrity: the value must be unique and never null. For a composite key (a key made of several columns), list all the columns, e.g. <code>PRIMARY KEY (A, B, C)</code>. Adding <code>NOT NULL</code> as well is not needed. The book notes that it may even slow things down.</dd>
      <dt><code>FOREIGN KEY (cols) REFERENCES T</code></dt><dd>Referential integrity: the values must match a primary key in table T, or be null.</dd>
      <dt><code>NOT NULL</code></dt><dd>A value is required. Columns allow nulls unless you say otherwise.</dd>
      <dt><code>CHECK (condition)</code></dt><dd>Values must make the condition true. The check only applies when there is a value, so a null still passes.</dd>
      <dt><code>UNIQUE</code></dt><dd>No duplicates are allowed. It is mainly used for alternate keys (other columns that could also identify a row).</dd>
      <dt><code>CONSTRAINT name …</code></dt><dd>Gives a constraint a name, e.g. <code>CONSTRAINT CreditCheck CHECK (CreditLimit &gt;= 0)</code>. Then you can drop it later. If you do not name it, the system makes up a name that is hard to understand.</dd>
    </dl>
    <p>Nulls make true/false logic more complex. So the book advises you to avoid nulls in columns that you will test in conditions. It admits that <code>CreditLimit</code> is one of those columns, and it fixes this in section 3.3.</p>
    <h3>The rest of the running example</h3>
    <p>The other three tables are:</p>
    <ul>
      <li>PRODUCT, with <code>Price NUMERIC(5,2)</code> and <code>CHECK ((Price &gt;= 0) AND (Price &lt;= 999.99))</code>;</li>
      <li>SALE, with a <code>DATE</code> column and two foreign keys;</li>
      <li>EMPLOYEE. In Chapter 2, its only candidate key was all its columns together. So the chapter adds a <strong>surrogate key</strong>, <code>EmployeeID</code>. (A surrogate key is an artificial ID column with no business meaning.) It also checks salaries with <code>CHECK (Salary BETWEEN 10000 AND 50000)</code>.</li>
    </ul>
  <figure class="wide">
    <div class="plate" data-dg="schema"></div>
    <figcaption><span class="src ill">Course illustration</span><b>Figure A.</b> The chapter’s four tables, drawn as an ER diagram from the book’s <code>CREATE TABLE</code> statements. (The book shows only the tables and the SQL.) <code>ManagerID</code> (in the accent color) is added later with <code>ALTER TABLE</code>.</figcaption>
  </figure>
<pre><code class="sql">CREATE TABLE SALE
( SaleNo      SMALLINT,
  SaleDate    DATE          NOT NULL,
  CustomerNo  CHAR(9),                          -- null = cash sale
  ProductNo   CHAR(8)       NOT NULL,
  Qty         INTEGER       NOT NULL CHECK (Qty &gt; 0),
  Amount      NUMERIC(6,2)  NOT NULL CHECK (Amount &gt;= 0),
  Salesrep    VARCHAR(50),
  PRIMARY KEY (SaleNo),
  FOREIGN KEY (CustomerNo) REFERENCES CUSTOMER,
  FOREIGN KEY (ProductNo)  REFERENCES PRODUCT
);</code></pre>
  <p>The book admits that it takes two shortcuts here:</p>
  <ul>
    <li>A sale can hold only one product. The correct structure for many products per sale uses a header table and a lines table. It comes in Chapter 4.</li>
    <li><code>Salesrep</code> should really be a foreign key to another table.</li>
  </ul>
  <div class="aside pitfalls"><b>Common mistakes.</b>
    <ul>
      <li>Using <code>FLOAT</code> for prices.</li>
      <li>Thinking that <code>CHECK (CreditLimit &gt;= 0)</code> forbids nulls. It does not. Add <code>NOT NULL</code>.</li>
      <li>Writing a rule about two columns as a column constraint.</li>
      <li>Leaving constraints without names. Then you must find the generated name before you can drop one.</li>
    </ul></div>

  <!-- 3.3 -->
  <section class="chap" id="p3-3">
    <h2><span class="num">3.3</span>Changing structure: DROP, ALTER and indexes</h2>
    <p><code>DROP TABLE CUSTOMER;</code> deletes the table <em>and all its data</em>. Usually it does not ask you first. Normally only the person who created the table may drop it. (Security is in Chapter 8. Backups, which you will want if something goes wrong, are in Chapter 9.)</p>
    <p>Structures change over time. You could drop a table and create it again just to add one column. But that wastes effort, and the database is unavailable while you do it. Instead, use <code>ALTER TABLE</code>. It comes in three forms:</p>
    <dl class="notation">
      <dt>ADD</dt><dd><code>ADD [COLUMN] &lt;column-definition&gt;</code> or <code>ADD &lt;table-constraint&gt;</code>. New columns start as nulls, or as the default value if you give one. So you can add a <code>NOT NULL</code> column only if it has a default. Standard SQL-92 cannot add a column constraint to a column that already exists.</dd>
      <dt>ALTER</dt><dd><code>ALTER [COLUMN] c SET DEFAULT v</code> or <code>DROP DEFAULT</code>. In the standard, you can change only defaults here. Many products also let you change constraints or types here.</dd>
      <dt>DROP</dt><dd><code>DROP [COLUMN] c</code> (its data is lost) or <code>DROP CONSTRAINT name</code> (you need the name). You cannot drop a column if a constraint, such as a foreign key, still refers to it.</dd>
    </dl>
    <p>The chapter’s example: employees now manage other employees. So EMPLOYEE gets a <code>ManagerID</code> column that points back into EMPLOYEE itself. This is a <strong>recursive</strong> (unary) relationship: a table that is related to itself. Chapter 4 covers it. The book assumes that everyone has a manager. The person at the top manages themselves. So the default is 0 until the real IDs are filled in with <code>UPDATE</code>.</p>
<pre><code class="sql">ALTER TABLE EMPLOYEE ADD COLUMN ManagerID INTEGER DEFAULT 0 NOT NULL;
ALTER TABLE EMPLOYEE ADD FOREIGN KEY (ManagerID) REFERENCES EMPLOYEE;
ALTER TABLE EMPLOYEE ALTER COLUMN ManagerID SET DEFAULT 0;</code></pre>
    <p class="hint">The book prints the first and third statements with the type at the end (<code>… DEFAULT 0 NOT NULL INTEGER</code>). It also prints the third without <code>SET</code>. The versions above follow the standard order: name, type, default, constraints. In practice, the real manager IDs must also be in place before you add the foreign key, because no employee has ID 0.</p>
    <p>Next comes the fix for <code>CreditLimit</code>. The business decides that “no credit” means 0, not null. SQL-92 cannot add <code>NOT NULL</code> to an existing column. So the book needs six steps and a temporary column to do it. Step through them:</p>
  </section>
  <figure class="wide">
    <div class="plate" data-dg="alter"></div>
    <div class="chips" id="altBtns" aria-label="Choose a step"></div>
    <div class="note" id="altNote" aria-live="polite"></div>
    <figcaption><span class="src ill">Course illustration</span><b>Figure B.</b> The book’s method for making <code>CreditLimit</code> NOT NULL in SQL-92, applied to the five sample customers. New or changed columns are in the accent color.</figcaption>
  </figure>
  <div class="aside"><b>Then vs now.</b> Modern products do this in two statements. In PostgreSQL, first run <code>UPDATE CUSTOMER SET CreditLimit = 0 WHERE CreditLimit IS NULL;</code>. Then run <code>ALTER TABLE CUSTOMER ALTER COLUMN CreditLimit SET NOT NULL;</code>. Add <code>SET DEFAULT 0</code> for new rows. This is the shortcut the book wishes it had. In a team, these changes are kept in <strong>migration files</strong> (Prisma, Drizzle, Knex). Migration files are stored in version control and run in order.</div>
  <h3>Indexes</h3>
  <p>You create an index with <code>CREATE [UNIQUE] INDEX name ON table (columns);</code> and remove it with <code>DROP INDEX name;</code>. These statements are technically outside the standard, but every product has them. Some examples:</p>
  <ul>
    <li>An index on <code>CUSTOMER (Last, First)</code> makes name searches faster. It cannot be unique, because names repeat.</li>
    <li><code>CREATE UNIQUE INDEX … ON EMPLOYEE (EmployeeID)</code> works, but it is usually not needed. Many products index primary keys automatically.</li>
  </ul>
  <p>Indexes come back in Chapter 8.</p>
  <div class="aside pitfalls"><b>Common mistakes.</b>
    <ul>
      <li>Running <code>DROP TABLE</code> or <code>DROP COLUMN</code> on the live (production) database without a backup.</li>
      <li>Adding a <code>NOT NULL</code> column with no default to a table that already has rows.</li>
      <li>Trying to drop a column that a foreign key still refers to.</li>
    </ul></div>

  <!-- 3.4 -->
  <section class="chap" id="p3-4">
    <h2><span class="num">3.4</span>Changing data: INSERT, UPDATE, DELETE and WHERE</h2>
    <p>The four everyday operations are Create, Read, Update and Delete. Together they are called <strong>CRUD</strong>. Reading gets its own sections. The other three are simple.</p>
    <h3>INSERT</h3>
<pre><code class="sql">INSERT INTO EMPLOYEE (EmployeeID, Name, Position, Location, Salary)
VALUES (617258, 'Jane Smith', 'Manager', 'London', 35000);

-- Key generated by the RDBMS: leave the column out
INSERT INTO EMPLOYEE (Name, Position, Location, Salary)
VALUES ('Heather Ralston', 'Manager', 'Melbourne', 33000);

-- An explicit null, and an ISO date in single quotes
INSERT INTO SALE (SaleNo, SaleDate, CustomerNo, ProductNo, Qty, Amount, Salesrep)
VALUES (12348, '2002-08-13', NULL, 'DHU69863', 50, 118.50, 'Sara Thompson');</code></pre>
    <p>The column list is technically optional. But without it, the values go in the order of the table’s columns. This breaks without any warning when someone reorders or adds columns. So always list the columns. You can leave a column out in two cases:</p>
    <ul>
      <li>when the RDBMS generates its value;</li>
      <li>when you want its null or default value. (After the fix in 3.3, a <code>CreditLimit</code> you leave out becomes 0.)</li>
    </ul>
    <p>Some rules for writing values:</p>
    <ul>
      <li>Strings and dates use <strong>single</strong> quotes. Double quotes can mean something completely different.</li>
      <li>Inside a string, two single quotes stand for one apostrophe: <code>'Fred''s fish'</code>.</li>
      <li>Date formats are different in each product, so the book uses ISO dates (year-month-day).</li>
    </ul>
    <h3>UPDATE</h3>
<pre><code class="sql">UPDATE EMPLOYEE SET Salary = 37000 WHERE EmployeeID = 617258;   -- by key: one row
UPDATE CUSTOMER SET CreditLimit = 0, Address = 'Iowa State Penitentiary'
WHERE CustomerNo = '4649-4673';
UPDATE PRODUCT SET Price = Price * 1.1;                        -- every row, from its own value</code></pre>
    <p>Without a <code>WHERE</code>, <code>UPDATE</code> changes every row. For example, <code>UPDATE EMPLOYEE SET Salary = 37000;</code> gives everyone the same salary. When you mean one row, filter on the primary key. <code>WHERE Name = 'Jane Smith'</code> could match several people. <code>SET c = NULL</code> is the only place where null goes with <code>=</code>. In comparisons, you write <code>IS NULL</code>.</p>
    <h3>DELETE</h3>
<pre><code class="sql">DELETE FROM PRODUCT  WHERE ProductNo = 'AAD62726';
DELETE FROM EMPLOYEE WHERE Location = 'New York' AND Salary &gt;= 40000;
DELETE FROM SALE     WHERE CustomerNo IS NULL;
DELETE FROM PRODUCT;   -- fails here: sales still reference products</code></pre>
    <p>The last statement tries to delete every product. It should fail. Rows in SALE refer to products through a foreign key. Removing the products would break referential integrity. So the RDBMS refuses, as long as you declared the keys. Many products also offer <code>TRUNCATE</code>, which is not standard. It empties a table much faster than <code>DELETE</code>, because it does not log (record) each row. This makes it useful for resetting test data from a script.</p>
    <h3>The WHERE clause</h3>
    <p><code>WHERE</code> <strong>filters</strong> rows. The RDBMS checks its true/false condition for each row. Only rows where the condition is true go on to the operation. Some rules:</p>
    <ul>
      <li>Combine smaller conditions with <code>AND</code>, <code>OR</code> and <code>NOT</code>.</li>
      <li>Use parentheses to show the grouping clearly.</li>
      <li><code>&lt;&gt;</code> is the standard “not equal”. Some products also accept <code>!=</code>.</li>
    </ul>
    <p>Beginners often forget the <code>WHERE</code> on an <code>UPDATE</code> or <code>DELETE</code>. A wrong <code>WHERE</code> is just as bad. Test the condition as a <code>SELECT</code> first. Do it on a backup with realistic data, never on the live system.</p>
  <figure class="wide">
    <div class="plate" data-dg="where"></div>
    <div class="chips" id="whBtns" aria-label="Choose a condition"></div>
    <div class="note" id="whNote" aria-live="polite"></div>
    <figcaption><span class="src book">From the book</span><b>SALE table, p. 62, redrawn</b>, with the smaller conditions from the book’s <code>DELETE</code> example (p. 72). The two null tests are a course addition. Pick a condition to see the result for each row.</figcaption>
  </figure>
  <p class="hint">Two corrections to the book’s worked examples. First, in its <code>DELETE</code>, the code prints <code>ProductNo &lt;&gt; 'DHU69863'</code>. But the explanation and the row counts only work with <code>=</code>. The tester uses <code>=</code>.</p>
  <p class="hint">Second, the <code>UPDATE</code> before it is <code>UPDATE PRODUCT SET Price = Price * 2 WHERE ((QtyInStock &gt; 5000) OR (Price &lt;= 10)) AND (ReorderLevel &lt; 1000)</code>. The book says four rows change. But because of the <code>AND</code>, only rows that match both parts change. That is two rows (AAD62726 and DHU69863).</p>
  <div class="aside pitfalls"><b>Common mistakes.</b>
    <ul>
      <li>Writing <code>WHERE CustomerNo = NULL</code>. It matches nothing, because any comparison with null is <em>unknown</em>, not true. Use <code>IS NULL</code>.</li>
      <li>Mixing <code>AND</code> and <code>OR</code> without parentheses.</li>
      <li>Putting a value in double quotes.</li>
      <li>Leaving out the column list in <code>INSERT</code>.</li>
    </ul></div>

  <!-- 3.5 -->
  <section class="chap" id="p3-5">
    <h2><span class="num">3.5</span>Querying with SELECT</h2>
    <p>Reading data is called <strong>querying</strong>. When Codd defined the relational model, he gave it two query languages:</p>
    <ul>
      <li><strong>Relational algebra</strong> is a set of operators on tables. It gives step-by-step instructions.</li>
      <li><strong>Relational calculus</strong> is based on logic. It describes what the result looks like and leaves the “how” to someone else.</li>
    </ul>
    <p>SQL’s <code>SELECT</code> is mostly algebra, with some calculus. Some queries are hard to write because of early design decisions. But everyday queries are easy.</p>
<pre><code class="sql">SELECT &lt;columns&gt;
FROM &lt;tables&gt;
[WHERE &lt;conditions&gt;];

SELECT Name, Salary FROM EMPLOYEE WHERE Location = 'Paris';   -- Alex de Tocqueville, 21000</code></pre>
    <p>Read a <code>SELECT</code> in this order:</p>
    <ol>
      <li><code>FROM</code>: which tables;</li>
      <li><code>WHERE</code>: which rows;</li>
      <li>the <code>SELECT</code> list: which columns.</li>
    </ol>
    <p><code>WHERE</code> is processed before the output is shaped. So it can test columns that you do not return. This suits the Web, where you send only what the page needs.</p>
    <p><code>SELECT *</code> returns every column. The book calls it bad practice, for two reasons. First, it wastes server time and bandwidth on large tables. Second, it can be a security hole. Someone may later add a column for internal use. That column then suddenly appears in every <code>SELECT *</code>. So name your columns.</p>
    <p>The chapter then answers its list of questions written in plain English:</p>
<pre><code class="sql">-- How many grunge nuts do we have in stock?
SELECT ProductNo, Description, QtyInStock FROM PRODUCT WHERE ProductNo = 'FGE91822';

-- Any customers with a credit limit over $6,000?  (none)
SELECT CustomerNo, First, Last FROM CUSTOMER WHERE CreditLimit &gt; 6000;

-- Sales on 12 or 13 August 2002: three equivalent filters
WHERE SaleDate = '2002-08-12' OR SaleDate = '2002-08-13'
WHERE SaleDate BETWEEN '2002-08-12' AND '2002-08-13'      -- inclusive range
WHERE SaleDate IN ('2002-08-12', '2002-08-13')            -- value in a list</code></pre>
    <p>You can write a query in several ways. This is one of SQL’s strengths. But the book points out the downside. It makes the optimizer’s job harder. (The optimizer is the part of the RDBMS that finds the fastest way to run a query.)</p>
    <p>The question about total revenue must wait for aggregation (3.7). Next comes “all sales to Amelia Waverley”. Her name is in CUSTOMER and her sales are in SALE. So the obvious idea is to list both tables in <code>FROM</code>. But without a join condition, this gives seven rows, and five of them are not hers. This problem leads directly to joins.</p>
    <div class="aside"><b>Front-end tie-in.</b> The same argument applies to an API that returns whole rows “just in case”. If you select only the columns a component shows, the payloads (the data sent) stay small. ORMs select all columns by default. So use their <code>select</code> option on hot paths (code that runs very often).</div>
  </section>

  <!-- 3.6 -->
  <section class="chap" id="p3-6">
    <h2><span class="num">3.6</span>Joins</h2>
    <p>Suppose you list several tables in <code>FROM</code> and give no other instructions. The result is the <strong>Cartesian product</strong>: every row of one table combined with every row of the other. This sounds strange. But it is the raw material. Join conditions and filters then reduce it.</p>
  </section>
  <figure class="wide">
    <div class="plate" data-dg="product"></div>
    <div class="chips" id="prBtns" aria-label="Choose a version"></div>
    <div class="note" id="prNote" aria-live="polite"></div>
    <figcaption><span class="src ill">Course illustration</span><b>Figure C.</b> The book’s Amelia Waverley query, with and without a join condition. The rows are from the book. The layout and highlighting are added.</figcaption>
  </figure>
  <p>A <strong>join</strong> combines related rows from two tables. Usually it uses a link between a foreign key and a primary key. The chapter covers three kinds of join.</p>
  <h3>Natural joins</h3>
  <p><code>FROM CUSTOMER NATURAL JOIN SALE</code> matches rows on every column that the two tables share by name and type. Here that column is <code>CustomerNo</code>. A natural join breaks easily:</p>
  <ul>
    <li>Two tables can share a column name like <code>ItemNo</code>, but it may not mean the same thing in both.</li>
    <li>The join changes without any warning when someone adds columns.</li>
    <li>Many products do not support it.</li>
  </ul>
  <p>The book puts it in the same “potentially dangerous” group as <code>SELECT *</code>. It suggests that you give columns descriptive names. Then columns with the same name really mean the same attribute.</p>
  <h3>Condition-based joins</h3>
  <p>Here you say exactly how rows match. There are two ways to write this:</p>
<pre><code class="sql">-- Pre-SQL-92: join condition in WHERE, alongside the filters
SELECT SALE.SaleNo, SALE.SaleDate, SALE.Amount, SALE.Salesrep
FROM CUSTOMER, SALE
WHERE CUSTOMER.CustomerNo = SALE.CustomerNo
  AND CUSTOMER.First = 'Amelia' AND CUSTOMER.Last = 'Waverley';

-- SQL-92: JOIN … ON in FROM; WHERE only filters
SELECT SALE.SaleNo, SALE.SaleDate, SALE.Amount, SALE.Salesrep
FROM CUSTOMER JOIN SALE ON CUSTOMER.CustomerNo = SALE.CustomerNo
WHERE CUSTOMER.First = 'Amelia' AND CUSTOMER.Last = 'Waverley';

-- Three tables: sales on 14 August with product and customer names
SELECT SALE.SaleNo, SALE.Qty, SALE.Amount, PRODUCT.ProductNo, PRODUCT.Description,
       CUSTOMER.First, CUSTOMER.Last
FROM (CUSTOMER JOIN SALE ON SALE.CustomerNo = CUSTOMER.CustomerNo)
     JOIN PRODUCT ON SALE.ProductNo = PRODUCT.ProductNo
WHERE SALE.SaleDate = '2002-08-14';</code></pre>
  <p><code>CUSTOMER.CustomerNo</code> is a <strong>qualified</strong> column name: the table name plus the column name. You must use it when both tables have the column. The book uses it everywhere, as documentation for the next person who maintains the code.</p>
  <p>The SQL-92 form keeps join conditions separate from filters, and it is easier to read. In the book’s time, fewer products supported it. (Oracle added it only in version 9i.) In an SQL-92 join of several tables, each <code>JOIN</code> joins onto the result so far. With outer joins, that order can matter.</p>
  <p class="hint">In the book’s side-by-side table on p. 80, the column headings “SQL-92 style” and “Pre-SQL-92 style” are the wrong way round. Trust the syntax: the form with commas and <code>WHERE</code> is the older one.</p>
  <h3>Outer joins</h3>
  <p>Take this request: “Show all products, and the value of each sale they’ve been involved in, if any.” A normal <code>JOIN</code> returns only the three products that have sold. The others fail the join condition. All the joins so far are <strong>inner joins</strong>. An <strong>outer join</strong> also keeps rows that have no match. In the result, it fills the other table’s columns with nulls. Those nulls exist only in the temporary result. So they do not break the <code>NOT NULL</code> constraints on SALE.</p>
<pre><code class="sql">SELECT PRODUCT.ProductNo, PRODUCT.Description, SALE.SaleNo, SALE.Amount
FROM PRODUCT LEFT OUTER JOIN SALE ON PRODUCT.ProductNo = SALE.ProductNo;</code></pre>
  <figure class="wide">
    <div class="plate" data-dg="venn"></div>
    <div class="chips" id="jnBtns" aria-label="Choose a join type"></div>
    <div class="note" id="jnNote" aria-live="polite"></div>
    <figcaption><span class="src book">From the book</span><b>Join diagram, p. 82, redrawn</b>, with the result rows from p. 81. Like the book, this figure shades the included areas gray. The row highlighting and the right and full results are a course addition. They are worked out from the book’s data.</figcaption>
  </figure>
  <p>There are three kinds of outer join:</p>
  <ul>
    <li>A <strong>left</strong> outer join keeps unmatched rows from the table on the left of <code>JOIN</code>.</li>
    <li>A <strong>right</strong> outer join keeps unmatched rows from the table on the right.</li>
    <li>A <strong>full</strong> outer join keeps unmatched rows from both tables.</li>
  </ul>
  <p>The word <code>OUTER</code> is optional (<code>RIGHT JOIN</code> means <code>RIGHT OUTER JOIN</code>). In the book’s time, support was different in each product. Some products had no outer joins. Some had no full outer joins. Oracle8i used its own syntax: <code>WHERE PRODUCT.ProductNo = SALE.ProductNo (+)</code>. In that syntax, the <code>(+)</code> marks the side whose rows are <em>not</em> kept.</p>
  <div class="aside"><b>Then vs now.</b> Oracle has supported the standard <code>JOIN</code> syntax since version 9i, so write <code>LEFT JOIN</code>. MySQL still has no <code>FULL OUTER JOIN</code>. People imitate it with a <code>UNION</code> of a left join and a right join.</div>
  <h3>Joins on the web</h3>
  <p>Joins take time on large tables, and slow pages lose customers. Normalization is the reason we need joins. But redundant (repeated) data causes serious problems. So the book looks for a middle way.</p>
  <p>Some data rarely changes after it is written, such as completed sales or a student’s finished courses. For this data, you can <strong>pre-compute</strong> the joins. Run the join once and store the result in a separate, denormalized table (a table that keeps repeated data on purpose). Then refresh it regularly (with triggers, Chapter 8). This makes order-history pages cheap. The book calls this a <strong>materialized view</strong>. It is acceptable only when users do not need data that is up to the second.</p>
<pre><code class="sql">-- SALE_HISTORY: one wide row per sale (columns from SALE, PRODUCT, CUSTOMER), PK SaleNo
INSERT INTO SALE_HISTORY (SaleNo, SaleDate, Qty, Amount, ProductNo, Description, Price,
                          CustomerNo, First, Last, Address)
SELECT SALE.SaleNo, SALE.SaleDate, SALE.Qty, SALE.Amount,
       PRODUCT.ProductNo, PRODUCT.Description, PRODUCT.Price,
       CUSTOMER.CustomerNo, CUSTOMER.First, CUSTOMER.Last, CUSTOMER.Address
FROM SALE, PRODUCT, CUSTOMER
WHERE SALE.ProductNo = PRODUCT.ProductNo
  AND SALE.CustomerNo = CUSTOMER.CustomerNo;   -- no customer filter: everyone’s history</code></pre>
  <p><code>INSERT … SELECT</code> inserts the result of a query instead of a <code>VALUES</code> list. Some products can create the table directly from a <code>SELECT</code>. At that time, this was not standard. Some products use <code>SELECT INTO</code> for this. But in standard SQL, <code>SELECT INTO</code> means something different.</p>
  <div class="aside"><b>Then vs now.</b> PostgreSQL now has this built in: <code>CREATE MATERIALIZED VIEW sale_history AS SELECT …</code> and <code>REFRESH MATERIALIZED VIEW sale_history;</code>. <code>CREATE TABLE … AS SELECT</code> is standard, and most products support it. Note that the book’s inner join leaves out cash sales, because they have no customer. That is fine for a customer’s order history.</div>
  <div class="aside pitfalls"><b>Common mistakes.</b>
    <ul>
      <li>Forgetting a join condition. This gives a Cartesian product without any warning.</li>
      <li>Joining on columns that only have the same name.</li>
      <li>Using an inner join when the question says “all … if any”.</li>
      <li>Filtering the kept side of an outer join in a way that turns it back into an inner join. The detailed example in 3.9 shows this.</li>
    </ul></div>

  <!-- 3.7 -->
  <section class="chap" id="p3-7">
    <h2><span class="num">3.7</span>Reporting: sorting, duplicates, aggregates and groups</h2>
<pre><code class="sql">SELECT &lt;columns&gt;
FROM &lt;tables&gt;
[WHERE &lt;conditions&gt;]
[GROUP BY &lt;columns&gt; [HAVING &lt;conditions&gt;]]
[ORDER BY &lt;columns&gt;];</code></pre>
    <h3>ORDER BY and DISTINCT</h3>
    <p>The relational model gives rows no order. So without <code>ORDER BY</code>, rows come back in whatever order is easiest for the RDBMS. This is often the order in which they were inserted. Some examples:</p>
    <ul>
      <li><code>ORDER BY EMPLOYEE.Position</code> sorts in ascending order (<code>ASC</code> is the default).</li>
      <li><code>ORDER BY EMPLOYEE.Salary DESC</code> sorts in descending order.</li>
      <li><code>ORDER BY EMPLOYEE.Position DESC, EMPLOYEE.Salary</code> sorts by position, then by salary within each position.</li>
      <li><code>SELECT DISTINCT SALE.SaleDate FROM SALE</code> returns each of the three dates once, instead of seven rows. This also means less output to send.</li>
    </ul>
    <h3>Aggregate functions</h3>
    <p>An aggregate function calculates one value from many rows. SQL has five: <code>COUNT</code>, <code>SUM</code>, <code>MIN</code>, <code>MAX</code> and <code>AVG</code>. Each one takes a column or expression. It returns one value for the set of rows that passed <code>WHERE</code>.</p>
<pre><code class="sql">SELECT COUNT(*), SUM(Salary), MIN(Salary), MAX(Salary), AVG(Salary) FROM EMPLOYEE;
SELECT SUM(PRODUCT.QtyInStock * PRODUCT.Price) FROM PRODUCT;   -- inventory value
SELECT COUNT(DISTINCT Position) FROM EMPLOYEE;                  -- 3: Programmer twice</code></pre>
    <p><code>COUNT(*)</code> counts rows. It does not look at values. All the other aggregates ignore nulls. You cannot mix aggregates with normal columns in the <code>SELECT</code> list unless you group. For example, <code>SELECT COUNT(*), CustomerNo FROM CUSTOMER</code> is an error.</p>
    <p class="hint">A note on accuracy. The book suggests <code>COUNT(DISTINCT col)</code> for two jobs: counting distinct values, and not counting nulls. For the second job, plain <code>COUNT(col)</code> is enough. It counts values that are not null, including duplicates.</p>
    <h3>GROUP BY and HAVING</h3>
    <p><code>GROUP BY</code> splits the rows into groups that share a value. The aggregate runs once per group and gives one output row for each group. Some examples and rules:</p>
    <ul>
      <li><code>SELECT Position, COUNT(*) FROM EMPLOYEE GROUP BY Position</code> gives three rows.</li>
      <li>Grouping by <code>Position, Location</code> gives four rows, one for each different combination.</li>
      <li>Any normal column in the <code>SELECT</code> list must also be in <code>GROUP BY</code>.</li>
      <li>Aggregates can appear only in <code>SELECT</code> and <code>HAVING</code>.</li>
    </ul>
    <p>Suppose you want to list the reps with over $2,000 of sales. <code>WHERE SUM(Amount) &gt; 2000</code> fails, because <code>WHERE</code> sees single rows, not groups. <code>HAVING</code> is the filter for groups. It runs after the groups are built. Step through the evaluation:</p>
  </section>
  <figure class="wide">
    <div class="plate" data-dg="pipe"></div>
    <div class="controls"><button class="btn" id="pipePrev">Previous</button><button class="btn primary" id="pipeNext">Next</button><span class="hint" id="pipeCount"></span></div>
    <div class="note" id="pipeNote" aria-live="polite"></div>
    <figcaption><span class="src ill">Course illustration</span><b>Figure D.</b> How the RDBMS evaluates the book’s query <code>SELECT SALE.Salesrep FROM SALE GROUP BY SALE.Salesrep HAVING SUM(SALE.Amount) &gt; 2000</code>, one clause at a time. Click a clause or use Next.</figcaption>
  </figure>
  <p>The book describes grouping as two steps: sort by the group column, then split. Modern optimizers may use hashing instead, but the result is the same. As with joins, you can pre-compute a <code>GROUP BY</code> into its own table. This helps when the query is used often on a large table that rarely changes.</p>
  <div class="aside pitfalls"><b>Common mistakes.</b>
    <ul>
      <li>Putting an aggregate in <code>WHERE</code>.</li>
      <li>Having a column in <code>SELECT</code> that is not aggregated and not in <code>GROUP BY</code>. Older MySQL allowed this. It returned the value from any one row of the group, and you could not control which row.</li>
      <li>Depending on row order without <code>ORDER BY</code>.</li>
    </ul></div>

  <!-- 3.8 -->
  <section class="chap" id="p3-8">
    <h2><span class="num">3.8</span>Other useful features</h2>
    <h3>Comments, expressions and constants</h3>
    <p>Two hyphens start a comment (<code>-- like this</code>). The comment continues to the end of the line. Comments matter most in code that is kept in the database as stored procedures. The <code>SELECT</code> list can hold expressions and constants as well as columns. Each one becomes a new output column:</p>
<pre><code class="sql">SELECT PRODUCT.Description, PRODUCT.QtyInStock - PRODUCT.ReorderLevel FROM PRODUCT;
SELECT SALE.Salesrep, 'has sold to', CUSTOMER.First, CUSTOMER.Last
FROM SALE JOIN CUSTOMER ON SALE.CustomerNo = CUSTOMER.CustomerNo;</code></pre>
    <h3>Renaming tables and columns</h3>
    <p><code>FROM SALE AS S JOIN CUSTOMER AS C ON S.CustomerNo = C.CustomerNo</code> saves typing. (<code>AS</code> is optional.) S and C are aliases (short names). An alias is really a <strong>table variable</strong> that moves over the table’s rows. It is not a copy of the table. This matters for a <strong>self-join</strong>, where one table plays two roles. For example, to list employees with their managers, EMPLOYEE must appear as both the employee and the manager. Without aliases, the RDBMS rejects the repeated table name.</p>
<pre><code class="sql">SELECT EMP.Name, MGR.Name
FROM EMPLOYEE EMP JOIN EMPLOYEE MGR ON EMP.ManagerID = MGR.EmployeeID;</code></pre>
  </section>
  <figure class="wide">
    <div class="plate" data-dg="self"></div>
    <figcaption><span class="src ill">Course illustration</span><b>Figure E.</b> The self-join. EMP and MGR are two aliases over the same stored EMPLOYEE table. Each line follows a <code>ManagerID</code> to the matching <code>EmployeeID</code>. The rows and the result are as in the book.</figcaption>
  </figure>
  <p>You can rename columns too. This helps when output names would otherwise be blank or unclear. For example, <code>SELECT AVG(PRODUCT.Price) AS AveragePrice, AVG(PRODUCT.QtyInStock) AS AverageQty FROM PRODUCT</code> gives names to two columns. Otherwise both would just say AVG. In the same way, you can write <code>(QtyInStock - ReorderLevel) AS QtyRemaining</code>.</p>
  <h3>Set operations</h3>
  <p><code>UNION</code>, <code>INTERSECT</code> and <code>EXCEPT</code> (difference) combine the rows of two queries. They work like set union, intersection and difference in mathematics. Most products had <code>UNION</code> and <code>INTERSECT</code>. Fewer had <code>EXCEPT</code>. The two queries must be <strong>compatible</strong>. This means they have the same number of columns, with matching types. (<code>CHAR</code> and <code>VARCHAR</code> count as the same type, and sizes are usually ignored.)</p>
  <p>The book’s example counts each customer’s sales, sorted by name. An outer join from SALE would leave the cash sales as a row of nulls. Application code would then have to check for that row. Instead, you can join two queries with a union. One query is for real customers. The other fills the cash-sale row with constants:</p>
<pre><code class="sql">SELECT CUSTOMER.CustomerNo, CUSTOMER.First AS FirstName,
       CUSTOMER.Last AS LastName, COUNT(*) AS NumSales
FROM SALE JOIN CUSTOMER ON SALE.CustomerNo = CUSTOMER.CustomerNo
GROUP BY CUSTOMER.CustomerNo, CUSTOMER.First, CUSTOMER.Last
UNION
SELECT ' ', ' ' AS FirstName, 'Cash sale' AS LastName, COUNT(*) AS NumSales
FROM SALE WHERE SALE.CustomerNo IS NULL
ORDER BY LastName, FirstName;        -- one ORDER BY, after the last query</code></pre>
  <p>The columns get the same new names in both halves. This lets the final <code>ORDER BY</code> refer to them. The result is: Adams 1, Cash sale 1, Gonzales 1, Johnston 1, Jones 1, Waverley 2.</p>
  <div class="aside"><b>Then vs now.</b> Today you would often use the outer-join version with <code>COALESCE(CUSTOMER.Last, 'Cash sale')</code>. This replaces the null with a label in one query. Also, <code>UNION</code> removes duplicate rows. When you know there are no duplicates, use <code>UNION ALL</code> to skip that work.</div>

  <!-- 3.9 -->
  <section class="chap" id="p3-9">
    <h2><span class="num">3.9</span>Building SELECT queries step by step</h2>
    <p>Build a query in the same order that you read one. Test every step:</p>
    <ol>
      <li><strong>FROM.</strong> Which tables? If there is more than one: which joins, inner or outer? Do you need aliases? (For a self-join, yes.)</li>
      <li><strong>WHERE.</strong> Which rows? Write the criteria as a true/false condition and test it carefully.</li>
      <li><strong>GROUP BY / HAVING.</strong> Do you need groups or aggregates? Grouping columns also go in <code>SELECT</code>.</li>
      <li><strong>SELECT.</strong> Which columns and expressions appear in the output?</li>
      <li><strong>ORDER BY.</strong> Does the result need sorting?</li>
    </ol>
    <p>Each step can change an earlier one, so expect to go round several times. Some advice:</p>
    <ul>
      <li>Know what answer you expect before you run the query.</li>
      <li>Use good test data.</li>
      <li>Test complex conditions one part at a time before you combine them.</li>
    </ul>
    <p>The book says this step-by-step approach comes from an <em>Oracle Magazine</em> article (July/August 2000).</p>
    <h3>The detailed example</h3>
    <p>Management asks this question: <em>total value of sales to non-credit customers, day by day, during August 2002.</em></p>
    <dl class="notation">
      <dt>1. FROM</dt><dd><code>FROM SALE JOIN CUSTOMER ON …</code>. Test it. There are seven sales, but only six rows come back. The cash sale has a null <code>CustomerNo</code>, so it fails the join. Change to <code>SALE LEFT JOIN CUSTOMER</code>: now there are seven rows.</dd>
      <dt>2a. WHERE, date</dt><dd><code>SaleDate BETWEEN '2002-08-01' AND '2002-08-31'</code>. All seven rows pass, because every sale is in August. For a real test, add some sales on other dates.</dd>
      <dt>2b. WHERE, credit</dt><dd>“No credit” means a credit limit of 0. A cash sale has no customer, and a customer who does not exist has no credit. This is a business rule, and you should write it down. The outer join leaves that sale’s <code>CreditLimit</code> null in the <em>result</em>. So the test is <code>(CreditLimit = 0) OR (CreditLimit IS NULL)</code>: five rows.</dd>
      <dt>2c. Combine</dt><dd>Join both parts with <code>AND</code>. Keep the parentheses around the <code>OR</code>.</dd>
      <dt>3. GROUP BY</dt><dd>“Day by day” means <code>GROUP BY SaleDate</code>. “Total” means <code>SUM(SALE.Amount)</code>.</dd>
    </dl>
<pre><code class="sql">SELECT SALE.SaleDate, SUM(SALE.Amount) AS DailyTotal
FROM SALE LEFT JOIN CUSTOMER ON SALE.CustomerNo = CUSTOMER.CustomerNo
WHERE ((CUSTOMER.CreditLimit = 0) OR (CUSTOMER.CreditLimit IS NULL))
  AND (SALE.SaleDate BETWEEN '2002-08-01' AND '2002-08-31')
GROUP BY SALE.SaleDate;</code></pre>
    <div class="tablewrap"><table>
      <thead><tr><th>SaleDate</th><th>DailyTotal</th><th>From sales</th></tr></thead>
      <tbody>
        <tr><td>2002-08-12</td><td>167.65</td><td>12346</td></tr>
        <tr><td>2002-08-13</td><td>5120.25</td><td>12347, 12348 (cash)</td></tr>
        <tr><td>2002-08-14</td><td>2327.34</td><td>12349, 12350</td></tr>
      </tbody>
    </table></div>
    <p class="hint">The totals are as in the book. The “From sales” column is added. The book’s data here gives Richard Johnston a credit limit of 1000. But an earlier <code>UPDATE</code> example set it to 0. With that update, sale 12345 (23.95) would be part of the 12 August total.</p>
    <p>The last step is to make the query general. Wrap it in a <strong>stored procedure</strong> that takes the date range as parameters. Then the web app makes one short call, instead of sending a long SQL string (Chapter 8).</p>
    <div class="aside"><b>Front-end tie-in.</b> In a Node API, the modern way to “make it general with parameters” is <code>WHERE SaleDate BETWEEN $1 AND $2</code>. You pass the dates as values. Never paste them into the SQL string. As the book recommends, write a test with known data and a known expected total.</div>
  </section>

  <!-- Review -->
  <section class="chap" id="review">
    <h2><span class="num">✓</span>Cheat sheet and quiz</h2>
    <h3>Statements at a glance</h3>
    <div class="tablewrap"><table>
      <thead><tr><th>Task</th><th>Statement</th><th>Watch out for</th></tr></thead>
      <tbody>
        <tr><td>Create or remove a table</td><td><code>CREATE TABLE</code> / <code>DROP TABLE</code></td><td>DROP deletes all the data without asking</td></tr>
        <tr><td>Change a table</td><td><code>ALTER TABLE … ADD | ALTER | DROP</code></td><td>A new NOT NULL column needs a default</td></tr>
        <tr><td>Add rows</td><td><code>INSERT INTO t (cols) VALUES (…)</code> or <code>… SELECT</code></td><td>Always list the columns</td></tr>
        <tr><td>Change rows</td><td><code>UPDATE t SET c = v WHERE …</code></td><td>No WHERE means every row changes</td></tr>
        <tr><td>Remove rows</td><td><code>DELETE FROM t WHERE …</code></td><td>Blocked if foreign keys still refer to the rows</td></tr>
        <tr><td>Read rows</td><td><code>SELECT … FROM … WHERE … GROUP BY … HAVING … ORDER BY</code></td><td>Name the columns. Avoid <code>SELECT *</code></td></tr>
        <tr><td>Combine tables</td><td><code>JOIN … ON</code>, <code>LEFT | RIGHT | FULL OUTER JOIN</code></td><td>No join condition gives a Cartesian product</td></tr>
        <tr><td>Combine queries</td><td><code>UNION</code>, <code>INTERSECT</code>, <code>EXCEPT</code></td><td>The queries must be compatible</td></tr>
      </tbody>
    </table></div>
    <h3>Key terms</h3>
    <dl class="notation">
      <dt>Declarative</dt><dd>You say what result you want. The RDBMS decides how to get it.</dd>
      <dt>Column vs table constraint</dt><dd>A column constraint covers one column only. A table constraint can cover any columns of the table. You need it for rules and keys with several columns.</dd>
      <dt>Inner vs outer join</dt><dd>An inner join returns only matching rows. An outer join also returns unmatched rows from the left table, the right table or both, filled with nulls.</dd>
      <dt>WHERE vs HAVING</dt><dd>WHERE filters rows before grouping. HAVING filters groups after grouping.</dd>
      <dt>Table alias</dt><dd>A table variable that moves over a table’s rows. It makes self-joins possible.</dd>
      <dt>Materialized view</dt><dd>A stored copy of a query’s result that is refreshed regularly. It avoids running the same joins again and again on data that rarely changes.</dd>
    </dl>
    <h3>Test yourself</h3>
  </section>

  <section class="chap" id="p4-1">
    <h2><span class="num">4.1</span>Data modeling</h2>
    <p>A <strong>data model</strong> is an abstract picture of the part of the real world that your application cares about. Modeling means three things. You keep the information that matters. You drop what doesn’t matter. And you make the relationships between things explicit (clearly stated). When the model is ready, you generate the tables in your RDBMS (relational database management system) from it.</p>
    <p>The chapter argues that you should do this on purpose. A web application depends completely on its data. Databases come with graphical table editors. These editors tempt you to design “by hand”, one table at a time. That works for a few tables. For more, you need an overview of the whole system. A good design is also what lets a small database keep growing as the requirements change.</p>
    <h3>Why bother modeling?</h3>
    <p>You build a model anyway, even if it is only in your head. When you write it down, you can share it with other developers, with the customer, and with yourself after the weekend. The book compares a model to an architect’s drawing. One item in the wrong place can ruin the project later. It is much cheaper to fix a mistake on paper than months after the site goes live.</p>
    <p>Modeling is <strong>iterative</strong>: you repeat the same steps in loops. Customers rarely know exactly what they need. When you show them the model, they understand their own problem better, and they can explain it better. Modeling also brings up questions that you didn’t know you should ask. Click each phase below.</p>
  </section>
  <figure class="wide">
    <div class="plate" data-dg="cycle"></div>
    <div class="note" id="cycleNote" aria-live="polite"></div>
    <figcaption><span class="src book">From the book</span><b>Book figure, p. 102, redrawn.</b> The data-modeling process. The book draws the phases as circles. The wording here is shorter than in the book.</figcaption>
  </figure>
  <p>A model has two more benefits:</p>
  <ul>
    <li><strong>It is independent of the database product.</strong> So the results of your analysis (storage size, target response times) can help you choose a platform. You can also build a prototype on a desktop database and move to a production server later.</li>
    <li><strong>It explains legacy systems.</strong> A legacy system is an older system that you take over from someone else. Extract its structure into a model. This explains the original design much better than pages of DDL (the SQL statements that create the tables).</li>
  </ul>
  <div class="aside pitfalls"><b>Common mistakes.</b>
    <ul>
      <li>Opening the database GUI and creating tables before anyone has agreed what the data is.</li>
      <li>Treating the first model as final. One interview with the client usually raises more questions than it answers. You ask those questions in the next loop of the cycle.</li>
    </ul></div>

  <section class="chap" id="p4-2">
    <h2><span class="num">4.2</span>Entities, attributes and relationships</h2>
    <p>The book uses <strong>Entity Relationship (ER) modeling</strong>. It is the most common approach, and it has three building blocks. The first example is an online bookstore that stores books and their publishers. The diagrams use <strong>crow’s-foot notation</strong>. It is named after its forked symbol for “many”, which looks like a bird’s foot. The book’s diagrams were drawn in Microsoft Visio. Other tools draw the symbols a little differently, but the ideas are the same.</p>
    <dl class="notation">
      <dt>Entity</dt><dd>An abstract representation of a real-world thing. It becomes a <strong>table</strong>. It is drawn as a box with its name in the header. A big model sometimes needs an overview, so most tools let you hide the attributes.</dd>
      <dt>Attribute</dt><dd>A property of an entity. It becomes a <strong>column</strong>. In this notation each attribute row has three parts. First comes a key marker: <code>PK</code> (primary key), or <code>FK</code> (foreign key) plus a number. The number only tells the foreign keys apart. Then come the name and the data type. Primary-key attributes sit in their own section at the top. <strong>Bold</strong> attributes may not be null (they must have a value).</dd>
      <dt>Relationship</dt><dd>How entities interact. It is drawn as a line between them. The symbols at each end show two things. The <strong>cardinality</strong> is how many: a fork means many, and a single bar means one. The <strong>optionality</strong> is whether it is required: a circle means optional, and a bar beside it means mandatory.</dd>
    </dl>
  </section>
  <figure class="wide">
    <div class="plate" data-dg="bookEr"></div>
    <div class="chips" id="bookErBtns" aria-label="Highlight a part of the diagram"></div>
    <div class="note" id="bookErNote" aria-live="polite"></div>

  <p>Read the line from each side:</p>
  <ul>

  <p>The foreign key <code>PublisherID</code> is on the many side.</p>
  <p>Notice that something is missing. The bookstore wanted to know how many books each publisher has in the catalog. But there is no attribute for this number. Storing the count would be <strong>redundant</strong> (the same information stored twice). You can get it from the books themselves with <code>COUNT</code> (Chapter 3). Section 4.7 comes back to this trade-off.</p>

      <li>A <strong>solid</strong> line is an identifying relationship. The foreign key is part of the child’s primary key, as in OrderItems below.</li>

      <li>Reading crow’s feet backwards. The symbol <em>next to</em> an entity says how many rows of <em>that</em> entity relate to one row on the other side.</li>
      <li>Storing values that you can derive (calculate), such as counts and totals, as ordinary columns “for convenience”.</li>
